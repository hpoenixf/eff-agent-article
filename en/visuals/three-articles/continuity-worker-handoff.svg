<svg xmlns="http://www.w3.org/2000/svg" width="760" height="575" viewBox="0 0 760 575" role="img" aria-labelledby="title desc"><title id="title">Replace the Worker, not the Run</title><desc id="desc">Worker B takes over the original Run under its existing authority and preserves unknown effects.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#557779" stroke-width="1.5"/></marker></defs><rect width="760" height="575" rx="28" fill="#f3f6f2"/><style>text{font-family:'Noto Sans CJK SC','Noto Sans',sans-serif;fill:#18393b}.title{font-size:35px;font-weight:700}.label{font-size:30px;font-weight:700}.body{font-size:28px}.note{font-size:26px;fill:#456365}.num{font-size:26px;fill:#fff;font-weight:700}</style><text x="36" y="58" class="title">Replace the Worker, not the Run</text><rect x="30" y="94" width="700" height="135" rx="18" fill="#dfeee6"/><text x="54" y="135" class="label">The same Run</text><text x="54" y="175" class="body">Question · Sources · Permissions</text><text x="54" y="210" class="body">Budget · Committed results</text><rect x="30" y="267" width="300" height="118" rx="18" fill="#ffffff"/><rect x="430" y="267" width="300" height="118" rx="18" fill="#ffffff"/><text x="58" y="311" class="label">Worker A</text><text x="58" y="358" class="body">Host stops</text><text x="458" y="311" class="label">Worker B</text><text x="458" y="358" class="body">Claims same Run</text><path d="M340,325 L420,325" fill="none" stroke="#557779" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="426" width="700" height="118" rx="18" fill="#e6e7f2"/><text x="54" y="470" class="label">New process, same commitments</text><text x="54" y="512" class="body">Unknown stays unknown. No automatic resend.</text></svg>