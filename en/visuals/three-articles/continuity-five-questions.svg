<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" role="img" aria-labelledby="title desc"><title id="title">One goal, five different questions</title><desc id="desc">Five responsibilities, not five required architectural layers.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#557779" stroke-width="1.5"/></marker></defs><rect width="760" height="640" rx="28" fill="#f3f6f2"/><style>text{font-family:'Noto Sans CJK SC','Noto Sans',sans-serif;fill:#18393b}.title{font-size:35px;font-weight:700}.label{font-size:30px;font-weight:700}.body{font-size:28px}.note{font-size:26px;fill:#456365}.num{font-size:26px;fill:#fff;font-weight:700}</style><text x="36" y="58" class="title">One goal, five different questions</text><rect x="30" y="92" width="700" height="88" rx="18" fill="#ffffff"/><text x="50" y="127" class="label">Task</text><text x="50" y="164" class="body">What do we still owe the user?</text><rect x="30" y="196" width="700" height="88" rx="18" fill="#ffffff"/><text x="50" y="231" class="label">Session</text><text x="50" y="268" class="body">Which context and state persist?</text><rect x="30" y="300" width="700" height="88" rx="18" fill="#ffffff"/><text x="50" y="335" class="label">Run</text><text x="50" y="372" class="body">How far has this round progressed?</text><rect x="30" y="404" width="700" height="88" rx="18" fill="#ffffff"/><text x="50" y="439" class="label">Worker</text><text x="50" y="476" class="body">Which process is advancing it?</text><rect x="30" y="508" width="700" height="88" rx="18" fill="#ffffff"/><text x="50" y="543" class="label">Schedule</text><text x="50" y="580" class="body">When may execution begin?</text><text x="36" y="624" class="note">Identify responsibilities before adding modules.</text></svg>