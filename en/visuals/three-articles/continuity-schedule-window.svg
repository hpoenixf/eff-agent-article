<svg xmlns="http://www.w3.org/2000/svg" width="760" height="660" viewBox="0 0 760 660" role="img" aria-labelledby="title desc"><title id="title">A Schedule is an opportunity</title><desc id="desc">A one-time schedule distinguishes early, eligible, and missed execution. The public entry point requires an explicit call.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#557779" stroke-width="1.5"/></marker></defs><rect width="760" height="660" rx="28" fill="#f3f6f2"/><style>text{font-family:'Noto Sans CJK SC','Noto Sans',sans-serif;fill:#18393b}.title{font-size:35px;font-weight:700}.label{font-size:30px;font-weight:700}.body{font-size:28px}.note{font-size:26px;fill:#456365}.num{font-size:26px;fill:#fff;font-weight:700}</style><text x="36" y="58" class="title">A Schedule is an opportunity</text><rect x="30" y="94" width="700" height="92" rx="18" fill="#dfeee6"/><text x="54" y="132" class="label">Confirmed one-time schedule</text><text x="54" y="170" class="body">Explicit time, time zone, and allowed lateness</text><rect x="30" y="220" width="700" height="104" rx="18" fill="#fff"/><text x="54" y="262" class="label">Not due yet</text><text x="54" y="304" class="body">No execution; no hidden background wait.</text><rect x="30" y="342" width="700" height="104" rx="18" fill="#dfeee6"/><text x="54" y="384" class="label">Inside the allowed window</text><text x="54" y="426" class="body">Original rules → materialize and execute Run.</text><rect x="30" y="464" width="700" height="104" rx="18" fill="#f4e4d8"/><text x="54" y="506" class="label">Window has passed</text><text x="54" y="548" class="body">Record missed; do not silently start a new Run.</text><text x="36" y="634" class="note">Explicit run-due required. No automatic wake-up.</text></svg>