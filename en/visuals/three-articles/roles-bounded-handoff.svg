<svg xmlns="http://www.w3.org/2000/svg" width="390" height="600" viewBox="0 0 390 600" role="img" aria-labelledby="t d"><title id="t">Delegate a bounded task</title><desc id="d">Main defines scope; Child returns findings and sources; Main synthesizes within root authority.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#728091" stroke-width="1.5"/></marker></defs><rect width="390" height="600" rx="20" fill="#f4f6f8"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172838}.title{font-size:23px;font-weight:700}.label{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#536577}</style><text x="24" y="40" class="title">Delegate a bounded task</text><rect x="22" y="76" width="346" height="112" rx="13" fill="white"/><rect x="22" y="76" width="5" height="112" rx="2" fill="#356f91"/><text x="40" y="105" class="label">Main: define the question</text><text x="40" y="133" class="body">Reconcile two fee definitions</text><text x="40" y="158" class="body">Provide method and allowed sources</text><path d="M195 192V218" stroke="#728091" stroke-width="2" marker-end="url(#arr)"/><rect x="22" y="230" width="346" height="112" rx="13" fill="white"/><rect x="22" y="230" width="5" height="112" rx="2" fill="#26837e"/><text x="40" y="259" class="label">Child: work within scope</text><text x="40" y="287" class="body">Check in a separate context</text><text x="40" y="312" class="body">Return findings, limits, and sources</text><path d="M195 346V372" stroke="#728091" stroke-width="2" marker-end="url(#arr)"/><rect x="22" y="384" width="346" height="112" rx="13" fill="white"/><rect x="22" y="384" width="5" height="112" rx="2" fill="#356f91"/><text x="40" y="413" class="label">Main: decide how to use it</text><text x="40" y="441" class="body">Reading a summary does not</text><text x="40" y="466" class="body">mean adopting its judgment.</text><text x="24" y="535" class="small">Root permissions and budget still apply.</text><text x="24" y="560" class="small">Public Child is not a parallel team.</text></svg>