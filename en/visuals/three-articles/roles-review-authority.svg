<svg xmlns="http://www.w3.org/2000/svg" width="390" height="630" viewBox="0 0 390 630" role="img" aria-labelledby="t d"><title id="t">Advice, not editing authority</title><desc id="d">Review checks a fixed report and sources. The reader decides; the original stays intact.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#728091" stroke-width="1.5"/></marker></defs><rect width="390" height="630" rx="20" fill="#f4f6f8"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172838}.title{font-size:23px;font-weight:700}.label{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#536577}</style><text x="24" y="40" class="title">Advice, not editing authority</text><rect x="22" y="76" width="346" height="114" rx="13" fill="white"/><rect x="22" y="76" width="5" height="114" rx="2" fill="#356f91"/><text x="40" y="105" class="label">Fixed inputs</text><text x="40" y="133" class="body">Report revision + original sources</text><text x="40" y="158" class="body">No silent swap to newer materials</text><path d="M195 194V216" stroke="#728091" stroke-width="2" marker-end="url(#arr)"/><rect x="22" y="228" width="346" height="138" rx="13" fill="white"/><rect x="22" y="228" width="5" height="138" rx="2" fill="#a66c35"/><text x="40" y="257" class="label">Review: separate checks</text><text x="40" y="285" class="body">Do materials support this claim?</text><text x="40" y="310" class="body">Do the actual citations match?</text><text x="40" y="335" class="body">What remains unchecked?</text><path d="M195 370V392" stroke="#728091" stroke-width="2" marker-end="url(#arr)"/><rect x="22" y="404" width="346" height="135" rx="13" fill="white"/><rect x="22" y="404" width="5" height="135" rx="2" fill="#76579c"/><text x="40" y="433" class="label">Reader: decide whether to edit</text><text x="40" y="461" class="body">Keep the original report.</text><text x="40" y="486" class="body">Save any revision as a new version.</text><text x="24" y="580" class="small">No search, automatic fixes, or publishing.</text></svg>