<svg xmlns="http://www.w3.org/2000/svg" width="390" height="625" viewBox="0 0 390 625" role="img" aria-labelledby="t d"><title id="t">Four roles, four questions</title><desc id="d">Profiles define methods; subagents execute; reviews inspect reports; judges evaluate results.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#728091" stroke-width="1.5"/></marker></defs><rect width="390" height="625" rx="20" fill="#f4f6f8"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172838}.title{font-size:23px;font-weight:700}.label{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#536577}</style><text x="24" y="40" class="title">Four roles, four questions</text><text x="24" y="68" class="small">Not a required pipeline or a ranking.</text><rect x="22" y="88" width="346" height="102" rx="13" fill="white"/><rect x="22" y="88" width="5" height="102" rx="2" fill="#356f91"/><text x="40" y="117" class="label">Profile | Which method?</text><text x="40" y="145" class="body">A reusable research method</text><rect x="22" y="210" width="346" height="102" rx="13" fill="white"/><rect x="22" y="210" width="5" height="102" rx="2" fill="#26837e"/><text x="40" y="239" class="label">Subagent | Who executes?</text><text x="40" y="267" class="body">A bounded piece of work</text><rect x="22" y="332" width="346" height="102" rx="13" fill="white"/><rect x="22" y="332" width="5" height="102" rx="2" fill="#a66c35"/><text x="40" y="361" class="label">Review | What needs a look?</text><text x="40" y="389" class="body">Findings about a fixed report</text><rect x="22" y="454" width="346" height="102" rx="13" fill="white"/><rect x="22" y="454" width="5" height="102" rx="2" fill="#76579c"/><text x="40" y="483" class="label">Judge | Which criteria?</text><text x="40" y="511" class="body">Evaluate one or more outputs</text><text x="24" y="597" class="small">One model can take different roles.</text></svg>