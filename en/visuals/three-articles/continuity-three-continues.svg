<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">Three meanings of “continue”</title><desc id="desc">Choose based on the original Run state, changed inputs, and future timing, not the word continue alone.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#557779" stroke-width="1.5"/></marker></defs><rect width="760" height="650" rx="28" fill="#f3f6f2"/><style>text{font-family:'Noto Sans CJK SC','Noto Sans',sans-serif;fill:#18393b}.title{font-size:35px;font-weight:700}.label{font-size:30px;font-weight:700}.body{font-size:28px}.note{font-size:26px;fill:#456365}.num{font-size:26px;fill:#fff;font-weight:700}</style><text x="36" y="58" class="title">Three meanings of “continue”</text><rect x="30" y="92" width="700" height="158" rx="18" fill="#dfeee6"/><text x="54" y="134" class="label">Original Run is unfinished</text><text x="54" y="177" class="body">Same inputs; only the host stopped.</text><text x="54" y="221" class="label">→ Resume the original Run</text><rect x="30" y="270" width="700" height="158" rx="18" fill="#e6e7f2"/><text x="54" y="312" class="label">Run ended, or inputs changed</text><text x="54" y="355" class="body">New material, question, or research round.</text><text x="54" y="399" class="label">→ Keep old results; start a new Run</text><rect x="30" y="448" width="700" height="158" rx="18" fill="#f4e4d8"/><text x="54" y="490" class="label">Start at a future time</text><text x="54" y="533" class="body">Agree on timing and missed-window handling.</text><text x="54" y="577" class="label">→ Save a schedule; trigger it explicitly</text></svg>