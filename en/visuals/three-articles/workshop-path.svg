<svg xmlns="http://www.w3.org/2000/svg" width="720" height="770" viewBox="0 0 720 770" role="img">
<title>Keep the research trail</title>
<desc>01  Freeze sources; Choose files or Web pages; Keep text and source identity. 02  Save the report; Main synthesizes the findings; Freeze a readable revision. 03  Review independently; Check that revision and its sources; Save advice; keep the original</desc>
<rect width="720" height="770" rx="24" fill="#f3f6fb"/>
<g font-family="Arial, sans-serif">
<text x="36" y="66" font-size="36" font-weight="700" fill="#142d4e">Keep the research trail</text>
<rect x="36" y="100" width="648" height="180" rx="20" fill="white" stroke="#ccd8e8"/>
<rect x="36" y="100" width="9" height="180" rx="4" fill="#367b91"/>
<text x="65" y="148" font-size="32" font-weight="700" fill="#174c68">01  Freeze sources</text>
<text x="65" y="199" font-size="29" fill="#253b54">Choose files or Web pages</text>
<text x="65" y="244" font-size="29" fill="#253b54">Keep text and source identity</text>
<path d="M350 290 l10 14 10 -14" fill="none" stroke="#367b91" stroke-width="4"/>
<rect x="36" y="315" width="648" height="180" rx="20" fill="white" stroke="#ccd8e8"/>
<rect x="36" y="315" width="9" height="180" rx="4" fill="#367b91"/>
<text x="65" y="363" font-size="32" font-weight="700" fill="#174c68">02  Save the report</text>
<text x="65" y="414" font-size="29" fill="#253b54">Main synthesizes the findings</text>
<text x="65" y="459" font-size="29" fill="#253b54">Freeze a readable revision</text>
<path d="M350 505 l10 14 10 -14" fill="none" stroke="#367b91" stroke-width="4"/>
<rect x="36" y="530" width="648" height="180" rx="20" fill="white" stroke="#ccd8e8"/>
<rect x="36" y="530" width="9" height="180" rx="4" fill="#367b91"/>
<text x="65" y="578" font-size="32" font-weight="700" fill="#174c68">03  Review independently</text>
<text x="65" y="629" font-size="29" fill="#253b54">Check that revision and its sources</text>
<text x="65" y="674" font-size="29" fill="#253b54">Save advice; keep the original</text>
</g></svg>