<svg xmlns="http://www.w3.org/2000/svg" width="520" height="724" viewBox="0 0 520 724" role="img" aria-labelledby="title desc" lang="zh"><title id="title">同一金额，三个分母</title><desc id="desc">教学例：公司 X 已知金额 9,000 元</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#49796e" stroke-width="1.7"/></marker></defs><rect width="520" height="724" rx="20" fill="#f7f8f2"/><rect x="1" y="1" width="518" height="722" rx="19" fill="none" stroke="#cddbd1"/>
<text x="28" y="32" font-family="Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#7756a0" text-anchor="start">RESEARCH / FIELD GUIDE</text>
<text x="28" y="68" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#183e35" text-anchor="start">同一金额，三个分母</text>
<text x="28" y="101" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="500" fill="#586d65" text-anchor="start">教学例：公司 X 已知金额 9,000 元</text>
<rect x="28" y="130" width="464" height="78" rx="12" fill="#f0eaf8" stroke="#c4b2da" stroke-width="1.5"/>
<text x="260.0" y="175.5" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#183e35" text-anchor="middle">公司X已知金额九千元</text>
<rect x="64" y="250" width="240" height="116" rx="12" fill="#ffffff" stroke="#bacdc4" stroke-width="1.5"/>
<text x="184.0" y="301.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">除以</text>
<text x="184.0" y="327.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">总资产 120,000 元</text>
<rect x="330" y="250" width="162" height="116" rx="12" fill="#fff5dd" stroke="#d5be83"/>
<text x="411" y="292" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#7756a0" text-anchor="middle">7.5%</text>
<text x="411" y="325" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#183e35" text-anchor="middle">总资产暴露</text>
<path d="M40 208 V308 H64" fill="none" stroke="#49796e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M304 308 H330" fill="none" stroke="#49796e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="64" y="400" width="240" height="116" rx="12" fill="#ffffff" stroke="#bacdc4" stroke-width="1.5"/>
<text x="184.0" y="451.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">除以</text>
<text x="184.0" y="477.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">基金资产 108,000 元</text>
<rect x="330" y="400" width="162" height="116" rx="12" fill="#fff5dd" stroke="#d5be83"/>
<text x="411" y="442" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#7756a0" text-anchor="middle">≈ 8.33%</text>
<text x="411" y="475" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#183e35" text-anchor="middle">基金内部暴露</text>
<path d="M40 208 V458 H64" fill="none" stroke="#49796e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M304 458 H330" fill="none" stroke="#49796e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="64" y="550" width="240" height="116" rx="12" fill="#ffffff" stroke="#bacdc4" stroke-width="1.5"/>
<text x="184.0" y="601.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">除以</text>
<text x="184.0" y="627.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">披露样本 64,800 元</text>
<rect x="330" y="550" width="162" height="116" rx="12" fill="#fff5dd" stroke="#d5be83"/>
<text x="411" y="592" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#7756a0" text-anchor="middle">≈ 13.89%</text>
<text x="411" y="625" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#183e35" text-anchor="middle">披露样本暴露</text>
<path d="M40 208 V608 H64" fill="none" stroke="#49796e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M304 608 H330" fill="none" stroke="#49796e" stroke-width="2" marker-end="url(#arrow)"/></svg>
