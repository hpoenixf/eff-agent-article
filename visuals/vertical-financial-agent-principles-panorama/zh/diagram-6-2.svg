<svg xmlns="http://www.w3.org/2000/svg" width="520" height="554" viewBox="0 0 520 554" role="img" aria-labelledby="title desc" lang="zh"><title id="title">领域复用，不等于重建运行时</title><desc id="desc">续图 · 共享领域核心之后再作判断</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#49796e" stroke-width="1.7"/></marker></defs><rect width="520" height="554" rx="20" fill="#f7f8f2"/><rect x="1" y="1" width="518" height="552" rx="19" fill="none" stroke="#cddbd1"/>
<text x="28" y="32" font-family="Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#7756a0" text-anchor="start">RESEARCH / FIELD GUIDE</text>
<text x="28" y="68" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#183e35" text-anchor="start">领域复用，不等于重建运行时</text>
<text x="28" y="101" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="500" fill="#586d65" text-anchor="start">续图 · 共享领域核心之后再作判断</text>
<rect x="60" y="138" width="400" height="116" rx="12" fill="#f0eaf8" stroke="#c4b2da" stroke-width="1.5"/>
<text x="260.0" y="202.5" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#183e35" text-anchor="middle">现有执行合同确实不够吗</text>
<rect x="28" y="334" width="220" height="180" rx="12" fill="#ffffff" stroke="#bacdc4" stroke-width="1.5"/>
<text x="138.0" y="430.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">继续复用现有运行时</text>
<rect x="272" y="334" width="220" height="180" rx="12" fill="#fff5dd" stroke="#d5be83" stroke-width="1.5"/>
<text x="382.0" y="417.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">用反例比较扩展与局</text>
