<rect x="138" y="268" width="44" height="25" rx="8" fill="#f7f8f2"/>
<text x="160" y="286" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#315c50" text-anchor="middle">否</text>
<path d="M360 254 V294 H382 V334" fill="none" stroke="#49796e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="338" y="268" width="44" height="25" rx="8" fill="#f7f8f2"/>
<text x="360" y="286" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#315c50" text-anchor="middle">是</text></svg>
