<svg xmlns="http://www.w3.org/2000/svg" width="640" height="492" viewBox="0 0 640 492" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">减负有三种不同的处理</title><desc id="desc">先保留回到原件的路径 摘要描述工作，不改写证据与效果</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#216d63"/></marker></defs>
<rect width="640" height="492" rx="24" fill="#f1f7f4"/>
<g font-family="Noto Sans CJK SC,Arial,sans-serif"><text x="32" y="48" font-size="32" fill="#163d39" font-weight="700" text-anchor="start">减负有三种不同的处理</text><text x="32" y="83" font-size="23" fill="#4b6661" font-weight="500" text-anchor="start">先保留回到原件的路径</text>
<rect x="24" y="112" width="592" height="82" rx="16" fill="#ffffff" stroke="#a8c9c0" stroke-width="1.5"/><text x="44" y="146" font-size="27" fill="#163d39" font-weight="700" text-anchor="start">当前关键材料</text><text x="44" y="177" font-size="25" fill="#4b6661" font-weight="500" text-anchor="start">留在需要它的决策中</text><rect x="24" y="206" width="592" height="82" rx="16" fill="#e7f0eb" stroke="#a8c9c0" stroke-width="1.5"/><text x="44" y="240" font-size="27" fill="#163d39" font-weight="700" text-anchor="start">较旧可回读正文</text><text x="44" y="271" font-size="25" fill="#4b6661" font-weight="500" text-anchor="start">换为原版本、选区与引用</text><rect x="24" y="300" width="592" height="82" rx="16" fill="#ffffff" stroke="#a8c9c0" stroke-width="1.5"/><text x="44" y="334" font-size="27" fill="#163d39" font-weight="700" text-anchor="start">旧工作过程</text><text x="44" y="365" font-size="25" fill="#4b6661" font-weight="500" text-anchor="start">必要时生成有损摘要</text>
<rect x="24" y="422" width="592" height="48" rx="12" fill="#216d63" stroke="#216d63" stroke-width="1.5"/><text x="320" y="454" font-size="25" fill="#fff" font-weight="600" text-anchor="middle">摘要描述工作，不改写证据与效果</text></g></svg>
