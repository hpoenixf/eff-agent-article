<svg xmlns="http://www.w3.org/2000/svg" width="640" height="586" viewBox="0 0 640 586" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">用户从 P1 改为 P2 之后</title><desc id="desc">教学场景：只更新受影响的工作 保留旧结果身份，不把历史改成新事实</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#216d63"/></marker></defs>
<rect width="640" height="586" rx="24" fill="#f1f7f4"/>
<g font-family="Noto Sans CJK SC,Arial,sans-serif"><text x="32" y="48" font-size="32" fill="#163d39" font-weight="700" text-anchor="start">用户从 P1 改为 P2 之后</text><text x="32" y="83" font-size="23" fill="#4b6661" font-weight="500" text-anchor="start">教学场景：只更新受影响的工作</text>
<rect x="24" y="112" width="592" height="82" rx="16" fill="#ffffff" stroke="#a8c9c0" stroke-width="1.5"/><text x="44" y="146" font-size="27" fill="#163d39" font-weight="700" text-anchor="start">个人持仓</text><text x="44" y="177" font-size="25" fill="#4b6661" font-weight="500" text-anchor="start">P1 → P2</text><rect x="24" y="206" width="592" height="82" rx="16" fill="#e7f0eb" stroke="#a8c9c0" stroke-width="1.5"/><text x="44" y="240" font-size="27" fill="#163d39" font-weight="700" text-anchor="start">个人计算</text><text x="44" y="271" font-size="25" fill="#4b6661" font-weight="500" text-anchor="start">C1 使用 P1 → 重新评估</text><rect x="24" y="300" width="592" height="82" rx="16" fill="#ffffff" stroke="#a8c9c0" stroke-width="1.5"/><text x="44" y="334" font-size="27" fill="#163d39" font-weight="700" text-anchor="start">费用条款</text><text x="44" y="365" font-size="25" fill="#4b6661" font-weight="500" text-anchor="start">F1 / F2 仍适用时保留</text><rect x="24" y="394" width="592" height="82" rx="16" fill="#e7f0eb" stroke="#a8c9c0" stroke-width="1.5"/><text x="44" y="428" font-size="27" fill="#163d39" font-weight="700" text-anchor="start">披露缺口</text><text x="44" y="459" font-size="25" fill="#4b6661" font-weight="500" text-anchor="start">B 的部分披露仍是部分</text>
<rect x="24" y="516" width="592" height="48" rx="12" fill="#216d63" stroke="#216d63" stroke-width="1.5"/><text x="320" y="548" font-size="25" fill="#fff" font-weight="600" text-anchor="middle">保留旧结果身份，不把历史改成新事实</text></g></svg>
