<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">系统提示词：四个清楚的分区</title><desc id="desc">具体到能指导判断，不预写全部路线 用户、日期、持仓、记忆按轮装配</desc>
