<g font-family="Noto Sans CJK SC,Arial,sans-serif"><text x="32" y="48" font-size="32" fill="#163d39" font-weight="700" text-anchor="start">系统提示词：四个清楚的分区</text><text x="32" y="83" font-size="23" fill="#4b6661" font-weight="500" text-anchor="start">具体到能指导判断，不预写全部路线</text>
