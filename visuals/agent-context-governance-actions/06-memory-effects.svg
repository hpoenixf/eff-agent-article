<svg xmlns="http://www.w3.org/2000/svg" width="640" height="558" viewBox="0 0 640 558" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">显式记忆：以提交回执为准</title><desc id="desc">保存、纠正、遗忘，都不是一句口头承诺 提交后回答失败，不回滚已提交记忆</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#216d63"/></marker></defs>
<rect width="640" height="558" rx="24" fill="#f1f7f4"/>
<g font-family="Noto Sans CJK SC,Arial,sans-serif"><text x="32" y="48" font-size="32" fill="#163d39" font-weight="700" text-anchor="start">显式记忆：以提交回执为准</text><text x="32" y="83" font-size="23" fill="#4b6661" font-weight="500" text-anchor="start">保存、纠正、遗忘，都不是一句口头承诺</text>
<rect x="50" y="111" width="540" height="55" rx="16" fill="#ffffff" stroke="#a8c9c0" stroke-width="1.5"/><text x="320" y="148" font-size="27" fill="#163d39" font-weight="600" text-anchor="middle">用户明确持久请求</text><path d="M320 167 L320 179" fill="none" stroke="#216d63" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="183" width="540" height="55" rx="16" fill="#ffffff" stroke="#a8c9c0" stroke-width="1.5"/><text x="320" y="220" font-size="27" fill="#163d39" font-weight="600" text-anchor="middle">定位已有记录</text><path d="M320 239 L320 251" fill="none" stroke="#216d63" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="255" width="540" height="55" rx="16" fill="#ffffff" stroke="#a8c9c0" stroke-width="1.5"/><text x="320" y="292" font-size="27" fill="#163d39" font-weight="600" text-anchor="middle">核对范围与目标修订</text><path d="M320 311 L320 323" fill="none" stroke="#216d63" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="327" width="540" height="55" rx="16" fill="#ffffff" stroke="#a8c9c0" stroke-width="1.5"/><text x="320" y="364" font-size="27" fill="#163d39" font-weight="600" text-anchor="middle">提交并取得操作回执</text><path d="M320 383 L320 395" fill="none" stroke="#216d63" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="399" width="540" height="55" rx="16" fill="#e0efea" stroke="#a8c9c0" stroke-width="1.5"/><text x="320" y="436" font-size="27" fill="#163d39" font-weight="600" text-anchor="middle">按真实回执报告结果</text>
<rect x="24" y="488" width="592" height="48" rx="12" fill="#216d63" stroke="#216d63" stroke-width="1.5"/><text x="320" y="520" font-size="25" fill="#fff" font-weight="600" text-anchor="middle">提交后回答失败，不回滚已提交记忆</text></g></svg>
