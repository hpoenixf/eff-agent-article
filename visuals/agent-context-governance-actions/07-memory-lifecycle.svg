<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">纠正与遗忘要影响未来输入</title><desc id="desc">教学场景：旧历史仍可存在 旧缓存、摘要和晚到任务不能使其复活</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#216d63"/></marker></defs>
<rect width="640" height="460" rx="24" fill="#f1f7f4"/>
<g font-family="Noto Sans CJK SC,Arial,sans-serif"><text x="32" y="48" font-size="32" fill="#163d39" font-weight="700" text-anchor="start">纠正与遗忘要影响未来输入</text><text x="32" y="83" font-size="23" fill="#4b6661" font-weight="500" text-anchor="start">教学场景：旧历史仍可存在</text>
<rect x="24" y="130" width="188" height="166" rx="16" fill="#f0ecf8" stroke="#a8c9c0" stroke-width="1.5"/><text x="118" y="178" font-size="25" fill="#163d39" font-weight="700" text-anchor="middle">修订 r1</text><text x="118" y="224" font-size="24" fill="#4b6661" font-weight="500" text-anchor="middle">已被替代</text><text x="118" y="275" font-size="36" fill="#216d63" font-weight="600" text-anchor="middle">×</text><path d="M214 212 L223 212" fill="none" stroke="#216d63" stroke-width="3" marker-end="url(#arrow)"/><rect x="226" y="130" width="188" height="166" rx="16" fill="#ffffff" stroke="#a8c9c0" stroke-width="1.5"/><text x="320" y="178" font-size="25" fill="#163d39" font-weight="700" text-anchor="middle">修订 r2</text><text x="320" y="224" font-size="24" fill="#4b6661" font-weight="500" text-anchor="middle">当前有效</text><text x="320" y="275" font-size="36" fill="#216d63" font-weight="600" text-anchor="middle">✓</text><path d="M416 212 L425 212" fill="none" stroke="#216d63" stroke-width="3" marker-end="url(#arrow)"/><rect x="428" y="130" width="188" height="166" rx="16" fill="#fff2df" stroke="#a8c9c0" stroke-width="1.5"/><text x="522" y="178" font-size="25" fill="#163d39" font-weight="700" text-anchor="middle">遗忘该记忆</text><text x="522" y="224" font-size="24" fill="#4b6661" font-weight="500" text-anchor="middle">后续不再使用</text><text x="522" y="275" font-size="36" fill="#9b6226" font-weight="600" text-anchor="middle">—</text><text x="320" y="350" font-size="25" fill="#163d39" font-weight="500" text-anchor="middle">核对记录资格，再装配后继请求</text>
<rect x="24" y="390" width="592" height="48" rx="12" fill="#216d63" stroke="#216d63" stroke-width="1.5"/><text x="320" y="422" font-size="25" fill="#fff" font-weight="600" text-anchor="middle">旧缓存、摘要和晚到任务不能使其复活</text></g></svg>
