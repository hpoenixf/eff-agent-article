<circle cx="70" cy="295" r="6" fill="#a3523d" stroke="#a3523d" stroke-width="2"/>
<text x="92" y="303" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="31" font-weight="700" fill="#16362f" text-anchor="start" letter-spacing="0">Findings and conditions</text>
<text x="64" y="346" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="500" fill="#4e665e" text-anchor="start" letter-spacing="0">What holds, and within which scope</text>
<path d="M64 367 H576" fill="none" stroke="#cddbd1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="70" cy="401" r="6" fill="#a3523d" stroke="#a3523d" stroke-width="2"/>
<text x="92" y="409" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="31" font-weight="700" fill="#16362f" text-anchor="start" letter-spacing="0">Existing results</text>
<text x="64" y="452" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="500" fill="#4e665e" text-anchor="start" letter-spacing="0">Readable sources, receipts and artifacts</text>
<path d="M64 473 H576" fill="none" stroke="#cddbd1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="70" cy="507" r="6" fill="#a3523d" stroke="#a3523d" stroke-width="2"/>
<text x="92" y="515" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="31" font-weight="700" fill="#16362f" text-anchor="start" letter-spacing="0">Failures and unknowns</text>
<text x="64" y="558" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="500" fill="#4e665e" text-anchor="start" letter-spacing="0">Failed approaches, unsettled effects</text>
