<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1282" width="390" height="1282" role="img" aria-labelledby="title desc"><title id="title">One report, four independently checked facts</title><desc id="desc">Generating, saving, accessing and sharing are not the same successful operation. Unknown commit outcome: check the original receipt first. Revocation cannot recall a copy already downloaded.</desc><rect width="390" height="1282" rx="22" fill="#f7f9fc"/><rect width="390" height="8" fill="#7054a2"/><text x="24" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#17263e">One report, four</text><text x="24" y="76" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#17263e">independently checked</text><text x="24" y="107" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#17263e">facts</text><text x="24" y="146" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Generating, saving, accessing and sharing</text><text x="24" y="170" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">are not the same successful operation.</text><rect x="20" y="218" width="350" height="194" rx="18" fill="white" stroke="#dbe3ed"/><rect x="36" y="232" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="46" y="255" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">1</text><text x="40" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#17263e">Generate a candidate</text><text x="40" y="330" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Obtain the file bytes.</text><text x="40" y="362" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">A filename is not a version.</text><text x="185" y="436" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">↓</text><rect x="20" y="446" width="350" height="194" rx="18" fill="white" stroke="#dbe3ed"/><rect x="36" y="460" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="46" y="483" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">2</text><text x="40" y="522" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#17263e">Commit durable bytes</text><text x="40" y="558" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Bind digest and revision.</text><text x="40" y="590" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">The save outcome may remain</text><text x="40" y="614" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">unknown.</text><text x="185" y="664" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">↓</text><rect x="20" y="674" width="350" height="194" rx="18" fill="white" stroke="#dbe3ed"/><rect x="36" y="688" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="46" y="711" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">3</text><text x="40" y="750" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#17263e">Authorized reread</text><text x="40" y="786" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Check account and ownership.</text><text x="40" y="818" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Read only the fixed version.</text><text x="185" y="892" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">↓</text><rect x="20" y="902" width="350" height="194" rx="18" fill="white" stroke="#dbe3ed"/><rect x="36" y="916" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="46" y="939" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">4</text><text x="40" y="978" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#17263e">Targeted sharing</text><text x="40" y="1014" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Name the recipient and revision.</text><text x="40" y="1046" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Revocation limits later access.</text><rect x="20" y="1130" width="350" height="128" rx="18" fill="#f1ebfa" stroke="none"/><text x="40" y="1160" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#7054a2">Unknown commit outcome: check the</text><text x="40" y="1184" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#7054a2">original receipt first. Revocation</text><text x="40" y="1208" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#7054a2">cannot recall a copy already</text><text x="40" y="1232" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#7054a2">downloaded.</text></svg>
