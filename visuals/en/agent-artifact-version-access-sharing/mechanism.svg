<svg xmlns="http://www.w3.org/2000/svg" width="480" height="455" viewBox="0 0 480 455" role="img" aria-labelledby="title desc"><title id="title">Share a version, not a name</title><desc id="desc">The original share stays bound to version one. Version two needs a new explicit grant. Revocation blocks later requests, not downloaded copies.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC",Arial,sans-serif;fill:#17324d}.title{font-size:27px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.muted{fill:#475569}.warn{fill:#9a3412}</style><rect width="480" height="455" rx="18" fill="#f8fafc"/><text x="24" y="43" class="title">Share a version, not a name</text><text x="24" y="76" class="small">Same filename; separate saved objects.</text><rect x="24" y="104" width="180" height="127" rx="12" fill="#eaf4ff" stroke="#8cb9df"/><rect x="276" y="104" width="180" height="127" rx="12" fill="#eaf7f2" stroke="#8ccbb6"/><text x="114" y="143" class="label" text-anchor="middle">Version 1</text><text x="114" y="178" class="body" text-anchor="middle">Original bytes</text><text x="114" y="208" class="small" text-anchor="middle">Fixed identity</text><path d="M205 166H273" class="line"/><text x="240" y="146" class="small" text-anchor="middle">Share</text><text x="366" y="143" class="label" text-anchor="middle">Recipient</text><text x="366" y="178" class="body" text-anchor="middle">Own session</text><text x="366" y="208" class="small" text-anchor="middle">This version only</text><rect x="24" y="261" width="432" height="105" rx="12" fill="#fff6ec" stroke="#e2ba8b"/><text x="43" y="298" class="label">Version 2: new private context</text><text x="43" y="334" class="body">Not added to the old share.</text><text x="24" y="405" class="body">Revocation stops future reads.</text><text x="24" y="435" class="small">Downloaded copies cannot be recalled.</text></svg>
