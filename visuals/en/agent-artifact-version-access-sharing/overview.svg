<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 563" width="1200" height="563" role="img" aria-labelledby="title desc"><title id="title">One report, four independently checked facts</title><desc id="desc">Generating, saving, accessing and sharing are not the same successful operation. Unknown commit outcome: check the original receipt first. Revocation cannot recall a copy already downloaded.</desc><rect width="1200" height="563" rx="22" fill="#f7f9fc"/><rect width="1200" height="8" fill="#7054a2"/><text x="48" y="60" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#17263e">One report, four independently checked facts</text><text x="48" y="108" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#17263e">Generating, saving, accessing and sharing are not the same successful operation.</text><rect x="34" y="160" width="264" height="286" rx="18" fill="white" stroke="#dbe3ed"/><rect x="50" y="174" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="60" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">1</text><text x="54" y="236" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">Generate a</text><text x="54" y="266" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">candidate</text><text x="54" y="304" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Obtain the file bytes.</text><text x="54" y="338" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">A filename is not a</text><text x="54" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">version.</text><text x="306" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">›</text><rect x="325" y="160" width="264" height="286" rx="18" fill="white" stroke="#dbe3ed"/><rect x="341" y="174" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="351" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">2</text><text x="345" y="236" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">Commit durable</text><text x="345" y="266" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">bytes</text><text x="345" y="304" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Bind digest and revision.</text><text x="345" y="338" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">The save outcome may</text><text x="345" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">remain unknown.</text><text x="597" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">›</text><rect x="616" y="160" width="264" height="286" rx="18" fill="white" stroke="#dbe3ed"/><rect x="632" y="174" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="642" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">3</text><text x="636" y="236" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">Authorized</text><text x="636" y="266" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">reread</text><text x="636" y="304" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Check account and</text><text x="636" y="330" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">ownership.</text><text x="636" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Read only the fixed</text><text x="636" y="390" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">version.</text><text x="888" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">›</text><rect x="907" y="160" width="264" height="286" rx="18" fill="white" stroke="#dbe3ed"/><rect x="923" y="174" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="933" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">4</text><text x="927" y="236" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">Targeted sharing</text><text x="927" y="274" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Name the recipient and</text><text x="927" y="300" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">revision.</text><text x="927" y="334" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Revocation limits later</text><text x="927" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">access.</text><rect x="34" y="480" width="1132" height="59" rx="18" fill="#f1ebfa" stroke="none"/><text x="54" y="510" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#7054a2">Unknown commit outcome: check the original receipt first. Revocation cannot recall a copy already downloaded.</text></svg>
