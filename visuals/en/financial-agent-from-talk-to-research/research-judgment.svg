<path d="M317 220 H468 V237" fill="none" stroke="#0b7472" stroke-width="3" stroke-linejoin="round" marker-end="url(#teal-arrow)"/>
<rect x="32" y="242" width="270" height="128" rx="16" fill="#ffffff" stroke="#bdcfd3" stroke-width="2"/>
<rect x="334" y="242" width="268" height="128" rx="16" fill="#ffffff" stroke="#bdcfd3" stroke-width="2"/>
<text x="54" y="280" font-size="28" fill="#183847" font-weight="700" text-anchor="start">Applicable facts</text>
<text x="54" y="317" font-size="27" fill="#4d6672" font-weight="400" text-anchor="start">Scope · time</text>
<text x="54" y="352" font-size="26" fill="#4d6672" font-weight="400" text-anchor="start">Basis · coverage</text>
