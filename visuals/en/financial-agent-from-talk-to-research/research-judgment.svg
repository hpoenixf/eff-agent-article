<rect x="32" y="410" width="570" height="96" rx="18" fill="#0b7472"/>
<text x="317" y="449" font-size="31" fill="#ffffff" font-weight="700" text-anchor="middle">A useful judgment now</text>
<text x="317" y="485" font-size="26" fill="#ffffff" font-weight="400" text-anchor="middle">Differences · reasons · conditions</text>
