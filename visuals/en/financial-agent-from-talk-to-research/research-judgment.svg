<text x="28" y="47" font-size="32" fill="#183847" font-weight="700" text-anchor="start">A judgment with reasons</text>
<text x="28" y="84" font-size="27" fill="#4d6672" font-weight="400" text-anchor="start">And a clear route to revision</text>
<rect x="32" y="110" width="570" height="94" rx="18" fill="#e7f3ef"/>
<text x="317" y="148" font-size="30" fill="#0b7472" font-weight="700" text-anchor="middle">User purpose and choices</text>
<text x="317" y="184" font-size="26" fill="#183847" font-weight="400" text-anchor="middle">Objective · alternatives · baseline</text>
