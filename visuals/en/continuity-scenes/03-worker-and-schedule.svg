<svg xmlns="http://www.w3.org/2000/svg" width="600" height="980" viewBox="0 0 600 980" role="img" aria-labelledby="title desc" lang="en" xml:lang="en">
<title id="title">A Worker executes; a Schedule sets the time</title><desc id="desc">Two independent scenarios. When the process executing an unfinished Run exits, a new Worker resumes that Run from durable Session records if recovery conditions are met. A confirmed one-time future schedule needs an external trigger and eligibility checks to create or link its Run, which a Worker then executes.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#738691" stroke-width="1.5" /></marker></defs>
<style>text{font-family:"Noto Sans",Arial,sans-serif;fill:#172D3F} .muted{fill:#516475}</style>
<rect width="600" height="980" rx="22" fill="#F5F5F1" />
<text x="28" y="38" font-size="18" style="fill:#516475" font-weight="500" text-anchor="start" id="label-8">Scenario 03 · Execution and future scheduling</text>
<text x="28" y="84" font-size="31" style="fill:#172D3F" font-weight="700" text-anchor="start" id="label-9">Worker: who executes</text>
<text x="28" y="126" font-size="31" style="fill:#172D3F" font-weight="700" text-anchor="start" id="label-10">Schedule: when to start</text>
<rect x="24" y="153" width="552" height="324" rx="18" fill="white" stroke="#D7E0E4" stroke-width="1" />
<rect x="42" y="170" width="131" height="33" rx="16" fill="#EDF2FB" stroke="none" stroke-width="1" />
<text x="107.5" y="193" font-size="21" style="fill:#3159A0" font-weight="600" text-anchor="middle" id="label-13">Interrupted</text>
<text x="44" y="234" font-size="23" style="fill:#172D3F" font-weight="600" text-anchor="start" id="label-14">Research is unfinished; its process exits.</text>
<rect x="42" y="253" width="516" height="55" rx="10" fill="#E5F3EE" stroke="none" stroke-width="1" />
<text x="58" y="288" font-size="22" style="fill:#086C63" font-weight="600" text-anchor="start" id="label-16">Same Run R4: same question and progress</text>
<rect x="42" y="330" width="190" height="50" rx="10" fill="#EDF2FB" stroke="none" stroke-width="1" />
<text x="137" y="363" font-size="24" style="fill:#3159A0" font-weight="600" text-anchor="middle" id="label-18">Worker A</text>
<line x1="248" y1="355" x2="350" y2="355" stroke="#738691" stroke-width="2" marker-end="url(#arrow)" />
<rect x="366" y="330" width="192" height="50" rx="10" fill="#EDF2FB" stroke="none" stroke-width="1" />
<text x="462" y="363" font-size="24" style="fill:#3159A0" font-weight="600" text-anchor="middle" id="label-21">Worker B</text>
<text x="138" y="408" font-size="21" style="fill:#516475" font-weight="400" text-anchor="middle" id="label-22">Stops mid-run</text>
<text x="462" y="408" font-size="20" style="fill:#516475" font-weight="400" text-anchor="middle" id="label-23">Resumes when eligible</text>
<text x="44" y="449" font-size="20" style="fill:#172D3F" font-weight="400" text-anchor="start" id="label-24">Session stores state; budgets do not reset.</text>
<rect x="24" y="501" width="552" height="400" rx="18" fill="white" stroke="#D7E0E4" stroke-width="1" />
<rect x="42" y="518" width="131" height="33" rx="16" fill="#FFF2DD" stroke="none" stroke-width="1" />
<text x="107.5" y="541" font-size="21" style="fill:#8B541C" font-weight="600" text-anchor="middle" id="label-27">Run later</text>
<text x="44" y="583" font-size="23" style="fill:#172D3F" font-weight="600" text-anchor="start" id="label-28">You: Compare again at 9 a.m. tomorrow.</text>
<rect x="42" y="604" width="516" height="63" rx="10" fill="#FFF2DD" stroke="none" stroke-width="1" />
<text x="58" y="631" font-size="23" style="fill:#8B541C" font-weight="600" text-anchor="start" id="label-30">Today: confirm and save Schedule S1</text>
<text x="58" y="656" font-size="20" style="fill:#8B541C" font-weight="400" text-anchor="start" id="label-31">This research has not started yet.</text>
<line x1="69" y1="679" x2="69" y2="716" stroke="#738691" stroke-width="2" marker-end="url(#arrow)" />
<text x="94" y="706" font-size="22" style="fill:#516475" font-weight="400" text-anchor="start" id="label-33">An external trigger runs when due</text>
<rect x="42" y="733" width="516" height="142" rx="10" fill="#E5F3EE" stroke="none" stroke-width="1" />
<text x="58" y="765" font-size="22" style="fill:#086C63" font-weight="600" text-anchor="start" id="label-35">Check timing, authorization and eligibility</text>
<text x="58" y="803" font-size="22" style="fill:#086C63" font-weight="600" text-anchor="start" id="label-36">Create or link this occurrence's Run R5</text>
<text x="58" y="841" font-size="22" style="fill:#086C63" font-weight="600" text-anchor="start" id="label-37">A Worker executes, then saves results</text>
<text x="28" y="939" font-size="20" style="fill:#172D3F" font-weight="500" text-anchor="start" id="label-38">Public one-time schedules need an explicit run-due.</text>
<text x="28" y="969" font-size="20" style="fill:#516475" font-weight="400" text-anchor="start" id="label-39">A saved date does not wake execution by itself.</text>
</svg>