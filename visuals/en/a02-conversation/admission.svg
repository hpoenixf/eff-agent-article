<svg xmlns="http://www.w3.org/2000/svg" width="640" height="742" viewBox="0 0 640 742" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Retry the intent, not the effect</title><desc id="desc">For an existing ID, matching requests read back and conflicts are rejected. New admission has three outcomes: accepted, known not admitted, or unknown. Unknown outcomes retain the same ID for reconciliation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a3523d" stroke-width="1.8"/></marker></defs>
<rect x="1" y="1" width="638" height="740" rx="24" fill="#f7f8f2" stroke="#cddbd1"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" fill="#16362f">
<text x="30" y="35" font-size="16" font-weight="700" fill="#a3523d">A02 / CONVERSATION ADMISSION</text>
<text x="30" y="79" font-size="31" font-weight="700" fill="#16362f">Retry the intent, not the effect</text>
<rect x="28" y="105" width="584" height="94" rx="16" fill="#e8efe7" stroke="#cddbd1"/>
<text x="46" y="138" font-size="26" font-weight="700" fill="#16362f">Check ID, text, conversation and target</text>
<text x="46" y="169" font-size="23" font-weight="500" fill="#4e665e">Existing ID: match → read; conflict → reject</text>
<text x="30" y="238" font-size="23" font-weight="700" fill="#16362f">New ID: attempt admission; distinguish outcomes</text>
<rect x="28" y="262" width="584" height="94" rx="16" fill="#e8efe7" stroke="#cddbd1"/>
<text x="46" y="295" font-size="26" font-weight="700" fill="#16362f">Accepted</text>
<text x="46" y="326" font-size="23" font-weight="500" fill="#4e665e">Return the saved message and Run</text>
<rect x="28" y="380" width="584" height="94" rx="16" fill="#fff0e8" stroke="#cddbd1"/>
<text x="46" y="413" font-size="26" font-weight="700" fill="#16362f">Known not admitted</text>
<text x="46" y="444" font-size="23" font-weight="500" fill="#4e665e">Return failure; do not invent durable identity</text>
<rect x="28" y="498" width="584" height="94" rx="16" fill="white" stroke="#cddbd1"/>
<text x="46" y="531" font-size="26" font-weight="700" fill="#16362f">Outcome unknown</text>
<text x="46" y="562" font-size="23" font-weight="500" fill="#4e665e">Keep the same ID; reconcile persisted facts</text>
<text x="30" y="651" font-size="23" font-weight="500" fill="#4e665e">Retries after known failure follow the contract.</text>
<text x="30" y="684" font-size="23" font-weight="500" fill="#a3523d">Timeout proves neither success nor rollback.</text>
</g></svg>
