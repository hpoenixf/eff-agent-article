<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-labelledby="title desc"><title id="title">Preserve ownership from login to screen</title><desc id="desc">Current access, in-flight research grants and browser views have separate lifetimes. Account mismatch: deny the current read. Leaving the page does not automatically cancel an existing background task.</desc><rect width="1200" height="590" rx="22" fill="#f7f9fc"/><rect width="1200" height="8" fill="#7054a2"/><text x="48" y="60" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#17263e">Preserve ownership from login to screen</text><text x="48" y="108" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#17263e">Current access, in-flight research grants and browser views have separate lifetimes.</text><rect x="34" y="160" width="264" height="286" rx="18" fill="white" stroke="#dbe3ed"/><rect x="50" y="174" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="60" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">1</text><text x="54" y="236" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">Trusted session</text><text x="54" y="274" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">The server verifies the</text><text x="54" y="300" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">actor.</text><text x="54" y="334" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Never trust a</text><text x="54" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">client-supplied identity.</text><text x="306" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">›</text><rect x="325" y="160" width="264" height="286" rx="18" fill="white" stroke="#dbe3ed"/><rect x="341" y="174" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="351" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">2</text><text x="345" y="236" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">Resource</text><text x="345" y="266" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">ownership</text><text x="345" y="304" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Read by actor and</text><text x="345" y="330" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">resource relationship.</text><text x="345" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">A link is not permission.</text><text x="597" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">›</text><rect x="616" y="160" width="264" height="286" rx="18" fill="white" stroke="#dbe3ed"/><rect x="632" y="174" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="642" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">3</text><text x="636" y="236" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">Run authorization</text><text x="636" y="274" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Admit new requests</text><text x="636" y="300" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">independently.</text><text x="636" y="334" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">In-flight research uses</text><text x="636" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">its original grant.</text><text x="888" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">›</text><rect x="907" y="160" width="264" height="286" rx="18" fill="white" stroke="#dbe3ed"/><rect x="923" y="174" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="933" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">4</text><text x="927" y="236" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">Client isolation</text><text x="927" y="274" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Clear old views on</text><text x="927" y="300" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">identity changes.</text><text x="927" y="334" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Ignore late responses</text><text x="927" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">from the old identity.</text><rect x="34" y="480" width="1132" height="86" rx="18" fill="#f1ebfa" stroke="none"/><text x="54" y="510" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#7054a2">Account mismatch: deny the current read. Leaving the page does not automatically cancel an existing</text><text x="54" y="537" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#7054a2">background task.</text></svg>
