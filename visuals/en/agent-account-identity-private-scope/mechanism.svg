<svg xmlns="http://www.w3.org/2000/svg" width="480" height="453" viewBox="0 0 480 453" role="img" aria-labelledby="title desc"><title id="title">Two authorization lifetimes</title><desc id="desc">A new access request checks the current session and object ownership or share. An admitted research Run uses its recorded grant, subject to resources and cancellation. Logout is not task cancellation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC",Arial,sans-serif;fill:#17324d}.title{font-size:27px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.muted{fill:#475569}.warn{fill:#9a3412}</style><rect width="480" height="453" rx="18" fill="#f8fafc"/><text x="24" y="43" class="title">Two authorization lifetimes</text><text x="24" y="78" class="small">Different actions; different authority.</text><rect x="24" y="103" width="432" height="123" rx="12" fill="#eaf4ff" stroke="#8cb9df"/><text x="43" y="139" class="label">New access request</text><text x="43" y="177" class="body">Current session + target ownership</text><text x="43" y="207" class="small">Or an applicable recipient share</text><rect x="24" y="248" width="432" height="123" rx="12" fill="#eaf7f2" stroke="#8ccbb6"/><text x="43" y="285" class="label">Already admitted research</text><text x="43" y="322" class="body">Recorded grant + execution limits</text><text x="43" y="352" class="small">No new authority for another Run</text><text x="240" y="417" class="label" text-anchor="middle">Logout ≠ cancel the research</text></svg>
