<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1275" width="390" height="1275" role="img" aria-labelledby="title desc"><title id="title">Preserve ownership from login to screen</title><desc id="desc">Current access, in-flight research grants and browser views have separate lifetimes. Account mismatch: deny the current read. Leaving the page does not automatically cancel an existing background task.</desc><rect width="390" height="1275" rx="22" fill="#f7f9fc"/><rect width="390" height="8" fill="#7054a2"/><text x="24" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#17263e">Preserve ownership from</text><text x="24" y="76" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#17263e">login to screen</text><text x="24" y="115" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Current access, in-flight research grants</text><text x="24" y="139" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">and browser views have separate</text><text x="24" y="163" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">lifetimes.</text><rect x="20" y="211" width="350" height="194" rx="18" fill="white" stroke="#dbe3ed"/><rect x="36" y="225" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="46" y="248" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">1</text><text x="40" y="287" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#17263e">Trusted session</text><text x="40" y="323" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">The server verifies the actor.</text><text x="40" y="355" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Never trust a client-supplied identity.</text><text x="185" y="429" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">↓</text><rect x="20" y="439" width="350" height="194" rx="18" fill="white" stroke="#dbe3ed"/><rect x="36" y="453" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="46" y="476" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">2</text><text x="40" y="515" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#17263e">Resource ownership</text><text x="40" y="551" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Read by actor and resource</text><text x="40" y="575" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">relationship.</text><text x="40" y="607" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">A link is not permission.</text><text x="185" y="657" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">↓</text><rect x="20" y="667" width="350" height="194" rx="18" fill="white" stroke="#dbe3ed"/><rect x="36" y="681" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="46" y="704" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">3</text><text x="40" y="743" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#17263e">Run authorization</text><text x="40" y="779" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Admit new requests independently.</text><text x="40" y="811" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">In-flight research uses its original</text><text x="40" y="835" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">grant.</text><text x="185" y="885" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">↓</text><rect x="20" y="895" width="350" height="194" rx="18" fill="white" stroke="#dbe3ed"/><rect x="36" y="909" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="46" y="932" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">4</text><text x="40" y="971" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#17263e">Client isolation</text><text x="40" y="1007" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Clear old views on identity changes.</text><text x="40" y="1039" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Ignore late responses from the old</text><text x="40" y="1063" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">identity.</text><rect x="20" y="1123" width="350" height="128" rx="18" fill="#f1ebfa" stroke="none"/><text x="40" y="1153" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#7054a2">Account mismatch: deny the current</text><text x="40" y="1177" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#7054a2">read. Leaving the page does not</text><text x="40" y="1201" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#7054a2">automatically cancel an existing</text><text x="40" y="1225" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#7054a2">background task.</text></svg>
