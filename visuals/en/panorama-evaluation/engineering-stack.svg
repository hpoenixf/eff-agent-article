      <circle cx="87" cy="793" r="23" fill="#e6efe9"/>
      <text x="87" y="800" font-size="19" font-weight="750" fill="#25604d" text-anchor="middle">05</text>
      <text x="125" y="802" font-size="27" font-weight="700" fill="#16362f">Report Comparable Outcomes</text>
      <text x="73" y="840" font-size="21" fill="#4e665e">Preserve failures, unknowns and the full denominator</text>
      
      </g></g>
<g stroke="#a66b21" stroke-width="2.6" fill="none" marker-end="url(#arr)">
<path d="M320 240 V271"/><path d="M320 388 V419"/><path d="M320 536 V567"/><path d="M320 720 V745"/>
