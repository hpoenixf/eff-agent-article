<svg xmlns="http://www.w3.org/2000/svg" width="640" height="944" viewBox="0 0 640 944" role="img" aria-labelledby="title description" lang="en">
<title id="title">Agent evaluation implementation stack</title>
<desc id="description">Frozen tasks flow through a research runtime, recorded evidence, layered checks and comparable outcomes. Ragas has no real quality scores yet.</desc>
<defs>
  <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#b7cbc1" opacity=".48"/></pattern>
  <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#16362f" flood-opacity=".08"/></filter>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a66b21" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="640" height="944" rx="24" fill="#f7f8f2"/>
<rect x="1" y="1" width="638" height="942" rx="23" fill="url(#dots)" stroke="#cbd9d0"/>
<text x="40" y="43" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#a66b21">EVALUATION / IMPLEMENTATION</text>
<text x="40" y="92" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28" font-weight="750" fill="#16362f">HOW AGENT EVALUATION WORKS</text>
<g font-family="Inter, Arial, Helvetica, sans-serif"><g>
      <rect x="40" y="134" width="560" height="103" rx="18" fill="#ffffff" stroke="#cbd9d0" stroke-width="1.6" filter="url(#cardShadow)"/>
      <rect x="40" y="134" width="8" height="103" rx="4" fill="#2a6b55"/>
      <circle cx="87" cy="171" r="23" fill="#e6efe9"/>
      <text x="87" y="178" font-size="19" font-weight="750" fill="#25604d" text-anchor="middle">01</text>
      <text x="125" y="180" font-size="27" font-weight="700" fill="#16362f">Frozen Tasks &amp; Criteria</text>
      <text x="73" y="218" font-size="21" fill="#4e665e">13 ETF regression cases + curated research tasks</text>
      
      </g><g>
      <rect x="40" y="282" width="560" height="103" rx="18" fill="#ffffff" stroke="#cbd9d0" stroke-width="1.6" filter="url(#cardShadow)"/>
      <rect x="40" y="282" width="8" height="103" rx="4" fill="#2a6b55"/>
      <circle cx="87" cy="319" r="23" fill="#e6efe9"/>
      <text x="87" y="326" font-size="19" font-weight="750" fill="#25604d" text-anchor="middle">02</text>
      <text x="125" y="328" font-size="27" font-weight="700" fill="#16362f">Run a Real Research Task</text>
      <text x="73" y="366" font-size="21" fill="#4e665e">TypeScript Runtime · AI SDK · MCP</text>
      
      </g><g>
      <rect x="40" y="430" width="560" height="103" rx="18" fill="#ffffff" stroke="#cbd9d0" stroke-width="1.6" filter="url(#cardShadow)"/>
      <rect x="40" y="430" width="8" height="103" rx="4" fill="#2a6b55"/>
      <circle cx="87" cy="467" r="23" fill="#e6efe9"/>
      <text x="87" y="474" font-size="19" font-weight="750" fill="#25604d" text-anchor="middle">03</text>
      <text x="125" y="476" font-size="25" font-weight="700" fill="#16362f">Save Evidence and Receipts</text>
      <text x="73" y="514" font-size="21" fill="#4e665e">PostgreSQL · OpenTelemetry · Langfuse</text>
      
      </g><g>
      <rect x="40" y="578" width="560" height="139" rx="18" fill="#ffffff" stroke="#cbd9d0" stroke-width="1.6" filter="url(#cardShadow)"/>
      <rect x="40" y="578" width="8" height="139" rx="4" fill="#b6792b"/>
      <circle cx="87" cy="615" r="23" fill="#f5ead5"/>
      <text x="87" y="622" font-size="19" font-weight="750" fill="#a66b21" text-anchor="middle">04</text>
      <text x="125" y="624" font-size="27" font-weight="700" fill="#16362f">Check and Judge Separately</text>
      <text x="73" y="663" font-size="21" fill="#4e665e">Vitest / Playwright · rules · optional DeepEval</text>
      <text x="73" y="696" font-size="20" fill="#936016">Ragas integration tested; real scores not available</text>
      </g><g>
      <rect x="40" y="756" width="560" height="108" rx="18" fill="#ffffff" stroke="#cbd9d0" stroke-width="1.6" filter="url(#cardShadow)"/>
