<rect width="640" height="486" rx="24" fill="#f1f7f4"/>
<g font-family="Noto Sans CJK SC,Arial,sans-serif"><text x="32" y="48" font-size="32" fill="#163d39" font-weight="700" text-anchor="start">Acquire once, read the exact version</text><text x="32" y="83" font-size="23" fill="#4b6661" font-weight="500" text-anchor="start">A resultRef is not a fresh-query command</text>
