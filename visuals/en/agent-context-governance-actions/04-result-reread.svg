<rect x="24" y="416" width="592" height="48" rx="12" fill="#216d63" stroke="#216d63" stroke-width="1.5"/><text x="320" y="448" font-size="25" fill="#fff" font-weight="600" text-anchor="middle">Reading R1 must not silently return R2</text></g></svg>
