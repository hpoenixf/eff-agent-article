<svg xmlns="http://www.w3.org/2000/svg" width="640" height="486" viewBox="0 0 640 486" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Acquire once, read the exact version</title><desc id="desc">A resultRef is not a fresh-query command Reading R1 must not silently return R2</desc>
