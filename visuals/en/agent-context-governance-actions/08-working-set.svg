<svg xmlns="http://www.w3.org/2000/svg" width="640" height="492" viewBox="0 0 640 492" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Three ways to reduce context</title><desc id="desc">Keep a route back to the originals Summaries cannot rewrite facts or effects</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#216d63"/></marker></defs>
<rect width="640" height="492" rx="24" fill="#f1f7f4"/>
<g font-family="Noto Sans CJK SC,Arial,sans-serif"><text x="32" y="48" font-size="32" fill="#163d39" font-weight="700" text-anchor="start">Three ways to reduce context</text><text x="32" y="83" font-size="23" fill="#4b6661" font-weight="500" text-anchor="start">Keep a route back to the originals</text>
<rect x="24" y="112" width="592" height="82" rx="16" fill="#ffffff" stroke="#a8c9c0" stroke-width="1.5"/><text x="44" y="146" font-size="27" fill="#163d39" font-weight="700" text-anchor="start">Current critical material</text><text x="44" y="177" font-size="25" fill="#4b6661" font-weight="500" text-anchor="start">Keep it where decisions need it</text><rect x="24" y="206" width="592" height="82" rx="16" fill="#e7f0eb" stroke="#a8c9c0" stroke-width="1.5"/><text x="44" y="240" font-size="27" fill="#163d39" font-weight="700" text-anchor="start">Older readable results</text><text x="44" y="271" font-size="25" fill="#4b6661" font-weight="500" text-anchor="start">Use exact-version references</text><rect x="24" y="300" width="592" height="82" rx="16" fill="#ffffff" stroke="#a8c9c0" stroke-width="1.5"/><text x="44" y="334" font-size="27" fill="#163d39" font-weight="700" text-anchor="start">Past working process</text><text x="44" y="365" font-size="25" fill="#4b6661" font-weight="500" text-anchor="start">Summarize only when useful</text>
<rect x="24" y="422" width="592" height="48" rx="12" fill="#216d63" stroke="#216d63" stroke-width="1.5"/><text x="320" y="454" font-size="25" fill="#fff" font-weight="600" text-anchor="middle">Summaries cannot rewrite facts or effects</text></g></svg>
