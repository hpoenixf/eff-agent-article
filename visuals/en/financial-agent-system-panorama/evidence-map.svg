<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="960" viewBox="0 0 1240 960" role="img" aria-labelledby="title desc" lang="en">
<title id="title">03 · Trace records, not an imagined chain of thought</title><desc id="desc">Source records remain with their owners. Observability, quality and audit ask different questions.</desc>
<defs><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#39688C"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#136F70"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9C6014"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7B8997"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC",Arial,"Microsoft YaHei",sans-serif;fill:#172D43}.title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#53667A}.head{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#53667A}.tag{font-size:14px;font-weight:700;letter-spacing:.5px}.edge{font-size:15px;fill:#39688C;}.label{font-size:16px;font-weight:700}</style>
<rect x="0" y="0" width="1240" height="960" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.8"/>
<text x="32" y="46" class="title" text-anchor="start">03 · Trace records, not an imagined chain of thought</text>
<text x="32" y="77" class="sub" text-anchor="start">Source records remain with their owners. Observability, quality and audit ask different questions.</text>
<text x="32" y="126" class="head" text-anchor="start">LINKED ORIGINAL RECORDS</text>
<rect x="32" y="166" width="196" height="161" rx="14" fill="#EAF7F3" stroke="#136F70" stroke-width="1.8"/>
<text x="49" y="193" class="tag" text-anchor="start" style="fill:#136F70">REQUEST</text>
<text x="49" y="223" class="head" text-anchor="start" style="font-size:19px">Who / which Run?</text>
<text x="49" y="252" class="body" text-anchor="start" style="font-size:15px">Subject · original text</text>
<text x="49" y="275" class="body" text-anchor="start" style="font-size:15px">Run · scope</text>
<rect x="277" y="166" width="196" height="161" rx="14" fill="#EAF7F3" stroke="#136F70" stroke-width="1.8"/>
<text x="294" y="193" class="tag" text-anchor="start" style="fill:#136F70">SOURCE</text>
<text x="294" y="223" class="head" text-anchor="start" style="font-size:20px">Which evidence?</text>
<text x="294" y="252" class="body" text-anchor="start" style="font-size:15px">Source · version</text>
<text x="294" y="275" class="body" text-anchor="start" style="font-size:15px">Data as of · range</text>
<text x="294" y="298" class="body" text-anchor="start" style="font-size:15px">Gaps / failures</text>
<rect x="522" y="166" width="196" height="161" rx="14" fill="#EAF7F3" stroke="#136F70" stroke-width="1.8"/>
<text x="539" y="193" class="tag" text-anchor="start" style="fill:#136F70">METHOD</text>
<text x="539" y="223" class="head" text-anchor="start" style="font-size:18px">Which calculation?</text>
<text x="539" y="252" class="body" text-anchor="start" style="font-size:15px">Method version</text>
<text x="539" y="275" class="body" text-anchor="start" style="font-size:15px">Input version · result</text>
<text x="539" y="298" class="body" text-anchor="start" style="font-size:15px">Units · assumptions</text>
<rect x="767" y="166" width="196" height="161" rx="14" fill="#EAF7F3" stroke="#136F70" stroke-width="1.8"/>
<text x="784" y="193" class="tag" text-anchor="start" style="fill:#136F70">PUBLICATION</text>
<text x="784" y="223" class="head" text-anchor="start" style="font-size:20px">Which report?</text>
<text x="784" y="252" class="body" text-anchor="start" style="font-size:15px">Body / file version</text>
<text x="784" y="275" class="body" text-anchor="start" style="font-size:15px">Commit · access</text>
<text x="784" y="298" class="body" text-anchor="start" style="font-size:15px">receipt</text>
<rect x="1012" y="166" width="196" height="161" rx="14" fill="#FFF6E8" stroke="#9C6014" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="1029" y="193" class="tag" text-anchor="start" style="fill:#9C6014">BUSINESS TARGET</text>
<text x="1029" y="223" class="head" text-anchor="start" style="font-size:19px">Any actual effect?</text>
<text x="1029" y="252" class="body" text-anchor="start" style="font-size:15px">Review / mandate</text>
<text x="1029" y="275" class="body" text-anchor="start" style="font-size:15px">Order / fill / settlement</text>
<path d="M 228 247 L 277 247" fill="none" stroke="#136F70" stroke-width="2.2" marker-end="url(#teal)"/>
<path d="M 473 247 L 522 247" fill="none" stroke="#136F70" stroke-width="2.2" marker-end="url(#teal)"/>
<path d="M 718 247 L 767 247" fill="none" stroke="#136F70" stroke-width="2.2" marker-end="url(#teal)"/>
<path d="M 963 247 L 1012 247" fill="none" stroke="#9C6014" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#amber)"/>
<rect x="32" y="406" width="1176" height="96" rx="14" fill="#F4F0FA" stroke="#66518D" stroke-width="1.8"/>
<text x="52" y="440" class="head" text-anchor="start">PERMITTED READ / RECONCILIATION</text>
<text x="52" y="474" class="body" text-anchor="start">Join original identities and receipts; keep missing, truncated and unknown evidence explicit.</text>
<path d="M 130 327 L 130 395 L 130 406" fill="none" stroke="#7B8997" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#gray)"/>
<path d="M 375 327 L 375 395 L 375 406" fill="none" stroke="#7B8997" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#gray)"/>
<path d="M 620 327 L 620 395 L 620 406" fill="none" stroke="#7B8997" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#gray)"/>
<path d="M 865 327 L 865 395 L 865 406" fill="none" stroke="#7B8997" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#gray)"/>
<path d="M 1110 327 L 1110 395 L 1110 406" fill="none" stroke="#7B8997" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#gray)"/>
<rect x="180" y="341" width="870" height="32" rx="4" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.8"/>
<text x="615" y="363" class="body" text-anchor="middle">References preserve identity; they do not certify semantic correctness or grant access.</text>
<rect x="32" y="585" width="360" height="170" rx="14" fill="#EDF5FC" stroke="#CCDAE5" stroke-width="1.8"/>
<text x="49" y="612" class="tag" text-anchor="start" style="fill:#136F70">ENGINEERING</text>
<text x="49" y="642" class="head" text-anchor="start" style="font-size:20px">Operational diagnosis</text>
<text x="49" y="671" class="body" text-anchor="start" style="font-size:17px">What executed or failed?</text>
<text x="49" y="696" class="body" text-anchor="start" style="font-size:17px">Where was delivery interrupted?</text>
<text x="49" y="721" class="body" text-anchor="start" style="font-size:17px">Trace ≠ original business effect</text>
<rect x="440" y="585" width="360" height="170" rx="14" fill="#EDF5FC" stroke="#CCDAE5" stroke-width="1.8"/>
<text x="457" y="612" class="tag" text-anchor="start" style="fill:#136F70">RESEARCH</text>
<text x="457" y="642" class="head" text-anchor="start" style="font-size:20px">Quality assessment</text>
<text x="457" y="671" class="body" text-anchor="start" style="font-size:17px">Did it answer the original question?</text>
<text x="457" y="696" class="body" text-anchor="start" style="font-size:17px">Are sources, methods and values right?</text>
<text x="457" y="721" class="body" text-anchor="start" style="font-size:17px">Completed ≠ correct</text>
<rect x="848" y="585" width="360" height="170" rx="14" fill="#FFF6E8" stroke="#9C6014" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="865" y="612" class="tag" text-anchor="start" style="fill:#9C6014">INSTITUTIONAL TARGET</text>
<text x="865" y="642" class="head" text-anchor="start" style="font-size:20px">Independent review / audit</text>
<text x="865" y="671" class="body" text-anchor="start" style="font-size:17px">Who was authorized for which effect?</text>
<text x="865" y="696" class="body" text-anchor="start" style="font-size:17px">Was the required review performed?</text>
<text x="865" y="721" class="body" text-anchor="start" style="font-size:17px">No record ≠ verified review</text>
<path d="M 212 502 L 212 585" fill="none" stroke="#39688C" stroke-width="2.2" marker-end="url(#line)"/>
<path d="M 620 502 L 620 585" fill="none" stroke="#39688C" stroke-width="2.2" marker-end="url(#line)"/>
<path d="M 1028 502 L 1028 585" fill="none" stroke="#9C6014" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#amber)"/>
<rect x="32" y="806" width="1176" height="110" rx="14" fill="#FFFFFF" stroke="#7B8997" stroke-width="1.8"/>
<text x="52" y="840" class="head" text-anchor="start">PRIVACY AND RETENTION ARE PART OF THE DESIGN</text>
<text x="52" y="872" class="body" text-anchor="start">Minimized ordinary logs · separately governed protected content · access / retention / deletion policies</text>
<text x="52" y="899" class="body" text-anchor="start">Replay evidence is not permission to re-execute. Historical reports are not current holdings.</text>
</svg>