<svg xmlns="http://www.w3.org/2000/svg" width="640" height="656" viewBox="0 0 640 656" role="img" aria-labelledby="title desc"><title id="title">Separate research and business effects</title><desc id="desc">Reading can complete the research. Later research keeps the old basis. A new specific action request requires separate business authorization; the action lane is an institutional target, not current trading functionality.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f83"/></marker></defs><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect width="640" height="656" rx="24" fill="#f5f8f8"/><text x="32" y="49" font-size="30" fill="#153246" font-weight="700" text-anchor="start">A report is not an order</text><text x="32" y="90" font-size="25" fill="#4e6571" font-weight="400" text-anchor="start">Reading and acting are separate.</text><rect x="24" y="120" width="592" height="100" rx="18" fill="#e7f3f2" stroke="#87bcbb" stroke-width="2"/><text x="320" y="158" font-size="27" fill="#153246" font-weight="700" text-anchor="middle">Materials → calculations → judgment</text><text x="320" y="196" font-size="25" fill="#4e6571" font-weight="400" text-anchor="middle">Preserve the report and its basis.</text><path d="M320 220 V244 H162 V270" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><path d="M320 244 H478 V270" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="274" width="276" height="104" rx="18" fill="#ffffff" stroke="#d5e1e5" stroke-width="2"/><text x="162" y="314" font-size="28" fill="#153246" font-weight="700" text-anchor="middle">Read &amp; ask</text><text x="162" y="354" font-size="25" fill="#4e6571" font-weight="400" text-anchor="middle">Research can end.</text><rect x="340" y="274" width="276" height="104" rx="18" fill="#fff6eb" stroke="#d9a873" stroke-width="2" stroke-dasharray="8 6"/><text x="478" y="314" font-size="25" fill="#a45b15" font-weight="700" text-anchor="middle">New action request</text><text x="478" y="354" font-size="25" fill="#4e6571" font-weight="400" text-anchor="middle">A separate process</text><path d="M162 378 V434" fill="none" stroke="#087f83" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M478 378 V434" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="438" width="276" height="142" rx="18" fill="#ffffff" stroke="#d5e1e5" stroke-width="2"/><text x="162" y="476" font-size="26" fill="#153246" font-weight="700" text-anchor="middle">Review over time</text><text x="162" y="515" font-size="24" fill="#4e6571" font-weight="400" text-anchor="middle">Keep the old basis.</text><text x="162" y="552" font-size="24" fill="#4e6571" font-weight="400" text-anchor="middle">Assess new facts.</text><rect x="340" y="438" width="276" height="142" rx="18" fill="#fff6eb" stroke="#d9a873" stroke-width="2" stroke-dasharray="8 6"/><text x="478" y="476" font-size="26" fill="#a45b15" font-weight="700" text-anchor="middle">Check &amp; authorize</text><text x="478" y="515" font-size="23" fill="#4e6571" font-weight="400" text-anchor="middle">Execute and reconcile</text><text x="478" y="552" font-size="23" fill="#4e6571" font-weight="400" text-anchor="middle">Record actual results.</text><text x="320" y="624" font-size="24" fill="#a45b15" font-weight="400" text-anchor="middle">Dashed amber: institutional target only.</text></g></svg>