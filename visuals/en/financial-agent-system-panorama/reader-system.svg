<svg xmlns="http://www.w3.org/2000/svg" width="640" height="624" viewBox="0 0 640 624" role="img" aria-labelledby="title desc"><title id="title">System responsibilities</title><desc id="desc">The cards describe responsibilities, not four mandatory services. Trading is not a current conversational research capability.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f83"/></marker></defs><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect width="640" height="624" rx="24" fill="#f5f8f8"/><text x="32" y="49" font-size="30" fill="#153246" font-weight="700" text-anchor="start">A map of responsibilities</text><text x="32" y="90" font-size="26" fill="#4e6571" font-weight="400" text-anchor="start">Different roles. Shared research.</text><rect x="24" y="122" width="286" height="158" rx="18" fill="#ffffff" stroke="#d5e1e5" stroke-width="2"/><text x="42" y="158" font-size="22" fill="#087f83" font-weight="700" text-anchor="start">01</text><text x="42" y="198" font-size="27" fill="#153246" font-weight="700" text-anchor="start">Investment records</text><text x="42" y="234" font-size="23" fill="#4e6571" font-weight="400" text-anchor="start">Holdings and cash</text><text x="42" y="266" font-size="23" fill="#4e6571" font-weight="400" text-anchor="start">Read, do not rewrite</text><rect x="330" y="122" width="286" height="158" rx="18" fill="#ffffff" stroke="#d5e1e5" stroke-width="2"/><text x="348" y="158" font-size="22" fill="#087f83" font-weight="700" text-anchor="start">02</text><text x="348" y="198" font-size="27" fill="#153246" font-weight="700" text-anchor="start">Data access</text><text x="348" y="234" font-size="23" fill="#4e6571" font-weight="400" text-anchor="start">Source, date, scope</text><text x="348" y="266" font-size="23" fill="#4e6571" font-weight="400" text-anchor="start">Pass materials on</text><rect x="24" y="302" width="286" height="158" rx="18" fill="#ffffff" stroke="#d5e1e5" stroke-width="2"/><text x="42" y="338" font-size="22" fill="#087f83" font-weight="700" text-anchor="start">03</text><text x="42" y="378" font-size="27" fill="#153246" font-weight="700" text-anchor="start">Research &amp; delivery</text><text x="42" y="414" font-size="23" fill="#4e6571" font-weight="400" text-anchor="start">Choose, calculate</text><text x="42" y="446" font-size="23" fill="#4e6571" font-weight="400" text-anchor="start">Explain and deliver</text><rect x="330" y="302" width="286" height="158" rx="18" fill="#ffffff" stroke="#d5e1e5" stroke-width="2"/><text x="348" y="338" font-size="22" fill="#087f83" font-weight="700" text-anchor="start">04</text><text x="348" y="378" font-size="27" fill="#153246" font-weight="700" text-anchor="start">Observation</text><text x="348" y="414" font-size="23" fill="#4e6571" font-weight="400" text-anchor="start">Calls and outcomes</text><text x="348" y="446" font-size="23" fill="#4e6571" font-weight="400" text-anchor="start">Diagnose, not approve</text><rect x="24" y="494" width="592" height="102" rx="18" fill="#153246" stroke="#153246" stroke-width="2"/><text x="320" y="534" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle">Research autonomy ≠ action authority</text><text x="320" y="574" font-size="25" fill="#d4e8eb" font-weight="400" text-anchor="middle">Current research does not trade.</text></g></svg>