<svg xmlns="http://www.w3.org/2000/svg" width="640" height="656" viewBox="0 0 640 656" role="img" aria-labelledby="title desc"><title id="title">The research feedback loop</title><desc id="desc">Important gaps can lead back from calculation to retrieval. Supported independent parts can be delivered without waiting for every gap to close.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f83"/></marker></defs><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect width="640" height="656" rx="24" fill="#f5f8f8"/><text x="32" y="49" font-size="30" fill="#153246" font-weight="700" text-anchor="start">Research is a feedback loop</text><text x="32" y="90" font-size="26" fill="#4e6571" font-weight="400" text-anchor="start">Investigate gaps; retain useful work.</text><rect x="24" y="120" width="450" height="88" rx="18" fill="#ffffff" stroke="#d5e1e5" stroke-width="2"/><text x="44" y="156" font-size="28" fill="#153246" font-weight="700" text-anchor="start">Frame the question</text><text x="44" y="190" font-size="25" fill="#4e6571" font-weight="400" text-anchor="start">Goal and key constraints</text><path d="M249 208 V230" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="234" width="450" height="88" rx="18" fill="#ffffff" stroke="#d5e1e5" stroke-width="2"/><text x="44" y="270" font-size="28" fill="#153246" font-weight="700" text-anchor="start">Retrieve materials</text><text x="44" y="304" font-size="25" fill="#4e6571" font-weight="400" text-anchor="start">Sources, dates, coverage</text><path d="M249 322 V344" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="348" width="450" height="88" rx="18" fill="#ffffff" stroke="#d5e1e5" stroke-width="2"/><text x="44" y="384" font-size="28" fill="#153246" font-weight="700" text-anchor="start">Compare and calculate</text><text x="44" y="418" font-size="25" fill="#4e6571" font-weight="400" text-anchor="start">Suitable inputs and methods</text><path d="M249 436 V458" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="462" width="450" height="88" rx="18" fill="#ffffff" stroke="#d5e1e5" stroke-width="2"/><text x="44" y="498" font-size="28" fill="#153246" font-weight="700" text-anchor="start">Explain and deliver</text><text x="44" y="532" font-size="25" fill="#4e6571" font-weight="400" text-anchor="start">Conclusions and open gaps</text><path d="M474 391 H605 V278 H474" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><text x="543" y="318" font-size="24" fill="#087f83" font-weight="700" text-anchor="middle">Gap?</text><text x="543" y="353" font-size="24" fill="#087f83" font-weight="700" text-anchor="middle">Revisit</text><text x="320" y="590" font-size="26" fill="#087f83" font-weight="700" text-anchor="middle">Deliver supported parts along the way.</text><text x="320" y="628" font-size="24" fill="#4e6571" font-weight="400" text-anchor="middle">Stopping does not mean every gap is closed.</text></g></svg>