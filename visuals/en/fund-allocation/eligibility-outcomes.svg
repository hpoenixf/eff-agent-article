<svg xmlns="http://www.w3.org/2000/svg" width="640" height="824" viewBox="0 0 640 824" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Eligibility changes the amount, not the facts</title><desc id="desc">When current amount evidence is unavailable, keep historical facts and disclose the amount gap. With a known deployable budget, assess each fund: eligible amounts respect caps and steps; ineligible amounts are withdrawn and their gaps remain. Allocated plus unallocated equals the deployable budget. All paths produce read-only advice and limitations, not ledger writes or trades.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#226e63" stroke-width="1.6"/></marker></defs>
<rect x="1" y="1" width="638" height="822" rx="20" fill="#f8faf5" stroke="#a8bcb4"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<text x="28" y="48" text-anchor="start" font-size="30" font-weight="700" fill="#183a36"><tspan x="28" dy="0">Eligibility changes the amount</tspan></text>
<text x="28" y="86" text-anchor="start" font-size="27" font-weight="400" fill="#4c625d"><tspan x="28" dy="0">Missing evidence stays an explicit gap</tspan></text>
<g id="amount-evidence-unavailable"><rect x="24" y="113" width="260" height="142" rx="14" fill="#f6ead8" stroke="#a8bcb4"/><text x="42" y="153" text-anchor="start" font-size="27" font-weight="700" fill="#183a36"><tspan x="42" dy="0">Current amount</tspan><tspan x="42" dy="34">evidence is</tspan><tspan x="42" dy="34">unavailable</tspan></text></g>
<g id="preserve-history-gap"><rect x="350" y="113" width="242" height="142" rx="14" fill="#f6ead8" stroke="#a8bcb4"/><text x="367" y="153" text-anchor="start" font-size="26" font-weight="700" fill="#183a36"><tspan x="367" dy="0">Keep historical</tspan><tspan x="367" dy="33">facts; mark the</tspan><tspan x="367" dy="33">amount gap</tspan></text></g>
<path id="missing-evidence-keeps-history" d="M286 184 H342" fill="none" stroke="#226e63" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="24" y="291" width="568" height="360" rx="14" fill="white" stroke="#a8bcb4"/>
<text x="42" y="329" text-anchor="start" font-size="26" font-weight="700" fill="#183a36"><tspan x="42" dy="0">With a known deployable budget</tspan></text>
<g id="eligible-fund"><rect x="42" y="353" width="248" height="166" rx="14" fill="#e5f0e9" stroke="#a8bcb4"/><text x="58" y="389" text-anchor="start" font-size="27" font-weight="700" fill="#183a36"><tspan x="58" dy="0">Eligible fund</tspan></text><text x="58" y="429" text-anchor="start" font-size="26" font-weight="400" fill="#183a36"><tspan x="58" dy="0">Allocate within</tspan><tspan x="58" dy="33">caps and steps</tspan></text></g>
<g id="ineligible-fund"><rect x="316" y="353" width="258" height="166" rx="14" fill="#f6ead8" stroke="#a8bcb4"/><text x="332" y="389" text-anchor="start" font-size="26" font-weight="700" fill="#183a36"><tspan x="332" dy="0">Ineligible fund</tspan></text><text x="332" y="429" text-anchor="start" font-size="26" font-weight="400" fill="#183a36"><tspan x="332" dy="0">Withdraw amount;</tspan><tspan x="332" dy="33">retain its gap</tspan></text></g>
<path id="eligible-to-reconciliation" d="M166 521 V551" fill="none" stroke="#226e63" stroke-width="2.5" marker-end="url(#arrow)"/>
<path id="ineligible-to-reconciliation" d="M445 521 V551" fill="none" stroke="#226e63" stroke-width="2.5" marker-end="url(#arrow)"/>
<g id="reconciliation"><rect x="42" y="560" width="532" height="72" rx="14" fill="#e5f0e9" stroke="#a8bcb4"/><text x="308" y="590" text-anchor="middle" font-size="26" font-weight="700" fill="#183a36"><tspan x="308" dy="0">Allocated + unallocated</tspan><tspan x="308" dy="33">= deployable budget</tspan></text></g>
<path id="history-gap-to-readonly" d="M594 184 H612 V744 H596" fill="none" stroke="#226e63" stroke-width="2.5" marker-end="url(#arrow)"/>
<path id="reconciled-to-readonly" d="M308 654 V681" fill="none" stroke="#226e63" stroke-width="2.5" marker-end="url(#arrow)"/>
<g id="readonly-output"><rect x="24" y="690" width="568" height="108" rx="14" fill="#e5f0e9" stroke="#a8bcb4"/><text x="42" y="729" text-anchor="start" font-size="26" font-weight="700" fill="#183a36"><tspan x="42" dy="0">Read-only amounts and limitations</tspan></text><text x="42" y="771" text-anchor="start" font-size="25" font-weight="400" fill="#4c625d"><tspan x="42" dy="0">No ledger writes. No trade execution.</tspan></text></g>
</g></svg>
