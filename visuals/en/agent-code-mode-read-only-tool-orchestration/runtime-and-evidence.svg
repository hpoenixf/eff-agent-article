<svg xmlns="http://www.w3.org/2000/svg" width="600" height="834" viewBox="0 0 600 834" role="img" aria-labelledby="runtime-title runtime-desc">
<title id="runtime-title">Inside the private research agent</title>
<desc id="runtime-desc">Controlled validation in the private research agent. Each inner call passes through existing permission, input and budget checks before tool execution. Results and call status are recorded, and the program can return selected text and sources to the model. Approved structured financial reads retain original-version results for later range reads or isolated Python computation, after checks at the same tool entry. This re-read support does not apply to every tool result. Rejected calls also retain failure status.</desc>
