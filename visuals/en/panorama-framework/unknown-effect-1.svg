<svg xmlns="http://www.w3.org/2000/svg" width="520" height="720" viewBox="0 0 520 720" role="img" aria-labelledby="title desc" lang="en"><title id="title">Establish effects after an exception</title><desc id="desc">Unknown does not mean not committed</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#49796e" stroke-width="1.7"/></marker></defs><rect width="520" height="720" rx="20" fill="#f7f8f2"/><rect x="1" y="1" width="518" height="718" rx="19" fill="none" stroke="#cddbd1"/>
<text x="28" y="32" font-family="Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#7756a0" text-anchor="start">FRAMEWORK / FIELD GUIDE</text>
<text x="28" y="68" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#183e35" text-anchor="start">Establish effects after an exception</text>
<text x="28" y="101" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="500" fill="#586d65" text-anchor="start">Unknown does not mean not committed</text>
<rect x="28" y="128" width="464" height="80" rx="12" fill="#f0eaf8" stroke="#c4b2da" stroke-width="1.5"/>
<text x="260.0" y="174.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">Exception after an operation</text>
<text x="28" y="244" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#183e35" text-anchor="start">Is the effect known</text>
<text x="28" y="280" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#7756a0" text-anchor="start">Committed</text>
<rect x="28" y="296" width="464" height="100" rx="12" fill="#ffffff" stroke="#bacdc4" stroke-width="1.5"/>
<text x="260.0" y="352.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">Read back by original identity</text>
<text x="28" y="420" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#7756a0" text-anchor="start">Not committed</text>
<rect x="28" y="436" width="464" height="100" rx="12" fill="#ffffff" stroke="#bacdc4" stroke-width="1.5"/>
<text x="260.0" y="492.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">Retry only under the applicable policy</text>
<text x="28" y="560" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#7756a0" text-anchor="start">Unknown</text>
<rect x="28" y="576" width="464" height="100" rx="12" fill="#ffffff" stroke="#bacdc4" stroke-width="1.5"/>
<text x="260.0" y="632.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">Consult the original effect owner</text></svg>
