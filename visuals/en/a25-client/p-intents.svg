<svg xmlns="http://www.w3.org/2000/svg" width="640" height="488" viewBox="0 0 640 488" role="img" aria-labelledby="title desc" lang="en">
<title id="title">New input can mean different work</title><desc id="desc">A new question, amendment, clarification reply and stop action each have their own explicit target.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a3523d" stroke-width="1.8"/></marker></defs>
<rect x="1" y="1" width="638" height="486" rx="24" fill="#f7f8f2" stroke="#cddbd1"/>
<g fill="#16362f" font-weight="500" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<text x="30" y="36" font-size="16" font-weight="700" fill="#a3523d">AGENT / CLIENT PANORAMA</text>
<text x="30" y="80" font-size="32" font-weight="750">New input can mean different work</text>
<rect x="26" y="105" width="588" height="70" rx="16" fill="white" stroke="#cddbd1"/>
<text x="42" y="134" font-size="25" font-weight="700">Ask something else</text>
<text x="42" y="162" font-size="23" fill="#4e665e">Separate answer; no silent amendment</text>
<rect x="26" y="187" width="588" height="70" rx="16" fill="#e8efe7" stroke="#cddbd1"/>
<text x="42" y="216" font-size="25" font-weight="700">Add a requirement</text>
<text x="42" y="244" font-size="23" fill="#4e665e">Target the selected research task</text>
<rect x="26" y="269" width="588" height="70" rx="16" fill="white" stroke="#cddbd1"/>
<text x="42" y="298" font-size="25" font-weight="700">Reply to a question</text>
<text x="42" y="326" font-size="23" fill="#4e665e">Answer that pending clarification</text>
<rect x="26" y="351" width="588" height="70" rx="16" fill="white" stroke="#cddbd1"/>
<text x="42" y="380" font-size="25" font-weight="700">Stop this task</text>
<text x="42" y="408" font-size="23" fill="#4e665e">Await receipt; retain delivered work</text>
<text x="30" y="462" font-size="23" fill="#4e665e">Received ≠ adopted ≠ reflected in the report.</text>
</g></svg>
