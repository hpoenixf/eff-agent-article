<svg xmlns="http://www.w3.org/2000/svg" width="640" height="488" viewBox="0 0 640 488" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Keep the correct content revision</title><desc id="desc">Current content P is revision 2. A late revision 1 cannot overwrite it. Only an exact revision-2 persistence receipt confirms the preview; access denial overrides preview retention.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a3523d" stroke-width="1.8"/></marker></defs>
<rect x="1" y="1" width="638" height="486" rx="24" fill="#f7f8f2" stroke="#cddbd1"/>
<g fill="#16362f" font-weight="500" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<text x="30" y="36" font-size="16" font-weight="700" fill="#a3523d">AGENT / A25 · CLIENT</text>
<text x="30" y="80" font-size="32" font-weight="750">Keep the correct content revision</text>
<rect x="26" y="106" width="588" height="72" rx="16" fill="#e8efe7" stroke="#cddbd1"/>
<text x="44" y="137" font-size="27" font-weight="700">Current view: content P · revision 2</text>
<text x="44" y="165" font-size="23" fill="#4e665e">A preview still needs persistence confirmation.</text>
<rect x="26" y="204" width="588" height="78" rx="16" fill="white" stroke="#cddbd1"/>
<text x="44" y="236" font-size="26" font-weight="700">Late history: P · revision 1</text>
<text x="44" y="267" font-size="23" fill="#a3523d">Keep revision 2; arrival order does not win.</text>
<rect x="26" y="308" width="588" height="90" rx="16" fill="white" stroke="#cddbd1"/>
<text x="44" y="340" font-size="26" font-weight="700">Persistence receipt: P · revision 2</text>
<text x="44" y="370" font-size="23" fill="#4e665e">Match identity, revision and exact body.</text>
<text x="30" y="438" font-size="22" font-weight="650" fill="#a3523d">Access denial overrides retained previews.</text>
<text x="30" y="462" font-size="23" fill="#4e665e">Illustrative contract—not client-owned publication.</text>
</g></svg>
