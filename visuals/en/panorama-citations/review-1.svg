<svg xmlns="http://www.w3.org/2000/svg" width="520" height="760" viewBox="0 0 520 760" role="img" aria-labelledby="title desc" lang="en"><title id="title">Review does not rewrite facts</title><desc id="desc">Responsibilities and handoffs—not automatic proof</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#49796e" stroke-width="1.7"/></marker></defs><rect width="520" height="760" rx="20" fill="#f7f8f2"/><rect x="1" y="1" width="518" height="758" rx="19" fill="none" stroke="#cddbd1"/>
