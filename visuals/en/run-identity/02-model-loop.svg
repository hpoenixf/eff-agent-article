<svg xmlns="http://www.w3.org/2000/svg" width="600" height="752" viewBox="0 0 600 752" role="img" aria-labelledby="title desc" lang="en"><title id="title">Three model turns inside one Run</title><desc id="desc">M1 proposes reads X1 and X2. Their results inform M2, which proposes X3. M3 uses its result to answer.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#7B919B" stroke-width="1.7"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Noto Sans",Arial,sans-serif;fill:#173044}</style>
<rect width="600" height="752" rx="20" fill="#F4F5F2"/>
<text x="28" y="39" font-size="21" font-weight="500" text-anchor="start" style="fill:#536573">02 / ZOOM INTO RUN R1</text>
<text x="28" y="84" font-size="32" font-weight="700" text-anchor="start" style="fill:#173044">New observations drive</text>
<text x="28" y="127" font-size="32" font-weight="700" text-anchor="start" style="fill:#173044">the next model turn</text>
<rect x="24" y="156" width="552" height="123" rx="14" fill="#ECF2FC" stroke="#D4DFE3"/>
<text x="44" y="196" font-size="29" font-weight="700" text-anchor="start" style="fill:#245CA6">M1</text>
<text x="118" y="198" font-size="26" font-weight="400" text-anchor="start" style="fill:#173044">Propose X1 + X2</text>
<text x="118" y="237" font-size="26" font-weight="400" text-anchor="start" style="fill:#173044">Read A and B</text>
<rect x="24" y="366" width="552" height="123" rx="14" fill="#ECF2FC" stroke="#D4DFE3"/>
<text x="44" y="406" font-size="29" font-weight="700" text-anchor="start" style="fill:#245CA6">M2</text>
<text x="118" y="408" font-size="26" font-weight="400" text-anchor="start" style="fill:#173044">Propose X3</text>
<text x="118" y="447" font-size="26" font-weight="400" text-anchor="start" style="fill:#173044">Read the original fee notice</text>
<rect x="24" y="576" width="552" height="123" rx="14" fill="#ECF2FC" stroke="#D4DFE3"/>
<text x="44" y="616" font-size="29" font-weight="700" text-anchor="start" style="fill:#245CA6">M3</text>
<text x="118" y="618" font-size="26" font-weight="400" text-anchor="start" style="fill:#173044">Use the new evidence</text>
<text x="118" y="657" font-size="26" font-weight="400" text-anchor="start" style="fill:#173044">Generate the comparison</text>
<path d="M66,288 L66,348" fill="none" stroke="#7B919B" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="98" y="327" font-size="24" font-weight="500" text-anchor="start" style="fill:#076F63">X1 + X2 results → next input</text>
<path d="M66,498 L66,558" fill="none" stroke="#7B919B" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="98" y="537" font-size="24" font-weight="500" text-anchor="start" style="fill:#076F63">X3 result → next input</text>
<text x="28" y="731" font-size="25" font-weight="600" text-anchor="start" style="fill:#076F63">3 model turns · 3 tool actions</text>
</svg>
