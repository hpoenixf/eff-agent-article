<svg xmlns="http://www.w3.org/2000/svg" width="600" height="585" viewBox="0 0 600 585" role="img" aria-labelledby="title desc" lang="en"><title id="title">One logical turn, two request attempts</title><desc id="desc">A2.1 fails before valid output. An eligible retry A2.2 obtains the output for M2. The scenario totals three logical turns and four model request attempts.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#7B919B" stroke-width="1.7"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Noto Sans",Arial,sans-serif;fill:#173044}</style>
<rect width="600" height="585" rx="20" fill="#F4F5F2"/>
<text x="28" y="39" font-size="21" font-weight="500" text-anchor="start" style="fill:#536573">03 / MODEL TURN &amp; ATTEMPT</text>
<text x="28" y="84" font-size="32" font-weight="700" text-anchor="start" style="fill:#173044">The same model turn,</text>
<text x="28" y="127" font-size="32" font-weight="700" text-anchor="start" style="fill:#173044">a new request attempt</text>
<rect x="24" y="155" width="552" height="67" rx="14" fill="#ECF2FC" stroke="#D4DFE3"/>
<text x="44" y="198" font-size="27" font-weight="600" text-anchor="start" style="fill:#245CA6">M2 · Decide what to read next</text>
<rect x="24" y="244" width="552" height="91" rx="14" fill="#FFF1DC" stroke="#D4DFE3"/>
<text x="44" y="280" font-size="27" font-weight="600" text-anchor="start" style="fill:#87531C">A2.1 · Request failed</text>
<text x="44" y="314" font-size="25" font-weight="400" text-anchor="start" style="fill:#87531C">No valid output obtained</text>
<path d="M64,345 L64,404" fill="none" stroke="#7B919B" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="98" y="374" font-size="24" font-weight="400" text-anchor="start" style="fill:#536573">Retry permitted; budget remains</text>
<rect x="24" y="418" width="552" height="91" rx="14" fill="#E5F3EE" stroke="#D4DFE3"/>
<text x="44" y="454" font-size="27" font-weight="600" text-anchor="start" style="fill:#076F63">A2.2 · Output obtained</text>
<text x="44" y="488" font-size="25" font-weight="400" text-anchor="start" style="fill:#076F63">Keep the failed attempt on record</text>
<text x="28" y="558" font-size="25" font-weight="600" text-anchor="start" style="fill:#173044">Whole example: 3 turns / 4 attempts</text>
</svg>
