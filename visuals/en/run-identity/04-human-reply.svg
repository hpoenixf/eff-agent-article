<svg xmlns="http://www.w3.org/2000/svg" width="600" height="730" viewBox="0 0 600 730" role="img" aria-labelledby="title desc" lang="en"><title id="title">A human reply resumes a Run, not a live model response</title><desc id="desc">A model turn asks a question. The Run saves waiting state. A reply linked to the question is adopted, then a new model turn continues while the original Run remains eligible.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#7B919B" stroke-width="1.7"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Noto Sans",Arial,sans-serif;fill:#173044}</style>
<rect width="600" height="730" rx="20" fill="#F4F5F2"/>
<text x="28" y="39" font-size="21" font-weight="500" text-anchor="start" style="fill:#536573">04 / A SEPARATE VARIATION</text>
<text x="28" y="84" font-size="32" font-weight="700" text-anchor="start" style="fill:#173044">The Run waits.</text>
<text x="28" y="127" font-size="32" font-weight="700" text-anchor="start" style="fill:#173044">The model request does not.</text>
<rect x="24" y="155" width="552" height="523" rx="18" fill="white" stroke="#D4DFE3"/>
<text x="44" y="197" font-size="25" font-weight="600" text-anchor="start" style="fill:#076F63">Same Run R1, while eligible</text>
<rect x="42" y="219" width="516" height="96" rx="14" fill="#ECF2FC" stroke="#D4DFE3"/>
<text x="60" y="255" font-size="26" font-weight="600" text-anchor="start" style="fill:#245CA6">Model turn: ask a question</text>
<text x="60" y="291" font-size="26" font-weight="400" text-anchor="start" style="fill:#173044">“What is your holding period?”</text>
<path d="M68,325 L68,361" fill="none" stroke="#7B919B" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="42" y="374" width="516" height="96" rx="14" fill="#FFF1DC" stroke="#D4DFE3"/>
<text x="60" y="410" font-size="26" font-weight="600" text-anchor="start" style="fill:#87531C">Run state: waiting for reply</text>
<text x="60" y="446" font-size="25" font-weight="400" text-anchor="start" style="fill:#87531C">Saved state; Worker can yield</text>
<path d="M68,480 L68,535" fill="none" stroke="#7B919B" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="98" y="512" font-size="24" font-weight="500" text-anchor="start" style="fill:#076F63">Linked reply is adopted</text>
<rect x="42" y="547" width="516" height="102" rx="14" fill="#ECF2FC" stroke="#D4DFE3"/>
<text x="60" y="583" font-size="27" font-weight="600" text-anchor="start" style="fill:#245CA6">New model turn</text>
<text x="60" y="622" font-size="25" font-weight="400" text-anchor="start" style="fill:#173044">Input now includes the reply</text>
<text x="28" y="703" font-size="24" font-weight="600" text-anchor="start" style="fill:#076F63">Same Run ≠ same Model Turn</text>
</svg>
