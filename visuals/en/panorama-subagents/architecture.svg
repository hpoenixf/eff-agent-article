<path d="M173 518 V675 H320 V696" fill="none" stroke="#7054a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M467 646 V675 H320" fill="none" stroke="#7054a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="704" width="560" height="112" rx="18" fill="white" stroke="#cddbd1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="66" y="749" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700" fill="#16362f" text-anchor="start" letter-spacing="0">Main synthesis → User answer</text>
<text x="66" y="788" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="500" fill="#4e665e" text-anchor="start" letter-spacing="0">Bring local findings back to the goal</text>
<text x="40" y="856" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="600" fill="#7054a0" text-anchor="start" letter-spacing="0">Share root resources and grants</text>
