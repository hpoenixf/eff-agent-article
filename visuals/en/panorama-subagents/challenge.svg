<svg xmlns="http://www.w3.org/2000/svg" width="520" height="770" viewBox="0 0 520 770" role="img" aria-labelledby="title desc" lang="en"><title id="title">A challenge must arrive</title><desc id="desc">Recording a message is not receiving it</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#49796e" stroke-width="1.7"/></marker></defs><rect width="520" height="770" rx="20" fill="#f7f8f2"/><rect x="1" y="1" width="518" height="768" rx="19" fill="none" stroke="#cddbd1"/>
<text x="28" y="32" font-family="Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#7756a0" text-anchor="start">SUBAGENT / FIELD GUIDE</text>
<text x="28" y="68" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#183e35" text-anchor="start">A challenge must arrive</text>
<text x="28" y="101" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="500" fill="#586d65" text-anchor="start">Recording a message is not receiving it</text>
