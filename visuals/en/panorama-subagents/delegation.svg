<svg xmlns="http://www.w3.org/2000/svg" width="520" height="620" viewBox="0 0 520 620" role="img" aria-labelledby="title desc" lang="en"><title id="title">Decide whether to delegate</title><desc id="desc">Start with Main; add specialists only as needed</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#49796e" stroke-width="1.7"/></marker></defs><rect width="520" height="620" rx="20" fill="#f7f8f2"/><rect x="1" y="1" width="518" height="618" rx="19" fill="none" stroke="#cddbd1"/>
<text x="28" y="32" font-family="Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#7756a0" text-anchor="start">SUBAGENT / FIELD GUIDE</text>
<text x="28" y="68" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#183e35" text-anchor="start">Decide whether to delegate</text>
<text x="28" y="101" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="500" fill="#586d65" text-anchor="start">Start with Main; add specialists only as needed</text>
<rect x="60" y="130" width="400" height="62" rx="12" fill="#ffffff" stroke="#bacdc4" stroke-width="1.5"/>
<text x="260.0" y="167.5" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#183e35" text-anchor="middle">User research question</text>
<path d="M260 192 V220" fill="none" stroke="#49796e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="220" width="400" height="90" rx="12" fill="#f0eaf8" stroke="#c4b2da" stroke-width="1.5"/>
<text x="260.0" y="258.0" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#183e35" text-anchor="middle">Is the local task substantial</text>
<text x="260.0" y="285.0" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#183e35" text-anchor="middle">and independently verifiable?</text>
<path d="M150 310 V358" fill="none" stroke="#49796e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="128" y="326" width="44" height="25" rx="8" fill="#f7f8f2"/>
<text x="150" y="344" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#315c50" text-anchor="middle">No</text>
<path d="M365 310 V358" fill="none" stroke="#49796e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="343" y="326" width="44" height="25" rx="8" fill="#f7f8f2"/>
<text x="365" y="344" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#315c50" text-anchor="middle">Yes</text>
<rect x="28" y="358" width="204" height="104" rx="12" fill="#ffffff" stroke="#bacdc4" stroke-width="1.5"/>
<text x="130.0" y="390.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">Main uses</text>
<text x="130.0" y="416.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">approved tools</text>
<text x="130.0" y="442.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">directly</text>
<rect x="264" y="358" width="228" height="104" rx="12" fill="#ffffff" stroke="#bacdc4" stroke-width="1.5"/>
<text x="378.0" y="403.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">Delegate one or a</text>
<text x="378.0" y="429.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">few Children</text>
<path d="M130 462 V494" fill="none" stroke="#49796e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M378 462 V494" fill="none" stroke="#49796e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="494" width="204" height="104" rx="12" fill="#f0eaf8" stroke="#c4b2da" stroke-width="1.5"/>
<text x="130.0" y="526.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">Main verifies</text>
<text x="130.0" y="552.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">and delivers</text>
<text x="130.0" y="578.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">one answer</text>
<rect x="264" y="494" width="228" height="104" rx="12" fill="#f0eaf8" stroke="#c4b2da" stroke-width="1.5"/>
<text x="378.0" y="526.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">Continue: is an</text>
<text x="378.0" y="552.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">independent</text>
<text x="378.0" y="578.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">challenge useful?</text></svg>
