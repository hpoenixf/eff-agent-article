<svg xmlns="http://www.w3.org/2000/svg" width="520" height="690" viewBox="0 0 520 690" role="img" aria-labelledby="title desc" lang="en"><title id="title">After delegation, assess challenge</title><desc id="desc">A Child does not always need a Reviewer</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#49796e" stroke-width="1.7"/></marker></defs><rect width="520" height="690" rx="20" fill="#f7f8f2"/><rect x="1" y="1" width="518" height="688" rx="19" fill="none" stroke="#cddbd1"/>
<text x="28" y="32" font-family="Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#7756a0" text-anchor="start">SUBAGENT / FIELD GUIDE</text>
<text x="28" y="68" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#183e35" text-anchor="start">After delegation, assess challenge</text>
<text x="28" y="101" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="500" fill="#586d65" text-anchor="start">A Child does not always need a Reviewer</text>
<rect x="48" y="130" width="424" height="90" rx="12" fill="#f0eaf8" stroke="#c4b2da" stroke-width="1.5"/>
<text x="260.0" y="168.0" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#183e35" text-anchor="middle">Is there a material hypothesis</text>
<text x="260.0" y="195.0" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#183e35" text-anchor="middle">or independent challenge?</text>
<path d="M150 220 V266" fill="none" stroke="#49796e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="128" y="235" width="44" height="25" rx="8" fill="#f7f8f2"/>
<text x="150" y="253" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#315c50" text-anchor="middle">No</text>
<path d="M374 220 V266" fill="none" stroke="#49796e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="352" y="235" width="44" height="25" rx="8" fill="#f7f8f2"/>
<text x="374" y="253" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#315c50" text-anchor="middle">Yes</text>
<rect x="28" y="266" width="220" height="124" rx="12" fill="#ffffff" stroke="#bacdc4" stroke-width="1.5"/>
<text x="138.0" y="308.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">Return evidence,</text>
<text x="138.0" y="334.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">artifacts and</text>
<text x="138.0" y="360.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">gaps directly</text>
<rect x="272" y="266" width="220" height="150" rx="12" fill="#ffffff" stroke="#bacdc4" stroke-width="1.5"/>
<text x="382.0" y="295.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">Optional</text>
<text x="382.0" y="321.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">Reviewer,</text>
<text x="382.0" y="347.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">investment</text>
<text x="382.0" y="373.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">method, or</text>
<text x="382.0" y="399.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">bounded Bull/Bear</text>
<path d="M382 416 V454" fill="none" stroke="#49796e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="272" y="454" width="220" height="92" rx="12" fill="#ffffff" stroke="#bacdc4" stroke-width="1.5"/>
<text x="382.0" y="480.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">Return evidence,</text>
<text x="382.0" y="506.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">artifacts and</text>
<text x="382.0" y="532.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">gaps</text>
<path d="M138 390 V580 H260 V608" fill="none" stroke="#49796e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M382 546 V580 H260 V608" fill="none" stroke="#49796e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="608" width="424" height="66" rx="12" fill="#f0eaf8" stroke="#c4b2da" stroke-width="1.5"/>
<text x="260.0" y="647.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">Main verifies and delivers one answer</text></svg>
