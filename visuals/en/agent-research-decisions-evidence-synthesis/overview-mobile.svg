<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1275" width="390" height="1275" role="img" aria-labelledby="title desc"><title id="title">Which judgment should the next action change?</title><desc id="desc">More reading is not sufficient evidence. Supported parts can be answered first. Stop by asking whether specific claims can be answered, not whether every source was collected. Exhausted resources do not mean sufficient evidence.</desc><rect width="390" height="1275" rx="22" fill="#f7f9fc"/><rect width="390" height="8" fill="#7054a2"/><text x="24" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#17263e">Which judgment should</text><text x="24" y="76" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#17263e">the next action change?</text><text x="24" y="115" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">More reading is not sufficient evidence.</text><text x="24" y="139" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Supported parts can be answered first.</text><rect x="20" y="187" width="350" height="194" rx="18" fill="white" stroke="#dbe3ed"/><rect x="36" y="201" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="46" y="224" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">1</text><text x="40" y="263" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#17263e">Clarify the judgment</text><text x="40" y="299" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Lower fees do not alone justify</text><text x="40" y="323" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">switching.</text><text x="40" y="355" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Identify the decision conditions.</text><text x="185" y="405" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">↓</text><rect x="20" y="415" width="350" height="194" rx="18" fill="white" stroke="#dbe3ed"/><rect x="36" y="429" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="46" y="452" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">2</text><text x="40" y="491" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#17263e">Target the evidence</text><text x="40" y="527" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Check holding period and switching</text><text x="40" y="551" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">cost.</text><text x="40" y="583" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Fill only material gaps.</text><text x="185" y="633" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">↓</text><rect x="20" y="643" width="350" height="194" rx="18" fill="white" stroke="#dbe3ed"/><rect x="36" y="657" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="46" y="680" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">3</text><text x="40" y="719" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#17263e">Reconcile differences</text><text x="40" y="755" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Align object, date and definitions.</text><text x="40" y="787" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Keep unresolved conflicts visible.</text><text x="185" y="861" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">↓</text><rect x="20" y="871" width="350" height="194" rx="18" fill="white" stroke="#dbe3ed"/><rect x="36" y="885" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="46" y="908" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">4</text><text x="40" y="947" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#17263e">Form the answer</text><text x="40" y="983" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Deliver supported conclusions first.</text><text x="40" y="1015" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">State the unknown conditions.</text><rect x="20" y="1099" width="350" height="152" rx="18" fill="#f1ebfa" stroke="none"/><text x="40" y="1129" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#7054a2">Stop by asking whether specific</text><text x="40" y="1153" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#7054a2">claims can be answered, not whether</text><text x="40" y="1177" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#7054a2">every source was collected.</text><text x="40" y="1201" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#7054a2">Exhausted resources do not mean</text><text x="40" y="1225" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#7054a2">sufficient evidence.</text></svg>
