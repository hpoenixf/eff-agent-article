<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-labelledby="title desc"><title id="title">Which judgment should the next action change?</title><desc id="desc">More reading is not sufficient evidence. Supported parts can be answered first. Stop by asking whether specific claims can be answered, not whether every source was collected. Exhausted resources do not mean sufficient evidence.</desc><rect width="1200" height="590" rx="22" fill="#f7f9fc"/><rect width="1200" height="8" fill="#7054a2"/><text x="48" y="60" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#17263e">Which judgment should the next action change?</text><text x="48" y="108" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#17263e">More reading is not sufficient evidence. Supported parts can be answered first.</text><rect x="34" y="160" width="264" height="286" rx="18" fill="white" stroke="#dbe3ed"/><rect x="50" y="174" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="60" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">1</text><text x="54" y="236" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">Clarify the</text><text x="54" y="266" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">judgment</text><text x="54" y="304" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Lower fees do not alone</text><text x="54" y="330" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">justify switching.</text><text x="54" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Identify the decision</text><text x="54" y="390" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">conditions.</text><text x="306" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">›</text><rect x="325" y="160" width="264" height="286" rx="18" fill="white" stroke="#dbe3ed"/><rect x="341" y="174" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="351" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">2</text><text x="345" y="236" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">Target the</text><text x="345" y="266" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">evidence</text><text x="345" y="304" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Check holding period</text><text x="345" y="330" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">and switching cost.</text><text x="345" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Fill only material gaps.</text><text x="597" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">›</text><rect x="616" y="160" width="264" height="286" rx="18" fill="white" stroke="#dbe3ed"/><rect x="632" y="174" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="642" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">3</text><text x="636" y="236" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">Reconcile</text><text x="636" y="266" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">differences</text><text x="636" y="304" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Align object, date and</text><text x="636" y="330" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">definitions.</text><text x="636" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Keep unresolved</text><text x="636" y="390" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">conflicts visible.</text><text x="888" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">›</text><rect x="907" y="160" width="264" height="286" rx="18" fill="white" stroke="#dbe3ed"/><rect x="923" y="174" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="933" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">4</text><text x="927" y="236" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">Form the answer</text><text x="927" y="274" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Deliver supported</text><text x="927" y="300" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">conclusions first.</text><text x="927" y="334" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">State the unknown</text><text x="927" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">conditions.</text><rect x="34" y="480" width="1132" height="86" rx="18" fill="#f1ebfa" stroke="none"/><text x="54" y="510" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#7054a2">Stop by asking whether specific claims can be answered, not whether every source was collected. Exhausted</text><text x="54" y="537" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#7054a2">resources do not mean sufficient evidence.</text></svg>
