<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="title desc"><title id="title">Put the number in context</title><desc id="desc">Teaching assumptions: CNY 100,000; annual fee saving CNY 300; one-time conversion cost CNY 400. Six months saves 150, eighteen months saves 450. This is not a return forecast.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC",Arial,sans-serif;fill:#17324d}.title{font-size:27px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.muted{fill:#475569}.warn{fill:#9a3412}</style><rect width="480" height="460" rx="18" fill="#f8fafc"/><text x="24" y="43" class="title">Put the number in context</text><text x="24" y="77" class="small">Teaching example · not a product quote</text><rect x="24" y="101" width="432" height="74" rx="12" fill="#eaf4ff" stroke="#8cb9df"/><text x="240" y="133" class="body" text-anchor="middle">CNY 100,000 × (0.60% − 0.30%)</text><text x="240" y="160" class="body" text-anchor="middle">CNY 300 saved per year</text><rect x="24" y="199" width="204" height="132" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="126" y="232" class="label" text-anchor="middle">6 months</text><text x="126" y="269" class="body" text-anchor="middle">Save CNY 150</text><text x="126" y="308" class="small" text-anchor="middle">Net CNY −250</text><rect x="252" y="199" width="204" height="132" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="354" y="232" class="label" text-anchor="middle">18 months</text><text x="354" y="269" class="body" text-anchor="middle">Save CNY 450</text><text x="354" y="308" class="small" text-anchor="middle">Net CNY +50</text><text x="240" y="368" class="label" text-anchor="middle">One-time cost: CNY 400</text><text x="24" y="409" class="body">Holding period changes the comparison.</text><text x="24" y="440" class="small">Simplified fees ≠ investment returns.</text></svg>
