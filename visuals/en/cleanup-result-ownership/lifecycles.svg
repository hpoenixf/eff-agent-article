<svg xmlns="http://www.w3.org/2000/svg" width="500" height="548" viewBox="0 0 500 548" role="img" aria-labelledby="title desc">
<title id="title">Two lifecycles after a known size-limit failure</title>
<desc id="desc">Time moves downward. After a size-limit failure is known, preserve it and start cancellation. The call rejects with that failure so the caller can decide what to do. The cancellation Promise may still be pending, then settle or remain pending. Promise settlement is not proof of remote resource reclamation.</desc>
<defs>
<marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#126D75"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#965B17"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#54676B"/></marker>
</defs>
<rect width="500" height="548" rx="20" fill="#F6F8F8"/>
<g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif">
<text x="26" y="38" font-size="25" font-weight="700" fill="#193C47" text-anchor="start">One failure, two lifecycles</text>
<text x="26" y="70" font-size="19" font-weight="400" fill="#54676B" text-anchor="start">Time moves downward</text>
<text x="22" y="118" font-size="18" font-weight="400" fill="#54676B" text-anchor="start">t₀</text>
<rect x="80" y="88" width="360" height="48" rx="12" fill="#193C47"/>
<text x="260" y="120" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">Size-limit failure is known</text>
<path d="M260 137V151M150 151H365M150 151V165M365 151V165" fill="none" stroke="#D6E0E1" stroke-width="2"/>
<text x="150" y="189" font-size="22" font-weight="700" fill="#126D75" text-anchor="middle">Result path</text>
<text x="365" y="189" font-size="22" font-weight="700" fill="#965B17" text-anchor="middle">Cleanup path</text>
<rect x="60" y="206" width="180" height="64" rx="12" fill="#E6F3F2"/>
<rect x="275" y="206" width="180" height="64" rx="12" fill="#FFF0D9"/>
<rect x="60" y="303" width="180" height="64" rx="12" fill="#E6F3F2"/>
<rect x="275" y="303" width="180" height="64" rx="12" fill="#FFF0D9"/>
<rect x="60" y="400" width="180" height="64" rx="12" fill="#E6F3F2"/>
<rect x="275" y="400" width="180" height="64" rx="12" fill="#FFF0D9"/>
<text x="22" y="245" font-size="18" font-weight="400" fill="#54676B" text-anchor="start">t₁</text>
<text x="150" y="232" font-size="20" font-weight="500" fill="#126D75" text-anchor="middle">Preserve the</text>
<text x="150" y="257" font-size="20" font-weight="500" fill="#126D75" text-anchor="middle">original failure</text>
<text x="365" y="245" font-size="20" font-weight="500" fill="#965B17" text-anchor="middle">Start cancellation</text>
<path d="M150 277V294" fill="none" stroke="#126D75" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<path d="M365 277V294" fill="none" stroke="#965B17" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6" marker-end="url(#amber)"/>
<text x="22" y="342" font-size="18" font-weight="400" fill="#54676B" text-anchor="start">t₂</text>
<text x="150" y="342" font-size="21" font-weight="600" fill="#126D75" text-anchor="middle">Call rejected</text>
<text x="365" y="329" font-size="20" font-weight="500" fill="#965B17" text-anchor="middle">May still</text>
<text x="365" y="354" font-size="20" font-weight="500" fill="#965B17" text-anchor="middle">be pending</text>
<path d="M150 374V391" fill="none" stroke="#126D75" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<path d="M365 374V391" fill="none" stroke="#965B17" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6" marker-end="url(#amber)"/>
<text x="22" y="439" font-size="18" font-weight="400" fill="#54676B" text-anchor="start">t₃</text>
<text x="150" y="439" font-size="21" font-weight="600" fill="#126D75" text-anchor="middle">Caller decides</text>
<text x="365" y="426" font-size="20" font-weight="500" fill="#965B17" text-anchor="middle">Settles later</text>
<text x="365" y="451" font-size="20" font-weight="500" fill="#965B17" text-anchor="middle">or stays pending</text>
<text x="26" y="500" font-size="20" font-weight="400" fill="#54676B" text-anchor="start">Cancellation Promise settled</text>
<text x="26" y="527" font-size="20" font-weight="400" fill="#54676B" text-anchor="start">≠ remote resources reclaimed</text>
</g></svg>
