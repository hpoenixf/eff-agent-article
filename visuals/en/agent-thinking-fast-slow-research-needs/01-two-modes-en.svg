<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Two modes. Different strengths.</title><desc id="desc">Automatic and deliberate processing, arithmetic examples and an intuition trap. A conceptual comparison, not two brain organs.</desc><style>text{font-family:'Noto Sans CJK SC',Inter,Arial,sans-serif;fill:#152D3A}.muted{fill:#60717B}.teal{fill:#126E67}.amber{fill:#A85B22}.white{fill:white}.body{font-size:22px}.heading{font-size:31px;font-weight:700}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60717B"/></marker></defs><rect width="1200" height="760" fill="#F8F6F1"/><text x="52" y="48" class="teal" font-size="15" font-weight="700">ETF AGENT / THINKING, FAST AND SLOW</text><text x="1148" y="48" class="muted" text-anchor="end" font-size="18">01</text><text x="52" y="111" font-size="35" font-weight="750">Two modes. Different strengths.</text><text x="52" y="151" class="muted body">Fast is not careless. Slow is not infallible.</text><rect x="52" y="190" width="532" height="362" rx="22" fill="#E1F0E9"/><rect x="616" y="190" width="532" height="362" rx="22" fill="#F6E8D5"/><rect x="82" y="216" width="57" height="57" rx="17" fill="#126E67"/><rect x="646" y="216" width="57" height="57" rx="17" fill="#A85B22"/><text x="110" y="255" class="white" font-size="32" font-weight="700" text-anchor="middle">1</text><text x="674" y="255" class="white" font-size="32" font-weight="700" text-anchor="middle">2</text><text x="157" y="248" class="teal heading">Automatic</text><text x="721" y="248" class="amber heading">Deliberate</text><g class="body"><text x="82" y="311">Recognition, association, habit</text><text x="82" y="351">A familiar answer arrives quickly.</text><text x="82" y="391">Efficient — but may miss a constraint.</text><text x="646" y="311">Rules, working memory, checking</text><text x="646" y="351">Hold steps; compare; test assumptions.</text><text x="646" y="391">Flexible — but effortful and fallible.</text></g><rect x="82" y="434" width="472" height="84" rx="16" fill="white"/><rect x="646" y="434" width="472" height="84" rx="16" fill="white"/><text x="108" y="487" class="teal" font-size="35" font-weight="700">3 + 4 = 7</text><text x="672" y="487" class="amber" font-size="29" font-weight="700">17 × 24 = 340 + 68</text><path d="M570 371H627" stroke="#60717B" stroke-width="3" marker-end="url(#arrow)"/><rect x="52" y="577" width="1096" height="93" rx="20" fill="#152D3A"/><text x="80" y="615" class="white" font-size="23" font-weight="650">A persuasive intuition can miss the denominator.</text><text x="80" y="651" class="white" font-size="24">100 → 120 → 96    (+20%, then −20%)</text><path d="M52 697H1148" stroke="#D9E1DC"/><text x="52" y="730" class="muted" font-size="17">A conceptual comparison, not two brain organs or a literal map of LLM cognition.</text></svg>
