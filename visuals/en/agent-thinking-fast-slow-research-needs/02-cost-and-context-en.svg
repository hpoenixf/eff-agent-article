<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">More context is not always more help.</title><desc id="desc">Direct uses sufficient existing information; Research acquires new evidence. Cost, latency, context and exposure are separate trade-offs.</desc><style>text{font-family:'Noto Sans CJK SC',Inter,Arial,sans-serif;fill:#152D3A}.muted{fill:#60717B}.teal{fill:#126E67}.amber{fill:#A85B22}.white{fill:white}.small{font-size:17px}.label{font-size:26px;font-weight:700}</style><defs><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#126E67"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A85B22"/></marker></defs><rect width="1200" height="760" fill="#F8F6F1"/><text x="52" y="48" class="teal" font-size="15" font-weight="700">ETF AGENT / THINKING, FAST AND SLOW</text><text x="1148" y="48" class="muted" font-size="18" text-anchor="end">02</text><text x="52" y="111" font-size="35" font-weight="750">More context is not always more help.</text><text x="52" y="151" class="muted" font-size="22">Research should add evidence, not merely add material.</text><rect x="52" y="191" width="1096" height="81" rx="20" fill="#152D3A"/><text x="84" y="241" class="white" font-size="30" font-weight="650">Do we need new evidence?</text><path d="M325 273V311" stroke="#126E67" stroke-width="3" marker-end="url(#t)"/><path d="M875 273V311" stroke="#A85B22" stroke-width="3" marker-end="url(#a)"/><text x="345" y="300" class="teal small">No</text><text x="895" y="300" class="amber small">Yes</text><rect x="52" y="323" width="532" height="190" rx="22" fill="#E1F0E9"/><rect x="616" y="323" width="532" height="190" rx="22" fill="#F6E8D5"/><text x="82" y="369" class="teal label">DIRECT</text><text x="646" y="369" class="amber label">RESEARCH</text><text x="82" y="412" font-size="24" font-weight="600">Answer from sufficient context.</text><text x="646" y="412" font-size="23" font-weight="600">Acquire only relevant evidence.</text><text x="82" y="455" class="muted" font-size="21">No unnecessary external reads.</text><text x="646" y="455" class="muted" font-size="21">Align dates, units and source authority.</text><g fill="white" stroke="#D9E1DC" stroke-width="2"><rect x="52" y="540" width="262" height="120" rx="18"/><rect x="330" y="540" width="262" height="120" rx="18"/><rect x="608" y="540" width="262" height="120" rx="18"/><rect x="886" y="540" width="262" height="120" rx="18"/></g><g class="label"><text x="74" y="580">Cost</text><text x="352" y="580">Latency</text><text x="630" y="580">Context</text><text x="908" y="580">Exposure</text></g><g class="muted small"><text x="74" y="620">More requests and tool work</text><text x="352" y="620">More external waiting</text><text x="630" y="620">Noise and mixed definitions</text><text x="908" y="620">Permissions and failure paths</text></g><path d="M52 697H1148" stroke="#D9E1DC"/><text x="52" y="730" class="muted small">Conceptual trade-offs. Human attention and Transformer attention are not the same mechanism.</text></svg>
