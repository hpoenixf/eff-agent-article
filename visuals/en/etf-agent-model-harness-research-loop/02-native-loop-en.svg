<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="851" viewBox="0 0 1440 851" role="img" aria-labelledby="title desc"><title id="title">A loop that can change course</title><desc id="desc">Main proposes · Host executes · Observation changes the research path</desc><defs><linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C223B"/><stop offset="1" stop-color="#254761"/></linearGradient><filter id="soft"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#123752" flood-opacity=".10"/></filter><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#6B8DA6" stroke-width="1.8"/></marker><marker id="teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#138F89" stroke-width="1.8"/></marker><pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#A9C1D4" opacity=".3"/></pattern></defs><rect x="0" y="0" width="1440" height="851" rx="0" fill="#F6F9FC" stroke="none" stroke-width="1.2" /><rect x="0" y="0" width="1440" height="146" rx="0" fill="url(#navy)" stroke="none" stroke-width="1.2" /><circle cx="1387" cy="65" r="140" fill="#FFFFFF18" stroke="none" stroke-width="1"/><rect x="0" y="146" width="1440" height="705" rx="0" fill="url(#dots)" stroke="none" stroke-width="1.2" /><text x="61" y="37" fill="#81E2D6" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="740" text-anchor="start">ETF AGENT / NATIVE RESEARCH</text><text x="58" y="94" fill="#F6FBFF" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="38" font-weight="760" text-anchor="start">A loop that can change course</text><text x="61" y="125" fill="#C2D5E2" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="470" text-anchor="start">Main proposes · Host executes · Observation changes the research path</text><rect x="68" y="218" width="402" height="238" rx="22" fill="#FFFFFF" stroke="#D4E3EC" stroke-width="1.3" filter="url(#soft)"/><rect x="68" y="218" width="402" height="9" rx="4" fill="#537EA2" stroke="none" stroke-width="1.2" /><circle cx="116" cy="285" r="21" fill="#537EA225" stroke="none" stroke-width="1"/><circle cx="116" cy="285" r="8" fill="#537EA2" stroke="none" stroke-width="1"/><text x="96" y="340" fill="#537EA2" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="710" text-anchor="start">01 · MODEL / AGENT TURN</text><text x="96" y="384" fill="#12334C" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="28" font-weight="740" text-anchor="start">Main chooses an action</text><text x="96" y="417" fill="#526D81" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="510" text-anchor="start">Search, compute, delegate, answer</text><text x="96" y="442" fill="#7A8FA0" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="460" text-anchor="start">Judgment is not execution authority</text><path d="M475 343 H509" fill="none" stroke="#6B8DA6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="519" y="218" width="402" height="238" rx="22" fill="#FFFFFF" stroke="#D4E3EC" stroke-width="1.3" filter="url(#soft)"/><rect x="519" y="218" width="402" height="9" rx="4" fill="#0E9A91" stroke="none" stroke-width="1.2" /><circle cx="567" cy="285" r="21" fill="#0E9A9125" stroke="none" stroke-width="1"/><circle cx="567" cy="285" r="8" fill="#0E9A91" stroke="none" stroke-width="1"/><text x="547" y="340" fill="#0E9A91" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="710" text-anchor="start">02 · HOST / ACTION RUNTIME</text><text x="547" y="384" fill="#12334C" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="28" font-weight="740" text-anchor="start">Execute admitted work</text><text x="547" y="417" fill="#526D81" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="510" text-anchor="start">Run grant, tools, real receipts</text><text x="547" y="442" fill="#7A8FA0" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="460" text-anchor="start">Settled effects are not replayed</text><path d="M926 343 H960" fill="none" stroke="#6B8DA6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="970" y="218" width="402" height="238" rx="22" fill="#FFFFFF" stroke="#D4E3EC" stroke-width="1.3" filter="url(#soft)"/><rect x="970" y="218" width="402" height="9" rx="4" fill="#AD855E" stroke="none" stroke-width="1.2" /><circle cx="1018" cy="285" r="21" fill="#AD855E25" stroke="none" stroke-width="1"/><circle cx="1018" cy="285" r="8" fill="#AD855E" stroke="none" stroke-width="1"/><text x="998" y="340" fill="#AD855E" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="710" text-anchor="start">03 · OBSERVATION</text><text x="998" y="384" fill="#12334C" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="28" font-weight="740" text-anchor="start">Evidence returns to Main</text><text x="998" y="417" fill="#526D81" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="510" text-anchor="start">Source, version, numbers, unknowns</text><text x="998" y="442" fill="#7A8FA0" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="460" text-anchor="start">A new finding can change the plan</text><path d="M1175 463V528H271V463" fill="none" stroke="#15988E" stroke-width="3.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/><rect x="370" y="486" width="701" height="57" rx="14" fill="#DCF1ED" stroke="#B9E0D8" stroke-width="1" /><text x="720" y="521" fill="#0D706D" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="670" text-anchor="middle">The feedback that matters: new evidence changes the next choice</text><rect x="68" y="597" width="402" height="168" rx="18" fill="#F9FCFE" stroke="#D4E3EC" stroke-width="1.1" /><rect x="87" y="619" width="7" height="106" rx="3" fill="#537EA2" stroke="none" stroke-width="1.2" /><text x="111" y="644" fill="#537EA2" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="740" text-anchor="start">RESEARCH NEEDS</text><text x="111" y="689" fill="#17344D" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="710" text-anchor="start">Questions can reopen</text><text x="111" y="725" fill="#667E90" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="460" text-anchor="start">Resolved is not certified truth</text><rect x="519" y="597" width="402" height="168" rx="18" fill="#F9FCFE" stroke="#D4E3EC" stroke-width="1.1" /><rect x="538" y="619" width="7" height="106" rx="3" fill="#0E9A91" stroke="none" stroke-width="1.2" /><text x="562" y="644" fill="#0E9A91" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="740" text-anchor="start">OPTIONAL CHILD</text><text x="562" y="689" fill="#17344D" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="710" text-anchor="start">Delegate when useful</text><text x="562" y="725" fill="#667E90" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="460" text-anchor="start">Children report; Main synthesizes</text><rect x="970" y="597" width="402" height="168" rx="18" fill="#F9FCFE" stroke="#D4E3EC" stroke-width="1.1" /><rect x="989" y="619" width="7" height="106" rx="3" fill="#AD855E" stroke="none" stroke-width="1.2" /><text x="1013" y="644" fill="#AD855E" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="740" text-anchor="start">RECOVERY / PUBLICATION</text><text x="1013" y="689" fill="#17344D" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="710" text-anchor="start">Resume and deliver</text><text x="1013" y="725" fill="#667E90" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="460" text-anchor="start">Keep receipts; publish valid partials</text><text x="70" y="820" fill="#627C91" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="520" text-anchor="start">Distinct responsibilities inside one native loop · No extra research commander</text></svg>