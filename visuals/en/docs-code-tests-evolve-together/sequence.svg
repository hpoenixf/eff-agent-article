<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 741" width="680" height="741" role="img" aria-labelledby="title desc"><title id="title">The trigger sets the sequence</title><desc id="desc">No universal docs-first or tests-first rule</desc><rect x="0" y="0" width="680" height="741" rx="24" fill="#F3F7FB" stroke="#F3F7FB" stroke-width="1.5"/><rect x="0" y="0" width="680" height="9" rx="4" fill="#247DA9" stroke="#247DA9" stroke-width="1.5"/><circle cx="620" cy="58" r="54" fill="#EAF5FB"/><text x="32" y="60" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="31" fill="#16283F" font-weight="700" text-anchor="start">The trigger sets the sequence</text><text x="32" y="99" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="20" fill="#52677D" font-weight="400" text-anchor="start">No universal docs-first or tests-first rule</text><rect x="32" y="132" width="616" height="121" rx="17" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.5"/><rect x="32" y="132" width="10" height="121" rx="4" fill="#247DA9" stroke="#247DA9" stroke-width="1.5"/><circle cx="79" cy="175" r="23" fill="#EAF5FB"/><text x="79" y="183" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="25" fill="#247DA9" font-weight="700" text-anchor="middle">1</text><text x="122" y="178" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="27" fill="#16283F" font-weight="700" text-anchor="start">Requirement</text><text x="62" y="214" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="22" fill="#52677D" font-weight="400" text-anchor="start">Confirm the new contract first</text><text x="62" y="244" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="22" fill="#52677D" font-weight="400" text-anchor="start">Then test, implement and verify</text><rect x="32" y="270" width="616" height="121" rx="17" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.5"/><rect x="32" y="270" width="10" height="121" rx="4" fill="#B65259" stroke="#B65259" stroke-width="1.5"/><circle cx="79" cy="313" r="23" fill="#FCEDEB"/><text x="79" y="321" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="25" fill="#B65259" font-weight="700" text-anchor="middle">2</text><text x="122" y="316" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="27" fill="#16283F" font-weight="700" text-anchor="start">Bug fix</text><text x="62" y="352" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="22" fill="#52677D" font-weight="400" text-anchor="start">Reproduce the original error</text><text x="62" y="382" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="22" fill="#52677D" font-weight="400" text-anchor="start">Then red test, repair and regression</text><rect x="32" y="408" width="616" height="121" rx="17" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.5"/><rect x="32" y="408" width="10" height="121" rx="4" fill="#147E71" stroke="#147E71" stroke-width="1.5"/><circle cx="79" cy="451" r="23" fill="#E4F5EF"/><text x="79" y="459" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="25" fill="#147E71" font-weight="700" text-anchor="middle">3</text><text x="122" y="454" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="27" fill="#16283F" font-weight="700" text-anchor="start">Refactor</text><text x="62" y="490" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="22" fill="#52677D" font-weight="400" text-anchor="start">Protect observable behavior first</text><text x="62" y="520" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="22" fill="#52677D" font-weight="400" text-anchor="start">Then change internals and regress</text><rect x="32" y="546" width="616" height="121" rx="17" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.5"/><rect x="32" y="546" width="10" height="121" rx="4" fill="#B17725" stroke="#B17725" stroke-width="1.5"/><circle cx="79" cy="589" r="23" fill="#FFF2DF"/><text x="79" y="597" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="25" fill="#B17725" font-weight="700" text-anchor="middle">4</text><text x="122" y="592" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="27" fill="#16283F" font-weight="700" text-anchor="start">Incident</text><text x="62" y="628" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="22" fill="#52677D" font-weight="400" text-anchor="start">Contain or roll back first</text><text x="62" y="658" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="22" fill="#52677D" font-weight="400" text-anchor="start">Then diagnose, repair and verify</text><rect x="32" y="694" width="616" height="33" rx="10" fill="#EAF5FB" stroke="#CDE6F2" stroke-width="1.5"/><text x="340" y="718" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="20" fill="#247DA9" font-weight="700" text-anchor="middle">Temporary divergence is not an excuse at merge</text></svg>