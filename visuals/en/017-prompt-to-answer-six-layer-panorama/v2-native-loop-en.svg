<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 930" width="1480" height="930" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">Six layers around the native research loop</title>
<desc id="arch-desc">Six-layer agent architecture with an orthogonal closed loop from model decision to authorized tool execution to evidence receipts and back to the model, plus a Direct bypass, Publication, HIL, Recovery and observability.</desc>
<defs>
 <marker id="arrowNormal" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#567A91"/></marker>
 <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 6 L 1 11 Z" fill="#119E98"/></marker>
 <marker id="arrowMuted" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#92A3B4"/></marker>
 <style>
  text { font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Inter,Arial,sans-serif; }
  .main-title { font-size:29px; font-weight:740; fill:#183346; letter-spacing:-.3px; }
  .sub-title { font-size:16px; font-weight:400; fill:#617887; }
  .edition { font-size:14px; letter-spacing:1px; font-weight:680; fill:#5B7C8C; }
  .card-meta { font-size:14px; font-weight:730; letter-spacing:.4px; fill:#567385; }
  .card-title { font-size:22px; font-weight:720; fill:#1C3446; }
  .card-sub { font-size:15px; fill:#697E8C; }
  .group-title { font-size:23px; font-weight:770; fill:#176660; }
  .group-sub { font-size:14px; font-weight:620; fill:#5C7D7B; }
  .flow-note { font-size:14px; fill:#627B88; font-weight:640; }
  .feedback { font-size:18px; fill:#168A84; font-weight:735; }
  .legend { font-size:13px; fill:#718A98; }
 </style>
</defs>
<rect x="0" y="0" width="1480" height="930" rx="20" fill="#F7F9FB"/>
<rect x="0" y="0" width="1480" height="10" rx="5" fill="#147B81"/>
<text x="82" y="80" class="main-title" >From a question to continuous research: the six-layer architecture</text>
<text x="82" y="111" class="sub-title" >At the center is a repeated Run-level decision → execution → receipt cycle, not a one-way pipeline.</text>
<rect x="1242" y="57" width="160" height="34" rx="17" fill="#E9F1F4"/>
<text x="1322" y="79" class="edition" text-anchor="middle">ARCHITECTURE · V2</text>
