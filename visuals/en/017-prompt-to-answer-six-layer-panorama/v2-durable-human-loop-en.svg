<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 930" width="1480" height="930" role="img" aria-labelledby="hil-title hil-desc">
<title id="hil-title">Human-in-the-Loop: asking does not stop the research</title><desc id="hil-desc">Every response targets its original request. Reception, persistence, adoption and effects remain separate facts.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#5c7c8b" stroke-width="1.5"/></marker>
<marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#168e87" stroke-width="1.5"/></marker>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Inter,Arial,sans-serif}.heading{font-size:28px;font-weight:770;fill:#163944}.intro{font-size:16px;fill:#687E8A}.eyebrow{font-size:13px;font-weight:800;letter-spacing:1.2px;fill:#168e87}.meta{font-size:12px;font-weight:790;letter-spacing:.4px;fill:#54858b}.title{font-size:20px;font-weight:740;fill:#23424a}.titleSmall{font-size:18px;font-weight:740;fill:#23424a}.sub{font-size:15px;fill:#66828d}.group{font-size:23px;font-weight:760;fill:#1f4e54}.groupSub{font-size:15px;fill:#62818c}.footerHead{font-size:20px;font-weight:750;fill:#21424d}.footerSub{font-size:15px;fill:#617D88}</style>
</defs>
<rect x="0" y="0" width="1480" height="930" rx="18" fill="#F7F9FB" stroke="#F7F9FB" stroke-width="1.5"/>
<rect x="0" y="0" width="1480" height="9" rx="3" fill="#168A82" stroke="#168A82" stroke-width="1.5"/>
<text x="78" y="55" class="eyebrow" >DURABLE HUMAN INTERACTION · EXACT REQUEST IDENTITY</text>
<text x="78" y="98" class="heading" >Human-in-the-Loop: asking does not stop the research</text>
<text x="78" y="129" class="intro" >Every response targets its original request. Reception, persistence, adoption and effects remain separate facts.</text><rect x="78" y="171" width="295" height="126" rx="11" fill="#FFFFFF" stroke="#D3E2E6" stroke-width="1.5"/><rect x="78" y="191" width="5" height="86" rx="2" fill="#168e87"/><text x="98" y="198" class="meta" >01 · MODEL PROPOSAL</text><text x="98" y="238" class="titleSmall" >Ask the user</text><text x="98" y="263" class="sub" >Main proposes ask_user</text><rect x="421" y="171" width="295" height="126" rx="11" fill="#FFFFFF" stroke="#D3E2E6" stroke-width="1.5"/><rect x="421" y="191" width="5" height="86" rx="2" fill="#168e87"/><text x="441" y="198" class="meta" >02 · HIO ADMISSION</text><text x="441" y="238" class="titleSmall" >Persist request identity</text><text x="441" y="263" class="sub" >Run / Action / revision</text><rect x="764" y="171" width="295" height="126" rx="11" fill="#FFFFFF" stroke="#D3E2E6" stroke-width="1.5"/><rect x="764" y="191" width="5" height="86" rx="2" fill="#668aa9"/><text x="784" y="198" class="meta" >03 · GLOBAL INBOX</text><text x="784" y="238" class="titleSmall" >Discover the question</text><text x="784" y="263" class="sub" >Read the exact request</text><rect x="1107" y="171" width="295" height="126" rx="11" fill="#FFFFFF" stroke="#D3E2E6" stroke-width="1.5"/><rect x="1107" y="191" width="5" height="86" rx="2" fill="#668aa9"/><text x="1127" y="198" class="meta" >04 · USER RESPONSE</text><text x="1127" y="238" class="titleSmall" >Save original text</text><text x="1127" y="263" class="sub" >Auth · idempotency · conflict</text><path d="M373 234 H421" fill="none" stroke="#5c7c8b" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/><path d="M716 234 H764" fill="none" stroke="#5c7c8b" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/><path d="M1059 234 H1107" fill="none" stroke="#5c7c8b" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/><path d="M1254 297 V342 H405 V404" fill="none" stroke="#5c7c8b" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/><path d="M1254 342 H1087 V404" fill="none" stroke="#5c7c8b" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="73" y="402" width="663" height="378" rx="16" fill="#EAF5F2" stroke="#C2DDD4" stroke-width="1.5"/><rect x="754" y="402" width="652" height="378" rx="16" fill="#EFF5FA" stroke="#CBDDEB" stroke-width="1.5"/><rect x="73" y="402" width="663" height="7" rx="3" fill="#199B8D" stroke="#199B8D" stroke-width="1.5"/><rect x="754" y="402" width="652" height="7" rx="3" fill="#688BAC" stroke="#688BAC" stroke-width="1.5"/><text x="105" y="448" class="group" >Original Run is nonterminal</text><text x="105" y="476" class="groupSub" >The original Correction or Recovery adopts the reply; independent work can continue</text><text x="786" y="448" class="group" >Original Run has ended</text><text x="786" y="476" class="groupSub" >A late response stays linked to its request; no automatic new execution</text><rect x="99" y="510" width="284" height="108" rx="11" fill="#FFFFFF" stroke="#D3E2E6" stroke-width="1.5"/><rect x="99" y="530" width="5" height="68" rx="2" fill="#168e87"/><text x="119" y="537" class="meta" >DEFAULT NON-BLOCKING</text><text x="119" y="577" class="titleSmall" >Continue other work</text><text x="119" y="602" class="sub" >Publish independent results</text><rect x="413" y="510" width="284" height="108" rx="11" fill="#FFFFFF" stroke="#D3E2E6" stroke-width="1.5"/><rect x="413" y="530" width="5" height="68" rx="2" fill="#168e87"/><text x="433" y="537" class="meta" >ACTUAL ADOPTION</text><text x="433" y="577" class="titleSmall" >Correction safe point</text><text x="433" y="602" class="sub" >Next model input</text><path d="M383 570 H413" fill="none" stroke="#168e87" stroke-width="3.2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrowTeal)"/><rect x="99" y="645" width="284" height="108" rx="11" fill="#FFFFFF" stroke="#D3E2E6" stroke-width="1.5"/><rect x="99" y="665" width="5" height="68" rx="2" fill="#448e8c"/><text x="119" y="672" class="meta" >WAIT IF REQUIRED</text><text x="119" y="712" class="titleSmall" >Human Park</text><text x="119" y="737" class="sub" >Same nonterminal Run</text><rect x="413" y="645" width="284" height="108" rx="11" fill="#FFFFFF" stroke="#D3E2E6" stroke-width="1.5"/><rect x="413" y="665" width="5" height="68" rx="2" fill="#448e8c"/><text x="433" y="672" class="meta" >WAKE AND RESUME</text><text x="433" y="712" class="titleSmall" >Recovery / Wake</text><text x="433" y="737" class="sub" >Re-admit original Run</text><path d="M383 705 H413" fill="none" stroke="#168e87" stroke-width="3.2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrowTeal)"/><rect x="782" y="510" width="270" height="108" rx="11" fill="#FFFFFF" stroke="#D3E2E6" stroke-width="1.5"/><rect x="782" y="530" width="5" height="68" rx="2" fill="#6585a3"/><text x="802" y="537" class="meta" >LATE RESPONSE</text><text x="802" y="577" class="titleSmall" >Store original reply</text><text x="802" y="602" class="sub" >No implicit restart</text><rect x="1082" y="510" width="285" height="108" rx="11" fill="#FFFFFF" stroke="#D3E2E6" stroke-width="1.5"/><rect x="1082" y="530" width="5" height="68" rx="2" fill="#B28B58"/><text x="1102" y="537" class="meta" >EXPLICIT USER CHOICE</text><text x="1102" y="577" class="titleSmall" >Continue research?</text><text x="1102" y="602" class="sub" >User must confirm</text><path d="M1052 570 H1082" fill="none" stroke="#5c7c8b" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="1082" y="645" width="285" height="108" rx="11" fill="#FFFFFF" stroke="#D3E2E6" stroke-width="1.5"/><rect x="1082" y="665" width="5" height="68" rx="2" fill="#B28B58"/><text x="1102" y="672" class="meta" >CREATE LINKED RUN</text><text x="1102" y="712" class="titleSmall" >Continue creates Run</text><text x="1102" y="737" class="sub" >Keep parent relationship</text><path d="M1225 618 V645" fill="none" stroke="#5c7c8b" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="74" y="808" width="1332" height="98" rx="12" fill="#FFFFFF" stroke="#D5E3E7" stroke-width="1.5"/><text x="106" y="850" class="footerHead" >Request admitted ≠ reply stored ≠ Main adopted ≠ business effect committed</text><text x="106" y="884" class="footerSub" >HIO owns interaction routing; Authorization and original Effect / Publication retain their authority.</text></svg>