<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 900" width="1480" height="900" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">One conversation, multiple Runs: concurrent without confusion</title><desc id="chart-desc">Foreground replies and background research coexist. Each Run retains its own identity, usage, output and cancellation target.</desc>
