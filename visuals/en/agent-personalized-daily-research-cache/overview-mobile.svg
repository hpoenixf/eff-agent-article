<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1251" width="390" height="1251" role="img" aria-labelledby="title desc"><title id="title">Separate daily generation from reading</title><desc id="desc">Interests guide selection, not permissions. Reopening the homepage must not repeat research. No findings is not generation failure. A cache hit rereads saved content without another model call.</desc><rect width="390" height="1251" rx="22" fill="#f7f9fc"/><rect width="390" height="8" fill="#7054a2"/><text x="24" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#17263e">Separate daily generation</text><text x="24" y="76" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#17263e">from reading</text><text x="24" y="115" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Interests guide selection, not permissions.</text><text x="24" y="139" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Reopening the homepage must not repeat</text><text x="24" y="163" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">research.</text><rect x="20" y="211" width="350" height="194" rx="18" fill="white" stroke="#dbe3ed"/><rect x="36" y="225" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="46" y="248" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">1</text><text x="40" y="287" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#17263e">Followed topics</text><text x="40" y="323" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Provide research direction.</text><text x="40" y="355" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Do not grant tool permissions.</text><text x="185" y="429" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">↓</text><rect x="20" y="439" width="350" height="194" rx="18" fill="white" stroke="#dbe3ed"/><rect x="36" y="453" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="46" y="476" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">2</text><text x="40" y="515" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#17263e">Explicit generation</text><text x="40" y="551" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Bind account and UTC date.</text><text x="40" y="583" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Deduplicate within that day.</text><text x="185" y="657" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">↓</text><rect x="20" y="667" width="350" height="194" rx="18" fill="white" stroke="#dbe3ed"/><rect x="36" y="681" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="46" y="704" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">3</text><text x="40" y="743" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#17263e">Save and reread</text><text x="40" y="779" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Read the existing research.</text><text x="40" y="811" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Citations bind its original version.</text><text x="185" y="885" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">↓</text><rect x="20" y="895" width="350" height="194" rx="18" fill="white" stroke="#dbe3ed"/><rect x="36" y="909" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="46" y="932" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">4</text><text x="40" y="971" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#17263e">Continue a question</text><text x="40" y="1007" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Start new research from a card.</text><text x="40" y="1039" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#17263e">Do not silently rewrite the old result.</text><rect x="20" y="1123" width="350" height="104" rx="18" fill="#f1ebfa" stroke="none"/><text x="40" y="1153" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#7054a2">No findings is not generation failure. A</text><text x="40" y="1177" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#7054a2">cache hit rereads saved content</text><text x="40" y="1201" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#7054a2">without another model call.</text></svg>
