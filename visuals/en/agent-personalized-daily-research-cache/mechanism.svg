<svg xmlns="http://www.w3.org/2000/svg" width="480" height="465" viewBox="0 0 480 465" role="img" aria-labelledby="title desc"><title id="title">Do not let locks starve work</title><desc id="desc">A long generation must not occupy every connection needed for its own reads and publication. Use a separate bounded lock pool; ordinary research queries retain their pool. Losing the lock must invalidate late commits.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC",Arial,sans-serif;fill:#17324d}.title{font-size:27px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.muted{fill:#475569}.warn{fill:#9a3412}</style><rect width="480" height="465" rx="18" fill="#f8fafc"/><text x="24" y="43" class="title">Do not let locks starve work</text><text x="24" y="77" class="small">Separate capacity, not a larger promise.</text><rect x="24" y="101" width="432" height="91" rx="12" fill="#fff6ec" stroke="#e2ba8b"/><text x="43" y="138" class="label">One pool: long-held locks fill it</text><text x="43" y="172" class="small">The research cannot run its own queries.</text><path d="M240 200V231" class="line"/><rect x="24" y="245" width="204" height="119" rx="12" fill="#eaf4ff" stroke="#8cb9df"/><rect x="252" y="245" width="204" height="119" rx="12" fill="#eaf7f2" stroke="#8ccbb6"/><text x="126" y="283" class="label" text-anchor="middle">Lock pool</text><text x="126" y="318" class="body" text-anchor="middle">Bounded capacity</text><text x="126" y="347" class="small" text-anchor="middle">Bounded waiting</text><text x="354" y="283" class="label" text-anchor="middle">Query pool</text><text x="354" y="318" class="body" text-anchor="middle">Read + publish</text><text x="354" y="347" class="small" text-anchor="middle">Original work</text><text x="24" y="410" class="body">After lock loss: reject late commits.</text><text x="24" y="444" class="small">Deduplication still has resource costs.</text></svg>
