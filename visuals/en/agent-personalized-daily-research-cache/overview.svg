<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 563" width="1200" height="563" role="img" aria-labelledby="title desc"><title id="title">Separate daily generation from reading</title><desc id="desc">Interests guide selection, not permissions. Reopening the homepage must not repeat research. No findings is not generation failure. A cache hit rereads saved content without another model call.</desc><rect width="1200" height="563" rx="22" fill="#f7f9fc"/><rect width="1200" height="8" fill="#7054a2"/><text x="48" y="60" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#17263e">Separate daily generation from reading</text><text x="48" y="108" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#17263e">Interests guide selection, not permissions. Reopening the homepage must not repeat research.</text><rect x="34" y="160" width="264" height="286" rx="18" fill="white" stroke="#dbe3ed"/><rect x="50" y="174" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="60" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">1</text><text x="54" y="236" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">Followed topics</text><text x="54" y="274" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Provide research</text><text x="54" y="300" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">direction.</text><text x="54" y="334" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Do not grant tool</text><text x="54" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">permissions.</text><text x="306" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">›</text><rect x="325" y="160" width="264" height="286" rx="18" fill="white" stroke="#dbe3ed"/><rect x="341" y="174" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="351" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">2</text><text x="345" y="236" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">Explicit</text><text x="345" y="266" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">generation</text><text x="345" y="304" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Bind account and UTC</text><text x="345" y="330" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">date.</text><text x="345" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Deduplicate within that</text><text x="345" y="390" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">day.</text><text x="597" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">›</text><rect x="616" y="160" width="264" height="286" rx="18" fill="white" stroke="#dbe3ed"/><rect x="632" y="174" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="642" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">3</text><text x="636" y="236" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">Save and reread</text><text x="636" y="274" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Read the existing</text><text x="636" y="300" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">research.</text><text x="636" y="334" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Citations bind its</text><text x="636" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">original version.</text><text x="888" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#7054a2">›</text><rect x="907" y="160" width="264" height="286" rx="18" fill="white" stroke="#dbe3ed"/><rect x="923" y="174" width="32" height="32" rx="16" fill="#f1ebfa" stroke="none"/><text x="933" y="197" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#7054a2">4</text><text x="927" y="236" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">Continue a</text><text x="927" y="266" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#17263e">question</text><text x="927" y="304" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Start new research from</text><text x="927" y="330" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">a card.</text><text x="927" y="364" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">Do not silently rewrite</text><text x="927" y="390" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#17263e">the old result.</text><rect x="34" y="480" width="1132" height="59" rx="18" fill="#f1ebfa" stroke="none"/><text x="54" y="510" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#7054a2">No findings is not generation failure. A cache hit rereads saved content without another model call.</text></svg>
