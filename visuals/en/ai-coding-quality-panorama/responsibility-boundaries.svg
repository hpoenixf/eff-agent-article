<svg xmlns="http://www.w3.org/2000/svg" width="720" height="830" viewBox="0 0 720 830" role="img" aria-labelledby="responsibility-boundaries-en-title responsibility-boundaries-en-desc" xml:lang="en">
  <title id="responsibility-boundaries-en-title">Give each rule a clear owner</title>
  <desc id="responsibility-boundaries-en-desc">Conceptual comparison: if a page, an API, and an exporter each duplicate the same business rule, one change requires checking all three copies. Giving that rule an explicit responsible module lets the callers reuse the result. This does not imply centralizing every business rule in one module.</desc>
  <defs>
    <marker id="responsibility-boundaries-en-arrow" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#237D78"/></marker>
    <style>text{font-family:'Noto Sans CJK SC','Noto Sans SC',Arial,sans-serif}</style>
  </defs>
  <rect width="720" height="830" rx="24" fill="#F4F7FA"/>
<text x="40" y="61" font-size="36" font-weight="700" fill="#183249"><tspan x="40" dy="0">Give each rule a clear owner</tspan></text><text x="40" y="106" font-size="27" font-weight="400" fill="#526775"><tspan x="40" dy="0">Conceptual view · One business rule</tspan></text><rect x="40" y="140" width="640" height="250" rx="18" fill="#FFF1E6" stroke="#D8BBA3" stroke-width="2"/><text x="64" y="185" font-size="32" font-weight="700" fill="#183249"><tspan x="64" dy="0">Duplicated decisions</tspan></text><rect x="64" y="214" width="184" height="112" rx="14" fill="white" stroke="#D8BBA3" stroke-width="2"/><text x="156" y="258" font-size="31" font-weight="700" fill="#183249" text-anchor="middle"><tspan x="156" dy="0">Page</tspan></text><text x="156" y="301" font-size="28" font-weight="400" fill="#526775" text-anchor="middle"><tspan x="156" dy="0">Rule copy</tspan></text><rect x="268" y="214" width="184" height="112" rx="14" fill="white" stroke="#D8BBA3" stroke-width="2"/><text x="360" y="258" font-size="31" font-weight="700" fill="#183249" text-anchor="middle"><tspan x="360" dy="0">API</tspan></text><text x="360" y="301" font-size="28" font-weight="400" fill="#526775" text-anchor="middle"><tspan x="360" dy="0">Rule copy</tspan></text><rect x="472" y="214" width="184" height="112" rx="14" fill="white" stroke="#D8BBA3" stroke-width="2"/><text x="564" y="258" font-size="31" font-weight="700" fill="#183249" text-anchor="middle"><tspan x="564" dy="0">Export</tspan></text><text x="564" y="301" font-size="28" font-weight="400" fill="#526775" text-anchor="middle"><tspan x="564" dy="0">Rule copy</tspan></text><text x="64" y="367" font-size="29" font-weight="400" fill="#183249"><tspan x="64" dy="0">One change must align three copies.</tspan></text><rect x="40" y="416" width="640" height="326" rx="18" fill="#E6F3EF" stroke="#99C7BE" stroke-width="2"/><text x="64" y="463" font-size="32" font-weight="700" fill="#176F6B"><tspan x="64" dy="0">Clear ownership</tspan></text><rect x="64" y="490" width="184" height="58" rx="12" fill="white" stroke="#99C7BE" stroke-width="2"/><text x="156" y="530" font-size="30" font-weight="700" fill="#183249" text-anchor="middle"><tspan x="156" dy="0">Page</tspan></text><rect x="268" y="490" width="184" height="58" rx="12" fill="white" stroke="#99C7BE" stroke-width="2"/><text x="360" y="530" font-size="30" font-weight="700" fill="#183249" text-anchor="middle"><tspan x="360" dy="0">API</tspan></text><rect x="472" y="490" width="184" height="58" rx="12" fill="white" stroke="#99C7BE" stroke-width="2"/><text x="564" y="530" font-size="30" font-weight="700" fill="#183249" text-anchor="middle"><tspan x="564" dy="0">Export</tspan></text><path d="M 156 558 V 579 H 564 V 558 M 360 558 V 612" fill="none" stroke="#237D78" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#responsibility-boundaries-en-arrow)"/><rect x="112" y="624" width="496" height="94" rx="14" fill="white" stroke="#99C7BE" stroke-width="2"/><text x="360" y="664" font-size="31" font-weight="700" fill="#176F6B" text-anchor="middle"><tspan x="360" dy="0">Responsible module</tspan></text><text x="360" y="702" font-size="28" font-weight="400" fill="#183249" text-anchor="middle"><tspan x="360" dy="0">One decision · Reused result</tspan></text><text x="40" y="791" font-size="30" font-weight="700" fill="#183249"><tspan x="40" dy="0">Each key rule has an explicit owner.</tspan></text>
</svg>
