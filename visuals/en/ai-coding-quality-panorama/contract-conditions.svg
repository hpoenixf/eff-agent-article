<svg xmlns="http://www.w3.org/2000/svg" width="720" height="816" viewBox="0 0 720 816" role="img" aria-labelledby="contract-conditions-en-title contract-conditions-en-desc" xml:lang="en">
  <title id="contract-conditions-en-title">Make acceptance observable</title>
  <desc id="contract-conditions-en-desc">Illustrative example: export all. Decide what all includes, then define the outcome, scope, invariants, and failure behavior together. The chosen contract delivers a downloadable file with every authorized record in the current filter, across pagination and with existing columns. Failed generation must not show a successful download link.</desc>
  <defs>
    <marker id="contract-conditions-en-arrow" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#237D78"/></marker>
    <style>text{font-family:'Noto Sans CJK SC','Noto Sans SC',Arial,sans-serif}</style>
  </defs>
  <rect width="720" height="816" rx="24" fill="#F4F7FA"/>
<text x="40" y="61" font-size="36" font-weight="700" fill="#183249"><tspan x="40" dy="0">Make acceptance observable</tspan></text><text x="40" y="106" font-size="27" font-weight="400" fill="#526775"><tspan x="40" dy="0">Illustrative example · Export all</tspan></text><rect x="40" y="140" width="640" height="110" rx="18" fill="white" stroke="#C8D7E0" stroke-width="2"/><text x="64" y="185" font-size="31" font-weight="700" fill="#183249"><tspan x="64" dy="0">Decide what “all” includes</tspan></text><text x="64" y="226" font-size="28" font-weight="400" fill="#526775"><tspan x="64" dy="0">Page · filtered results · account data</tspan></text><path d="M 360 260 V 280" stroke="#237D78" stroke-width="4" stroke-linecap="round" marker-end="url(#contract-conditions-en-arrow)"/><rect x="40" y="296" width="312" height="162" rx="18" fill="white" stroke="#C8D7E0" stroke-width="2"/><text x="62" y="340" font-size="31" font-weight="700" fill="#176F6B"><tspan x="62" dy="0">Outcome</tspan></text><text x="62" y="387" font-size="28" font-weight="400" fill="#183249"><tspan x="62" dy="0">A downloadable</tspan><tspan x="62" dy="38">data file</tspan></text><rect x="368" y="296" width="312" height="162" rx="18" fill="#E6F3EF" stroke="#99C7BE" stroke-width="2"/><text x="390" y="340" font-size="31" font-weight="700" fill="#176F6B"><tspan x="390" dy="0">Scope</tspan></text><text x="390" y="387" font-size="28" font-weight="400" fill="#183249"><tspan x="390" dy="0">All authorized rows</tspan><tspan x="390" dy="38">in the current filter</tspan></text><rect x="40" y="480" width="312" height="162" rx="18" fill="white" stroke="#C8D7E0" stroke-width="2"/><text x="62" y="524" font-size="31" font-weight="700" fill="#176F6B"><tspan x="62" dy="0">Invariants</tspan></text><text x="62" y="571" font-size="28" font-weight="400" fill="#183249"><tspan x="62" dy="0">Across every page</tspan><tspan x="62" dy="38">Preserve columns</tspan></text><rect x="368" y="480" width="312" height="162" rx="18" fill="white" stroke="#C8D7E0" stroke-width="2"/><text x="390" y="524" font-size="31" font-weight="700" fill="#176F6B"><tspan x="390" dy="0">Failure</tspan></text><text x="390" y="571" font-size="28" font-weight="400" fill="#183249"><tspan x="390" dy="0">Generation failed?</tspan><tspan x="390" dy="38">No success link</tspan></text><path d="M 40 688 H 680" stroke="#C8D7E0" stroke-width="2"/><text x="40" y="735" font-size="30" font-weight="700" fill="#183249"><tspan x="40" dy="0">Together, these define what to build</tspan></text><text x="40" y="777" font-size="28" font-weight="400" fill="#526775"><tspan x="40" dy="0">and what acceptance must observe.</tspan></text>
</svg>
