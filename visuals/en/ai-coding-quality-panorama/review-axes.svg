<svg xmlns="http://www.w3.org/2000/svg" width="720" height="845" viewBox="0 0 720 845" role="img" aria-labelledby="review-axes-en-title review-axes-en-desc" xml:lang="en">
  <title id="review-axes-en-title">Two judgments in code review</title>
  <desc id="review-axes-en-desc">A two-axis review matrix. The columns ask whether the requirements are met; the rows ask whether the design supports future changes. A maintainable implementation with unmet requirements still needs behavior fixes. Working behavior with important design problems still needs design fixes. If both aspects are sound, proceed to delivery verification; this is not automatic acceptance.</desc>
  <defs>
    <marker id="review-axes-en-arrow" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#237D78"/></marker>
    <style>text{font-family:'Noto Sans CJK SC','Noto Sans SC',Arial,sans-serif}</style>
  </defs>
  <rect width="720" height="845" rx="24" fill="#F4F7FA"/>
<text x="40" y="61" font-size="36" font-weight="700" fill="#183249"><tspan x="40" dy="0">Two judgments in code review</tspan></text><text x="40" y="106" font-size="27" font-weight="400" fill="#526775"><tspan x="40" dy="0">Conceptual view · Behavior and design</tspan></text><text x="196" y="167" font-size="28" font-weight="700" fill="#183249" text-anchor="middle"><tspan x="196" dy="0">Requirement unmet</tspan></text><text x="524" y="167" font-size="28" font-weight="700" fill="#183249" text-anchor="middle"><tspan x="524" dy="0">Requirement met</tspan></text><text x="40" y="220" font-size="29" font-weight="700" fill="#176F6B"><tspan x="40" dy="0">Design supports future changes</tspan></text><rect x="40" y="241" width="312" height="182" rx="18" fill="white" stroke="#C8D7E0" stroke-width="2"/><text x="62" y="288" font-size="31" font-weight="700" fill="#183249"><tspan x="62" dy="0">Fix the behavior</tspan></text><text x="62" y="342" font-size="27.5" font-weight="400" fill="#183249"><tspan x="62" dy="0">Clear structure</tspan><tspan x="62" dy="40">Unmet expectations</tspan></text><rect x="368" y="241" width="312" height="182" rx="18" fill="#E6F3EF" stroke="#99C7BE" stroke-width="2"/><text x="390" y="288" font-size="31" font-weight="700" fill="#176F6B"><tspan x="390" dy="0">Verify delivery</tspan></text><text x="390" y="342" font-size="27.5" font-weight="400" fill="#183249"><tspan x="390" dy="0">Requirements met</tspan><tspan x="390" dy="40">Maintainable design</tspan></text><rect x="40" y="502" width="312" height="182" rx="18" fill="#FFF1E6" stroke="#D8BBA3" stroke-width="2"/><text x="62" y="549" font-size="31" font-weight="700" fill="#183249"><tspan x="62" dy="0">Fix both aspects</tspan></text><text x="62" y="603" font-size="27.5" font-weight="400" fill="#183249"><tspan x="62" dy="0">Close behavior gaps</tspan><tspan x="62" dy="40">Resolve design issues</tspan></text><rect x="368" y="502" width="312" height="182" rx="18" fill="#FFF1E6" stroke="#D8BBA3" stroke-width="2"/><text x="390" y="549" font-size="31" font-weight="700" fill="#183249"><tspan x="390" dy="0">Fix the design</tspan></text><text x="390" y="603" font-size="27.5" font-weight="400" fill="#183249"><tspan x="390" dy="0">Behavior works</tspan><tspan x="390" dy="40">Changes remain hard</tspan></text><text x="40" y="481" font-size="29" font-weight="700" fill="#183249"><tspan x="40" dy="0">Design makes future changes hard</tspan></text><path d="M 40 719 H 680" stroke="#C8D7E0" stroke-width="2"/><text x="40" y="764" font-size="29" font-weight="700" fill="#183249"><tspan x="40" dy="0">Next: verify the version and user result.</tspan></text><text x="40" y="805" font-size="27" font-weight="400" fill="#526775"><tspan x="40" dy="0">Sound review is not automatic acceptance.</tspan></text>
</svg>
