<svg xmlns="http://www.w3.org/2000/svg" width="640" height="656" viewBox="0 0 640 656" role="img" aria-labelledby="title desc"><title id="title">研究成果与业务操作分开</title><desc id="desc">阅读即可结束研究；后续研究保留旧依据；用户新的具体操作请求才进入独立业务授权。橙色操作路径是机构目标，不代表当前交易能力。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f83"/></marker></defs><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect width="640" height="656" rx="24" fill="#f5f8f8"/><text x="32" y="49" font-size="30" fill="#153246" font-weight="700" text-anchor="start">报告之后，是两条不同的路</text><text x="32" y="90" font-size="25" fill="#4e6571" font-weight="400" text-anchor="start">研究有自己的终点，操作另行进入业务流程</text><rect x="24" y="120" width="592" height="100" rx="18" fill="#e7f3f2" stroke="#87bcbb" stroke-width="2"/><text x="320" y="158" font-size="27" fill="#153246" font-weight="700" text-anchor="middle">原资料 → 计算结果 → 分析判断</text><text x="320" y="196" font-size="25" fill="#4e6571" font-weight="400" text-anchor="middle">关联依据，保存可回看的报告</text><path d="M320 220 V244 H162 V270" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><path d="M320 244 H478 V270" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="274" width="276" height="104" rx="18" fill="#ffffff" stroke="#d5e1e5" stroke-width="2"/><text x="162" y="314" font-size="28" fill="#153246" font-weight="700" text-anchor="middle">阅读与追问</text><text x="162" y="354" font-size="25" fill="#4e6571" font-weight="400" text-anchor="middle">研究可以在此结束</text><rect x="340" y="274" width="276" height="104" rx="18" fill="#fff6eb" stroke="#d9a873" stroke-width="2" stroke-dasharray="8 6"/><text x="478" y="314" font-size="25" fill="#a45b15" font-weight="700" text-anchor="middle">另行提出操作请求</text><text x="478" y="354" font-size="25" fill="#4e6571" font-weight="400" text-anchor="middle">不是报告自动下单</text><path d="M162 378 V434" fill="none" stroke="#087f83" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M478 378 V434" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="438" width="276" height="142" rx="18" fill="#ffffff" stroke="#d5e1e5" stroke-width="2"/><text x="162" y="476" font-size="26" fill="#153246" font-weight="700" text-anchor="middle">历史与持续研究</text><text x="162" y="515" font-size="24" fill="#4e6571" font-weight="400" text-anchor="middle">保留当时的依据</text><text x="162" y="552" font-size="24" fill="#4e6571" font-weight="400" text-anchor="middle">用新事实重新评估</text><rect x="340" y="438" width="276" height="142" rx="18" fill="#fff6eb" stroke="#d9a873" stroke-width="2" stroke-dasharray="8 6"/><text x="478" y="476" font-size="26" fill="#a45b15" font-weight="700" text-anchor="middle">业务核验与授权</text><text x="478" y="515" font-size="24" fill="#4e6571" font-weight="400" text-anchor="middle">执行、查询与对账</text><text x="478" y="552" font-size="24" fill="#4e6571" font-weight="400" text-anchor="middle">按真实回报更新记录</text><text x="320" y="624" font-size="24" fill="#a45b15" font-weight="400" text-anchor="middle">橙色虚线：机构接入目标，非当前交易能力</text></g></svg>