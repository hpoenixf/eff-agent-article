<svg xmlns="http://www.w3.org/2000/svg" width="640" height="656" viewBox="0 0 640 656" role="img" aria-labelledby="title desc"><title id="title">研究循环与局部交付</title><desc id="desc">比较计算中发现重要缺口可以返回取证；不必等所有缺口关闭才交付独立成立的部分。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f83"/></marker></defs><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect width="640" height="656" rx="24" fill="#f5f8f8"/><text x="32" y="49" font-size="30" fill="#153246" font-weight="700" text-anchor="start">研究不是一条直线</text><text x="32" y="90" font-size="26" fill="#4e6571" font-weight="400" text-anchor="start">用新证据调整路线，把已有成果交出来</text><rect x="24" y="120" width="450" height="88" rx="18" fill="#ffffff" stroke="#d5e1e5" stroke-width="2"/><text x="44" y="156" font-size="28" fill="#153246" font-weight="700" text-anchor="start">明确问题</text><text x="44" y="190" font-size="25" fill="#4e6571" font-weight="400" text-anchor="start">目标、对象与关键约束</text><path d="M249 208 V230" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="234" width="450" height="88" rx="18" fill="#ffffff" stroke="#d5e1e5" stroke-width="2"/><text x="44" y="270" font-size="28" fill="#153246" font-weight="700" text-anchor="start">取得材料</text><text x="44" y="304" font-size="25" fill="#4e6571" font-weight="400" text-anchor="start">来源、时点与实际覆盖</text><path d="M249 322 V344" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="348" width="450" height="88" rx="18" fill="#ffffff" stroke="#d5e1e5" stroke-width="2"/><text x="44" y="384" font-size="28" fill="#153246" font-weight="700" text-anchor="start">比较与计算</text><text x="44" y="418" font-size="25" fill="#4e6571" font-weight="400" text-anchor="start">选择适用的输入和方法</text><path d="M249 436 V458" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="462" width="450" height="88" rx="18" fill="#ffffff" stroke="#d5e1e5" stroke-width="2"/><text x="44" y="498" font-size="28" fill="#153246" font-weight="700" text-anchor="start">解释并交付</text><text x="44" y="532" font-size="25" fill="#4e6571" font-weight="400" text-anchor="start">说明结论、条件与缺口</text><path d="M474 391 H605 V278 H474" fill="none" stroke="#087f83" stroke-width="3" marker-end="url(#arrow)"/><text x="543" y="318" font-size="24" fill="#087f83" font-weight="700" text-anchor="middle">重要缺口</text><text x="543" y="353" font-size="24" fill="#087f83" font-weight="700" text-anchor="middle">返回补查</text><text x="320" y="590" font-size="26" fill="#087f83" font-weight="700" text-anchor="middle">能独立回答的部分，可以先交付</text><text x="320" y="628" font-size="24" fill="#4e6571" font-weight="400" text-anchor="middle">停止补查，不等于所有问题都已解决</text></g></svg>