<svg xmlns="http://www.w3.org/2000/svg" width="640" height="624" viewBox="0 0 640 624" role="img" aria-labelledby="title desc"><title id="title">四类职责与业务边界</title><desc id="desc">四张卡片表示职责，不要求四个独立服务；当前对话研究不直接交易。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f83"/></marker></defs><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect width="640" height="624" rx="24" fill="#f5f8f8"/><text x="32" y="49" font-size="30" fill="#153246" font-weight="700" text-anchor="start">金融 Agent 的职责地图</text><text x="32" y="90" font-size="26" fill="#4e6571" font-weight="400" text-anchor="start">四类职责协作，不让一个角色包办所有事</text><rect x="24" y="122" width="286" height="158" rx="18" fill="#ffffff" stroke="#d5e1e5" stroke-width="2"/><text x="42" y="158" font-size="22" fill="#087f83" font-weight="700" text-anchor="start">01</text><text x="42" y="198" font-size="28" fill="#153246" font-weight="700" text-anchor="start">投资记录</text><text x="42" y="234" font-size="24" fill="#4e6571" font-weight="400" text-anchor="start">持仓、现金与确认记录</text><text x="42" y="266" font-size="24" fill="#4e6571" font-weight="400" text-anchor="start">研究读取，不由模型改写</text><rect x="330" y="122" width="286" height="158" rx="18" fill="#ffffff" stroke="#d5e1e5" stroke-width="2"/><text x="348" y="158" font-size="22" fill="#087f83" font-weight="700" text-anchor="start">02</text><text x="348" y="198" font-size="28" fill="#153246" font-weight="700" text-anchor="start">数据入口</text><text x="348" y="234" font-size="24" fill="#4e6571" font-weight="400" text-anchor="start">来源、时点与读取范围</text><text x="348" y="266" font-size="24" fill="#4e6571" font-weight="400" text-anchor="start">交接材料，不替研究裁决</text><rect x="24" y="302" width="286" height="158" rx="18" fill="#ffffff" stroke="#d5e1e5" stroke-width="2"/><text x="42" y="338" font-size="22" fill="#087f83" font-weight="700" text-anchor="start">03</text><text x="42" y="378" font-size="28" fill="#153246" font-weight="700" text-anchor="start">研究与交付</text><text x="42" y="414" font-size="24" fill="#4e6571" font-weight="400" text-anchor="start">选方法、调工具、写报告</text><text x="42" y="446" font-size="24" fill="#4e6571" font-weight="400" text-anchor="start">按问题推进，保留成果</text><rect x="330" y="302" width="286" height="158" rx="18" fill="#ffffff" stroke="#d5e1e5" stroke-width="2"/><text x="348" y="338" font-size="22" fill="#087f83" font-weight="700" text-anchor="start">04</text><text x="348" y="378" font-size="28" fill="#153246" font-weight="700" text-anchor="start">运行观察</text><text x="348" y="414" font-size="24" fill="#4e6571" font-weight="400" text-anchor="start">调用、异常与实际交付</text><text x="348" y="446" font-size="24" fill="#4e6571" font-weight="400" text-anchor="start">帮助排查，不授予权限</text><rect x="24" y="494" width="592" height="102" rx="18" fill="#153246" stroke="#153246" stroke-width="2"/><text x="320" y="534" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle">研究可以自主，操作必须另行授权</text><text x="320" y="574" font-size="25" fill="#d4e8eb" font-weight="400" text-anchor="middle">当前对话研究不直接交易</text></g></svg>