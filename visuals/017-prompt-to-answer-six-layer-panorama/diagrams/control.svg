<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" role="img" aria-labelledby="control-title control-desc"><title id="control-title">两类持久工作：原 Run 唤醒与新 Task occurrence</title><desc id="control-desc">图中左上的 Schedule 路径是用户**确认后**才生效的一次定时任务；`TaskRun` 是该 occurrence 的 Root Run。右侧的 parked/wake 则延续**原来那一个**非终态 Run。两者共用受控事件入口和真实生命周期 owner，却不能因收到通知就相互转换，更不能把 `finish_research({isSuspend:true})` 这种终态暂停解释为同 Run 睡眠。</desc><defs><marker id="arrow-control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#83949f"/></marker></defs><path d="M240,53 H295 V53 H347" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-control)"/><path d="M560,53 H615 V53 H667" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-control)"/><path d="M775,86 V125.5 H775 V162" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-control)"/><path d="M240,198 H295 V198 H347" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-control)"/><path d="M560,198 H615 V198 H667" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-control)"/><path d="M775,231 V270.5 H775 V307" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-control)"/><path d="M670,343 H615 V343 H563" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-control)"/><path d="M455,376 V425.5 H455 V472" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-control)"/><path d="M240,508 H455 V198 H667" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-control)"/><rect x="30" y="20" width="210" height="66" rx="11" fill="#f1ecfa" stroke="#ab95c7" /><text x="135" y="47" text-anchor="middle" fill="#4a3764" font-size="16" font-weight="550">Confirmed</text><text x="135" y="69" text-anchor="middle" fill="#4a3764" font-size="16" font-weight="550">Schedule</text><rect x="350" y="20" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="455" y="58" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">New Occurrence</text><rect x="670" y="20" width="210" height="66" rx="11" fill="#fff4e5" stroke="#cf994e" /><text x="775" y="58" text-anchor="middle" fill="#654815" font-size="16" font-weight="550">Task Run</text><rect x="30" y="165" width="210" height="66" rx="11" fill="#f1ecfa" stroke="#ab95c7" /><text x="135" y="203" text-anchor="middle" fill="#4a3764" font-size="16" font-weight="550">Control Event</text><rect x="350" y="165" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="455" y="203" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Control Inbox</text><rect x="670" y="165" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="775" y="203" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Run Owner</text><rect x="670" y="310" width="210" height="66" rx="11" fill="#fff9ef" stroke="#b9ad92" stroke-dasharray="5 4"/><text x="775" y="348" text-anchor="middle" fill="#6a5a3d" font-size="16" font-weight="550">Parked Run</text><rect x="350" y="310" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="455" y="348" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Wake Receipt</text><rect x="350" y="475" width="210" height="66" rx="11" fill="#fff4e5" stroke="#cf994e" /><text x="455" y="513" text-anchor="middle" fill="#654815" font-size="16" font-weight="550">Resume Same Run</text><rect x="30" y="475" width="210" height="66" rx="11" fill="#f1ecfa" stroke="#ab95c7" /><text x="135" y="513" text-anchor="middle" fill="#4a3764" font-size="16" font-weight="550">Stop Request</text></svg>
