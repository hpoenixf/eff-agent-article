<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 435" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" role="img" aria-labelledby="hooks-title hooks-desc"><title id="hooks-title">扩展边界：收窄投影，保留事实</title><desc id="hooks-desc">这是调用后钩子的简化关系。原始回执独立保存；投影可以删除，留下的值与路径必须继承原事实。等形替换来源或数字属于禁止分支。</desc><defs><marker id="arrow-hooks" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#83949f"/></marker></defs><path d="M455,86 V115.5 H135 V142" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-hooks)"/><path d="M455,86 V115.5 H455 V142" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-hooks)"/><path d="M455,211 V235.5 H295 V257" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-hooks)"/><path d="M455,211 V235.5 H775 V257" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-hooks)"/><path d="M295,326 V345.5 H295 V362" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-hooks)"/><path d="M775,326 V345.5 H775 V362" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-hooks)"/><rect x="350" y="20" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="455" y="58" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Host Tool Facts</text><rect x="30" y="145" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="135" y="183" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Raw Observations</text><rect x="350" y="145" width="210" height="66" rx="11" fill="#f1ecfa" stroke="#ab95c7" /><text x="455" y="183" text-anchor="middle" fill="#4a3764" font-size="16" font-weight="550">Model Projection</text><rect x="190" y="260" width="210" height="66" rx="11" fill="#f1ecfa" stroke="#ab95c7" /><text x="295" y="298" text-anchor="middle" fill="#4a3764" font-size="16" font-weight="550">Remove Fields</text><rect x="670" y="260" width="210" height="66" rx="11" fill="#f1f3f5" stroke="#9caab4" /><text x="775" y="287" text-anchor="middle" fill="#3a4c59" font-size="16" font-weight="550">Attempt Fact</text><text x="775" y="309" text-anchor="middle" fill="#3a4c59" font-size="16" font-weight="550">Rewrite</text><rect x="190" y="365" width="210" height="66" rx="11" fill="#fff4e5" stroke="#cf994e" /><text x="295" y="392" text-anchor="middle" fill="#654815" font-size="16" font-weight="550">Narrow Safe</text><text x="295" y="414" text-anchor="middle" fill="#654815" font-size="16" font-weight="550">Projection</text><rect x="670" y="365" width="210" height="66" rx="11" fill="#f1f3f5" stroke="#9caab4" /><text x="775" y="403" text-anchor="middle" fill="#3a4c59" font-size="16" font-weight="550">Reject Rewrite</text></svg>
