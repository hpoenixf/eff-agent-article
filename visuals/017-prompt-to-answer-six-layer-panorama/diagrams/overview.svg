<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 615" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" role="img" aria-labelledby="overview-title overview-desc"><title id="overview-title">职责全景：一句问题穿过哪些交接</title><desc id="overview-desc">这是需要工具的研究路径。结果回灌后，模型可以提出下一轮动作或提交答案；观测从各处取得独立记录，并非最后才开始。</desc><defs><marker id="arrow-overview" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#83949f"/></marker></defs><path d="M240,58 H295 V58 H347" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-overview)"/><path d="M560,58 H615 V58 H667" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-overview)"/><path d="M775,91 V130.5 H775 V167" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-overview)"/><path d="M670,203 H615 V203 H563" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-overview)"/><path d="M350,203 H295 V203 H243" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-overview)"/><path d="M135,236 V283 H135 V327" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-overview)"/><path d="M240,363 H295 V363 H347" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-overview)"/><path d="M560,363 H615 V363 H667" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-overview)"/><path d="M455,236 V275 H615 V475 H455 V507" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-overview)"/><path d="M135,396 V453 H455 V507" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-overview)"/><path d="M775,396 V453 H455 V507" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-overview)"/><rect x="30" y="25" width="210" height="66" rx="11" fill="#f1ecfa" stroke="#ab95c7" /><text x="135" y="63" text-anchor="middle" fill="#4a3764" font-size="16" font-weight="550">User Question</text><rect x="350" y="25" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="455" y="63" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Entry Gate</text><rect x="670" y="25" width="210" height="66" rx="11" fill="#f1ecfa" stroke="#ab95c7" /><text x="775" y="52" text-anchor="middle" fill="#4a3764" font-size="16" font-weight="550">Build Model</text><text x="775" y="74" text-anchor="middle" fill="#4a3764" font-size="16" font-weight="550">Context</text><rect x="670" y="170" width="210" height="66" rx="11" fill="#fff4e5" stroke="#cf994e" /><text x="775" y="208" text-anchor="middle" fill="#654815" font-size="16" font-weight="550">Model Action</text><rect x="350" y="170" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="455" y="208" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Host Execution</text><rect x="30" y="170" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="135" y="197" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Read And</text><text x="135" y="219" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Calculate</text><rect x="30" y="330" width="210" height="66" rx="11" fill="#fff4e5" stroke="#cf994e" /><text x="135" y="368" text-anchor="middle" fill="#654815" font-size="16" font-weight="550">Model Continues</text><rect x="350" y="330" width="210" height="66" rx="11" fill="#e8f4ef" stroke="#7daa97" /><text x="455" y="368" text-anchor="middle" fill="#244d3d" font-size="16" font-weight="550">Publish Answer</text><rect x="670" y="330" width="210" height="66" rx="11" fill="#e8f4ef" stroke="#7daa97" /><text x="775" y="368" text-anchor="middle" fill="#244d3d" font-size="16" font-weight="550">User Followup</text><rect x="350" y="510" width="210" height="66" rx="11" fill="#f1f3f5" stroke="#9caab4" /><text x="455" y="548" text-anchor="middle" fill="#3a4c59" font-size="16" font-weight="550">Observability</text></svg>
