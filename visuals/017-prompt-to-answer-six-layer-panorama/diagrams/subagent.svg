<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" role="img" aria-labelledby="subagent-title subagent-desc"><title id="subagent-title">按需委派：Root 管理所有 Child，Main 统一交付</title><desc id="subagent-desc">图中两条路径是可选分支，不代表每次都同时启动。Child 用 `submit_subagent_result` 提交部分或最终交接，保留真实引用、产物、已读范围和未解决缺口。**Child 自己读过原文与 Main 只收到它的摘要，是两种不同消费事实**；摘要不自动升级为已核验数值，Child 也不能直接向用户发布最终答案。</desc><defs><marker id="arrow-subagent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#83949f"/></marker></defs><path d="M455,86 V115.5 H455 V142" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-subagent)"/><path d="M455,211 V250.5 H135 V287" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-subagent)"/><path d="M455,211 V250.5 H775 V287" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-subagent)"/><path d="M775,356 V398 H775 V437" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-subagent)"/><path d="M135,356 V458 H455 V557" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-subagent)"/><path d="M775,506 V533 H455 V557" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-subagent)"/><rect x="350" y="20" width="210" height="66" rx="11" fill="#fff4e5" stroke="#cf994e" /><text x="455" y="58" text-anchor="middle" fill="#654815" font-size="16" font-weight="550">Main Agent</text><rect x="350" y="145" width="210" height="66" rx="11" fill="#f1ecfa" stroke="#ab95c7" /><text x="455" y="183" text-anchor="middle" fill="#4a3764" font-size="16" font-weight="550">Assess Delegation</text><rect x="30" y="290" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="135" y="328" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Direct Tools</text><rect x="670" y="290" width="210" height="66" rx="11" fill="#fff4e5" stroke="#cf994e" /><text x="775" y="328" text-anchor="middle" fill="#654815" font-size="16" font-weight="550">Child Worker</text><rect x="670" y="440" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="775" y="478" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Child Handoff</text><rect x="350" y="560" width="210" height="66" rx="11" fill="#e8f4ef" stroke="#7daa97" /><text x="455" y="598" text-anchor="middle" fill="#244d3d" font-size="16" font-weight="550">Main Synthesis</text></svg>
