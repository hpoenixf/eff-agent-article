<text x="78" y="52" class="eyebrow" >CONCURRENT RESEARCH · 运行身份</text><text x="78" y="99" class="heading" >一段会话，多个运行：并发但不混淆</text><text x="78" y="126" class="sub" >前台短答与后台研究可以同时存在，每条 Run 都有自己的身份、预算、输出和取消目标。</text><g><rect x="430" y="162" width="620" height="118" rx="12" fill="#FFFFFF" stroke="#D7E5E7" stroke-width="1.5"/><rect x="430" y="182" width="5" height="78" rx="2" fill="#268F87"/><text x="450" y="189" class="meta" >统一会话与认证范围</text><text x="450" y="228" class="title" >Conversation · 同一个用户</text><text x="450" y="255" class="small" >聊天历史共享，执行按 Run 隔离</text></g><path d="M740 280 V 305 H 395 V 335" fill="none" stroke="#5C7D8B" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arr)"/><path d="M740 305 H 1090 V 335" fill="none" stroke="#5C7D8B" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arr)"/><rect x="74" y="337" width="650" height="380" rx="16" fill="#EBF6F2" stroke="#BBDCD6" stroke-width="1.5"/><rect x="757" y="337" width="649" height="380" rx="16" fill="#EFF5FA" stroke="#CBDEEA" stroke-width="1.5"/><rect x="74" y="337" width="650" height="7" rx="3" fill="#1C968A" stroke="#1C968A" stroke-width="1.5"/><rect x="757" y="337" width="649" height="7" rx="3" fill="#678DAF" stroke="#678DAF" stroke-width="1.5"/><text x="106" y="382" class="group" >后台长研究 · Run A</text><text x="106" y="408" class="group-sub" >持续获取证据，逐步生成带来源的研究结果</text><text x="789" y="382" class="group" >前台短交互 · Run B / C</text><text x="789" y="408" class="group-sub" >短答可以先交付；修正必须明确找到目标研究</text><g><rect x="102" y="467" width="188" height="126" rx="12" fill="#FFFFFF" stroke="#D7E5E7" stroke-width="1.5"/><rect x="102" y="487" width="5" height="86" rx="2" fill="#228E88"/><text x="122" y="494" class="meta" >研究阶段 01</text><text x="122" y="533" class="title" >资料读取</text><text x="122" y="560" class="small" >Web / PDF</text></g><g><rect x="310" y="467" width="188" height="126" rx="12" fill="#FFFFFF" stroke="#D7E5E7" stroke-width="1.5"/><rect x="310" y="487" width="5" height="86" rx="2" fill="#228E88"/><text x="330" y="494" class="meta" >研究阶段 02</text><text x="330" y="533" class="title" >分析与计算</text><text x="330" y="560" class="small" >重叠 · 来源</text></g><g><rect x="518" y="467" width="177" height="126" rx="12" fill="#FFFFFF" stroke="#D7E5E7" stroke-width="1.5"/><rect x="518" y="487" width="5" height="86" rx="2" fill="#228E88"/><text x="538" y="494" class="meta" >研究阶段 03</text><text x="538" y="533" class="title" >阶段性发布</text><text x="538" y="560" class="small" >部分 / 最终报告</text></g><path d="M290 532 H310" fill="none" stroke="#5C7D8B" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arr)"/><path d="M498 532 H518" fill="none" stroke="#5C7D8B" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arr)"/><g><rect x="787" y="450" width="260" height="108" rx="12" fill="#FFFFFF" stroke="#D7E5E7" stroke-width="1.5"/><rect x="787" y="470" width="5" height="68" rx="2" fill="#557EAF"/><text x="807" y="477" class="meta" >Run B · 普通问题</text><text x="807" y="516" class="title" >解释一个概念</text><text x="807" y="543" class="small" >无需等待 Run A</text></g><g><rect x="1100" y="450" width="276" height="108" rx="12" fill="#FFFFFF" stroke="#D7E5E7" stroke-width="1.5"/><rect x="1100" y="470" width="5" height="68" rx="2" fill="#557EAF"/><text x="1120" y="477" class="meta" >Run B · 已有结果</text><text x="1120" y="516" class="title" >短答独立交付</text><text x="1120" y="543" class="small" >按自身身份发布</text></g><path d="M1047 509 H1100" fill="none" stroke="#5C7D8B" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arr)"/><g><rect x="787" y="575" width="260" height="108" rx="12" fill="#FFFFFF" stroke="#D7E5E7" stroke-width="1.5"/><rect x="787" y="595" width="5" height="68" rx="2" fill="#8B85A7"/><text x="807" y="602" class="meta" >Run C · 用户补充</text><text x="807" y="641" class="title" >明确修正口径</text><text x="807" y="668" class="small" >选择目标研究</text></g><g><rect x="1100" y="575" width="276" height="108" rx="12" fill="#FFFFFF" stroke="#D7E5E7" stroke-width="1.5"/><rect x="1100" y="595" width="5" height="68" rx="2" fill="#8B85A7"/><text x="1120" y="602" class="meta" >Correction · 精准投递</text><text x="1120" y="641" class="title" >绑定原 Run A</text><text x="1120" y="668" class="small" >不是“最新消息”</text></g><path d="M1047 630 H1100" fill="none" stroke="#5C7D8B" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arr)"/><path d="M1238 683 V754 H400 V593" fill="none" stroke="#178D83" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" stroke-dasharray="8 7" marker-end="url(#arrTeal)"/><text x="816" y="748" class="annotation" text-anchor="middle">修正送回指定的后台研究</text><rect x="74" y="789" width="1332" height="86" rx="12" fill="#FFFFFF" stroke="#D7E5E7" stroke-width="1.5"/><text x="106" y="826" class="foot-head" >共享机制，不共享执行身份</text><text x="106" y="856" class="foot-small" >Runtime · Host · Publication · Recovery 共用；每个 Run 仍拥有自己的预算、引用、Stop 与结果版本</text></svg>