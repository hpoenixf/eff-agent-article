<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" role="img" aria-labelledby="continuity-title continuity-desc"><title id="continuity-title">继续分流：消息重发、任务续接与普通追问</title><desc id="continuity-desc">这张图按请求关系分流，省略每条路径上的权限与来源检查。普通追问和显式任务续接都可以建立新运行，重发则查找原消息。</desc><defs><marker id="arrow-continuity" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#83949f"/></marker></defs><path d="M455,86 V115.5 H135 V142" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-continuity)"/><path d="M455,86 V115.5 H455 V142" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-continuity)"/><path d="M455,86 V115.5 H775 V142" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-continuity)"/><path d="M135,211 V235.5 H135 V257" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-continuity)"/><path d="M455,211 V235.5 H455 V257" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-continuity)"/><path d="M775,211 V235.5 H775 V257" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-continuity)"/><path d="M135,326 V343 H455 V357" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-continuity)"/><path d="M455,326 V343 H455 V357" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-continuity)"/><path d="M775,326 V343 H455 V357" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-continuity)"/><rect x="350" y="20" width="210" height="66" rx="11" fill="#f1ecfa" stroke="#ab95c7" /><text x="455" y="47" text-anchor="middle" fill="#4a3764" font-size="16" font-weight="550">Resubmitted</text><text x="455" y="69" text-anchor="middle" fill="#4a3764" font-size="16" font-weight="550">Message</text><rect x="30" y="145" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="135" y="172" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Same Message</text><text x="135" y="194" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Replay</text><rect x="350" y="145" width="210" height="66" rx="11" fill="#fff4e5" stroke="#cf994e" /><text x="455" y="172" text-anchor="middle" fill="#654815" font-size="16" font-weight="550">Explicit</text><text x="455" y="194" text-anchor="middle" fill="#654815" font-size="16" font-weight="550">Continuation</text><rect x="670" y="145" width="210" height="66" rx="11" fill="#fff4e5" stroke="#cf994e" /><text x="775" y="183" text-anchor="middle" fill="#654815" font-size="16" font-weight="550">New Follow Up</text><rect x="30" y="260" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="135" y="287" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Resolve Existing</text><text x="135" y="309" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Run</text><rect x="350" y="260" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="455" y="298" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Link Parent Run</text><rect x="670" y="260" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="775" y="298" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">New Run History</text><rect x="350" y="360" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="455" y="387" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Continue Or</text><text x="455" y="409" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Recover</text></svg>
