ource</text><text x="135" y="294" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Version</text><rect x="350" y="245" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="455" y="272" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Read Scoped</text><text x="455" y="294" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Evidence</text><rect x="670" y="130" width="210" height="66" rx="11" fill="#f1f3f5" stroke="#9caab4" /><text x="775" y="168" text-anchor="middle" fill="#3a4c59" font-size="16" font-weight="550">Missing Sources</text><rect x="670" y="245" width="210" height="66" rx="11" fill="#f1f3f5" stroke="#9caab4" /><text x="775" y="272" text-anchor="middle" fill="#3a4c59" font-size="16" font-weight="550">Record Evidence</text><text x="775" y="294" text-anchor="middle" fill="#3a4c59" font-size="16" font-weight="550">Gap</text><rect x="670" y="370" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="775" y="397" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Approved</text><text x="775" y="419" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Portfolio Facts</text><rect x="350" y="370" width="210" height="66" rx="11" fill="#fff4e5" stroke="#cf994e" /><text x="455" y="397" text-anchor="middle" fill="#654815" font-size="16" font-weight="550">Explain Or Read</text><text x="455" y="419" text-anchor="middle" fill="#654815" font-size="16" font-weight="550">More</text></svg>
