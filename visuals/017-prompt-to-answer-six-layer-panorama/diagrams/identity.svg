<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 425" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" role="img" aria-labelledby="identity-title identity-desc"><title id="identity-title">入口分支：重发、新问题与正文冲突</title><desc id="identity-desc">消息身份把一次发送与实际运行关联起来。同一身份的重发查找原运行；正文冲突则拒绝，不覆盖已发生的执行。</desc><defs><marker id="arrow-identity" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#83949f"/></marker></defs><path d="M455,86 V108 H455 V127" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-identity)"/><path d="M455,196 V220.5 H135 V242" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-identity)"/><path d="M455,196 V220.5 H455 V242" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-identity)"/><path d="M455,196 V220.5 H775 V242" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-identity)"/><path d="M135,311 V330.5 H135 V347" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-identity)"/><path d="M455,311 V330.5 H455 V347" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-identity)"/><path d="M775,311 V330.5 H775 V347" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-identity)"/><rect x="350" y="20" width="210" height="66" rx="11" fill="#f1ecfa" stroke="#ab95c7" /><text x="455" y="58" text-anchor="middle" fill="#4a3764" font-size="16" font-weight="550">User Message</text><rect x="350" y="130" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="455" y="157" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Validate Message</text><text x="455" y="179" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Id</text><rect x="30" y="245" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="135" y="283" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">New Message Id</text><rect x="350" y="245" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="455" y="283" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Same Message</text><rect x="670" y="245" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="775" y="272" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Conflicting</text><text x="775" y="294" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Payload</text><rect x="30" y="350" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="135" y="388" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Start New Run</text><rect x="350" y="350" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="455" y="388" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Resume Or Replay</text><rect x="670" y="350" width="210" height="66" rx="11" fill="#f1f3f5" stroke="#9caab4" /><text x="775" y="388" text-anchor="middle" fill="#3a4c59" font-size="16" font-weight="550">Reject Conflict</text></svg>
