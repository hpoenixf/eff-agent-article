<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" role="img" aria-labelledby="evaluation-title evaluation-desc"><title id="evaluation-title">质量回看：从原问题和实际交付出发</title><desc id="evaluation-desc">评估使用固定任务和明确评审对象。通过、失败和未知都保留；修复先回到失真模块，避免把所有问题都变成新增提示。</desc><defs><marker id="arrow-evaluation" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#83949f"/></marker></defs><path d="M135,86 V115.5 H455 V142" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-evaluation)"/><path d="M775,86 V115.5 H455 V142" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-evaluation)"/><path d="M455,211 V235.5 H135 V257" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-evaluation)"/><path d="M455,211 V235.5 H455 V257" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-evaluation)"/><path d="M455,211 V235.5 H775 V257" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-evaluation)"/><path d="M455,326 V343 H455 V357" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-evaluation)"/><rect x="30" y="20" width="210" height="66" rx="11" fill="#f1ecfa" stroke="#ab95c7" /><text x="135" y="58" text-anchor="middle" fill="#4a3764" font-size="16" font-weight="550">Fixed Task</text><rect x="670" y="20" width="210" height="66" rx="11" fill="#e8f4ef" stroke="#7daa97" /><text x="775" y="47" text-anchor="middle" fill="#244d3d" font-size="16" font-weight="550">Published</text><text x="775" y="69" text-anchor="middle" fill="#244d3d" font-size="16" font-weight="550">Evidence</text><rect x="350" y="145" width="210" height="66" rx="11" fill="#f1f3f5" stroke="#9caab4" /><text x="455" y="183" text-anchor="middle" fill="#3a4c59" font-size="16" font-weight="550">Semantic Review</text><rect x="30" y="260" width="210" height="66" rx="11" fill="#e8f4ef" stroke="#7daa97" /><text x="135" y="298" text-anchor="middle" fill="#244d3d" font-size="16" font-weight="550">Supported Outcome</text><rect x="350" y="260" width="210" height="66" rx="11" fill="#f1f3f5" stroke="#9caab4" /><text x="455" y="298" text-anchor="middle" fill="#3a4c59" font-size="16" font-weight="550">Failed Cases</text><rect x="670" y="260" width="210" height="66" rx="11" fill="#f1f3f5" stroke="#9caab4" /><text x="775" y="298" text-anchor="middle" fill="#3a4c59" font-size="16" font-weight="550">Unreviewed Cases</text><rect x="350" y="360" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="455" y="387" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Fix Responsible</text><text x="455" y="409" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Module</text></svg>
