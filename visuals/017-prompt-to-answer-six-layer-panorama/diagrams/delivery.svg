<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 545" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" role="img" aria-labelledby="delivery-title delivery-desc"><title id="delivery-title">交付分叉：可见正文与后台保存有各自时点</title><desc id="delivery-desc">这是正文已允许展示后的关系。浏览器收到内容与后台保存可以在不同时间结算，需要按同一正文身份核对，不能相互冒充成功。</desc><defs><marker id="arrow-delivery" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#83949f"/></marker></defs><path d="M455,86 V108 H455 V127" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-delivery)"/><path d="M455,196 V220.5 H455 V242" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-delivery)"/><path d="M455,311 V330.5 H135 V347" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-delivery)"/><path d="M135,416 V435.5 H135 V452" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-delivery)"/><path d="M455,311 V330.5 H775 V347" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-delivery)"/><path d="M775,416 V435.5 H775 V452" fill="none" stroke="#83949f" stroke-width="1.8" marker-end="url(#arrow-delivery)"/><rect x="350" y="20" width="210" height="66" rx="11" fill="#fff4e5" stroke="#cf994e" /><text x="455" y="58" text-anchor="middle" fill="#654815" font-size="16" font-weight="550">Model Answer</text><rect x="350" y="130" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="455" y="157" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Publication</text><text x="455" y="179" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Pipeline</text><rect x="350" y="245" width="210" height="66" rx="11" fill="#e8f4ef" stroke="#7daa97" /><text x="455" y="283" text-anchor="middle" fill="#244d3d" font-size="16" font-weight="550">Approved Text</text><rect x="30" y="350" width="210" height="66" rx="11" fill="#e8f4ef" stroke="#7daa97" /><text x="135" y="388" text-anchor="middle" fill="#244d3d" font-size="16" font-weight="550">Server Events</text><rect x="30" y="455" width="210" height="66" rx="11" fill="#e8f4ef" stroke="#7daa97" /><text x="135" y="493" text-anchor="middle" fill="#244d3d" font-size="16" font-weight="550">Client Renders</text><rect x="670" y="350" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="775" y="388" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Persist Answer</text><rect x="670" y="455" width="210" height="66" rx="11" fill="#edf4fc" stroke="#81a8ce" /><text x="775" y="482" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">Receipt And</text><text x="775" y="504" text-anchor="middle" fill="#143a5c" font-size="16" font-weight="550">History</text></svg>
