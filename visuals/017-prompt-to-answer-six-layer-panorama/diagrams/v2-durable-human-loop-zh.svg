<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Inter,Arial,sans-serif}.heading{font-size:28px;font-weight:770;fill:#163944}.intro{font-size:16px;fill:#687E8A}.eyebrow{font-size:13px;font-weight:800;letter-spacing:1.2px;fill:#168e87}.meta{font-size:12px;font-weight:790;letter-spacing:.4px;fill:#54858b}.title{font-size:20px;font-weight:740;fill:#23424a}.titleSmall{font-size:18px;font-weight:740;fill:#23424a}.sub{font-size:15px;fill:#66828d}.group{font-size:23px;font-weight:760;fill:#1f4e54}.groupSub{font-size:15px;fill:#62818c}.footerHead{font-size:20px;font-weight:750;fill:#21424d}.footerSub{font-size:15px;fill:#617D88}</style>
</defs>
