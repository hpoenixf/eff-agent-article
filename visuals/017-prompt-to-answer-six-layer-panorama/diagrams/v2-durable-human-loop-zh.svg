<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 930" width="1480" height="930" role="img" aria-labelledby="hil-title hil-desc">
<title id="hil-title">Human-in-the-Loop：提问后，原研究仍能继续</title><desc id="hil-desc">每个回复都指向原请求。收到、保存、真正采用、后续效果分别留下事实。</desc>
