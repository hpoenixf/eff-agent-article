<text x="78" y="55" class="eyebrow" >DURABLE HUMAN INTERACTION · 有身份的人工交接</text>
<text x="78" y="98" class="heading" >Human-in-the-Loop：提问后，原研究仍能继续</text>
<text x="78" y="129" class="intro" >每个回复都指向原请求。收到、保存、真正采用、后续效果分别留下事实。</text><rect x="78" y="171" width="295" height="126" rx="11" fill="#FFFFFF" stroke="#D3E2E6" stroke-width="1.5"/><rect x="78" y="191" width="5" height="86" rx="2" fill="#168e87"/><text x="98" y="198" class="meta" >01 · 模型提议</text><text x="98" y="238" class="titleSmall" >向用户提出问题</text><text x="98" y="263" class="sub" >同一 Main 的 ask_user</text><rect x="421" y="171" width="295" height="126" rx="11" fill="#FFFFFF" stroke="#D3E2E6" stroke-width="1.5"/><rect x="421" y="191" width="5" height="86" rx="2" fill="#168e87"/><text x="441" y="198" class="meta" >02 · HIO 接纳</text><text x="441" y="238" class="titleSmall" >保存问题身份</text><text x="441" y="263" class="sub" >Run / Action / 请求版本</text><rect x="764" y="171" width="295" height="126" rx="11" fill="#FFFFFF" stroke="#D3E2E6" stroke-width="1.5"/><rect x="764" y="191" width="5" height="86" rx="2" fill="#668aa9"/><text x="784" y="198" class="meta" >03 · 待办可发现</text><text x="784" y="238" class="titleSmall" >跨会话显示问题</text><text x="784" y="263" class="sub" >只读查看原请求</text><rect x="1107" y="171" width="295" height="126" rx="11" fill="#FFFFFF" stroke="#D3E2E6" stroke-width="1.5"/><rect x="1107" y="191" width="5" height="86" rx="2" fill="#668aa9"/><text x="1127" y="198" class="meta" >04 · 用户回复</text><text x="1127" y="238" class="titleSmall" >持久保存原文</text><text x="1127" y="263" class="sub" >认证 · 幂等 · 冲突校验</text><path d="M373 234 H421" fill="none" stroke="#5c7c8b" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/><path d="M716 234 H764" fill="none" stroke="#5c7c8b" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/><path d="M1059 234 H1107" fill="none" stroke="#5c7c8b" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/><path d="M1254 297 V342 H405 V404" fill="none" stroke="#5c7c8b" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/><path d="M1254 342 H1087 V404" fill="none" stroke="#5c7c8b" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="73" y="402" width="663" height="378" rx="16" fill="#EAF5F2" stroke="#C2DDD4" stroke-width="1.5"/><rect x="754" y="402" width="652" height="378" rx="16" fill="#EFF5FA" stroke="#CBDDEB" stroke-width="1.5"/><rect x="73" y="402" width="663" height="7" rx="3" fill="#199B8D" stroke="#199B8D" stroke-width="1.5"/><rect x="754" y="402" width="652" height="7" rx="3" fill="#688BAC" stroke="#688BAC" stroke-width="1.5"/><text x="105" y="448" class="group" >原 Run 仍未结束</text><text x="105" y="476" class="groupSub" >回复交还原 Correction 或 Recovery，独立研究不中断</text><text x="786" y="448" class="group" >原 Run 已终结</text><text x="786" y="476" class="groupSub" >迟到回复保存原交互关系，不能自动重启</text><rect x="99" y="510" width="284" height="108" rx="11" fill="#FFFFFF" stroke="#D3E2E6" stroke-width="1.5"/><rect x="99" y="530" width="5" height="68" rx="2" fill="#168e87"/><text x="119" y="537" class="meta" >默认非阻塞</text><text x="119" y="577" class="titleSmall" >继续可做的研究</text><text x="119" y="602" class="sub" >可交付独立成果</text><rect x="413" y="510" width="284" height="108" rx="11" fill="#FFFFFF" stroke="#D3E2E6" stroke-width="1.5"/><rect x="413" y="530" width="5" height="68" rx="2" fill="#168e87"/><text x="433" y="537" class="meta" >真实采用</text><text x="433" y="577" class="titleSmall" >Correction 安全点</text><text x="433" y="602" class="sub" >进入下一轮模型</text><path d="M383 570 H413" fill="none" stroke="#168e87" stroke-width="3.2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrowTeal)"/><rect x="99" y="645" width="284" height="108" rx="11" fill="#FFFFFF" stroke="#D3E2E6" stroke-width="1.5"/><rect x="99" y="665" width="5" height="68" rx="2" fill="#448e8c"/><text x="119" y="672" class="meta" >需要等待时</text><text x="119" y="712" class="titleSmall" >Human Park 停放</text><text x="119" y="737" class="sub" >同一个非终态 Run</text><rect x="413" y="645" width="284" height="108" rx="11" fill="#FFFFFF" stroke="#D3E2E6" stroke-width="1.5"/><rect x="413" y="665" width="5" height="68" rx="2" fill="#448e8c"/><text x="433" y="672" class="meta" >唤醒继续</text><text x="433" y="712" class="titleSmall" >Recovery / Wake</text><text x="433" y="737" class="sub" >原 Run 重新准入</text><path d="M383 705 H413" fill="none" stroke="#168e87" stroke-width="3.2" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrowTeal)"/><rect x="782" y="510" width="270" height="108" rx="11" fill="#FFFFFF" stroke="#D3E2E6" stroke-width="1.5"/><rect x="782" y="530" width="5" height="68" rx="2" fill="#6585a3"/><text x="802" y="537" class="meta" >迟到答复</text><text x="802" y="577" class="titleSmall" >保留原始回答</text><text x="802" y="602" class="sub" >不隐式恢复旧 Run</text><rect x="1082" y="510" width="285" height="108" rx="11" fill="#FFFFFF" stroke="#D3E2E6" stroke-width="1.5"/><rect x="1082" y="530" width="5" height="68" rx="2" fill="#B28B58"/><text x="1102" y="537" class="meta" >用户显式决定</text><text x="1102" y="577" class="titleSmall" >继续分析？</text><text x="1102" y="602" class="sub" >由用户确认</text><path d="M1052 570 H1082" fill="none" stroke="#5c7c8b" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="1082" y="645" width="285" height="108" rx="11" fill="#FFFFFF" stroke="#D3E2E6" stroke-width="1.5"/><rect x="1082" y="665" width="5" height="68" rx="2" fill="#B28B58"/><text x="1102" y="672" class="meta" >建立新运行</text><text x="1102" y="712" class="titleSmall" >Continue 新 Run</text><text x="1102" y="737" class="sub" >关联原父任务</text><path d="M1225 618 V645" fill="none" stroke="#5c7c8b" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="74" y="808" width="1332" height="98" rx="12" fill="#FFFFFF" stroke="#D5E3E7" stroke-width="1.5"/><text x="106" y="850" class="footerHead" >请求被接纳 ≠ 回复已保存 ≠ Main 已采用 ≠ 业务效果已经结算</text><text x="106" y="884" class="footerSub" >HIO 负责交互；授权归 Authorization，最终业务效果归原 Effect / Publication。</text></svg>