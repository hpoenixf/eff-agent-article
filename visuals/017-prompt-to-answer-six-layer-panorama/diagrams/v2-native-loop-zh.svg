<text x="82" y="80" class="main-title" >从一次提问到持续研究：六层系统如何协作</text>
<text x="82" y="111" class="sub-title" >核心是同一 Run 中不断重复的「决策 → 执行 → 结果回灌」，而不是单向流水线。</text>
