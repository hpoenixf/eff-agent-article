<svg xmlns="http://www.w3.org/2000/svg" width="480" height="465" viewBox="0 0 480 465" role="img" aria-labelledby="title desc"><title id="title">去重锁不能耗尽研究连接</title><desc id="desc">长时间生成持锁不能占满研究查询和发布所需的连接。持锁使用独立且有限的连接池，普通查询沿原池执行；丢锁后不得让晚到结果提交。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC",Arial,sans-serif;fill:#17324d}.title{font-size:27px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.muted{fill:#475569}.warn{fill:#9a3412}</style><rect width="480" height="465" rx="18" fill="#f8fafc"/><text x="24" y="43" class="title">去重锁不能耗尽研究连接</text><text x="24" y="77" class="small">拆开资源容量，不宣称通用恰好一次</text><rect x="24" y="101" width="432" height="91" rx="12" fill="#fff6ec" stroke="#e2ba8b"/><text x="43" y="138" class="label">单一池：长时持锁占满连接</text><text x="43" y="172" class="small">研究随后要查询，却拿不到连接</text><path d="M240 200V231" class="line"/><rect x="24" y="245" width="204" height="119" rx="12" fill="#eaf4ff" stroke="#8cb9df"/><rect x="252" y="245" width="204" height="119" rx="12" fill="#eaf7f2" stroke="#8ccbb6"/><text x="126" y="283" class="label" text-anchor="middle">独立持锁池</text><text x="126" y="318" class="body" text-anchor="middle">有限容量</text><text x="126" y="347" class="small" text-anchor="middle">有限等待</text><text x="354" y="283" class="label" text-anchor="middle">普通查询池</text><text x="354" y="318" class="body" text-anchor="middle">读取与发布</text><text x="354" y="347" class="small" text-anchor="middle">保留工作通路</text><text x="24" y="410" class="body">失去锁资格后，晚到结果不得提交</text><text x="24" y="444" class="small">去重仍有成本，需保留取消与结算</text></svg>
