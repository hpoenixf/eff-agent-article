<svg xmlns="http://www.w3.org/2000/svg" width="640" height="742" viewBox="0 0 640 742" role="img" aria-labelledby="title desc">
<title id="title">暴露判断取决于比较基准</title>
<desc id="desc">教学假设：外部新增10万元。原组合总额100万元、X暴露40万元，占40%；新资金留现金后总额110万元、X暴露40万元，占36.36%；买入X权重25%的基金A后，总额110万元、X暴露42.5万元，占38.64%。条形采用同一金额尺度。假设持仓权重不变，净值与币种口径相同，忽略费用和价格变化，现金不产生X的直接持仓暴露。</desc>
<defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#0b7472"/></marker><marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#8a5115"/></marker></defs>
<g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif">
<rect x="0" y="0" width="640" height="742" rx="24" fill="#f6f8f7"/>
<text x="28" y="42" font-size="26" fill="#0b7472" font-weight="700" text-anchor="start">教学情景 · 组合外新增 10 万元</text>
<text x="28" y="85" font-size="34" fill="#183847" font-weight="700" text-anchor="start">同一笔买入，要看和谁比较</text>
<rect x="30" y="112" width="18" height="18" rx="4" fill="#0b7472"/>
<text x="58" y="129" font-size="26" fill="#183847" font-weight="400" text-anchor="start">X 暴露</text>
<rect x="273" y="112" width="18" height="18" rx="4" fill="#d8e3e5"/>
<text x="301" y="129" font-size="26" fill="#4d6672" font-weight="400" text-anchor="start">其他资产</text>
<text x="28" y="165" font-size="24" fill="#4d6672" font-weight="400" text-anchor="start">条形长度按金额绘制，三行使用同一尺度</text>
<text x="28" y="222" font-size="27" fill="#183847" font-weight="700" text-anchor="start">原组合</text>
<text x="612" y="222" font-size="32" fill="#0b7472" font-weight="700" text-anchor="end">40.00%</text>
<rect x="28" y="240" width="527.2727272727273" height="29" rx="5" fill="#d8e3e5"/>
<rect x="28" y="240" width="210.9090909090909" height="29" rx="5" fill="#0b7472"/>
<text x="28" y="301" font-size="26" fill="#4d6672" font-weight="400" text-anchor="start">X 40 万元 / 总额 100 万元</text>
<text x="28" y="342" font-size="27" fill="#183847" font-weight="700" text-anchor="start">新增资金留现金</text>
<text x="612" y="342" font-size="32" fill="#0b7472" font-weight="700" text-anchor="end">36.36%</text>
<rect x="28" y="360" width="580.0" height="29" rx="5" fill="#d8e3e5"/>
<rect x="28" y="360" width="210.9090909090909" height="29" rx="5" fill="#0b7472"/>
<text x="28" y="421" font-size="26" fill="#4d6672" font-weight="400" text-anchor="start">X 40 万元 / 总额 110 万元</text>
<text x="28" y="462" font-size="27" fill="#183847" font-weight="700" text-anchor="start">新增资金买入 A</text>
<text x="612" y="462" font-size="32" fill="#0b7472" font-weight="700" text-anchor="end">38.64%</text>
<rect x="28" y="480" width="580.0" height="29" rx="5" fill="#d8e3e5"/>
<rect x="28" y="480" width="224.0909090909091" height="29" rx="5" fill="#0b7472"/>
<text x="28" y="541" font-size="26" fill="#4d6672" font-weight="400" text-anchor="start">X 42.5 万元 / 总额 110 万元</text>
<rect x="24" y="571" width="592" height="115" rx="16" fill="#e7f3ef"/>
<text x="42" y="608" font-size="28" fill="#0b7472" font-weight="700" text-anchor="start">比原组合占比低，比留现金占比高</text>
<text x="42" y="650" font-size="27" fill="#183847" font-weight="700" text-anchor="start">X 暴露金额仍增加：40 → 42.5 万元</text>
<text x="28" y="720" font-size="25" fill="#4d6672" font-weight="400" text-anchor="start">只比较 X 暴露，不能据此判断组合总风险</text>
</g>
</svg>
