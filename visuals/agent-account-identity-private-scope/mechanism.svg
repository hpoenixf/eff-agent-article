<svg xmlns="http://www.w3.org/2000/svg" width="480" height="453" viewBox="0 0 480 453" role="img" aria-labelledby="title desc"><title id="title">当前访问与原研究，分别授权</title><desc id="desc">新的访问请求检查当前会话及对象归属或分享；已准入研究使用原授权记录，仍受资源与取消约束。退出登录不等于取消任务。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC",Arial,sans-serif;fill:#17324d}.title{font-size:27px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.muted{fill:#475569}.warn{fill:#9a3412}</style><rect width="480" height="453" rx="18" fill="#f8fafc"/><text x="24" y="43" class="title">当前访问与原研究，分别授权</text><text x="24" y="78" class="small">同一个用户，不代表同一个生命周期</text><rect x="24" y="103" width="432" height="123" rx="12" fill="#eaf4ff" stroke="#8cb9df"/><text x="43" y="139" class="label">新的读取或下载请求</text><text x="43" y="177" class="body">检查当前会话与目标资源归属</text><text x="43" y="207" class="small">或检查适用的指定接收者分享</text><rect x="24" y="248" width="432" height="123" rx="12" fill="#eaf7f2" stroke="#8ccbb6"/><text x="43" y="285" class="label">已经准入的原研究</text><text x="43" y="322" class="body">沿原授权范围，遵守执行约束</text><text x="43" y="352" class="small">不能把原权限借给另一项研究</text><text x="240" y="417" class="label" text-anchor="middle">退出登录 ≠ 取消后台研究</text></svg>
