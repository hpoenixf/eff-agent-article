<svg xmlns="http://www.w3.org/2000/svg" width="600" height="585" viewBox="0 0 600 585" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">同一模型回合，两次请求尝试</title><desc id="desc">M2的A2.1在有效输出前失败，满足重试条件后A2.2获得输出。整个教学例子为三个逻辑回合、四次模型请求。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#7B919B" stroke-width="1.7"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Noto Sans",Arial,sans-serif;fill:#173044}</style>
<rect width="600" height="585" rx="20" fill="#F4F5F2"/>
<text x="28" y="39" font-size="21" font-weight="500" text-anchor="start" style="fill:#536573">03 / 逻辑决策与实际发送</text>
<text x="28" y="84" font-size="32" font-weight="700" text-anchor="start" style="fill:#173044">决策仍属于 M2</text>
<text x="28" y="127" font-size="32" font-weight="700" text-anchor="start" style="fill:#173044">每次发送分别留痕</text>
<rect x="24" y="155" width="552" height="67" rx="14" fill="#ECF2FC" stroke="#D4DFE3"/>
<text x="44" y="198" font-size="27" font-weight="600" text-anchor="start" style="fill:#245CA6">M2 · 判断还需要补读什么</text>
<rect x="24" y="244" width="552" height="91" rx="14" fill="#FFF1DC" stroke="#D4DFE3"/>
<text x="44" y="280" font-size="27" font-weight="600" text-anchor="start" style="fill:#87531C">A2.1 · 本次请求失败</text>
<text x="44" y="314" font-size="25" font-weight="400" text-anchor="start" style="fill:#87531C">尚未取得有效输出</text>
<path d="M64,345 L64,404" fill="none" stroke="#7B919B" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="98" y="374" font-size="24" font-weight="400" text-anchor="start" style="fill:#536573">满足重试条件，且仍有预算</text>
<rect x="24" y="418" width="552" height="91" rx="14" fill="#E5F3EE" stroke="#D4DFE3"/>
<text x="44" y="454" font-size="27" font-weight="600" text-anchor="start" style="fill:#076F63">A2.2 · 获得本轮输出</text>
<text x="44" y="488" font-size="25" font-weight="400" text-anchor="start" style="fill:#076F63">前一次失败记录仍然保留</text>
<text x="28" y="558" font-size="25" font-weight="600" text-anchor="start" style="fill:#173044">整个示例：3 个回合 / 4 次请求</text>
</svg>
