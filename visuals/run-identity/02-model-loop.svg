<svg xmlns="http://www.w3.org/2000/svg" width="600" height="752" viewBox="0 0 600 752" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">一次 Run 内的三个模型回合</title><desc id="desc">M1提出读取X1与X2，结果进入M2。M2提出补读X3，M3收到结果后生成回答。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#7B919B" stroke-width="1.7"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Noto Sans",Arial,sans-serif;fill:#173044}</style>
<rect width="600" height="752" rx="20" fill="#F4F5F2"/>
<text x="28" y="39" font-size="21" font-weight="500" text-anchor="start" style="fill:#536573">02 / 把第一次研究放大</text>
<text x="28" y="84" font-size="32" font-weight="700" text-anchor="start" style="fill:#173044">同一次研究</text>
<text x="28" y="127" font-size="32" font-weight="700" text-anchor="start" style="fill:#173044">通过新的观察向前推进</text>
<rect x="24" y="156" width="552" height="123" rx="14" fill="#ECF2FC" stroke="#D4DFE3"/>
<text x="44" y="196" font-size="29" font-weight="700" text-anchor="start" style="fill:#245CA6">M1</text>
<text x="118" y="198" font-size="26" font-weight="400" text-anchor="start" style="fill:#173044">提出 X1、X2</text>
<text x="118" y="237" font-size="26" font-weight="400" text-anchor="start" style="fill:#173044">读取 A、B 的资料</text>
<rect x="24" y="366" width="552" height="123" rx="14" fill="#ECF2FC" stroke="#D4DFE3"/>
<text x="44" y="406" font-size="29" font-weight="700" text-anchor="start" style="fill:#245CA6">M2</text>
<text x="118" y="408" font-size="26" font-weight="400" text-anchor="start" style="fill:#173044">提出 X3</text>
<text x="118" y="447" font-size="26" font-weight="400" text-anchor="start" style="fill:#173044">补读费用公告原文</text>
<rect x="24" y="576" width="552" height="123" rx="14" fill="#ECF2FC" stroke="#D4DFE3"/>
<text x="44" y="616" font-size="29" font-weight="700" text-anchor="start" style="fill:#245CA6">M3</text>
<text x="118" y="618" font-size="26" font-weight="400" text-anchor="start" style="fill:#173044">综合已经取得的资料</text>
<text x="118" y="657" font-size="26" font-weight="400" text-anchor="start" style="fill:#173044">形成比较回答</text>
<path d="M66,288 L66,348" fill="none" stroke="#7B919B" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="98" y="327" font-size="24" font-weight="500" text-anchor="start" style="fill:#076F63">X1、X2 的结果 → 后续输入</text>
<path d="M66,498 L66,558" fill="none" stroke="#7B919B" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="98" y="537" font-size="24" font-weight="500" text-anchor="start" style="fill:#076F63">X3 的结果 → 后续输入</text>
<text x="28" y="731" font-size="25" font-weight="600" text-anchor="start" style="fill:#076F63">3 个模型回合 · 3 个工具动作</text>
