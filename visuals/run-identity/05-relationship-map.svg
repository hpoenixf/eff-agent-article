<svg xmlns="http://www.w3.org/2000/svg" width="600" height="704" viewBox="0 0 600 704" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">执行身份与支撑职责的关系地图</title><desc id="desc">对话与任务关联工作，Run组织模型回合、请求尝试和工具动作。具有执行存储职责的Session保存状态，Worker推进执行，Schedule提供未来触发。不是固定层级或必建模块。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#7B919B" stroke-width="1.7"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Noto Sans",Arial,sans-serif;fill:#173044}</style>
<rect width="600" height="704" rx="20" fill="#F4F5F2"/>
<text x="28" y="39" font-size="21" font-weight="500" text-anchor="start" style="fill:#536573">05 / 关系地图，而不是层级树</text>
<text x="28" y="84" font-size="32" font-weight="700" text-anchor="start" style="fill:#173044">执行粒度是一条线</text>
<text x="28" y="127" font-size="32" font-weight="700" text-anchor="start" style="fill:#173044">状态、进程、时间是不同职责</text>
<rect x="24" y="153" width="268" height="70" rx="14" fill="white" stroke="#D4DFE3"/>
<rect x="308" y="153" width="268" height="70" rx="14" fill="white" stroke="#D4DFE3"/>
<text x="158" y="196" font-size="24" font-weight="600" text-anchor="middle" style="fill:#173044">对话 Conversation</text>
<text x="442" y="196" font-size="25" font-weight="600" text-anchor="middle" style="fill:#173044">任务 Task</text>
<path d="M158,233 L158,267" fill="none" stroke="#7B919B" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M442,233 L442,267" fill="none" stroke="#7B919B" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="24" y="279" width="552" height="182" rx="18" fill="#ECF2FC" stroke="#D4DFE3"/>
<text x="44" y="319" font-size="29" font-weight="700" text-anchor="start" style="fill:#245CA6">Run · 一次获准执行</text>
<text x="44" y="363" font-size="26" font-weight="400" text-anchor="start" style="fill:#173044">模型回合：M1 → M2 → M3</text>
<text x="44" y="402" font-size="24" font-weight="400" text-anchor="start" style="fill:#173044">请求尝试取得本轮输出</text>
<text x="44" y="439" font-size="24" font-weight="400" text-anchor="start" style="fill:#173044">工具动作的结果进入后续回合</text>
<path d="M114,516 L114,474" fill="none" stroke="#7B919B" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M300,516 L300,474" fill="none" stroke="#7B919B" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M486,516 L486,474" fill="none" stroke="#7B919B" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="24" y="529" width="180" height="103" rx="14" fill="#E5F3EE" stroke="#D4DFE3"/>
<text x="114" y="569" font-size="25" font-weight="700" text-anchor="middle" style="fill:#076F63">Session</text>
<text x="114" y="610" font-size="21" font-weight="500" text-anchor="middle" style="fill:#173044">保存状态</text>
<rect x="210" y="529" width="180" height="103" rx="14" fill="#E5F3EE" stroke="#D4DFE3"/>
<text x="300" y="569" font-size="25" font-weight="700" text-anchor="middle" style="fill:#076F63">Worker</text>
<text x="300" y="610" font-size="21" font-weight="500" text-anchor="middle" style="fill:#173044">推进执行</text>
<rect x="396" y="529" width="180" height="103" rx="14" fill="#FFF1DC" stroke="#D4DFE3"/>
<text x="486" y="569" font-size="25" font-weight="700" text-anchor="middle" style="fill:#87531C">Schedule</text>
<text x="486" y="610" font-size="21" font-weight="500" text-anchor="middle" style="fill:#173044">未来触发</text>
<text x="28" y="668" font-size="24" font-weight="400" text-anchor="start" style="fill:#536573">名字可能不同，要看它实际负责什么。</text>
</svg>
