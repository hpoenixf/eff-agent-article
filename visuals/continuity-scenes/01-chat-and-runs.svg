<svg xmlns="http://www.w3.org/2000/svg" width="600" height="878" viewBox="0 0 600 878" role="img" aria-labelledby="title desc">
<title id="title">同一个对话，三个已完成的 Run</title><desc id="desc">通用聊天产品教学示意。用户在同一对话中围绕同一个基金比较目标连续发起三次请求。每次都在上一轮完成后提出，分别形成 Run 1、Run 2、Run 3。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#738691" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-feature-settings:"palt";fill:#172D3F} .muted{fill:#516475}</style>
<rect width="600" height="878" rx="22" fill="#F5F5F1"/>
<text x="28" y="38" font-size="18" style="fill:#516475" font-weight="500" text-anchor="start">场景 01 · 回答已经完成，再追问</text>
<text x="28" y="84" font-size="31" style="fill:#172D3F" font-weight="700" text-anchor="start">同一个聊天窗口</text>
<text x="28" y="126" font-size="31" style="fill:#172D3F" font-weight="700" text-anchor="start">可以经历多个 Run</text>
<rect x="24" y="151" width="552" height="614" rx="20" fill="white" stroke="#D7E0E4" stroke-width="1"/>
<circle cx="57" cy="183" r="15" fill="#E5F3EE"/>
<text x="57" y="190" font-size="17" style="fill:#086C63" font-weight="700" text-anchor="middle">研</text>
<text x="83" y="191" font-size="24" style="fill:#172D3F" font-weight="600" text-anchor="start">基金比较 · 对话 C1</text>
<line x1="24" y1="211" x2="576" y2="211" stroke="#D7E0E4" stroke-width="1"/>
<rect x="40" y="227" width="520" height="49" rx="10" fill="#E5F3EE" stroke="none" stroke-width="1"/>
<text x="57" y="259" font-size="21" style="fill:#086C63" font-weight="600" text-anchor="start">业务目标 T1：完成基金 A 与 B 的比较</text>
<rect x="40" y="293" width="520" height="139" rx="12" fill="#FBFCFC" stroke="#D7E0E4" stroke-width="1"/>
<rect x="53" y="304" width="89" height="33" rx="16" fill="#EDF2FB" stroke="none" stroke-width="1"/>
<text x="97.5" y="327" font-size="19" style="fill:#3159A0" font-weight="600" text-anchor="middle">Run 1</text>
<text x="540" y="327" font-size="19" style="fill:#086C63" font-weight="600" text-anchor="end">本轮已完成</text>
<rect x="113" y="340" width="430" height="39" rx="11" fill="#EDF2FB" stroke="none" stroke-width="1"/>
<text x="129" y="367" font-size="22" style="fill:#3159A0" font-weight="500" text-anchor="start">你：帮我比较基金 A 和 B</text>
<text x="58" y="409" font-size="21" style="fill:#172D3F" font-weight="400" text-anchor="start">助手：已给出费用、持仓与风险对比。</text>
<rect x="40" y="445" width="520" height="139" rx="12" fill="#FBFCFC" stroke="#D7E0E4" stroke-width="1"/>
<rect x="53" y="456" width="89" height="33" rx="16" fill="#EDF2FB" stroke="none" stroke-width="1"/>
<text x="97.5" y="479" font-size="19" style="fill:#3159A0" font-weight="600" text-anchor="middle">Run 2</text>
<text x="540" y="479" font-size="19" style="fill:#086C63" font-weight="600" text-anchor="end">本轮已完成</text>
<rect x="113" y="492" width="430" height="39" rx="11" fill="#EDF2FB" stroke="none" stroke-width="1"/>
<text x="129" y="519" font-size="22" style="fill:#3159A0" font-weight="500" text-anchor="start">你：费用差异，再解释一下</text>
<text x="58" y="561" font-size="21" style="fill:#172D3F" font-weight="400" text-anchor="start">助手：已补充费用口径与差异说明。</text>
<rect x="40" y="597" width="520" height="139" rx="12" fill="#FBFCFC" stroke="#D7E0E4" stroke-width="1"/>
<rect x="53" y="608" width="89" height="33" rx="16" fill="#EDF2FB" stroke="none" stroke-width="1"/>
<text x="97.5" y="631" font-size="19" style="fill:#3159A0" font-weight="600" text-anchor="middle">Run 3</text>
<text x="540" y="631" font-size="19" style="fill:#086C63" font-weight="600" text-anchor="end">本轮已完成</text>
<rect x="113" y="644" width="430" height="39" rx="11" fill="#EDF2FB" stroke="none" stroke-width="1"/>
<text x="129" y="671" font-size="22" style="fill:#3159A0" font-weight="500" text-anchor="start">你：整理成一页对比表</text>
<text x="58" y="713" font-size="21" style="fill:#172D3F" font-weight="400" text-anchor="start">助手：已把前面的结果整理成表。</text>
<text x="28" y="802" font-size="25" style="fill:#086C63" font-weight="700" text-anchor="start">同一对话 · 同一目标 · 三次独立执行</text>
<text x="28" y="837" font-size="21" style="fill:#516475" font-weight="400" text-anchor="start">前提：每次追问前，上一轮已经结束。</text>
</svg>