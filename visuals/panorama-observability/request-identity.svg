<text x="635.0" y="333.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="26" fill="#193b34">Trace 视图</text>
<text x="390" y="412" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#53645e">同一请求的观察副本，不能计费三次</text>
<line x1="34" y1="467" x2="746" y2="467" stroke="#b8cdc2" stroke-width="2"/>
<text x="34" y="493" dominant-baseline="text-before-edge" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="31" fill="#193b34">费用：先认身份，再算金额</text>
<rect x="34" y="550" width="712" height="78" rx="10" fill="#eef5ef" stroke="#b8cdc2" stroke-width="2"/>
<text x="390.0" y="576.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="26" fill="#193b34">原请求 + 扣减回执 → 去重核对</text>
<text x="54" y="651" dominant-baseline="text-before-edge" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="27" fill="#236352">未知 ≠ 0        价格估算 ≠ 供应商账单</text>
<line x1="34" y1="710" x2="746" y2="710" stroke="#b8cdc2" stroke-width="2"/>
<text x="34" y="735" dominant-baseline="text-before-edge" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="31" fill="#193b34">时间：先确认可比，再相减</text>
<text x="54" y="793" dominant-baseline="text-before-edge" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="27" fill="#53645e">同一时钟域的时间，才可直接相减</text>
<text x="54" y="830" dominant-baseline="text-before-edge" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="27" fill="#53645e">服务端观察 ≠ 浏览器首屏</text>
