<line x1="390" y1="265" x2="635" y2="265" stroke="#236352" stroke-width="3"/>
<line x1="635" y1="265" x2="635" y2="298" stroke="#236352" stroke-width="3"/>
<polygon points="635,298 629.4586498935022,287.3560609266486 640.5413501064978,287.3560609266486" fill="#236352"/>
<rect x="34" y="308" width="222" height="77" rx="10" fill="#eef5ef" stroke="#b8cdc2" stroke-width="2"/>
<text x="145.0" y="333.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="26" fill="#193b34">SDK 用量</text>
<rect x="279" y="308" width="222" height="77" rx="10" fill="#eef5ef" stroke="#b8cdc2" stroke-width="2"/>
