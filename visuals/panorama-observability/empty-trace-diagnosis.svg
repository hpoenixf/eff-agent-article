<line x1="390" y1="260" x2="390" y2="260" stroke="#236352" stroke-width="3"/>
<line x1="390" y1="260" x2="390" y2="290" stroke="#236352" stroke-width="3"/>
<polygon points="390,290 384.4586498935022,279.3560609266486 395.5413501064978,279.3560609266486" fill="#236352"/>
<line x1="390" y1="236" x2="390" y2="260" stroke="#236352" stroke-width="3"/>
<line x1="390" y1="260" x2="635" y2="260" stroke="#236352" stroke-width="3"/>
<line x1="635" y1="260" x2="635" y2="290" stroke="#236352" stroke-width="3"/>
<polygon points="635,290 629.4586498935022,279.3560609266486 640.5413501064978,279.3560609266486" fill="#236352"/>
<rect x="34" y="300" width="222" height="95" rx="10" fill="#eef5ef" stroke="#b8cdc2" stroke-width="2"/>
<text x="145.0" y="317.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#193b34">确认未执行</text>
<text x="145.0" y="352.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#193b34">查执行入口</text>
<rect x="279" y="300" width="222" height="95" rx="10" fill="#eef5ef" stroke="#b8cdc2" stroke-width="2"/>
<text x="390.0" y="317.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#193b34">确认已执行</text>
<text x="390.0" y="352.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#193b34">继续查遥测</text>
<rect x="524" y="300" width="222" height="95" rx="10" fill="#fbf0eb" stroke="#b8cdc2" stroke-width="2"/>
<text x="635.0" y="317.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#193b34">证据不足</text>
<text x="635.0" y="352.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#193b34">保持未知</text>
<line x1="390" y1="395" x2="390" y2="438" stroke="#236352" stroke-width="3"/>
<polygon points="390,438 384.4586498935022,427.3560609266486 395.5413501064978,427.3560609266486" fill="#236352"/>
<rect x="125" y="448" width="530" height="93" rx="10" fill="#eef5ef" stroke="#b8cdc2" stroke-width="2"/>
<text x="390.0" y="481.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="26" fill="#193b34">采集是否开启？是否有容量缺口回执？</text>
<line x1="390" y1="541" x2="390" y2="578" stroke="#236352" stroke-width="3"/>
<polygon points="390,578 384.4586498935022,567.3560609266486 395.5413501064978,567.3560609266486" fill="#236352"/>
<rect x="34" y="588" width="712" height="86" rx="10" fill="#eef5ef" stroke="#b8cdc2" stroke-width="2"/>
<text x="390.0" y="618.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="26" fill="#193b34">按原身份查哪一段有证据，哪一段未知</text>
