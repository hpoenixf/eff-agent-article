<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1030" viewBox="0 0 780 1030" role="img"><title>Trace 为空，执行发生了吗？</title><rect width="780" height="1030" fill="#fafbf8"/>
<text x="34" y="28" dominant-baseline="text-before-edge" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="35" fill="#193b34">Trace 为空 ≠ 没有执行</text>
<text x="34" y="82" dominant-baseline="text-before-edge" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="26" fill="#53645e">教学诊断 · 先查事实，再查遥测</text>
<rect x="34" y="139" width="712" height="97" rx="10" fill="#eef5ef" stroke="#b8cdc2" stroke-width="2"/>
<text x="390.0" y="155.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="27" fill="#193b34">先查原运行、工具和发布记录</text>
<text x="390.0" y="192.5" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="27" fill="#193b34">能否确认原执行？</text>
<line x1="390" y1="236" x2="390" y2="260" stroke="#236352" stroke-width="3"/>
<line x1="390" y1="260" x2="145" y2="260" stroke="#236352" stroke-width="3"/>
