<line x1="390" y1="695" x2="390" y2="719" stroke="#236352" stroke-width="3"/>
<polygon points="390,719 384.4586498935022,708.3560609266486 395.5413501064978,708.3560609266486" fill="#236352"/>
<line x1="390" y1="674" x2="390" y2="695" stroke="#236352" stroke-width="3"/>
<line x1="390" y1="695" x2="654" y2="695" stroke="#236352" stroke-width="3"/>
<line x1="654" y1="695" x2="654" y2="719" stroke="#236352" stroke-width="3"/>
<polygon points="654,719 648.4586498935022,708.3560609266486 659.5413501064978,708.3560609266486" fill="#236352"/>
<rect x="34" y="729" width="184" height="94" rx="10" fill="#eef5ef" stroke="#b8cdc2" stroke-width="2"/>
<text x="126.0" y="746.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#193b34">异步导出</text>
<text x="126.0" y="781.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#193b34">是否发出</text>
<rect x="298" y="729" width="184" height="94" rx="10" fill="#eef5ef" stroke="#b8cdc2" stroke-width="2"/>
<text x="390.0" y="746.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#193b34">接收与处理</text>
<text x="390.0" y="781.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#193b34">到了哪层</text>
<rect x="562" y="729" width="184" height="94" rx="10" fill="#eef5ef" stroke="#b8cdc2" stroke-width="2"/>
<text x="654.0" y="746.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#193b34">精确 ID</text>
<text x="654.0" y="781.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#193b34">能否读回</text>
<text x="34" y="872" dominant-baseline="text-before-edge" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#53645e">SDK 返回 ≠ 接收成功 ≠ 查询可见</text>
<text x="34" y="907" dominant-baseline="text-before-edge" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#53645e">无历史缺口回执：原因仍未知。</text>
<text x="34" y="942" dominant-baseline="text-before-edge" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#53645e">不重跑模型来“补”原执行证据。</text>
</svg>