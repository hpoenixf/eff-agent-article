<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 635" width="1200" height="635" role="img" aria-label="下一次研究动作，要改变哪项判断？"><rect width="1200" height="635" rx="30" fill="#f7f9fc"/><rect x="0" y="0" width="1200" height="10" rx="4" fill="#16846a"/><text x="48" y="73" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="33" fill="#15243b" font-weight="700" text-anchor="start">下一次研究动作，要改变哪项判断？</text><text x="48" y="111" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#536177" font-weight="400" text-anchor="start">查得多不等于充分；已具备依据的部分可以先回答</text><rect x="34" y="158" width="264" height="294" rx="18" fill="white" stroke="#dbe3ed" stroke-width="2"/><circle cx="69" cy="196" r="20" fill="#e6f5ef" /><text x="69" y="203" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#16846a" font-weight="700" text-anchor="middle">1</text><text x="57" y="266" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="26" fill="#17263e" font-weight="700" text-anchor="start">澄清判断</text><path d="M57 291h218" stroke="#d9e2ed" stroke-width="2"/><text x="57" y="338" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#43536a" font-weight="400" text-anchor="start">费率低，不等于值得转换</text><text x="57" y="377" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#43536a" font-weight="400" text-anchor="start">识别决策条件</text><text x="311" y="314" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="33" fill="#16846a" font-weight="700" text-anchor="middle">›</text><rect x="325" y="158" width="264" height="294" rx="18" fill="white" stroke="#dbe3ed" stroke-width="2"/><circle cx="360" cy="196" r="20" fill="#e6f5ef" /><text x="360" y="203" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#16846a" font-weight="700" text-anchor="middle">2</text><text x="348" y="266" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="26" fill="#17263e" font-weight="700" text-anchor="start">定向取证</text><path d="M348 291h218" stroke="#d9e2ed" stroke-width="2"/><text x="348" y="338" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#43536a" font-weight="400" text-anchor="start">查持有期与转换成本</text><text x="348" y="377" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#43536a" font-weight="400" text-anchor="start">只补关键缺口</text><text x="602" y="314" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="33" fill="#16846a" font-weight="700" text-anchor="middle">›</text><rect x="616" y="158" width="264" height="294" rx="18" fill="white" stroke="#dbe3ed" stroke-width="2"/><circle cx="651" cy="196" r="20" fill="#e6f5ef" /><text x="651" y="203" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#16846a" font-weight="700" text-anchor="middle">3</text><text x="639" y="266" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="26" fill="#17263e" font-weight="700" text-anchor="start">核对差异</text><path d="M639 291h218" stroke="#d9e2ed" stroke-width="2"/><text x="639" y="338" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#43536a" font-weight="400" text-anchor="start">统一对象、日期与口径</text><text x="639" y="377" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#43536a" font-weight="400" text-anchor="start">留下未解决冲突</text><text x="893" y="314" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="33" fill="#16846a" font-weight="700" text-anchor="middle">›</text><rect x="907" y="158" width="264" height="294" rx="18" fill="white" stroke="#dbe3ed" stroke-width="2"/><circle cx="942" cy="196" r="20" fill="#e6f5ef" /><text x="942" y="203" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#16846a" font-weight="700" text-anchor="middle">4</text><text x="930" y="266" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="26" fill="#17263e" font-weight="700" text-anchor="start">形成回答</text><path d="M930 291h218" stroke="#d9e2ed" stroke-width="2"/><text x="930" y="338" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#43536a" font-weight="400" text-anchor="start">支持的结论先交付</text><text x="930" y="377" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#43536a" font-weight="400" text-anchor="start">未知条件明确标注</text><rect x="34" y="493" width="1134" height="92" rx="16" fill="#e6f5ef"/><text x="57" y="548" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#16846a" font-weight="600" text-anchor="start">停止条件：不是“找齐所有资料”，而是能否回答具体主张；资源耗尽不等于证据充分</text></svg>
