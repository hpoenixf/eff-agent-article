<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="title desc"><title id="title">算出数字，还要放回用户条件</title><desc id="desc">教学假设：比较基数十万元，年费用节省三百元，一次性转换成本四百元。六个月节省一百五十元，十八个月节省四百五十元；不是投资收益预测。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC",Arial,sans-serif;fill:#17324d}.title{font-size:27px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.muted{fill:#475569}.warn{fill:#9a3412}</style><rect width="480" height="460" rx="18" fill="#f8fafc"/><text x="24" y="43" class="title">算出数字，还要放回用户条件</text><text x="24" y="77" class="small">教学示意，不是实际产品费率</text><rect x="24" y="101" width="432" height="74" rx="12" fill="#eaf4ff" stroke="#8cb9df"/><text x="240" y="133" class="body" text-anchor="middle">CNY 100,000 × (0.60% − 0.30%)</text><text x="240" y="160" class="body" text-anchor="middle">每年理论节省 300 元</text><rect x="24" y="199" width="204" height="132" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="126" y="232" class="label" text-anchor="middle">持有 6 个月</text><text x="126" y="269" class="body" text-anchor="middle">节省 150 元</text><text x="126" y="308" class="small" text-anchor="middle">净费用差 −250 元</text><rect x="252" y="199" width="204" height="132" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="354" y="232" class="label" text-anchor="middle">持有 18 个月</text><text x="354" y="269" class="body" text-anchor="middle">节省 450 元</text><text x="354" y="308" class="small" text-anchor="middle">净费用差 +50 元</text><text x="240" y="368" class="label" text-anchor="middle">共同扣除：一次性成本 400 元</text><text x="24" y="409" class="body">持有期限改变费用比较的结论</text><text x="24" y="440" class="small">简化费用差，不等于投资收益</text></svg>
