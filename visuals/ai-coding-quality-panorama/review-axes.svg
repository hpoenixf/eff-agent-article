<svg xmlns="http://www.w3.org/2000/svg" width="720" height="845" viewBox="0 0 720 845" role="img" aria-labelledby="review-axes-zh-title review-axes-zh-desc" xml:lang="zh">
  <title id="review-axes-zh-title">审查的两个判断面</title>
  <desc id="review-axes-zh-desc">两轴审查示意。横向判断需求承诺是否满足，纵向判断工程质量能否支持后续修改。结构清楚但需求未满足，需要修正功能；功能满足但重要工程问题妨碍后续修改，需要修正工程问题；两面都有问题则分别修正。两者都成立，可以进入交付验证，仍不能据此自动接受。</desc>
  <defs>
    <marker id="review-axes-zh-arrow" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#237D78"/></marker>
    <style>text{font-family:'Noto Sans CJK SC','Noto Sans SC',Arial,sans-serif}</style>
  </defs>
  <rect width="720" height="845" rx="24" fill="#F4F7FA"/>
<text x="40" y="61" font-size="36" font-weight="700" fill="#183249"><tspan x="40" dy="0">审查的两个判断面</tspan></text><text x="40" y="106" font-size="27" font-weight="400" fill="#526775"><tspan x="40" dy="0">概念示意 · 功能与可维护性分别成立</tspan></text><text x="196" y="167" font-size="30" font-weight="700" fill="#183249" text-anchor="middle"><tspan x="196" dy="0">需求未满足</tspan></text><text x="524" y="167" font-size="30" font-weight="700" fill="#183249" text-anchor="middle"><tspan x="524" dy="0">需求已满足</tspan></text><text x="40" y="220" font-size="29" font-weight="700" fill="#176F6B"><tspan x="40" dy="0">工程质量支持后续修改</tspan></text><rect x="40" y="241" width="312" height="182" rx="18" fill="white" stroke="#C8D7E0" stroke-width="2"/><text x="62" y="288" font-size="31" font-weight="700" fill="#183249"><tspan x="62" dy="0">修正功能</tspan></text><text x="62" y="342" font-size="29" font-weight="400" fill="#183249"><tspan x="62" dy="0">结构清楚</tspan><tspan x="62" dy="40">承诺仍有缺口</tspan></text><rect x="368" y="241" width="312" height="182" rx="18" fill="#E6F3EF" stroke="#99C7BE" stroke-width="2"/><text x="390" y="288" font-size="31" font-weight="700" fill="#176F6B"><tspan x="390" dy="0">进入交付验证</tspan></text><text x="390" y="342" font-size="29" font-weight="400" fill="#183249"><tspan x="390" dy="0">需求得到满足</tspan><tspan x="390" dy="40">结构也可维护</tspan></text><rect x="40" y="502" width="312" height="182" rx="18" fill="#FFF1E6" stroke="#D8BBA3" stroke-width="2"/><text x="62" y="549" font-size="31" font-weight="700" fill="#183249"><tspan x="62" dy="0">两面都需修正</tspan></text><text x="62" y="603" font-size="29" font-weight="400" fill="#183249"><tspan x="62" dy="0">补足功能</tspan><tspan x="62" dy="40">处理重要设计问题</tspan></text><rect x="368" y="502" width="312" height="182" rx="18" fill="#FFF1E6" stroke="#D8BBA3" stroke-width="2"/><text x="390" y="549" font-size="31" font-weight="700" fill="#183249"><tspan x="390" dy="0">修正工程问题</tspan></text><text x="390" y="603" font-size="29" font-weight="400" fill="#183249"><tspan x="390" dy="0">功能可以演示</tspan><tspan x="390" dy="40">后续修改仍困难</tspan></text><text x="40" y="481" font-size="29" font-weight="700" fill="#183249"><tspan x="40" dy="0">重要工程问题妨碍后续修改</tspan></text><path d="M 40 719 H 680" stroke="#C8D7E0" stroke-width="2"/><text x="40" y="764" font-size="30" font-weight="700" fill="#183249"><tspan x="40" dy="0">进入交付验证，仍需核对版本与用户结果</tspan></text><text x="40" y="805" font-size="28" font-weight="400" fill="#526775"><tspan x="40" dy="0">两个判断都成立，不等于自动接受</tspan></text>
</svg>
