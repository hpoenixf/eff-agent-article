<svg xmlns="http://www.w3.org/2000/svg" width="720" height="934" viewBox="0 0 720 934" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">发现进入知识，保护也能退出</title><desc id="desc">四种材料有不同职责：现行约定说明应该怎样表现，实现说明实际怎样运行，测试保留有效反例，历史解释选择原因。真实发现促使受影响的材料更新，彼此校准而不互相替代。旧保护的前提仍成立时保留或调整，前提已失效时可以改写或退役。</desc>
<defs><style>
text{font-family:'Noto Sans CJK SC','Noto Sans SC',Arial,sans-serif;fill:#183249}
.title{font-size:34px;font-weight:700}.heading{font-size:30px;font-weight:700}.body{font-size:29px}.note{font-size:27px;fill:#526775}.small{font-size:26px;fill:#526775}.teal{fill:#176F6B}.amber{fill:#805013}.white{fill:#fff}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#237D78"/></marker>
<marker id="amber-arrow" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A26515"/></marker>
</defs><rect width="720" height="934" rx="24" fill="#F4F7FA"/>
<text x="40" y="58" class="title" text-anchor="start">发现进入知识，保护也能退出</text>
<text x="40" y="103" class="note" text-anchor="start">材料各有职责，依据变化时重新检查</text>
<rect x="40" y="135" width="640" height="66" rx="14" fill="#237D78" stroke="#237D78" stroke-width="2"/>
<text x="360" y="178" class="heading white" text-anchor="middle">真实发现 → 更新受影响的材料</text>
<rect x="40" y="231" width="304" height="164" rx="16" fill="#FFFFFF" stroke="#C8D7E0" stroke-width="2"/>
<rect x="40" y="231" width="7" height="164" rx="3.5" fill="#237D78"/>
<text x="62" y="274" class="heading" text-anchor="start">现行约定</text>
<text x="62" y="320" class="note" text-anchor="start">现在应怎样表现</text>
<text x="62" y="357" class="note" text-anchor="start">确认或更新约定</text>
<rect x="376" y="231" width="304" height="164" rx="16" fill="#FFFFFF" stroke="#C8D7E0" stroke-width="2"/>
<rect x="376" y="231" width="7" height="164" rx="3.5" fill="#237D78"/>
<text x="398" y="274" class="heading" text-anchor="start">实现</text>
<text x="398" y="320" class="note" text-anchor="start">当前实际怎样运行</text>
<text x="398" y="357" class="note" text-anchor="start">修复相关行为</text>
<rect x="40" y="421" width="304" height="164" rx="16" fill="#FFFFFF" stroke="#C8D7E0" stroke-width="2"/>
<rect x="40" y="421" width="7" height="164" rx="3.5" fill="#237D78"/>
<text x="62" y="464" class="heading" text-anchor="start">测试</text>
<text x="62" y="510" class="note" text-anchor="start">哪些条件正在保护</text>
<text x="62" y="547" class="note" text-anchor="start">保留有效反例</text>
<rect x="376" y="421" width="304" height="164" rx="16" fill="#FFFFFF" stroke="#C8D7E0" stroke-width="2"/>
<rect x="376" y="421" width="7" height="164" rx="3.5" fill="#237D78"/>
<text x="398" y="464" class="heading" text-anchor="start">历史记录</text>
<text x="398" y="510" class="note" text-anchor="start">为何选择当前方案</text>
<text x="398" y="547" class="note" text-anchor="start">保留原因与转折</text>
<text x="360" y="631" class="heading teal" text-anchor="middle">相互校准，不能互相替代</text>
<path d="M 40 661 H 680" fill="none" stroke="#C8D7E0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="360" y="709" class="heading" text-anchor="middle">旧保护的前提还成立吗？</text>
<path d="M 360 726 V 742 H 192 V 755" fill="none" stroke="#237D78" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 360 742 H 528 V 755" fill="none" stroke="#A26515" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber-arrow)"/>
<rect x="40" y="765" width="304" height="100" rx="14" fill="#E6F3EF" stroke="#99C7BE" stroke-width="2"/>
<rect x="376" y="765" width="304" height="100" rx="14" fill="#FFF4E1" stroke="#E4C693" stroke-width="2"/>
<text x="192" y="803" class="heading teal" text-anchor="middle">仍然成立</text>
<text x="192" y="843" class="note teal" text-anchor="middle">保留或调整</text>
<text x="528" y="803" class="heading amber" text-anchor="middle">已经失效</text>
<text x="528" y="843" class="note amber" text-anchor="middle">改写或退役</text>
<text x="360" y="907" class="small" text-anchor="middle">保留判断的原因，也记录失效的条件</text>
</svg>
