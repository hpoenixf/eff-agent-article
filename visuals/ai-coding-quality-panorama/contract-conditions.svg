<svg xmlns="http://www.w3.org/2000/svg" width="720" height="816" viewBox="0 0 720 816" role="img" aria-labelledby="contract-conditions-zh-title contract-conditions-zh-desc" xml:lang="zh">
  <title id="contract-conditions-zh-title">让约定可以被观察</title>
  <desc id="contract-conditions-zh-desc">教学示例：导出全部。先确定全部的范围，再同时说明目标、数据范围、保留条件和失败行为。本例要交付可下载文件，覆盖当前筛选中全部有权访问的记录，不受分页限制并保留既有列定义；生成失败时不展示成功下载入口。</desc>
  <defs>
    <marker id="contract-conditions-zh-arrow" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#237D78"/></marker>
    <style>text{font-family:'Noto Sans CJK SC','Noto Sans SC',Arial,sans-serif}</style>
  </defs>
  <rect width="720" height="816" rx="24" fill="#F4F7FA"/>
<text x="40" y="61" font-size="36" font-weight="700" fill="#183249"><tspan x="40" dy="0">让约定可以被观察</tspan></text><text x="40" y="106" font-size="27" font-weight="400" fill="#526775"><tspan x="40" dy="0">教学示例 · 导出全部</tspan></text><rect x="40" y="140" width="640" height="110" rx="18" fill="white" stroke="#C8D7E0" stroke-width="2"/><text x="64" y="185" font-size="31" font-weight="700" fill="#183249"><tspan x="64" dy="0">先说明“全部”指什么</tspan></text><text x="64" y="226" font-size="28" font-weight="400" fill="#526775"><tspan x="64" dy="0">当前页 / 筛选结果 / 账户数据</tspan></text><path d="M 360 260 V 280" stroke="#237D78" stroke-width="4" stroke-linecap="round" marker-end="url(#contract-conditions-zh-arrow)"/><rect x="40" y="296" width="312" height="162" rx="18" fill="white" stroke="#C8D7E0" stroke-width="2"/><text x="62" y="340" font-size="31" font-weight="700" fill="#176F6B"><tspan x="62" dy="0">目标</tspan></text><text x="62" y="387" font-size="29" font-weight="400" fill="#183249"><tspan x="62" dy="0">获得可下载的</tspan><tspan x="62" dy="38">数据文件</tspan></text><rect x="368" y="296" width="312" height="162" rx="18" fill="#E6F3EF" stroke="#99C7BE" stroke-width="2"/><text x="390" y="340" font-size="31" font-weight="700" fill="#176F6B"><tspan x="390" dy="0">范围</tspan></text><text x="390" y="387" font-size="29" font-weight="400" fill="#183249"><tspan x="390" dy="0">当前筛选内</tspan><tspan x="390" dy="38">全部授权记录</tspan></text><rect x="40" y="480" width="312" height="162" rx="18" fill="white" stroke="#C8D7E0" stroke-width="2"/><text x="62" y="524" font-size="31" font-weight="700" fill="#176F6B"><tspan x="62" dy="0">保留条件</tspan></text><text x="62" y="571" font-size="29" font-weight="400" fill="#183249"><tspan x="62" dy="0">不受分页影响</tspan><tspan x="62" dy="38">保留既有列定义</tspan></text><rect x="368" y="480" width="312" height="162" rx="18" fill="white" stroke="#C8D7E0" stroke-width="2"/><text x="390" y="524" font-size="31" font-weight="700" fill="#176F6B"><tspan x="390" dy="0">失败行为</tspan></text><text x="390" y="571" font-size="29" font-weight="400" fill="#183249"><tspan x="390" dy="0">生成失败时</tspan><tspan x="390" dy="38">不展示成功入口</tspan></text><path d="M 40 688 H 680" stroke="#C8D7E0" stroke-width="2"/><text x="40" y="735" font-size="30" font-weight="700" fill="#183249"><tspan x="40" dy="0">这些条件共同决定实现与验收</tspan></text><text x="40" y="777" font-size="28" font-weight="400" fill="#526775"><tspan x="40" dy="0">范围清楚，完成才有可观察的含义</tspan></text>
</svg>
