<svg xmlns="http://www.w3.org/2000/svg" width="720" height="830" viewBox="0 0 720 830" role="img" aria-labelledby="responsibility-boundaries-zh-title responsibility-boundaries-zh-desc" xml:lang="zh">
  <title id="responsibility-boundaries-zh-title">让关键判断有清楚的归属</title>
  <desc id="responsibility-boundaries-zh-desc">概念示意：同一条业务规则若在页面、接口、导出中各有副本，一次变化就需要同时对齐多个判断。把该规则交给负责的业务模块，页面、接口和导出便可复用同一判断结果。这不代表所有业务规则都必须集中到一个模块。</desc>
  <defs>
    <marker id="responsibility-boundaries-zh-arrow" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#237D78"/></marker>
    <style>text{font-family:'Noto Sans CJK SC','Noto Sans SC',Arial,sans-serif}</style>
  </defs>
  <rect width="720" height="830" rx="24" fill="#F4F7FA"/>
<text x="40" y="61" font-size="36" font-weight="700" fill="#183249"><tspan x="40" dy="0">让关键判断有清楚的归属</tspan></text><text x="40" y="106" font-size="27" font-weight="400" fill="#526775"><tspan x="40" dy="0">概念示意 · 同一条业务规则</tspan></text><rect x="40" y="140" width="640" height="250" rx="18" fill="#FFF1E6" stroke="#D8BBA3" stroke-width="2"/><text x="64" y="185" font-size="32" font-weight="700" fill="#183249"><tspan x="64" dy="0">规则分散：每处各自判断</tspan></text><rect x="64" y="214" width="184" height="112" rx="14" fill="white" stroke="#D8BBA3" stroke-width="2"/><text x="156" y="258" font-size="31" font-weight="700" fill="#183249" text-anchor="middle"><tspan x="156" dy="0">页面</tspan></text><text x="156" y="301" font-size="28" font-weight="400" fill="#526775" text-anchor="middle"><tspan x="156" dy="0">规则副本</tspan></text><rect x="268" y="214" width="184" height="112" rx="14" fill="white" stroke="#D8BBA3" stroke-width="2"/><text x="360" y="258" font-size="31" font-weight="700" fill="#183249" text-anchor="middle"><tspan x="360" dy="0">接口</tspan></text><text x="360" y="301" font-size="28" font-weight="400" fill="#526775" text-anchor="middle"><tspan x="360" dy="0">规则副本</tspan></text><rect x="472" y="214" width="184" height="112" rx="14" fill="white" stroke="#D8BBA3" stroke-width="2"/><text x="564" y="258" font-size="31" font-weight="700" fill="#183249" text-anchor="middle"><tspan x="564" dy="0">导出</tspan></text><text x="564" y="301" font-size="28" font-weight="400" fill="#526775" text-anchor="middle"><tspan x="564" dy="0">规则副本</tspan></text><text x="64" y="367" font-size="29" font-weight="400" fill="#183249"><tspan x="64" dy="0">一次变化，需要找到并对齐三处</tspan></text><rect x="40" y="416" width="640" height="326" rx="18" fill="#E6F3EF" stroke="#99C7BE" stroke-width="2"/><text x="64" y="463" font-size="32" font-weight="700" fill="#176F6B"><tspan x="64" dy="0">归属清楚：调用方复用结果</tspan></text><rect x="64" y="490" width="184" height="58" rx="12" fill="white" stroke="#99C7BE" stroke-width="2"/><text x="156" y="530" font-size="30" font-weight="700" fill="#183249" text-anchor="middle"><tspan x="156" dy="0">页面</tspan></text><rect x="268" y="490" width="184" height="58" rx="12" fill="white" stroke="#99C7BE" stroke-width="2"/><text x="360" y="530" font-size="30" font-weight="700" fill="#183249" text-anchor="middle"><tspan x="360" dy="0">接口</tspan></text><rect x="472" y="490" width="184" height="58" rx="12" fill="white" stroke="#99C7BE" stroke-width="2"/><text x="564" y="530" font-size="30" font-weight="700" fill="#183249" text-anchor="middle"><tspan x="564" dy="0">导出</tspan></text><path d="M 156 558 V 579 H 564 V 558 M 360 558 V 612" fill="none" stroke="#237D78" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#responsibility-boundaries-zh-arrow)"/><rect x="112" y="624" width="496" height="94" rx="14" fill="white" stroke="#99C7BE" stroke-width="2"/><text x="360" y="664" font-size="31" font-weight="700" fill="#176F6B" text-anchor="middle"><tspan x="360" dy="0">负责该规则的模块</tspan></text><text x="360" y="702" font-size="28" font-weight="400" fill="#183249" text-anchor="middle"><tspan x="360" dy="0">统一判断 · 复用结果</tspan></text><text x="40" y="791" font-size="30" font-weight="700" fill="#183249"><tspan x="40" dy="0">每条关键规则，都有清楚的负责位置</tspan></text>
</svg>
