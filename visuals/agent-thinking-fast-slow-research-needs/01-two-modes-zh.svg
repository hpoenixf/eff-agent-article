<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">两种思考方式，各有擅长的事</title><desc id="desc">自动加工与审慎加工的特点、算术示例与直觉陷阱。这是认知加工的概念对比，不是两块独立的大脑。</desc><style>text{font-family:'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif;fill:#152D3A}.muted{fill:#60717B}.teal{fill:#126E67}.amber{fill:#A85B22}.white{fill:white}.body{font-size:22px}.heading{font-size:31px;font-weight:700}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60717B"/></marker></defs><rect width="1200" height="760" fill="#F8F6F1"/><text x="52" y="48" class="teal" font-size="15" font-weight="700">ETF AGENT / THINKING, FAST AND SLOW</text><text x="1148" y="48" class="muted" text-anchor="end" font-size="18">01</text><text x="52" y="111" font-size="39" font-weight="750">两种思考方式，各有擅长的事</text><text x="52" y="151" class="muted body">快，不等于草率；慢，也不保证正确。</text><rect x="52" y="190" width="532" height="362" rx="22" fill="#E1F0E9"/><rect x="616" y="190" width="532" height="362" rx="22" fill="#F6E8D5"/><rect x="82" y="216" width="57" height="57" rx="17" fill="#126E67"/><rect x="646" y="216" width="57" height="57" rx="17" fill="#A85B22"/><text x="110" y="255" class="white" font-size="32" font-weight="700" text-anchor="middle">1</text><text x="674" y="255" class="white" font-size="32" font-weight="700" text-anchor="middle">2</text><text x="157" y="248" class="teal heading">自动加工</text><text x="721" y="248" class="amber heading">审慎加工</text><g class="body"><text x="82" y="311">模式识别 · 联想 · 熟练习惯</text><text x="82" y="351">熟悉的答案几乎自动浮现</text><text x="82" y="391">高效，但可能忽略关键条件</text><text x="646" y="311">规则推演 · 工作记忆 · 核对</text><text x="646" y="351">保留中间步骤，检查直觉的前提</text><text x="646" y="391">灵活，但费力，也可能出错</text></g><rect x="82" y="434" width="472" height="84" rx="16" fill="white"/><rect x="646" y="434" width="472" height="84" rx="16" fill="white"/><text x="108" y="487" class="teal" font-size="35" font-weight="700">3 + 4 = 7</text><text x="672" y="487" class="amber" font-size="29" font-weight="700">17 × 24 = 340 + 68</text><path d="M570 371H627" stroke="#60717B" stroke-width="3" marker-end="url(#arrow)"/><rect x="52" y="577" width="1096" height="93" rx="20" fill="#152D3A"/><text x="80" y="615" class="white" font-size="23" font-weight="650">直觉觉得「涨跌抵消」，检查才发现分母变了。</text><text x="80" y="651" class="white" font-size="24">100 → 120 → 96    先涨 20%，再跌 20%，实际少了 4%。</text><path d="M52 697H1148" stroke="#D9E1DC"/><text x="52" y="730" class="muted" font-size="17">认知加工的概念对比，不是两块独立的大脑，也不是对大模型内部机制的解剖图。</text></svg>
