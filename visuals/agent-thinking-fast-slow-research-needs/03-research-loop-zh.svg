<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">研究便签，最重要的是允许反悔</title><desc id="desc">原始问题保持不变。研究便签、证据、冲突与重开形成反馈循环。只交付有依据的部分，并说明未知。</desc><style>text{font-family:'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif;fill:#152D3A}.muted{fill:#60717B}.teal{fill:#126E67}.amber{fill:#A85B22}.white{fill:white}</style><defs><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#126E67"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A85B22"/></marker></defs><rect width="1200" height="760" fill="#F8F6F1"/><text x="52" y="48" class="teal" font-size="15" font-weight="700">ETF AGENT / THINKING, FAST AND SLOW</text><text x="1148" y="48" class="muted" font-size="18" text-anchor="end">03</text><text x="52" y="111" font-size="39" font-weight="750">研究便签，最重要的是允许反悔</text><text x="52" y="151" class="muted" font-size="22">让新证据改变下一步，而不是替最初的结论寻找理由。</text><rect x="52" y="191" width="1096" height="73" rx="18" fill="#152D3A"/><text x="80" y="237" class="white" font-size="25" font-weight="650">原始用户问题始终保留：删掉一张便签，不能删掉用户的要求。</text><rect x="52" y="302" width="498" height="132" rx="22" fill="#E1F0E9"/><rect x="650" y="302" width="498" height="132" rx="22" fill="#F6E8D5"/><g fill="white" stroke="#D9E1DC" stroke-width="2"><rect x="52" y="484" width="498" height="120" rx="20"/><rect x="650" y="484" width="498" height="120" rx="20"/></g><text x="80" y="347" class="teal" font-size="28" font-weight="700">当前研究便签</text><text x="80" y="391" font-size="23">哪些前提，还没有弄清？</text><text x="678" y="347" class="amber" font-size="28" font-weight="700">读取证据与必要计算</text><text x="678" y="391" font-size="23">检查覆盖范围、口径与日期。</text><text x="80" y="529" class="teal" font-size="27" font-weight="700">修订，甚至重新打开</text><text x="80" y="569" class="muted" font-size="21">resolved 是评估，不是事实认证。</text><text x="678" y="529" font-size="27" font-weight="700">遇到与初步判断冲突的事实</text><text x="678" y="569" class="muted" font-size="21">「8%」是五日涨幅，不是单日。</text><g fill="none" stroke="#126E67" stroke-width="3" marker-end="url(#t)"><path d="M551 367H641"/><path d="M649 544H559"/><path d="M300 483V443"/></g><path d="M899 435V476" stroke="#A85B22" stroke-width="3" marker-end="url(#a)"/><rect x="247" y="627" width="706" height="48" rx="16" fill="#152D3A"/><text x="600" y="659" class="white" font-size="23" font-weight="650" text-anchor="middle">能够支持的部分交付，仍然未知的部分说清楚。</text><path d="M52 697H1148" stroke="#D9E1DC"/><text x="52" y="730" class="muted" font-size="17">研究过程的概念示意；工作问题和审阅建议不构成自动发布门禁。</text></svg>
