<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 793" width="680" height="793" role="img" aria-labelledby="title desc"><title id="title">冲突时，不按三方票数判决</title><desc id="desc">先确认什么才是本次有效行为</desc><rect x="0" y="0" width="680" height="793" rx="24" fill="#F3F7FB" stroke="#F3F7FB" stroke-width="1.5"/><rect x="0" y="0" width="680" height="9" rx="4" fill="#247DA9" stroke="#247DA9" stroke-width="1.5"/><circle cx="620" cy="58" r="54" fill="#EAF5FB"/><text x="32" y="60" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="31" fill="#16283F" font-weight="700" text-anchor="start">冲突时，不按三方票数判决</text><text x="32" y="99" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="20" fill="#52677D" font-weight="400" text-anchor="start">先确认什么才是本次有效行为</text><rect x="88" y="130" width="504" height="104" rx="17" fill="#16283F" stroke="#16283F" stroke-width="1.5"/><text x="340" y="173" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="29" fill="#FFFFFF" font-weight="700" text-anchor="middle">目标行为已确认吗？</text><text x="340" y="212" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="20" fill="#CCDEEE" font-weight="400" text-anchor="middle">版本、权限、消费者与变更授权</text><path d="M340 234L340 264" fill="none" stroke="#247DA9" stroke-width="4" stroke-linecap="round"/><path d="M182 264L498 264" fill="none" stroke="#247DA9" stroke-width="4" stroke-linecap="round"/><path d="M182 264L182 289" fill="none" stroke="#247DA9" stroke-width="4" stroke-linecap="round"/><path d="M498 264L498 289" fill="none" stroke="#247DA9" stroke-width="4" stroke-linecap="round"/><rect x="30" y="289" width="296" height="132" rx="17" fill="#FFF2DF" stroke="#B17725" stroke-width="1.5"/><text x="178" y="330" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,Inter,Arial,sans-serif" font-size="24" fill="#B17725" font-weight="700" text-anchor="middle">还没有</text><te