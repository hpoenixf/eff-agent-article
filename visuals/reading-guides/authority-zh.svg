<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
<title id="title">模型提议，系统检查具体动作</title>
<desc id="desc">检查已记录的授权后，未获准的动作被拒绝；获准动作执行并记录结果，模型再解释，发布模块准备回答。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5c8c7d"/></marker></defs>
<rect width="720" height="720" rx="28" fill="#f3f7f3"/>
<text x="45" y="64" fill="#173e34" font-size="29" font-weight="700" font-family="PingFang SC, Microsoft YaHei, sans-serif">模型提议，系统检查具体动作</text>
<g stroke="#5c8c7d" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M360 170 V200"/><path d="M360 260 V284 H174 V315"/><path d="M360 260 V284 H546 V315"/><path d="M546 375 V405"/><path d="M546 465 V495"/><path d="M546 555 V585"/></g>
<rect x="150" y="110" width="420" height="60" rx="15" fill="#ffffff" stroke="#d5e4db"/>
<text x="360.0" y="149" text-anchor="middle" fill="#173e34" font-size="24" font-weight="650" font-family="PingFang SC, Microsoft YaHei, sans-serif">模型提议动作</text>
<rect x="150" y="200" width="420" height="60" rx="15" fill="#ffffff" stroke="#d5e4db"/>
<text x="360.0" y="239" text-anchor="middle" fill="#173e34" font-size="24" font-weight="650" font-family="PingFang SC, Microsoft YaHei, sans-serif">检查已记录的授权</text>
<rect x="24" y="315" width="300" height="60" rx="15" fill="#f9ebe7" stroke="#d8a99e"/>
<text x="174.0" y="354" text-anchor="middle" fill="#173e34" font-size="24" font-weight="650" font-family="PingFang SC, Microsoft YaHei, sans-serif">范围外：拒绝动作</text>
<rect x="396" y="315" width="300" height="60" rx="15" fill="#ffffff" stroke="#d5e4db"/>
<text x="546.0" y="354" text-anchor="middle" fill="#173e34" font-size="24" font-weight="650" font-family="PingFang SC, Microsoft YaHei, sans-serif">获准：派发动作</text>
<rect x="396" y="405" width="300" height="60" rx="15" fill="#ffffff" stroke="#d5e4db"/>
<text x="546.0" y="444" text-anchor="middle" fill="#173e34" font-size="24" font-weight="650" font-family="PingFang SC, Microsoft YaHei, sans-serif">记录实际执行结果</text>
<rect x="396" y="495" width="300" height="60" rx="15" fill="#ffffff" stroke="#d5e4db"/>
<text x="546.0" y="534" text-anchor="middle" fill="#173e34" font-size="24" font-weight="650" font-family="PingFang SC, Microsoft YaHei, sans-serif">模型解释结果</text>
<rect x="396" y="585" width="300" height="60" rx="15" fill="#ffffff" stroke="#d5e4db"/>
<text x="546.0" y="624" text-anchor="middle" fill="#173e34" font-size="24" font-weight="650" font-family="PingFang SC, Microsoft YaHei, sans-serif">发布模块准备回答</text>
</svg>
