<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 966" role="img" aria-labelledby="title desc">
<title id="title">Six questions for one task</title>
<desc id="desc">Follow the handoffs before opening the detailed map；What starts the work?：A message, a schedule or another event.；Whose task is this?：Establish identity, run and authorized material.；What happens next?：The model answers, researches or coordinates.；How is work performed?：Tools return actual results, receipts and gaps.；What can be delivered?：Confirm saved text and file revisions.；What does the user see?：Show the right task and revision to reopen.；A reading map, not a mandatory sequence for every task.</desc>
