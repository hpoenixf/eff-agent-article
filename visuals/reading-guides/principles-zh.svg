<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 606" role="img" aria-labelledby="title desc">
<title id="title">一份报告，三个关键问题</title>
<desc id="desc">先抓住判断，再按需查阅九条原则；谁理解问题？：模型理解需求，提出下一步。；谁确认事实？：权限、执行与保存以实际记录为准。；失败影响哪里？：保留独立可交付的结果和明确缺口。；教学示例：比较两份资料并保存报告</desc>
<rect width="720" height="606" rx="28" fill="#f3f7f3"/>
<circle cx="656" cy="60" r="94" fill="#deede5"/>
<path d="M 52 46 h 60" stroke="#2c8069" stroke-width="7" stroke-linecap="round"/>
<text x="52" y="96" fill="#173e34" font-size="34" font-weight="700" font-family="PingFang SC, Microsoft YaHei, sans-serif">一份报告，三个关键问题</text>
<text x="52" y="129" fill="#526e63" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif">先抓住判断，再按需查阅九条原则</text>
<rect x="38" y="148" width="644" height="102" rx="18" fill="#ffffff" stroke="#d9e5dc"/>
<rect x="54" y="163" width="72" height="72" rx="18" fill="#dcefe6"/>
<text x="90" y="210" text-anchor="middle" fill="#256c59" font-size="29" font-weight="700" font-family="sans-serif">01</text>
<text x="148" y="190" fill="#173e34" font-size="27" font-weight="700" font-family="PingFang SC, Microsoft YaHei, sans-serif">谁理解问题？</text>
<text x="148" y="224" fill="#526a62" font-size="25" font-family="PingFang SC, Microsoft YaHei, sans-serif">模型理解需求，提出下一步。</text>
<rect x="38" y="268" width="644" height="102" rx="18" fill="#ffffff" stroke="#d9e5dc"/>
<rect x="54" y="283" width="72" height="72" rx="18" fill="#e5edf8"/>
<text x="90" y="330" text-anchor="middle" fill="#256c59" font-size="29" font-weight="700" font-family="sans-serif">02</text>
<text x="148" y="310" fill="#173e34" font-size="27" font-weight="700" font-family="PingFang SC, Microsoft YaHei, sans-serif">谁确认事实？</text>
<text x="148" y="344" fill="#526a62" font-size="25" font-family="PingFang SC, Microsoft YaHei, sans-serif">权限、执行与保存以实际记录为准。</text>
<rect x="38" y="388" width="644" height="102" rx="18" fill="#ffffff" stroke="#d9e5dc"/>
<rect x="54" y="403" width="72" height="72" rx="18" fill="#f9ecd7"/>
<text x="90" y="450" text-anchor="middle" fill="#256c59" font-size="29" font-weight="700" font-family="sans-serif">03</text>
<text x="148" y="430" fill="#173e34" font-size="27" font-weight="700" font-family="PingFang SC, Microsoft YaHei, sans-serif">失败影响哪里？</text>
<text x="148" y="464" fill="#526a62" font-size="25" font-family="PingFang SC, Microsoft YaHei, sans-serif">保留独立可交付的结果和明确缺口。</text>
<text x="52" y="561" fill="#3b6658" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif">教学示例：比较两份资料并保存报告</text>
</svg>
