<title id="title">One report, three questions</title>
<desc id="desc">Start with the decisions behind the nine principles；Who understands?：The model interprets requests and proposes actions.；Who confirms facts?：Verify permission and saved effects in records.；How far does failure reach?：Keep independent results and identify gaps.；Teaching example: compare two documents and save a report</desc>
