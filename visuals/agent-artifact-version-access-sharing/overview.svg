<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 635" width="1200" height="635" role="img" aria-label="一份报告，四个需要独立确认的事实"><rect width="1200" height="635" rx="30" fill="#f7f9fc"/><rect x="0" y="0" width="1200" height="10" rx="4" fill="#2767b2"/><text x="48" y="73" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="33" fill="#15243b" font-weight="700" text-anchor="start">一份报告，四个需要独立确认的事实</text><text x="48" y="111" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#536177" font-weight="400" text-anchor="start">生成内容、持久化、访问权限和分享并不是同一次成功</text><rect x="34" y="158" width="264" height="294" rx="18" fill="white" stroke="#dbe3ed" stroke-width="2"/><circle cx="69" cy="196" r="20" fill="#e9f2ff" /><text x="69" y="203" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#2767b2" font-weight="700" text-anchor="middle">1</text><text x="57" y="266" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="26" fill="#17263e" font-weight="700" text-anchor="start">生成候选</text><path d="M57 291h218" stroke="#d9e2ed" stroke-width="2"/><text x="57" y="338" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#43536a" font-weight="400" text-anchor="start">得到文件字节</text><text x="57" y="377" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#43536a" font-weight="400" text-anchor="start">文件名不能代表版本</text><text x="311" y="314" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="33" fill="#2767b2" font-weight="700" text-anchor="middle">›</text><rect x="325" y="158" width="264" height="294" rx="18" fill="white" stroke="#dbe3ed" stroke-width="2"/><circle cx="360" cy="196" r="20" fill="#e9f2ff" /><text x="360" y="203" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#2767b2" font-weight="700" text-anchor="middle">2</text><text x="348" y="266" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="26" fill="#17263e" font-weight="700" text-anchor="start">持久化提交</text><path d="M348 291h218" stroke="#d9e2ed" stroke-width="2"/><text x="348" y="338" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#43536a" font-weight="400" text-anchor="start">绑定摘要与修订</text><text x="348" y="377" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#43536a" font-weight="400" text-anchor="start">保存结果可能未知</text><text x="602" y="314" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="33" fill="#2767b2" font-weight="700" text-anchor="middle">›</text><rect x="616" y="158" width="264" height="294" rx="18" fill="white" stroke="#dbe3ed" stroke-width="2"/><circle cx="651" cy="196" r="20" fill="#e9f2ff" /><text x="651" y="203" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#2767b2" font-weight="700" text-anchor="middle">3</text><text x="639" y="266" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="26" fill="#17263e" font-weight="700" text-anchor="start">授权回读</text><path d="M639 291h218" stroke="#d9e2ed" stroke-width="2"/><text x="639" y="338" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#43536a" font-weight="400" text-anchor="start">检查账户及资源归属</text><text x="639" y="377" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#43536a" font-weight="400" text-anchor="start">只读固定版本</text><text x="893" y="314" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="33" fill="#2767b2" font-weight="700" text-anchor="middle">›</text><rect x="907" y="158" width="264" height="294" rx="18" fill="white" stroke="#dbe3ed" stroke-width="2"/><circle cx="942" cy="196" r="20" fill="#e9f2ff" /><text x="942" y="203" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#2767b2" font-weight="700" text-anchor="middle">4</text><text x="930" y="266" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="26" fill="#17263e" font-weight="700" text-anchor="start">定向分享</text><path d="M930 291h218" stroke="#d9e2ed" stroke-width="2"/><text x="930" y="338" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#43536a" font-weight="400" text-anchor="start">指定接收者与修订</text><text x="930" y="377" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#43536a" font-weight="400" text-anchor="start">撤销限制后续访问</text><rect x="34" y="493" width="1134" height="92" rx="16" fill="#e9f2ff"/><text x="57" y="548" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#2767b2" font-weight="600" text-anchor="start">异常分支：提交结果未知 → 先查原操作回执；撤销不能追回已下载副本</text></svg>
