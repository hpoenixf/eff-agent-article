<svg xmlns="http://www.w3.org/2000/svg" width="480" height="455" viewBox="0 0 480 455" role="img" aria-labelledby="title desc"><title id="title">分享版本，不是共享文件名</title><desc id="desc">旧分享固定指向第一版。第二版需要新的明确授权；撤销限制后续请求，不能追回离线副本。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC",Arial,sans-serif;fill:#17324d}.title{font-size:27px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:19px;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.muted{fill:#475569}.warn{fill:#9a3412}</style><rect width="480" height="455" rx="18" fill="#f8fafc"/><text x="24" y="43" class="title">分享版本，不是共享文件名</text><text x="24" y="76" class="small">同一个文件名，可以对应两份不同内容</text><rect x="24" y="104" width="180" height="127" rx="12" fill="#eaf4ff" stroke="#8cb9df"/><rect x="276" y="104" width="180" height="127" rx="12" fill="#eaf7f2" stroke="#8ccbb6"/><text x="114" y="143" class="label" text-anchor="middle">第一版</text><text x="114" y="178" class="body" text-anchor="middle">原始报告字节</text><text x="114" y="208" class="small" text-anchor="middle">固定产物身份</text><path d="M205 166H273" class="line"/><text x="240" y="146" class="small" text-anchor="middle">授权</text><text x="366" y="143" class="label" text-anchor="middle">指定接收者</text><text x="366" y="178" class="body" text-anchor="middle">自己的登录会话</text><text x="366" y="208" class="small" text-anchor="middle">仅获准这个版本</text><rect x="24" y="261" width="432" height="105" rx="12" fill="#fff6ec" stroke="#e2ba8b"/><text x="43" y="298" class="label">第二版：补入新的私人条件</text><text x="43" y="334" class="body">旧分享不会自动扩大到新内容</text><text x="24" y="405" class="body">撤销限制后续读取</text><text x="24" y="435" class="small">已下载的离线副本不能被追回</text></svg>
