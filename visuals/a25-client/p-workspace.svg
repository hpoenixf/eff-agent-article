<svg xmlns="http://www.w3.org/2000/svg" width="640" height="514" viewBox="0 0 640 514" role="img" aria-labelledby="title desc" lang="zh">
<title id="title">同一项任务，三种阅读空间</title><desc id="desc">任务卡说明状态和操作，正文承载成果，对话表达意图。示意布局，不是产品截图。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a3523d" stroke-width="1.8"/></marker></defs>
<rect x="1" y="1" width="638" height="512" rx="24" fill="#f7f8f2" stroke="#cddbd1"/>
<g fill="#16362f" font-weight="500" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<text x="30" y="36" font-size="16" font-weight="700" fill="#a3523d">AGENT / CLIENT PANORAMA</text>
<text x="30" y="80" font-size="32" font-weight="750">同一项任务，三种阅读空间</text>
<rect x="26" y="104" width="588" height="98" rx="16" fill="#e8efe7" stroke="#cddbd1"/>
<text x="44" y="139" font-size="27" font-weight="700">任务卡｜基金 A 与基金 B</text>
<text x="44" y="176" font-size="24" fill="#4e665e">持仓部分待补齐   ·   补充要求   ·   停止</text>
<rect x="26" y="218" width="588" height="132" rx="16" fill="white" stroke="#cddbd1"/>
<text x="44" y="254" font-size="26" font-weight="700">结果正文｜先看已成立的差异</text>
<text x="44" y="292" font-size="24" fill="#4e665e">费用比较可读；缺口留在对应结论旁</text>
<text x="44" y="327" font-size="24" fill="#a3523d">查看依据     取得文件（可用时）</text>
<rect x="26" y="366" width="588" height="84" rx="16" fill="white" stroke="#cddbd1"/>
<text x="44" y="401" font-size="26" font-weight="700">对话输入｜另问一个问题……</text>
<text x="44" y="434" font-size="23" fill="#4e665e">补充模式要显示目标，也允许退出</text>
<text x="30" y="488" font-size="23" fill="#4e665e">界面示意：三个入口，不是三份独立结果</text>
</g></svg>
