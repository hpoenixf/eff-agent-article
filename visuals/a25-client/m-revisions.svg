<svg xmlns="http://www.w3.org/2000/svg" width="640" height="488" viewBox="0 0 640 488" role="img" aria-labelledby="title desc" lang="zh">
<title id="title">旧快照迟到，也不能倒退正文</title><desc id="desc">当前显示P的第二版，迟到第一版不能覆盖；完全匹配第二版的保存回执才确认预览保存。权限拒绝优先于保留预览。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a3523d" stroke-width="1.8"/></marker></defs>
<rect x="1" y="1" width="638" height="486" rx="24" fill="#f7f8f2" stroke="#cddbd1"/>
<g fill="#16362f" font-weight="500" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<text x="30" y="36" font-size="16" font-weight="700" fill="#a3523d">AGENT / A25 · CLIENT</text>
<text x="30" y="80" font-size="32" font-weight="750">旧快照迟到，也不能倒退正文</text>
<rect x="26" y="106" width="588" height="72" rx="16" fill="#e8efe7" stroke="#cddbd1"/>
<text x="44" y="137" font-size="27" font-weight="700">当前阅读：正文 P · 第 2 版</text>
<text x="44" y="165" font-size="23" fill="#4e665e">若是预览，仍需等待保存确认</text>
<rect x="26" y="204" width="588" height="78" rx="16" fill="white" stroke="#cddbd1"/>
<text x="44" y="236" font-size="26" font-weight="700">迟到历史：P · 第 1 版</text>
<text x="44" y="267" font-size="23" fill="#a3523d">保留当前第 2 版，不按到达顺序覆盖</text>
<rect x="26" y="308" width="588" height="90" rx="16" fill="white" stroke="#cddbd1"/>
<text x="44" y="340" font-size="26" font-weight="700">保存回执：P · 第 2 版</text>
<text x="44" y="370" font-size="23" fill="#4e665e">身份、修订、正文匹配，才确认已保存</text>
<text x="30" y="438" font-size="22" font-weight="650" fill="#a3523d">权限拒绝优先；旧版浏览是另一种明确动作</text>
<text x="30" y="462" font-size="23" fill="#4e665e">示意合同：不是让浏览器重写发布记录</text>
</g></svg>
