<svg xmlns="http://www.w3.org/2000/svg" width="640" height="492" viewBox="0 0 640 492" role="img" aria-labelledby="title desc" lang="zh">
<title id="title">一次研究，六个交互时刻</title><desc id="desc">提出需求、确认范围、边等边读、随时调整、核查结果、离开再回来；它们可以交错发生。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a3523d" stroke-width="1.8"/></marker></defs>
<rect x="1" y="1" width="638" height="490" rx="24" fill="#f7f8f2" stroke="#cddbd1"/>
<g fill="#16362f" font-weight="500" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<text x="30" y="36" font-size="16" font-weight="700" fill="#a3523d">AGENT / CLIENT PANORAMA</text>
<text x="30" y="80" font-size="32" font-weight="750">一次研究，六个交互时刻</text>
<rect x="26" y="106" width="280" height="96" rx="16" fill="white" stroke="#cddbd1"/>
<text x="42" y="140" font-size="28" font-weight="700">提出需求</text>
<text x="42" y="178" font-size="22" fill="#4e665e">对象与材料可见</text>
<rect x="334" y="106" width="280" height="96" rx="16" fill="white" stroke="#cddbd1"/>
<text x="350" y="140" font-size="28" font-weight="700">确认范围</text>
<text x="350" y="178" font-size="22" fill="#4e665e">只问关键条件</text>
<rect x="26" y="218" width="280" height="96" rx="16" fill="#e8efe7" stroke="#cddbd1"/>
<text x="42" y="252" font-size="28" font-weight="700">边等边读</text>
<text x="42" y="290" font-size="22" fill="#4e665e">先看有用结果</text>
<rect x="334" y="218" width="280" height="96" rx="16" fill="white" stroke="#cddbd1"/>
<text x="350" y="252" font-size="28" font-weight="700">随时调整</text>
<text x="350" y="290" font-size="22" fill="#4e665e">补充或停止</text>
<rect x="26" y="330" width="280" height="96" rx="16" fill="white" stroke="#cddbd1"/>
<text x="42" y="364" font-size="28" font-weight="700">核查结果</text>
<text x="42" y="402" font-size="22" fill="#4e665e">依据就在附近</text>
<rect x="334" y="330" width="280" height="96" rx="16" fill="#e8efe7" stroke="#cddbd1"/>
<text x="350" y="364" font-size="28" font-weight="700">离开再回来</text>
<text x="350" y="402" font-size="22" fill="#4e665e">接上原来的事</text>
<path d="M306 154 H328" fill="none" stroke="#a3523d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M474 202 V210 H166 V216" fill="none" stroke="#a3523d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M306 266 H328" fill="none" stroke="#a3523d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M474 314 V322 H166 V328" fill="none" stroke="#a3523d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M306 378 H328" fill="none" stroke="#a3523d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="30" y="466" font-size="23" fill="#4e665e">阅读地图：允许交错，不是六道强制关卡</text>
</g></svg>
