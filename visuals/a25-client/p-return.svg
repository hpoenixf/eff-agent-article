<svg xmlns="http://www.w3.org/2000/svg" width="640" height="476" viewBox="0 0 640 476" role="img" aria-labelledby="title desc" lang="zh">
<title id="title">回来以后，先分清要做什么</title><desc id="desc">重新阅读取得已有结果，继续请求按支持的接续合同推进，重新研究需要新的明确请求。打开页面不自动产生后两种动作。</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#a3523d" stroke-width="1.8"/></marker></defs>
<rect x="1" y="1" width="638" height="474" rx="24" fill="#f7f8f2" stroke="#cddbd1"/>
<g fill="#16362f" font-weight="500" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<text x="30" y="36" font-size="16" font-weight="700" fill="#a3523d">AGENT / CLIENT PANORAMA</text>
<text x="30" y="80" font-size="32" font-weight="750">回来以后，先分清要做什么</text>
<rect x="26" y="105" width="588" height="94" rx="16" fill="#e8efe7" stroke="#cddbd1"/>
<text x="44" y="135" font-size="27" font-weight="700">重新阅读</text>
<text x="44" y="165" font-size="24" fill="#4e665e">取得原任务的已保存成果</text>
<text x="44" y="191" font-size="22" fill="#a3523d">不重跑研究</text>
<rect x="26" y="209" width="588" height="94" rx="16" fill="white" stroke="#cddbd1"/>
<text x="44" y="239" font-size="27" font-weight="700">请求继续</text>
<text x="44" y="269" font-size="24" fill="#4e665e">说明原任务还要补什么</text>
<text x="44" y="295" font-size="22" fill="#a3523d">按实际接续能力处理</text>
<rect x="26" y="313" width="588" height="94" rx="16" fill="white" stroke="#cddbd1"/>
<text x="44" y="343" font-size="27" font-weight="700">重新研究</text>
<text x="44" y="373" font-size="24" fill="#4e665e">明确新的时点、材料或范围</text>
<text x="44" y="399" font-size="22" fill="#a3523d">新请求，不冒充旧版</text>
<text x="30" y="450" font-size="23" fill="#4e665e">打开历史，不应偷偷变成一次新的执行</text>
</g></svg>
