<svg xmlns="http://www.w3.org/2000/svg" width="640" height="550" viewBox="0 0 640 550" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">进展看目标差距</title><desc id="desc">新证据可以让已解决的问题重新打开 动作数量不等于研究完成</desc>
