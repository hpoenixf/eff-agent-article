<svg xmlns="http://www.w3.org/2000/svg" width="640" height="586" viewBox="0 0 640 586" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">稳定指导与动态处境</title><desc id="desc">更新节奏不同，不宜焊进同一个大提示词 信息协同，来源和职责仍然分开</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#216d63"/></marker></defs>
<rect width="640" height="586" rx="24" fill="#f1f7f4"/>
<g font-family="Noto Sans CJK SC,Arial,sans-serif"><text x="32" y="48" font-size="32" fill="#163d39" font-weight="700" text-anchor="start">稳定指导与动态处境</text><text x="32" y="83" font-size="23" fill="#4b6661" font-weight="500" text-anchor="start">更新节奏不同，不宜焊进同一个大提示词</text>
<rect x="24" y="112" width="592" height="82" rx="16" fill="#ffffff" stroke="#a8c9c0" stroke-width="1.5"/><text x="44" y="146" font-size="27" fill="#163d39" font-weight="700" text-anchor="start">系统提示词</text><text x="44" y="177" font-size="25" fill="#4b6661" font-weight="500" text-anchor="start">跨任务的工作原则</text><rect x="24" y="206" width="592" height="82" rx="16" fill="#e7f0eb" stroke="#a8c9c0" stroke-width="1.5"/><text x="44" y="240" font-size="27" fill="#163d39" font-weight="700" text-anchor="start">当前请求</text><text x="44" y="271" font-size="25" fill="#4b6661" font-weight="500" text-anchor="start">这次的目标、限制和修正</text><rect x="24" y="300" width="592" height="82" rx="16" fill="#ffffff" stroke="#a8c9c0" stroke-width="1.5"/><text x="44" y="334" font-size="27" fill="#163d39" font-weight="700" text-anchor="start">有效记忆</text><text x="44" y="365" font-size="25" fill="#4b6661" font-weight="500" text-anchor="start">可纠正的历史背景</text><rect x="24" y="394" width="592" height="82" rx="16" fill="#e7f0eb" stroke="#a8c9c0" stroke-width="1.5"/><text x="44" y="428" font-size="27" fill="#163d39" font-weight="700" text-anchor="start">观察与进度</text><text x="44" y="459" font-size="25" fill="#4b6661" font-weight="500" text-anchor="start">随执行更新的依据与缺口</text>
<rect x="24" y="516" width="592" height="48" rx="12" fill="#216d63" stroke="#216d63" stroke-width="1.5"/><text x="320" y="548" font-size="25" fill="#fff" font-weight="600" text-anchor="middle">信息协同，来源和职责仍然分开</text></g></svg>
