<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">先有合法范围，再作本轮选择</title><desc id="desc">相关性不能授予权限 提示词说明边界，执行端落实边界</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#216d63"/></marker></defs>
<rect width="640" height="500" rx="24" fill="#f1f7f4"/>
<g font-family="Noto Sans CJK SC,Arial,sans-serif"><text x="32" y="48" font-size="32" fill="#163d39" font-weight="700" text-anchor="start">先有合法范围，再作本轮选择</text><text x="32" y="83" font-size="23" fill="#4b6661" font-weight="500" text-anchor="start">相关性不能授予权限</text>
