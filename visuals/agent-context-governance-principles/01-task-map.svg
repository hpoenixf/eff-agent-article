<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">先定位任务，再选择下一步</title><desc id="desc">六个问题，构成同一份任务视图 各项信息协同，不是六个新模块</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#216d63"/></marker></defs>
<rect width="640" height="520" rx="24" fill="#f1f7f4"/>
<g font-family="Noto Sans CJK SC,Arial,sans-serif"><text x="32" y="48" font-size="32" fill="#163d39" font-weight="700" text-anchor="start">先定位任务，再选择下一步</text><text x="32" y="83" font-size="23" fill="#4b6661" font-weight="500" text-anchor="start">六个问题，构成同一份任务视图</text>
<rect x="24" y="113" width="288" height="88" rx="16" fill="#ffffff" stroke="#a8c9c0" stroke-width="1.5"/><circle cx="50" cy="142" r="17" fill="#216d63"/><text x="50" y="149" font-size="19" fill="#fff" font-weight="600" text-anchor="middle">1</text><text x="78" y="150" font-size="28" fill="#163d39" font-weight="700" text-anchor="start">目标</text><text x="44" y="184" font-size="25" fill="#4b6661" font-weight="500" text-anchor="start">完成什么</text><rect x="328" y="113" width="288" height="88" rx="16" fill="#ffffff" stroke="#a8c9c0" stroke-width="1.5"/><circle cx="354" cy="142" r="17" fill="#216d63"/><text x="354" y="149" font-size="19" fill="#fff" font-weight="600" text-anchor="middle">2</text><text x="382" y="150" font-size="28" fill="#163d39" font-weight="700" text-anchor="start">依据</text><text x="348" y="184" font-size="25" fill="#4b6661" font-weight="500" text-anchor="start">看见什么</text><rect x="24" y="216" width="288" height="88" rx="16" fill="#ffffff" stroke="#a8c9c0" stroke-width="1.5"/><circle cx="50" cy="245" r="17" fill="#216d63"/><text x="50" y="252" font-size="19" fill="#fff" font-weight="600" text-anchor="middle">3</text><text x="78" y="253" font-size="28" fill="#163d39" font-weight="700" text-anchor="start">边界</text><text x="44" y="287" font-size="25" fill="#4b6661" font-weight="500" text-anchor="start">允许什么</text><rect x="328" y="216" width="288" height="88" rx="16" fill="#ffffff" stroke="#a8c9c0" stroke-width="1.5"/><circle cx="354" cy="245" r="17" fill="#216d63"/><text x="354" y="252" font-size="19" fill="#fff" font-weight="600" text-anchor="middle">4</text><text x="382" y="253" font-size="28" fill="#163d39" font-weight="700" text-anchor="start">记忆</text><text x="348" y="287" font-size="25" fill="#4b6661" font-weight="500" text-anchor="start">找回过去</text><rect x="24" y="319" width="288" height="88" rx="16" fill="#ffffff" stroke="#a8c9c0" stroke-width="1.5"/><circle cx="50" cy="348" r="17" fill="#216d63"/><text x="50" y="355" font-size="19" fill="#fff" font-weight="600" text-anchor="middle">5</text><text x="78" y="356" font-size="28" fill="#163d39" font-weight="700" text-anchor="start">探索</text><text x="44" y="390" font-size="25" fill="#4b6661" font-weight="500" text-anchor="start">补足未知</text><rect x="328" y="319" width="288" height="88" rx="16" fill="#ffffff" stroke="#a8c9c0" stroke-width="1.5"/><circle cx="354" cy="348" r="17" fill="#216d63"/><text x="354" y="355" font-size="19" fill="#fff" font-weight="600" text-anchor="middle">6</text><text x="382" y="356" font-size="28" fill="#163d39" font-weight="700" text-anchor="start">进展</text><text x="348" y="390" font-size="25" fill="#4b6661" font-weight="500" text-anchor="start">还差什么</text>
<rect x="24" y="450" width="592" height="48" rx="12" fill="#216d63" stroke="#216d63" stroke-width="1.5"/><text x="320" y="482" font-size="25" fill="#fff" font-weight="600" text-anchor="middle">各项信息协同，不是六个新模块</text></g></svg>
