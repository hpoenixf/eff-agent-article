<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc"><title id="title">从生成文字到真正交付</title><desc id="desc">一条答案在用户面前出现，要经历多个独立事实</desc><defs><linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C223B"/><stop offset="1" stop-color="#254761"/></linearGradient><filter id="soft"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#123752" flood-opacity=".10"/></filter><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#6B8DA6" stroke-width="1.8"/></marker><marker id="teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#138F89" stroke-width="1.8"/></marker><pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#A9C1D4" opacity=".3"/></pattern></defs><rect x="0" y="0" width="1440" height="720" rx="0" fill="#F6F9FC" stroke="none" stroke-width="1.2" /><rect x="0" y="0" width="1440" height="146" rx="0" fill="url(#navy)" stroke="none" stroke-width="1.2" /><circle cx="1387" cy="65" r="140" fill="#FFFFFF18" stroke="none" stroke-width="1"/><rect x="0" y="146" width="1440" height="574" rx="0" fill="url(#dots)" stroke="none" stroke-width="1.2" /><text x="61" y="37" fill="#81E2D6" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="740" text-anchor="start">DELIVERY / PUBLICATION + ARTIFACT + HISTORY</text><text x="58" y="94" fill="#F6FBFF" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="38" font-weight="760" text-anchor="start">从生成文字到真正交付</text><text x="61" y="125" fill="#C2D5E2" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="470" text-anchor="start">一条答案在用户面前出现，要经历多个独立事实</text><rect x="55" y="240" width="254" height="263" rx="19" fill="#FFFFFF" stroke="#D4E3ED" stroke-width="1.2" filter="url(#soft)"/><rect x="55" y="240" width="254" height="8" rx="4" fill="#5783A5" stroke="none" stroke-width="1.2" /><circle cx="102" cy="305" r="24" fill="#5783A522" stroke="none" stroke-width="1"/><text x="102" y="313" fill="#5783A5" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="780" text-anchor="middle">1</text><text x="79" y="365" fill="#5783A5" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="760" text-anchor="start">MODEL</text><text x="78" y="411" fill="#12344E" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="710" text-anchor="start">模型提出正文</text><text x="78" y="452" fill="#607B90" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start">这是候选内容</text><path d="M311 366H332" fill="none" stroke="#6C8AA1" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="335" y="240" width="254" height="263" rx="19" fill="#FFFFFF" stroke="#D4E3ED" stroke-width="1.2" filter="url(#soft)"/><rect x="335" y="240" width="254" height="8" rx="4" fill="#897BB8" stroke="none" stroke-width="1.2" /><circle cx="382" cy="305" r="24" fill="#897BB822" stroke="none" stroke-width="1"/><text x="382" y="313" fill="#897BB8" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="780" text-anchor="middle">2</text><text x="359" y="365" fill="#897BB8" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="760" text-anchor="start">PUBLICATION</text><text x="358" y="411" fill="#12344E" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="710" text-anchor="start">接纳正文版本</text><text x="358" y="452" fill="#607B90" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start">可独立发 Partial</text><path d="M591 366H612" fill="none" stroke="#6C8AA1" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="615" y="240" width="254" height="263" rx="19" fill="#FFFFFF" stroke="#D4E3ED" stroke-width="1.2" filter="url(#soft)"/><rect x="615" y="240" width="254" height="8" rx="4" fill="#14958D" stroke="none" stroke-width="1.2" /><circle cx="662" cy="305" r="24" fill="#14958D22" stroke="none" stroke-width="1"/><text x="662" y="313" fill="#14958D" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="780" text-anchor="middle">3</text><text x="639" y="365" fill="#14958D" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="760" text-anchor="start">ARTIFACT</text><text x="638" y="411" fill="#12344E" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="710" text-anchor="start">文件保存与授权</text><text x="638" y="452" fill="#607B90" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start">生成不等于可下载</text><path d="M871 366H892" fill="none" stroke="#6C8AA1" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="895" y="240" width="254" height="263" rx="19" fill="#FFFFFF" stroke="#D4E3ED" stroke-width="1.2" filter="url(#soft)"/><rect x="895" y="240" width="254" height="8" rx="4" fill="#B89562" stroke="none" stroke-width="1.2" /><circle cx="942" cy="305" r="24" fill="#B8956222" stroke="none" stroke-width="1"/><text x="942" y="313" fill="#B89562" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="780" text-anchor="middle">4</text><text x="919" y="365" fill="#B89562" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="760" text-anchor="start">HISTORY</text><text x="918" y="411" fill="#12344E" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="710" text-anchor="start">历史按版本重读</text><text x="918" y="452" fill="#607B90" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start">不能拿旧版冒充新</text><path d="M1151 366H1172" fill="none" stroke="#6C8AA1" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1175" y="240" width="254" height="263" rx="19" fill="#FFFFFF" stroke="#D4E3ED" stroke-width="1.2" filter="url(#soft)"/><rect x="1175" y="240" width="254" height="8" rx="4" fill="#497995" stroke="none" stroke-width="1.2" /><circle cx="1222" cy="305" r="24" fill="#49799522" stroke="none" stroke-width="1"/><text x="1222" y="313" fill="#497995" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="780" text-anchor="middle">5</text><text x="1199" y="365" fill="#497995" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="760" text-anchor="start">CLIENT</text><text x="1198" y="411" fill="#12344E" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="710" text-anchor="start">用户实际可见</text><text x="1198" y="452" fill="#607B90" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start">展示需要真实回执</text><rect x="77" y="560" width="1286" height="76" rx="17" fill="#E4F2EF" stroke="#B7DED5" stroke-width="1" /><circle cx="114" cy="598" r="14" fill="#0D968B" stroke="none" stroke-width="1"/><text x="143" y="605" fill="#1A6562" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="610" text-anchor="start">Run 结束、正文提交、文件可取与界面可见，不能合成一个 completed。</text><text x="78" y="692" fill="#607D91" font-family="Inter,system-ui,-apple-system,Segoe UI,Noto Sans SC,Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="470" text-anchor="start">目标不是把状态写得复杂，而是别让用户拿不到已经生成的成果</text></svg>