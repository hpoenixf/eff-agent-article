<circle cx="70" cy="613" r="6" fill="#a3523d" stroke="#a3523d" stroke-width="2"/>
<text x="92" y="621" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="31" font-weight="700" fill="#16362f" text-anchor="start" letter-spacing="0">尚未解决</text>
<text x="64" y="664" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="500" fill="#4e665e" text-anchor="start" letter-spacing="0">会改变判断的关键缺口</text>
<path d="M64 685 H576" fill="none" stroke="#cddbd1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="70" cy="719" r="6" fill="#a3523d" stroke="#a3523d" stroke-width="2"/>
<text x="92" y="727" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="31" font-weight="700" fill="#16362f" text-anchor="start" letter-spacing="0">下一步</text>
<text x="64" y="770" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="500" fill="#4e665e" text-anchor="start" letter-spacing="0">可执行方向，不新增授权</text>
