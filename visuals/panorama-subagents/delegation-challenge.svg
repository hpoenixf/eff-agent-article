<svg xmlns="http://www.w3.org/2000/svg" width="520" height="690" viewBox="0 0 520 690" role="img" aria-labelledby="title desc" lang="zh"><title id="title">委派之后，再判断质询</title><desc id="desc">并非每次 Child 都需要 Reviewer</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#49796e" stroke-width="1.7"/></marker></defs><rect width="520" height="690" rx="20" fill="#f7f8f2"/><rect x="1" y="1" width="518" height="688" rx="19" fill="none" stroke="#cddbd1"/>
<text x="28" y="32" font-family="Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#7756a0" text-anchor="start">SUBAGENT / FIELD GUIDE</text>
<text x="28" y="68" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#183e35" text-anchor="start">委派之后，再判断质询</text>
<text x="28" y="101" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="500" fill="#586d65" text-anchor="start">并非每次 Child 都需要 Reviewer</text>
<rect x="48" y="130" width="424" height="90" rx="12" fill="#f0eaf8" stroke="#c4b2da" stroke-width="1.5"/>
<text x="260.0" y="168.0" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#183e35" text-anchor="middle">是否还有重要假设</text>
<text x="260.0" y="195.0" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="500" fill="#183e35" text-anchor="middle">或独立反证价值?</text>
<path d="M150 220 V266" fill="none" stroke="#49796e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="128" y="235" width="44" height="25" rx="8" fill="#f7f8f2"/>
<text x="150" y="253" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#315c50" text-anchor="middle">否</text>
<path d="M374 220 V266" fill="none" stroke="#49796e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="352" y="235" width="44" height="25" rx="8" fill="#f7f8f2"/>
<text x="374" y="253" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#315c50" text-anchor="middle">是</text>
<rect x="28" y="266" width="220" height="124" rx="12" fill="#ffffff" stroke="#bacdc4" stroke-width="1.5"/>
<text x="138.0" y="321.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">直接交回依据、产物</text>
<text x="138.0" y="347.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">与缺口</text>
<rect x="272" y="266" width="220" height="150" rx="12" fill="#ffffff" stroke="#bacdc4" stroke-width="1.5"/>
<text x="382.0" y="321.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">可选 Reviewer、投</text>
<text x="382.0" y="347.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">资视角</text>
<text x="382.0" y="373.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">或有界 Bull/Bear</text>
<path d="M382 416 V454" fill="none" stroke="#49796e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="272" y="454" width="220" height="92" rx="12" fill="#ffffff" stroke="#bacdc4" stroke-width="1.5"/>
<text x="382.0" y="493.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">交回依据、产物与缺</text>
<text x="382.0" y="519.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">口</text>
<path d="M138 390 V580 H260 V608" fill="none" stroke="#49796e" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M382 546 V580 H260 V608" fill="none" stroke="#49796e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="608" width="424" height="66" rx="12" fill="#f0eaf8" stroke="#c4b2da" stroke-width="1.5"/>
<text x="260.0" y="647.0" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="500" fill="#183e35" text-anchor="middle">Main 核对并统一交付</text></svg>
