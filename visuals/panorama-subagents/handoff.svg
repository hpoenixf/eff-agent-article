<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1010" viewBox="0 0 640 1010" role="img" aria-labelledby="title description" lang="zh">
<title id="title">交回成果，也交回缺口</title><desc id="description">交回成果，也交回缺口</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#cddbd1" opacity=".45"/></pattern><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#f7f8f2"/><stop offset="1" stop-color="#eae3f5"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#16362f" flood-opacity=".09"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#7054a0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="640" height="1010" rx="24" fill="#f7f8f2"/><rect x="1" y="1" width="638" height="1008" rx="23" fill="url(#grid)" stroke="#cddbd1"/>
<text x="40" y="48" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#7054a0" text-anchor="start" letter-spacing="2">AGENT / PANORAMA</text>
<text x="40" y="100" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="35" font-weight="750" fill="#16362f" text-anchor="start" letter-spacing="0">交回成果，也交回缺口</text>
<rect x="40" y="140" width="560" height="72" rx="18" fill="white" stroke="#cddbd1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="66" y="185" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#16362f" text-anchor="start" letter-spacing="0">Child 自主工作</text>
<path d="M320 212 V236 H173 V260" fill="none" stroke="#7054a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M320 236 H467 V260" fill="none" stroke="#7054a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="270" width="266" height="95" rx="18" fill="white" stroke="#cddbd1" stroke-width="1.5"/>
<text x="173" y="310" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="29" font-weight="650" fill="#16362f" text-anchor="middle" letter-spacing="0">有依据的发现</text>
<rect x="334" y="270" width="266" height="95" rx="18" fill="white" stroke="#cddbd1" stroke-width="1.5"/>
<text x="467" y="310" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="29" font-weight="650" fill="#16362f" text-anchor="middle" letter-spacing="0">局部失败</text>
<path d="M467 365 V390" fill="none" stroke="#7054a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="334" y="400" width="266" height="135" rx="18" fill="#eae3f5" stroke="#eae3f5" stroke-width="1.5"/>
<text x="467" y="443" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="600" fill="#16362f" text-anchor="middle" letter-spacing="0">可修复则有限修复</text>
<text x="467" y="478.1" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="600" fill="#16362f" text-anchor="middle" letter-spacing="0">否则明确缺口</text>
<path d="M600 435 H620 V176 H606" fill="none" stroke="#7054a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
<path d="M173 365 V567 H320 V588" fill="none" stroke="#7054a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M467 535 V567 H320" fill="none" stroke="#7054a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="596" width="560" height="112" rx="18" fill="white" stroke="#cddbd1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="66" y="641" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="31" font-weight="700" fill="#16362f" text-anchor="start" letter-spacing="0">成果交接</text>
<text x="66" y="680" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="500" fill="#4e665e" text-anchor="start" letter-spacing="0">摘要、原始依据、产物与缺口</text>
<path d="M320 708 V731" fill="none" stroke="#7054a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="739" width="560" height="72" rx="18" fill="white" stroke="#cddbd1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="66" y="784" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700" fill="#16362f" text-anchor="start" letter-spacing="0">Main 综合与按需回读</text>
<path d="M600 760 H620 V838 H604" fill="none" stroke="#7054a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
<path d="M40 776 H20 V868 H34" fill="none" stroke="#7054a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="826" width="560" height="72" rx="18" fill="white" stroke="#cddbd1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="66" y="871" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="29" font-weight="700" fill="#16362f" text-anchor="start" letter-spacing="0">发布独立获准的回答</text>
<text x="40" y="946" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="600" fill="#7054a0" text-anchor="start" letter-spacing="0">修复受原预算与取消约束</text>
<text x="40" y="981.1" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="600" fill="#7054a0" text-anchor="start" letter-spacing="0">回读依据不等于复制全部历史</text>
</svg>
