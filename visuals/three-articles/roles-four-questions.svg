<svg xmlns="http://www.w3.org/2000/svg" width="390" height="575" viewBox="0 0 390 575" role="img" aria-labelledby="t d"><title id="t">四个角色，四种问题</title><desc id="d">专家规定方法，子Agent承担执行，Review检查报告，Judge按规则评价。不是必经流水线。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#728091" stroke-width="1.5"/></marker></defs><rect width="390" height="575" rx="20" fill="#f4f6f8"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172838}.title{font-size:23px;font-weight:700}.label{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#536577}</style><text x="24" y="40" class="title">四个角色，四种问题</text><text x="24" y="68" class="small">不是必经流水线，也不是能力等级。</text><rect x="22" y="88" width="346" height="92" rx="13" fill="white"/><rect x="22" y="88" width="5" height="92" rx="2" fill="#356f91"/><text x="40" y="117" class="label">专家配置｜怎么做？</text><text x="40" y="145" class="body">一份可复用的研究方法</text><rect x="22" y="196" width="346" height="92" rx="13" fill="white"/><rect x="22" y="196" width="5" height="92" rx="2" fill="#26837e"/><text x="40" y="225" class="label">Subagent｜谁来做？</text><text x="40" y="253" class="body">一次有边界的局部执行</text><rect x="22" y="304" width="346" height="92" rx="13" fill="white"/><rect x="22" y="304" width="5" height="92" rx="2" fill="#a66c35"/><text x="40" y="333" class="label">Review｜哪里要再看？</text><text x="40" y="361" class="body">针对固定报告的复核意见</text><rect x="22" y="412" width="346" height="92" rx="13" fill="white"/><rect x="22" y="412" width="5" height="92" rx="2" fill="#76579c"/><text x="40" y="441" class="label">Judge｜按什么评价？</text><text x="40" y="469" class="body">按标准评价一个或多个结果</text><text x="24" y="544" class="small">同一个模型，可以承担不同职责。</text></svg>