<svg xmlns="http://www.w3.org/2000/svg" width="720" height="770" viewBox="0 0 720 770" role="img">
<title>把一次研究留下来</title>
<rect width="720" height="770" rx="24" fill="#f3f6fb"/>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="40" y="66" font-size="36" font-weight="700" fill="#142d4e">把一次研究留下来</text>
<rect x="36" y="100" width="648" height="180" rx="20" fill="white" stroke="#ccd8e8"/>
<rect x="36" y="100" width="9" height="180" rx="4" fill="#367b91"/>
<text x="65" y="148" font-size="32" font-weight="700" fill="#174c68">01  固定资料</text>
<text x="65" y="199" font-size="29" fill="#253b54">明确选文件或网页</text>
<text x="65" y="244" font-size="29" fill="#253b54">保留原文与来源身份</text>
<path d="M350 290 l10 14 10 -14" fill="none" stroke="#367b91" stroke-width="4"/>
<rect x="36" y="315" width="648" height="180" rx="20" fill="white" stroke="#ccd8e8"/>
<rect x="36" y="315" width="9" height="180" rx="4" fill="#367b91"/>
<text x="65" y="363" font-size="32" font-weight="700" fill="#174c68">02  保存报告</text>
<text x="65" y="414" font-size="29" fill="#253b54">主 Agent 整理结论</text>
<text x="65" y="459" font-size="29" fill="#253b54">冻结可打开的报告修订</text>
<path d="M350 505 l10 14 10 -14" fill="none" stroke="#367b91" stroke-width="4"/>
<rect x="36" y="530" width="648" height="180" rx="20" fill="white" stroke="#ccd8e8"/>
<rect x="36" y="530" width="9" height="180" rx="4" fill="#367b91"/>
<text x="65" y="578" font-size="32" font-weight="700" fill="#174c68">03  独立复核</text>
<text x="65" y="629" font-size="29" fill="#253b54">检查同一稿与原始来源</text>
<text x="65" y="674" font-size="29" fill="#253b54">单独保存意见，不覆盖原稿</text>
</g></svg>