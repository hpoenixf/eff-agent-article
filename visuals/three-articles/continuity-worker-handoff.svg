<svg xmlns="http://www.w3.org/2000/svg" width="760" height="555" viewBox="0 0 760 555" role="img" aria-labelledby="title desc"><title id="title">执行者可以换，Run 不重开</title><desc id="desc">主机停止后新的Worker按原身份与租约继续，并保留未知效果</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#557779" stroke-width="1.5"/></marker></defs><rect width="760" height="555" rx="28" fill="#f3f6f2"/><style>text{font-family:'Noto Sans CJK SC','Noto Sans',sans-serif;fill:#18393b}.title{font-size:35px;font-weight:700}.label{font-size:30px;font-weight:700}.body{font-size:28px}.note{font-size:26px;fill:#456365}.num{font-size:26px;fill:#fff;font-weight:700}</style><text x="36" y="58" class="title">执行者可以换，Run 不重开</text><rect x="30" y="94" width="700" height="115" rx="18" fill="#dfeee6"/><text x="54" y="135" class="label">同一个 Run</text><text x="54" y="180" class="body">问题 · 资料 · 权限 · 预算 · 已存结果</text><rect x="30" y="247" width="300" height="118" rx="18" fill="#ffffff"/><rect x="430" y="247" width="300" height="118" rx="18" fill="#ffffff"/><text x="58" y="291" class="label">Worker A</text><text x="58" y="338" class="body">主机停止</text><text x="458" y="291" class="label">Worker B</text><text x="458" y="338" class="body">领取原执行权</text><path d="M340,305 L420,305" fill="none" stroke="#557779" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="406" width="700" height="118" rx="18" fill="#e6e7f2"/><text x="54" y="450" class="label">换进程，不换原承诺</text><text x="54" y="492" class="body">未知请求仍是未知，不自动重发。</text></svg>