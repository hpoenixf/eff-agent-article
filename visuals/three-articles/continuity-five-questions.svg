<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" role="img" aria-labelledby="title desc"><title id="title">同一件事，五个不同的问题</title><desc id="desc">五个概念按责任区分，不表示五层架构</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#557779" stroke-width="1.5"/></marker></defs><rect width="760" height="640" rx="28" fill="#f3f6f2"/><style>text{font-family:'Noto Sans CJK SC','Noto Sans',sans-serif;fill:#18393b}.title{font-size:35px;font-weight:700}.label{font-size:30px;font-weight:700}.body{font-size:28px}.note{font-size:26px;fill:#456365}.num{font-size:26px;fill:#fff;font-weight:700}</style><text x="36" y="58" class="title">同一件事，五个不同的问题</text><rect x="30" y="92" width="700" height="88" rx="18" fill="#ffffff"/><text x="50" y="127" class="label">Task 任务</text><text x="50" y="164" class="body">还欠用户什么？</text><rect x="30" y="196" width="700" height="88" rx="18" fill="#ffffff"/><text x="50" y="231" class="label">Session 会话 / 记录</text><text x="50" y="268" class="body">保留什么关联与状态？</text><rect x="30" y="300" width="700" height="88" rx="18" fill="#ffffff"/><text x="50" y="335" class="label">Run 一次运行</text><text x="50" y="372" class="body">这一轮做到哪里？</text><rect x="30" y="404" width="700" height="88" rx="18" fill="#ffffff"/><text x="50" y="439" class="label">Worker 执行者</text><text x="50" y="476" class="body">现在由谁推进？</text><rect x="30" y="508" width="700" height="88" rx="18" fill="#ffffff"/><text x="50" y="543" class="label">Schedule 计划</text><text x="50" y="580" class="body">什么时候有执行机会？</text><text x="36" y="624" class="note">先辨认责任，再决定是否拆成模块。</text></svg>