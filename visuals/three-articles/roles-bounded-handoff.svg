<svg xmlns="http://www.w3.org/2000/svg" width="390" height="566" viewBox="0 0 390 566" role="img" aria-labelledby="t d"><title id="t">分出去的是一小块工作</title><desc id="d">Main选定问题方法与资料，Child返回发现和原始来源，Main负责综合，根权限和预算始终有效。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#728091" stroke-width="1.5"/></marker></defs><rect width="390" height="566" rx="20" fill="#f4f6f8"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172838}.title{font-size:23px;font-weight:700}.label{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#536577}</style><text x="24" y="40" class="title">分出去的是一小块工作</text><rect x="22" y="76" width="346" height="112" rx="13" fill="white"/><rect x="22" y="76" width="5" height="112" rx="2" fill="#356f91"/><text x="40" y="105" class="label">Main：提出局部问题</text><text x="40" y="133" class="body">核对两份资料的费用口径</text><text x="40" y="158" class="body">给定方法与获准资料</text><path d="M195 192V218" stroke="#728091" stroke-width="2" marker-end="url(#arr)"/><rect x="22" y="230" width="346" height="112" rx="13" fill="white"/><rect x="22" y="230" width="5" height="112" rx="2" fill="#26837e"/><text x="40" y="259" class="label">Child：在边界内执行</text><text x="40" y="287" class="body">独立上下文核查</text><text x="40" y="312" class="body">交回发现、限制与来源</text><path d="M195 346V372" stroke="#728091" stroke-width="2" marker-end="url(#arr)"/><rect x="22" y="384" width="346" height="92" rx="13" fill="white"/><rect x="22" y="384" width="5" height="92" rx="2" fill="#356f91"/><text x="40" y="413" class="label">Main：决定如何综合</text><text x="40" y="441" class="body">读到摘要 ≠ 已采纳判断</text><text x="24" y="511" class="small">根任务的权限与预算贯穿全程。</text><text x="24" y="536" class="small">当前公开 Child 不等于并行团队。</text></svg>