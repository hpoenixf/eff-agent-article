<svg xmlns="http://www.w3.org/2000/svg" width="760" height="660" viewBox="0 0 760 660" role="img" aria-labelledby="title desc"><title id="title">Schedule 给机会，不给结果</title><desc id="desc">一次性计划的过早、窗口内、错过三个分支；公开入口必须显式调用</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#557779" stroke-width="1.5"/></marker></defs><rect width="760" height="660" rx="28" fill="#f3f6f2"/><style>text{font-family:'Noto Sans CJK SC','Noto Sans',sans-serif;fill:#18393b}.title{font-size:35px;font-weight:700}.label{font-size:30px;font-weight:700}.body{font-size:28px}.note{font-size:26px;fill:#456365}.num{font-size:26px;fill:#fff;font-weight:700}</style><text x="36" y="58" class="title">Schedule 给机会，不给结果</text><rect x="30" y="94" width="700" height="92" rx="18" fill="#dfeee6"/><text x="54" y="132" class="label">已确认的一次性计划</text><text x="54" y="170" class="body">明确时刻、时区和允许迟到窗口</text><rect x="30" y="220" width="700" height="104" rx="18" fill="#fff"/><text x="54" y="262" class="label">还没到时间</text><text x="54" y="304" class="body">不执行，也不假装后台等待</text><rect x="30" y="342" width="700" height="104" rx="18" fill="#dfeee6"/><text x="54" y="384" class="label">仍在允许窗口</text><text x="54" y="426" class="body">通过原规则 → 物化并执行 Run</text><rect x="30" y="464" width="700" height="104" rx="18" fill="#f4e4d8"/><text x="54" y="506" class="label">已经超过窗口</text><text x="54" y="548" class="body">记录 missed，不悄悄补开 Run</text><text x="36" y="634" class="note">公开入口需显式 run-due，不会自动唤醒。</text></svg>