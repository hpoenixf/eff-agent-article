<svg xmlns="http://www.w3.org/2000/svg" width="390" height="598" viewBox="0 0 390 598" role="img" aria-labelledby="t d"><title id="t">复核有意见，没有改写权</title><desc id="d">固定报告和来源输入Review，输出支持关系与引用对应，读者决定是否修改，原报告保留。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#728091" stroke-width="1.5"/></marker></defs><rect width="390" height="598" rx="20" fill="#f4f6f8"/><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172838}.title{font-size:23px;font-weight:700}.label{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#536577}</style><text x="24" y="40" class="title">复核有意见，没有改写权</text><rect x="22" y="76" width="346" height="114" rx="13" fill="white"/><rect x="22" y="76" width="5" height="114" rx="2" fill="#356f91"/><text x="40" y="105" class="label">固定输入</text><text x="40" y="133" class="body">原报告版本＋原始来源</text><text x="40" y="158" class="body">不能偷偷换成“最新材料”</text><path d="M195 194V216" stroke="#728091" stroke-width="2" marker-end="url(#arr)"/><rect x="22" y="228" width="346" height="138" rx="13" fill="white"/><rect x="22" y="228" width="5" height="138" rx="2" fill="#a66c35"/><text x="40" y="257" class="label">Review：分别检查</text><text x="40" y="285" class="body">材料能否支持这句话？</text><text x="40" y="310" class="body">实际引用是否对应？</text><text x="40" y="335" class="body">哪些内容没有检查？</text><path d="M195 370V392" stroke="#728091" stroke-width="2" marker-end="url(#arr)"/><rect x="22" y="404" width="346" height="113" rx="13" fill="white"/><rect x="22" y="404" width="5" height="113" rx="2" fill="#76579c"/><text x="40" y="433" class="label">读者：决定是否修改</text><text x="40" y="461" class="body">原报告保留</text><text x="40" y="486" class="body">修改后另存新版本</text><text x="24" y="553" class="small">无搜索、无自动修复、无发布权。</text></svg>