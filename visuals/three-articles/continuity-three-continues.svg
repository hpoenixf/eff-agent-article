<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc"><title id="title">“继续”有三种不同操作</title><desc id="desc">选择依据是原运行状态、输入是否变化、是否未来触发，不是自然语言表面词语</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#557779" stroke-width="1.5"/></marker></defs><rect width="760" height="650" rx="28" fill="#f3f6f2"/><style>text{font-family:'Noto Sans CJK SC','Noto Sans',sans-serif;fill:#18393b}.title{font-size:35px;font-weight:700}.label{font-size:30px;font-weight:700}.body{font-size:28px}.note{font-size:26px;fill:#456365}.num{font-size:26px;fill:#fff;font-weight:700}</style><text x="36" y="58" class="title">“继续”有三种不同操作</text><rect x="30" y="92" width="700" height="158" rx="18" fill="#dfeee6"/><text x="54" y="134" class="label">原运行未结束</text><text x="54" y="177" class="body">输入没变，只是主机停了</text><text x="54" y="221" class="label">→ 接续原 Run</text><rect x="30" y="270" width="700" height="158" rx="18" fill="#e6e7f2"/><text x="54" y="312" class="label">原运行已结束 / 输入变了</text><text x="54" y="355" class="body">新公告、新问题或新的研究轮次</text><text x="54" y="399" class="label">→ 保留旧结果，提交新 Run</text><rect x="30" y="448" width="700" height="158" rx="18" fill="#f4e4d8"/><text x="54" y="490" class="label">希望到未来再开始</text><text x="54" y="533" class="body">先约定时刻与错过后的处理</text><text x="54" y="577" class="label">→ 保存计划，等待显式触发</text></svg>