name: Article Library · Checks & Legacy Redirects

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: article-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check current article backlinks against fixed Runtime qualification
        run: |
          node --test --test-concurrency=1 scripts/check-article-backlinks.test.mjs
          node scripts/check-article-backlinks.mjs --article
          node scripts/sync-open-etf-topic.mjs --check
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1' # GitHub runner already ships Chrome
      - name: Check articles and links
        run: npm run check:catalog
      - name: Install measured CJK diagram fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fontconfig
          fc-match -f '%{family}\n' 'Noto Sans CJK SC:lang=zh-cn'
      - name: Build reading site
        run: npm run docs:build
      - name: Verify principles entry and static discovery
        run: |
          test -f .vitepress/dist/sitemap.xml
          test -f .vitepress/dist/principles.html
          test -f .vitepress/dist/en/principles.html
          grep -q 'id="principle-4"' .vitepress/dist/principles.html
          grep -q 'id="method-6"' .vitepress/dist/principles.html
          grep -q 'rel="canonical"' .vitepress/dist/principles.html
          grep -q 'eff-agent-article/principles' .vitepress/dist/articles/agent-veto-authority-and-run-termination.html
          grep -q 'principles#principle-6' .vitepress/dist/articles/022-agent-entry-from-intent-to-direct-research.html
          grep -q 'principles#method-1' .vitepress/dist/articles/022-agent-entry-from-intent-to-direct-research.html
          grep -q 'en/principles#principle-5' .vitepress/dist/en/articles/agent-main-run-context-compaction.html
      - name: Verify bilingual topic output and home discovery
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          import assert from 'node:assert/strict'
          for (const route of ['open-etf-agent', 'en/open-etf-agent']) {
            const bytes = readFileSync(`.vitepress/dist/${route}.html`)
            const html = bytes.toString('utf8')
            assert.equal((html.match(/<h1[ >]/g) || []).length, 1)
            assert.ok(html.includes('https://hpoenixf.com/eff-agent-article/' + route))
            assert.ok(html.includes('hreflang="en"') && html.includes('hreflang="zh-CN"'))
            assert.ok(html.includes('id="reading"') && html.includes('id="versions"'))
            assert.ok(html.includes('oet-article') && html.includes('?lang=zh'))
            console.log(JSON.stringify({ route, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') }))
          }
          for (const route of ['index', 'en/index']) {
            const html = readFileSync(`.vitepress/dist/${route}.html`, 'utf8')
            assert.ok(!html.includes('class="oet-entry"'))
            const prefix = route.startsWith('en/') ? '/en' : ''
            assert.ok(html.includes('href="/eff-agent-article' + prefix + '/open-etf-agent"'))
            assert.ok(html.includes('href="/eff-agent-article/about"'))
          }
          const about = readFileSync('.vitepress/dist/about.html', 'utf8')
          assert.ok(about.includes('10 年开发经验'))
          assert.ok(about.includes('10 years of software development experience'))
          assert.ok(about.includes('/eff-agent-article/images/wechat-public-account.jpg'))
          NODE
      - name: Include portable visual collection
        run: |
          cp -R visuals .vitepress/dist/visuals
          test -f .vitepress/dist/index.html
          test -f .vitepress/dist/articles/017-prompt-to-answer-six-layer-panorama.html
          test -f .vitepress/dist/visuals/017-prompt-to-answer-six-layer-panorama/index.html
      - name: Test legacy redirect contract
        run: node --test scripts/build-legacy-redirects.test.mjs
      - name: Build redirect-only legacy site
        run: node scripts/build-legacy-redirects.mjs
      # Canonical article bodies are deployed only by hpoenixf/myblog-v2.
      # This public repo can build before the owner enables GitHub Pages.
      # GITHUB_TOKEN cannot enable a Pages site; initial enablement is a repo setting.
      - name: Setup Pages
        if: github.event_name != 'pull_request' && github.event.repository.has_pages == true
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.event.repository.has_pages == true
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/legacy-redirects

  deploy:
    if: github.event_name != 'pull_request' && github.event.repository.has_pages == true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy legacy redirects (no article bodies)
        id: deployment
        uses: actions/deploy-pages@v4


