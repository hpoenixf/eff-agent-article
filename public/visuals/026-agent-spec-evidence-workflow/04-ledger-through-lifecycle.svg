<svg xmlns="http://www.w3.org/2000/svg" width="720" height="780" viewBox="0 0 720 780" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">证据贯穿开发，不是最后补写</title><desc id="desc">基线在实现前记录，执行时追加，Verify 从已记录事实生成。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#116b61"/></marker></defs>
<g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif">
<rect width="720" height="780" rx="24" fill="#f7f5ef"/>
<path d="M36 36 H82" stroke="#116b61" stroke-width="6"/>
<text x="100" y="46" font-size="24" font-weight="600" fill="#52656c">ENGINEERING EVIDENCE</text><text x="684" y="48" font-size="28" font-weight="600" fill="#116b61" text-anchor="end">04</text>
<text x="36" y="106" font-size="40" font-weight="700" fill="#17313b">证据贯穿开发，不是最后补写</text>
<rect x="36" y="150" width="204" height="164" rx="18" fill="#fffefa" stroke="#d8ded9"/><text x="54" y="192" font-size="27" font-weight="700" fill="#116b61">计划</text><text x="54" y="244" font-size="25" font-weight="500" fill="#17313b">提案 · 设计</text><text x="54" y="282" font-size="23" font-weight="400" fill="#52656c">规范增量 / 任务</text><path d="M138 316 L138 356" fill="none" stroke="#116b61" stroke-width="3" marker-end="url(#arrow)"/><rect x="258" y="150" width="204" height="164" rx="18" fill="#fffefa" stroke="#d8ded9"/><text x="276" y="192" font-size="27" font-weight="700" fill="#116b61">实现</text><text x="276" y="244" font-size="25" font-weight="500" fill="#17313b">RED → GREEN</text><text x="276" y="282" font-size="23" font-weight="400" fill="#52656c">实际执行 / 检查</text><path d="M360 316 L360 356" fill="none" stroke="#116b61" stroke-width="3" marker-end="url(#arrow)"/><rect x="480" y="150" width="204" height="164" rx="18" fill="#fffefa" stroke="#d8ded9"/><text x="498" y="192" font-size="27" font-weight="700" fill="#116b61">收尾</text><text x="498" y="244" font-size="25" font-weight="500" fill="#17313b">验证视图</text><text x="498" y="282" font-size="23" font-weight="400" fill="#52656c">验收 / 历史交接</text><path d="M582 316 L582 356" fill="none" stroke="#116b61" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="364" width="648" height="122" rx="18" fill="#17313b" stroke="#17313b"/><text x="58" y="407" font-size="29" font-weight="700" fill="#fffefa">一份持续追加的证据账本</text><text x="58" y="454" font-size="28" font-weight="500" fill="#b7d8d1">基线 / 未采集 → 执行观察 → 关闭回执</text><path d="M360 488 L360 528" fill="none" stroke="#116b61" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="536" width="648" height="158" rx="18" fill="#e6f1ec" stroke="#e6f1ec"/><text x="58" y="579" font-size="31" font-weight="700" fill="#116b61">Verify 是视图，不是第二份事实</text><text x="58" y="626" font-size="28" font-weight="400" fill="#17313b">保留原始日期、版本和观察范围</text><text x="58" y="667" font-size="28" font-weight="400" fill="#17313b">输入变了，检测陈旧；不伪造新执行</text><text x="36" y="741" font-size="25" font-weight="400" fill="#52656c">不覆盖手写 Verify；生成过程不执行验收。</text>
</g></svg>
