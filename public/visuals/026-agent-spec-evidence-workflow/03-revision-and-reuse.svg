<svg xmlns="http://www.w3.org/2000/svg" width="720" height="800" viewBox="0 0 720 800" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">历史事实保留，适用范围重判</title><desc id="desc">新提交不会改写旧观察，旧观察也不能自动证明新版本。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#116b61"/></marker></defs>
<g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif">
<rect width="720" height="800" rx="24" fill="#f7f5ef"/>
<path d="M36 36 H82" stroke="#116b61" stroke-width="6"/>
<text x="100" y="46" font-size="24" font-weight="600" fill="#52656c">ENGINEERING EVIDENCE</text><text x="684" y="48" font-size="28" font-weight="600" fill="#116b61" text-anchor="end">03</text>
<text x="36" y="106" font-size="40" font-weight="700" fill="#17313b">历史事实保留，适用范围重判</text>
<rect x="36" y="150" width="302" height="128" rx="18" fill="#e6f1ec" stroke="#e6f1ec"/><rect x="382" y="150" width="302" height="128" rx="18" fill="#fffefa" stroke="#d8ded9"/><text x="58" y="192" font-size="28" font-weight="700" fill="#116b61">版本 A</text><text x="58" y="240" font-size="26" font-weight="500" fill="#17313b">保留原测试结果</text><text x="404" y="192" font-size="28" font-weight="700" fill="#17313b">版本 B</text><text x="404" y="240" font-size="25" font-weight="500" fill="#17313b">重新判断适用性</text><path d="M340 214 L378 214" fill="none" stroke="#116b61" stroke-width="3" marker-end="url(#arrow)"/><text x="36" y="330" font-size="28" font-weight="600" fill="#17313b">比较相关行为、配置、测试与外部条件</text><rect x="36" y="360" width="648" height="102" rx="18" fill="#fae8dc" stroke="#fae8dc"/><circle cx="77" cy="409" r="23" fill="#a6452c"/><text x="77" y="419" font-size="28" font-weight="600" fill="#fffefa" text-anchor="middle">1</text><text x="116" y="400" font-size="28" font-weight="600" fill="#17313b">影响被测行为或输入</text><text x="116" y="440" font-size="28" font-weight="400" fill="#a6452c">重验受影响范围</text><rect x="36" y="479" width="648" height="102" rx="18" fill="#e6f1ec" stroke="#e6f1ec"/><circle cx="77" cy="528" r="23" fill="#116b61"/><text x="77" y="538" font-size="28" font-weight="600" fill="#fffefa" text-anchor="middle">2</text><text x="116" y="519" font-size="28" font-weight="600" fill="#17313b">仅文字变化，原条件仍成立</text><text x="116" y="559" font-size="28" font-weight="400" fill="#116b61">注明复用；保留原日期</text><rect x="36" y="598" width="648" height="102" rx="18" fill="#fffefa" stroke="#d8ded9"/><circle cx="77" cy="647" r="23" fill="#17313b"/><text x="77" y="657" font-size="28" font-weight="600" fill="#fffefa" text-anchor="middle">3</text><text x="116" y="638" font-size="28" font-weight="600" fill="#17313b">无法确认是否受影响</text><text x="116" y="678" font-size="28" font-weight="400" fill="#17313b">保留未验证，不升级结论</text><text x="36" y="765" font-size="25" font-weight="400" fill="#52656c">这是影响分析，不是 CLI 自动判定源码等价。</text>
</g></svg>
