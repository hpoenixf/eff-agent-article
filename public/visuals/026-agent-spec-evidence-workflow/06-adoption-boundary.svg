<svg xmlns="http://www.w3.org/2000/svg" width="720" height="782" viewBox="0 0 720 782" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">按协作成本与风险，选择最小方案</title><desc id="desc">根据现有证据能力、协作交接与受保护效果选择机制，不把完整工作流强加给每个小改动。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#116b61"/></marker></defs>
<g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif">
<rect width="720" height="782" rx="24" fill="#f7f5ef"/>
<path d="M36 36 H82" stroke="#116b61" stroke-width="6"/>
<text x="100" y="46" font-size="24" font-weight="600" fill="#52656c">ENGINEERING EVIDENCE</text><text x="684" y="48" font-size="28" font-weight="600" fill="#116b61" text-anchor="end">06</text>
<text x="36" y="106" font-size="40" font-weight="700" fill="#17313b">按协作成本与风险，选择最小方案</text>
<rect x="36" y="150" width="648" height="164" rx="18" fill="#fffefa" stroke="#d8ded9"/><text x="58" y="193" font-size="27" font-weight="700" fill="#17313b">01</text><text x="120" y="193" font-size="31" font-weight="700" fill="#17313b">简单、一次性修改</text><text x="58" y="243" font-size="30" font-weight="600" fill="#17313b">PR 描述 + 对应 CI 记录</text><text x="58" y="287" font-size="27" font-weight="400" fill="#52656c">能回答问题，就不用再加一层。</text><rect x="36" y="333" width="648" height="164" rx="18" fill="#e6f1ec" stroke="#e6f1ec"/><text x="58" y="376" font-size="27" font-weight="700" fill="#116b61">02</text><text x="120" y="376" font-size="31" font-weight="700" fill="#17313b">跨轮、跨 Agent 协作</text><text x="58" y="426" font-size="30" font-weight="600" fill="#116b61">要求 → 执行 → 版本 → 结论</text><text x="58" y="470" font-size="27" font-weight="400" fill="#52656c">增加轻量索引，不复制原始日志。</text><rect x="36" y="516" width="648" height="164" rx="18" fill="#fae8dc" stroke="#fae8dc"/><text x="58" y="559" font-size="27" font-weight="700" fill="#a6452c">03</text><text x="120" y="559" font-size="31" font-weight="700" fill="#17313b">权限、资金与外部动作</text><text x="58" y="609" font-size="30" font-weight="600" fill="#a6452c">可信执行 + 受保护的验收</text><text x="58" y="653" font-size="27" font-weight="400" fill="#52656c">账本辅助追溯，不能自证真实。</text><text x="36" y="742" font-size="27" font-weight="600" fill="#17313b">增加的是决策所需信息，不是表格数量。</text>
</g></svg>
