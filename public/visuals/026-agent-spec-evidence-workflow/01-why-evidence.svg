<svg xmlns="http://www.w3.org/2000/svg" width="720" height="746" viewBox="0 0 720 746" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">绿灯之间，还缺一条解释链</title><desc id="desc">证据索引连接不同工具保存的事实；已有 CI 能提供同等关联时无需重复建设。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#116b61"/></marker></defs>
<g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif">
<rect width="720" height="746" rx="24" fill="#f7f5ef"/>
<path d="M36 36 H82" stroke="#116b61" stroke-width="6"/>
<text x="100" y="46" font-size="24" font-weight="600" fill="#52656c">ENGINEERING EVIDENCE</text><text x="684" y="48" font-size="28" font-weight="600" fill="#116b61" text-anchor="end">01</text>
<text x="36" y="106" font-size="40" font-weight="700" fill="#17313b">绿灯之间，还缺一条解释链</text>
<rect x="36" y="150" width="648" height="112" rx="18" fill="#fffefa" stroke="#d8ded9"/><text x="58" y="193" font-size="28" font-weight="700" fill="#116b61">SPEC</text><text x="190" y="194" font-size="31" font-weight="600" fill="#17313b">约定了什么？</text><text x="190" y="234" font-size="27" font-weight="400" fill="#52656c">要求与验收条件</text><rect x="36" y="280" width="648" height="112" rx="18" fill="#fffefa" stroke="#d8ded9"/><text x="58" y="323" font-size="28" font-weight="700" fill="#116b61">GIT</text><text x="190" y="324" font-size="31" font-weight="600" fill="#17313b">改了哪个版本？</text><text x="190" y="364" font-size="27" font-weight="400" fill="#52656c">源码与变更历史</text><rect x="36" y="410" width="648" height="112" rx="18" fill="#fffefa" stroke="#d8ded9"/><text x="58" y="453" font-size="28" font-weight="700" fill="#116b61">CI</text><text x="190" y="454" font-size="31" font-weight="600" fill="#17313b">实际检查了什么？</text><text x="190" y="494" font-size="27" font-weight="400" fill="#52656c">执行身份、结果与产物</text><path d="M90 522 L90 562" fill="none" stroke="#116b61" stroke-width="2" stroke-dasharray="7 7"/><path d="M360 522 L360 562" fill="none" stroke="#116b61" stroke-width="2" stroke-dasharray="7 7"/><path d="M630 522 L630 562" fill="none" stroke="#116b61" stroke-width="2" stroke-dasharray="7 7"/><rect x="36" y="560" width="648" height="150" rx="18" fill="#e6f1ec" stroke="#e6f1ec"/><text x="58" y="605" font-size="30" font-weight="600" fill="#116b61">缺的是关联，不一定是新工具</text><text x="58" y="645" font-size="30" font-weight="600" fill="#116b61">哪条要求，由哪次执行，</text><text x="58" y="685" font-size="30" font-weight="600" fill="#116b61">在什么条件下得到支持？</text>
</g></svg>
