<svg xmlns="http://www.w3.org/2000/svg" width="720" height="818" viewBox="0 0 720 818" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">证据支持的是有条件的主张</title><desc id="desc">教学示例：主张、执行条件、观察和原始产物共同限定结论。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#116b61"/></marker></defs>
<g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif">
<rect width="720" height="818" rx="24" fill="#f7f5ef"/>
<path d="M36 36 H82" stroke="#116b61" stroke-width="6"/>
<text x="100" y="46" font-size="24" font-weight="600" fill="#52656c">ENGINEERING EVIDENCE</text><text x="684" y="48" font-size="28" font-weight="600" fill="#116b61" text-anchor="end">02</text>
<text x="36" y="106" font-size="40" font-weight="700" fill="#17313b">证据支持的是有条件的主张</text>
<rect x="36" y="150" width="648" height="110" rx="18" fill="#17313b" stroke="#17313b"/><text x="58" y="190" font-size="26" font-weight="600" fill="#b7d8d1">要判断的主张</text><text x="58" y="235" font-size="32" font-weight="600" fill="#fffefa">新增来源不会扩大访问权限</text><path d="M360 262 L360 294" fill="none" stroke="#116b61" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="300" width="648" height="270" rx="18" fill="#fffefa" stroke="#d8ded9"/><text x="58" y="344" font-size="28" font-weight="700" fill="#116b61">EV-01  ·  关联到这条要求</text><text x="58" y="391" font-size="27" font-weight="600" fill="#52656c">对象</text><text x="218" y="391" font-size="28" font-weight="400" fill="#17313b">版本 A / 权限拒绝场景</text><text x="58" y="440" font-size="27" font-weight="600" fill="#52656c">执行</text><text x="218" y="440" font-size="28" font-weight="400" fill="#17313b">隔离环境 / 定向测试</text><text x="58" y="489" font-size="27" font-weight="600" fill="#52656c">观察</text><text x="218" y="489" font-size="28" font-weight="400" fill="#17313b">越权请求被拒绝</text><text x="58" y="538" font-size="27" font-weight="600" fill="#52656c">出处</text><text x="218" y="538" font-size="28" font-weight="400" fill="#17313b">运行身份 / 原始输出</text><path d="M360 572 L360 604" fill="none" stroke="#116b61" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="610" width="648" height="130" rx="18" fill="#e6f1ec" stroke="#e6f1ec"/><text x="58" y="654" font-size="29" font-weight="600" fill="#116b61">支持：A 的这条被测拒绝路径</text><text x="58" y="698" font-size="29" font-weight="600" fill="#116b61">没有证明：全部权限路径都正确</text><text x="36" y="783" font-size="26" font-weight="400" fill="#52656c">可定位的记录，仍需可信执行与充分测试。</text>
</g></svg>
