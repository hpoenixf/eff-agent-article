<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">完成不是一串自动升级的绿灯</title><desc id="desc">本地、集成、模型评测是独立维度；必要门禁缺失时不能关闭该范围，关闭不等于发布。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#116b61"/></marker></defs>
<g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif">
<rect width="720" height="840" rx="24" fill="#f7f5ef"/>
<path d="M36 36 H82" stroke="#116b61" stroke-width="6"/>
<text x="100" y="46" font-size="24" font-weight="600" fill="#52656c">ENGINEERING EVIDENCE</text><text x="684" y="48" font-size="28" font-weight="600" fill="#116b61" text-anchor="end">05</text>
<text x="36" y="106" font-size="40" font-weight="700" fill="#17313b">完成不是一串自动升级的绿灯</text>
<text x="36" y="151" font-size="25" font-weight="400" fill="#52656c">教学示例 · 先明确这次承诺的验收范围</text><rect x="36" y="176" width="648" height="90" rx="18" fill="#e6f1ec" stroke="#e6f1ec"/><text x="58" y="212" font-size="29" font-weight="600" fill="#17313b">本地合同</text><text x="661" y="212" font-size="27" font-weight="700" fill="#116b61" text-anchor="end">通过</text><text x="58" y="250" font-size="26" font-weight="400" fill="#52656c">确定性与 Mock 边界</text><rect x="36" y="282" width="648" height="90" rx="18" fill="#fae8dc" stroke="#fae8dc"/><text x="58" y="318" font-size="29" font-weight="600" fill="#17313b">真实集成</text><text x="661" y="318" font-size="27" font-weight="700" fill="#a6452c" text-anchor="end">受阻</text><text x="58" y="356" font-size="26" font-weight="400" fill="#52656c">缺少隔离环境</text><rect x="36" y="388" width="648" height="90" rx="18" fill="#fffefa" stroke="#d8ded9"/><text x="58" y="424" font-size="29" font-weight="600" fill="#17313b">模型质量</text><text x="661" y="424" font-size="27" font-weight="700" fill="#52656c" text-anchor="end">未执行</text><text x="58" y="462" font-size="26" font-weight="400" fill="#52656c">尚无对应评测</text><text x="36" y="536" font-size="27" font-weight="600" fill="#17313b">按声明范围判断，不让不同 PASS 互相替代</text><rect x="36" y="560" width="648" height="91" rx="18" fill="#e6f1ec" stroke="#e6f1ec"/><text x="58" y="598" font-size="27" font-weight="500" fill="#116b61">必要门禁满足 → 正式关闭</text><text x="58" y="634" font-size="27" font-weight="500" fill="#116b61">同步已接受规范 → 归档 / 有价值的历史交接</text><rect x="36" y="668" width="648" height="84" rx="18" fill="#fae8dc" stroke="#fae8dc"/><text x="58" y="705" font-size="27" font-weight="500" fill="#a6452c">必要门禁未满足 → 保留缺口</text><text x="58" y="739" font-size="27" font-weight="500" fill="#a6452c">定向修复 / 等待前置条件 → 追加新观察</text><text x="36" y="803" font-size="27" font-weight="600" fill="#17313b">发布仍由原发布流程与授权决定。</text>
</g></svg>
