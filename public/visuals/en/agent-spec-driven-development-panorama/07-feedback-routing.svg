<svg xmlns="http://www.w3.org/2000/svg" width="720" height="844" viewBox="0 0 720 844" role="img" aria-labelledby="title desc" lang="en"><title id="title">Which decision did the fact change?</title><desc id="desc">Route scope, design, implementation and environment changes without rewriting observations.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#116B61"/></marker></defs><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="720" height="844" rx="24" fill="#F7F5EF"/><path d="M36 36L82 36" fill="none" stroke="#116B61" stroke-width="5"/><text x="100" y="45" font-size="22" font-weight="600" fill="#52656C" text-anchor="start">SPEC / DEVELOPMENT</text><text x="682" y="47" font-size="28" font-weight="700" fill="#116B61" text-anchor="end">07</text><text x="36" y="106" font-size="38" font-weight="700" fill="#17313B" text-anchor="start">Which decision did the fact change?</text><text x="36" y="157" font-size="26" font-weight="700" fill="#52656C" text-anchor="start">NEW FACT</text><text x="366" y="157" font-size="26" font-weight="700" fill="#52656C" text-anchor="start">RETURN TO</text><rect x="36" y="179" width="648" height="88" rx="18" fill="#FFFEFA" stroke="#D5DED8" stroke-width="2"/><text x="56" y="232" font-size="27" font-weight="600" fill="#17313B" text-anchor="start">Scope changes</text><path d="M319 223L346 223" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><text x="366" y="232" font-size="26" font-weight="600" fill="#116B61" text-anchor="start">Proposal + commitments</text><rect x="36" y="289" width="648" height="88" rx="18" fill="#FFFEFA" stroke="#D5DED8" stroke-width="2"/><text x="56" y="342" font-size="27" font-weight="600" fill="#17313B" text-anchor="start">Design conflicts</text><path d="M319 333L346 333" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><text x="366" y="342" font-size="27" font-weight="600" fill="#116B61" text-anchor="start">Design + contracts</text><rect x="36" y="399" width="648" height="88" rx="18" fill="#FFFEFA" stroke="#D5DED8" stroke-width="2"/><text x="56" y="452" font-size="27" font-weight="600" fill="#17313B" text-anchor="start">Behavior is wrong</text><path d="M319 443L346 443" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><text x="366" y="452" font-size="27" font-weight="600" fill="#116B61" text-anchor="start">Code + tests</text><rect x="36" y="509" width="648" height="88" rx="18" fill="#FFFEFA" stroke="#D5DED8" stroke-width="2"/><text x="56" y="562" font-size="26" font-weight="600" fill="#17313B" text-anchor="start">Env unavailable</text><path d="M319 553L346 553" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><text x="366" y="562" font-size="27" font-weight="600" fill="#116B61" text-anchor="start">Only the affected lane</text><rect x="36" y="650" width="648" height="103" rx="18" fill="#FAE8DC"/><text x="58" y="691" font-size="29" font-weight="700" fill="#A6452C" text-anchor="start">The goal is no longer worth pursuing?</text><text x="58" y="733" font-size="26" font-weight="400" fill="#17313B" text-anchor="start">Record withdrawal; do not update accepted specs</text><text x="36" y="806" font-size="28" font-weight="600" fill="#17313B" text-anchor="start">Revisit the decision, not the whole workflow</text></g></svg>
