<svg xmlns="http://www.w3.org/2000/svg" width="720" height="835" viewBox="0 0 720 835" role="img" aria-labelledby="title desc" lang="en"><title id="title">Tasks and handoffs</title><desc id="desc">Organize three work units around shared contracts; this does not assert historical parallel scheduling.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#116B61"/></marker></defs><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="720" height="835" rx="24" fill="#F7F5EF"/><path d="M36 36L82 36" fill="none" stroke="#116B61" stroke-width="5"/><text x="100" y="45" font-size="22" font-weight="600" fill="#52656C" text-anchor="start">SPEC / DEVELOPMENT</text><text x="682" y="47" font-size="28" font-weight="700" fill="#116B61" text-anchor="end">05</text><text x="36" y="106" font-size="38" font-weight="700" fill="#17313B" text-anchor="start">Tasks and handoffs</text><text x="36" y="153" font-size="26" font-weight="400" fill="#52656C" text-anchor="start">Planning sketch · not runtime data flow</text><rect x="36" y="177" width="648" height="87" rx="18" fill="#17313B"/><text x="58" y="230" font-size="30" font-weight="600" fill="#FFFEFA" text-anchor="start">Agree on the shared output contract</text><path d="M360 267V291H190V322" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><path d="M360 291H530V322" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="330" width="308" height="175" rx="18" fill="#FFFEFA" stroke="#D5DED8" stroke-width="2"/><text x="56" y="371" font-size="28" font-weight="700" fill="#116B61" text-anchor="start">1</text><text x="96" y="371" font-size="26" font-weight="700" fill="#17313B" text-anchor="start">Admit and acquire</text><text x="56" y="424" font-size="25" font-weight="400" fill="#52656C" text-anchor="start">Admission / adapters</text><text x="56" y="463" font-size="25" font-weight="400" fill="#52656C" text-anchor="start">Local attachment errors</text><rect x="376" y="330" width="308" height="175" rx="18" fill="#FFFEFA" stroke="#D5DED8" stroke-width="2"/><text x="396" y="371" font-size="28" font-weight="700" fill="#116B61" text-anchor="start">2</text><text x="436" y="371" font-size="26" font-weight="700" fill="#17313B" text-anchor="start">Bounded parsing</text><text x="396" y="424" font-size="25" font-weight="400" fill="#52656C" text-anchor="start">Formats / locations</text><text x="396" y="463" font-size="25" font-weight="400" fill="#52656C" text-anchor="start">Explicit partial coverage</text><path d="M190 507V535H360V559" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><path d="M530 507V535H360" fill="none" stroke="#116B61" stroke-width="3"/><rect x="36" y="567" width="648" height="128" rx="18" fill="#E6F1EC"/><text x="58" y="611" font-size="29" font-weight="700" fill="#116B61" text-anchor="start">3  Workspace integration and lifecycle</text><text x="58" y="657" font-size="29" font-weight="400" fill="#17313B" text-anchor="start">Prove the real entry-to-reader path</text><text x="36" y="751" font-size="27" font-weight="400" fill="#17313B" text-anchor="start">Parallelize only after interfaces stabilize.</text><text x="36" y="793" font-size="27" font-weight="400" fill="#17313B" text-anchor="start">One owner must join the complete path.</text></g></svg>
