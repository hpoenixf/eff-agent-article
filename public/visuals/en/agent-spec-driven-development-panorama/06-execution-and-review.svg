<svg xmlns="http://www.w3.org/2000/svg" width="720" height="849" viewBox="0 0 720 849" role="img" aria-labelledby="title desc" lang="en"><title id="title">Test, integrate, review</title><desc id="desc">TDD, integration and independent review answer different questions; record observations during execution.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#116B61"/></marker></defs><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="720" height="849" rx="24" fill="#F7F5EF"/><path d="M36 36L82 36" fill="none" stroke="#116B61" stroke-width="5"/><text x="100" y="45" font-size="22" font-weight="600" fill="#52656C" text-anchor="start">SPEC / DEVELOPMENT</text><text x="682" y="47" font-size="28" font-weight="700" fill="#116B61" text-anchor="end">06</text><text x="36" y="106" font-size="38" font-weight="700" fill="#17313B" text-anchor="start">Test, integrate, review</text><rect x="36" y="152" width="648" height="148" rx="18" fill="#FFFEFA" stroke="#D5DED8" stroke-width="2"/><text x="58" y="190" font-size="26" font-weight="700" fill="#116B61" text-anchor="start">TDD</text><text x="58" y="234" font-size="31" font-weight="600" fill="#17313B" text-anchor="start">Does a targeted behavior change?</text><text x="58" y="277" font-size="27" font-weight="400" fill="#52656C" text-anchor="start">Reach the assertion: RED → GREEN</text><rect x="36" y="320" width="648" height="148" rx="18" fill="#FFFEFA" stroke="#D5DED8" stroke-width="2"/><text x="58" y="358" font-size="26" font-weight="700" fill="#116B61" text-anchor="start">Integration</text><text x="58" y="402" font-size="31" font-weight="600" fill="#17313B" text-anchor="start">Does the real path connect?</text><text x="58" y="445" font-size="27" font-weight="400" fill="#52656C" text-anchor="start">Tool result → workspace → reader</text><rect x="36" y="488" width="648" height="148" rx="18" fill="#FFFEFA" stroke="#D5DED8" stroke-width="2"/><text x="58" y="526" font-size="26" font-weight="700" fill="#116B61" text-anchor="start">Review</text><text x="58" y="570" font-size="31" font-weight="600" fill="#17313B" text-anchor="start">Does the change meet the promise?</text><text x="58" y="613" font-size="27" font-weight="400" fill="#52656C" text-anchor="start">Read the spec, diff and original results</text><rect x="36" y="674" width="648" height="137" rx="18" fill="#FAE8DC"/><text x="58" y="717" font-size="28" font-weight="700" fill="#A6452C" text-anchor="start">Environment failure is not behavioral RED</text><text x="58" y="760" font-size="27" font-weight="400" fill="#17313B" text-anchor="start">Record real observations at every step.</text></g></svg>
