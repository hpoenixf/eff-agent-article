<svg xmlns="http://www.w3.org/2000/svg" width="720" height="836" viewBox="0 0 720 836" role="img" aria-labelledby="title desc" lang="en"><title id="title">A change, end to end</title><desc id="desc">Four decision stages, continuous evidence and targeted feedback.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#116B61"/></marker></defs><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="720" height="836" rx="24" fill="#F7F5EF"/><path d="M36 36L82 36" fill="none" stroke="#116B61" stroke-width="5"/><text x="100" y="45" font-size="22" font-weight="600" fill="#52656C" text-anchor="start">SPEC / DEVELOPMENT</text><text x="682" y="47" font-size="28" font-weight="700" fill="#116B61" text-anchor="end">01</text><text x="36" y="106" font-size="38" font-weight="700" fill="#17313B" text-anchor="start">A change, end to end</text><rect x="36" y="152" width="538" height="116" rx="18" fill="#FFFEFA" stroke="#D5DED8" stroke-width="2"/><rect x="54" y="172" width="62" height="50" rx="12" fill="#E6F1EC"/><text x="85.0" y="206" font-size="27" font-weight="600" fill="#116B61" text-anchor="middle">1</text><text x="134" y="195" font-size="31" font-weight="700" fill="#17313B" text-anchor="start">Bound the promise</text><text x="134" y="238" font-size="27" font-weight="400" fill="#52656C" text-anchor="start">Clarify the need / proposal</text><path d="M304 271L304 286" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="289" width="538" height="116" rx="18" fill="#FFFEFA" stroke="#D5DED8" stroke-width="2"/><rect x="54" y="309" width="62" height="50" rx="12" fill="#E6F1EC"/><text x="85.0" y="343" font-size="27" font-weight="600" fill="#116B61" text-anchor="middle">2</text><text x="134" y="332" font-size="31" font-weight="700" fill="#17313B" text-anchor="start">Choose behavior and design</text><text x="134" y="375" font-size="27" font-weight="400" fill="#52656C" text-anchor="start">Design / specification delta</text><path d="M304 408L304 423" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="426" width="538" height="116" rx="18" fill="#FFFEFA" stroke="#D5DED8" stroke-width="2"/><rect x="54" y="446" width="62" height="50" rx="12" fill="#E6F1EC"/><text x="85.0" y="480" font-size="27" font-weight="600" fill="#116B61" text-anchor="middle">3</text><text x="134" y="469" font-size="31" font-weight="700" fill="#17313B" text-anchor="start">Implement and inspect</text><text x="134" y="512" font-size="27" font-weight="400" fill="#52656C" text-anchor="start">Tasks / TDD / direct review</text><path d="M304 545L304 560" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="563" width="538" height="116" rx="18" fill="#FFFEFA" stroke="#D5DED8" stroke-width="2"/><rect x="54" y="583" width="62" height="50" rx="12" fill="#E6F1EC"/><text x="85.0" y="617" font-size="27" font-weight="600" fill="#116B61" text-anchor="middle">4</text><text x="134" y="606" font-size="31" font-weight="700" fill="#17313B" text-anchor="start">Accept and hand off</text><text x="134" y="649" font-size="27" font-weight="400" fill="#52656C" text-anchor="start">Verify / close / archive</text><rect x="608" y="152" width="76" height="527" rx="18" fill="#E6F1EC"/><text transform="translate(655 644) rotate(-90)" font-size="29" fill="#116B61" font-weight="600">Evidence throughout the work</text><rect x="36" y="713" width="648" height="87" rx="18" fill="#17313B"/><text x="58" y="747" font-size="27" font-weight="600" fill="#FFFEFA" text-anchor="start">New facts → revisit the affected decision</text><text x="58" y="782" font-size="27" font-weight="400" fill="#B7D8D1" text-anchor="start">Not an irreversible approval pipeline</text></g></svg>
