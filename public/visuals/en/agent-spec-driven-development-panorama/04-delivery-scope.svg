<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" role="img" aria-labelledby="title desc" lang="en"><title id="title">Design broadly. Deliver a slice.</title><desc id="desc">Deliver an end-to-end authorized path; enhancements remain outside the present commitment.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#116B61"/></marker></defs><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="720" height="840" rx="24" fill="#F7F5EF"/><path d="M36 36L82 36" fill="none" stroke="#116B61" stroke-width="5"/><text x="100" y="45" font-size="22" font-weight="600" fill="#52656C" text-anchor="start">SPEC / DEVELOPMENT</text><text x="682" y="47" font-size="28" font-weight="700" fill="#116B61" text-anchor="end">04</text><text x="36" y="106" font-size="38" font-weight="700" fill="#17313B" text-anchor="start">Design broadly. Deliver a slice.</text><rect x="36" y="152" width="648" height="308" rx="18" fill="#E6F1EC"/><text x="58" y="194" font-size="27" font-weight="700" fill="#116B61" text-anchor="start">FIRST DELIVERABLE</text><text x="58" y="240" font-size="30" font-weight="600" fill="#17313B" text-anchor="start">Authorized file → readable material</text><rect x="58" y="270" width="132" height="50" rx="12" fill="#FFFEFA"/><text x="124.0" y="304" font-size="27" font-weight="600" fill="#116B61" text-anchor="middle">Admit</text><path d="M193 295L209 295" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><rect x="212" y="270" width="132" height="50" rx="12" fill="#FFFEFA"/><text x="278.0" y="304" font-size="27" font-weight="600" fill="#116B61" text-anchor="middle">Parse</text><path d="M347 295L363 295" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><rect x="366" y="270" width="132" height="50" rx="12" fill="#FFFEFA"/><text x="432.0" y="304" font-size="27" font-weight="600" fill="#116B61" text-anchor="middle">Register</text><path d="M501 295L517 295" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><rect x="520" y="270" width="132" height="50" rx="12" fill="#FFFEFA"/><text x="586.0" y="304" font-size="27" font-weight="600" fill="#116B61" text-anchor="middle">Read</text><text x="58" y="371" font-size="29" font-weight="400" fill="#17313B" text-anchor="start">Keep access, source identity</text><text x="58" y="414" font-size="29" font-weight="400" fill="#17313B" text-anchor="start">and partial-coverage semantics</text><rect x="36" y="494" width="648" height="196" rx="18" fill="#FFFEFA" stroke="#D5DED8" stroke-width="2" stroke-dasharray="8 7"/><text x="58" y="538" font-size="27" font-weight="700" fill="#52656C" text-anchor="start">OUTSIDE THIS COMMITMENT</text><text x="58" y="588" font-size="29" font-weight="400" fill="#52656C" text-anchor="start">OCR / richer document understanding</text><text x="58" y="635" font-size="29" font-weight="400" fill="#52656C" text-anchor="start">Automatic indexing / cross-run cache</text><rect x="36" y="728" width="648" height="77" rx="18" fill="#17313B"/><text x="58" y="776" font-size="29" font-weight="600" fill="#FFFEFA" text-anchor="start">Defer enhancements, not required safety</text></g></svg>
