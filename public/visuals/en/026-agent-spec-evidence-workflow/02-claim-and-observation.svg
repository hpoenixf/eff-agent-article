<svg xmlns="http://www.w3.org/2000/svg" width="720" height="818" viewBox="0 0 720 818" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Evidence bounds a claim</title><desc id="desc">Teaching example: a claim is bounded by execution conditions, observations and original artifacts.</desc>
