<g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif">
<rect width="720" height="818" rx="24" fill="#f7f5ef"/>
<path d="M36 36 H82" stroke="#116b61" stroke-width="6"/>
<text x="100" y="46" font-size="24" font-weight="600" fill="#52656c">ENGINEERING EVIDENCE</text><text x="684" y="48" font-size="28" font-weight="600" fill="#116b61" text-anchor="end">02</text>
<text x="36" y="106" font-size="40" font-weight="700" fill="#17313b">Evidence bounds a claim</text>
<rect x="36" y="150" width="648" height="110" rx="18" fill="#17313b" stroke="#17313b"/><text x="58" y="190" font-size="26" font-weight="600" fill="#b7d8d1">CLAIM TO CHECK</text><text x="58" y="235" font-size="29" font-weight="600" fill="#fffefa">The new source preserves access limits</text><path d="M360 262 L360 294" fill="none" stroke="#116b61" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="300" width="648" height="270" rx="18" fill="#fffefa" stroke="#d8ded9"/><text x="58" y="344" font-size="28" font-weight="700" fill="#116b61">EV-01  ·  linked to this requirement</text><text x="58" y="391" font-size="27" font-weight="600" fill="#52656c">Subject</text><text x="218" y="391" font-size="28" font-weight="400" fill="#17313b">Revision A / denial scenario</text><text x="58" y="440" font-size="27" font-weight="600" fill="#52656c">Execution</text><text x="218" y="440" font-size="28" font-weight="400" fill="#17313b">Isolated, targeted test</text><text x="58" y="489" font-size="27" font-weight="600" fill="#52656c">Observed</text><text x="218" y="489" font-size="28" font-weight="400" fill="#17313b">Out-of-scope call denied</text><text x="58" y="538" font-size="27" font-weight="600" fill="#52656c">Source</text><text x="218" y="538" font-size="28" font-weight="400" fill="#17313b">Run identity / original output</text><path d="M360 572 L360 604" fill="none" stroke="#116b61" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="610" width="648" height="130" rx="18" fill="#e6f1ec" stroke="#e6f1ec"/><text x="58" y="654" font-size="27" font-weight="600" fill="#116b61">Supports: the exercised denial path in A.</text><text x="58" y="698" font-size="27" font-weight="600" fill="#116b61">Does not establish every access path.</text><text x="36" y="783" font-size="26" font-weight="400" fill="#52656c">Still needs trusted runs and adequate tests.</text>
