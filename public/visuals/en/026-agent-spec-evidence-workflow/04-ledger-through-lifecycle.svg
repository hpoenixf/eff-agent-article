<svg xmlns="http://www.w3.org/2000/svg" width="720" height="780" viewBox="0 0 720 780" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Record as the work happens</title><desc id="desc">Capture a baseline before implementation, append observations during execution and generate Verify from existing records.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#116b61"/></marker></defs>
<g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif">
<rect width="720" height="780" rx="24" fill="#f7f5ef"/>
<path d="M36 36 H82" stroke="#116b61" stroke-width="6"/>
<text x="100" y="46" font-size="24" font-weight="600" fill="#52656c">ENGINEERING EVIDENCE</text><text x="684" y="48" font-size="28" font-weight="600" fill="#116b61" text-anchor="end">04</text>
<text x="36" y="106" font-size="40" font-weight="700" fill="#17313b">Record as the work happens</text>
<rect x="36" y="150" width="204" height="164" rx="18" fill="#fffefa" stroke="#d8ded9"/><text x="54" y="192" font-size="27" font-weight="700" fill="#116b61">PLAN</text><text x="54" y="244" font-size="22" font-weight="500" fill="#17313b">Scope / design</text><text x="54" y="282" font-size="21" font-weight="400" fill="#52656c">Delta / tasks</text><path d="M138 316 L138 356" fill="none" stroke="#116b61" stroke-width="3" marker-end="url(#arrow)"/><rect x="258" y="150" width="204" height="164" rx="18" fill="#fffefa" stroke="#d8ded9"/><text x="276" y="192" font-size="27" font-weight="700" fill="#116b61">IMPLEMENT</text><text x="276" y="244" font-size="22" font-weight="500" fill="#17313b">RED → GREEN</text><text x="276" y="282" font-size="21" font-weight="400" fill="#52656c">Runs / checks</text><path d="M360 316 L360 356" fill="none" stroke="#116b61" stroke-width="3" marker-end="url(#arrow)"/><rect x="480" y="150" width="204" height="164" rx="18" fill="#fffefa" stroke="#d8ded9"/><text x="498" y="192" font-size="27" font-weight="700" fill="#116b61">CLOSE OUT</text><text x="498" y="244" font-size="22" font-weight="500" fill="#17313b">Verify view</text><text x="498" y="282" font-size="21" font-weight="400" fill="#52656c">Gates / handoff</text><path d="M582 316 L582 356" fill="none" stroke="#116b61" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="364" width="648" height="122" rx="18" fill="#17313b" stroke="#17313b"/><text x="58" y="407" font-size="27" font-weight="700" fill="#fffefa">ONE CONTINUOUS EVIDENCE LEDGER</text><text x="58" y="454" font-size="24" font-weight="500" fill="#b7d8d1">Baseline / unknown → observations → close receipt</text><path d="M360 488 L360 528" fill="none" stroke="#116b61" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="536" width="648" height="158" rx="18" fill="#e6f1ec" stroke="#e6f1ec"/><text x="58" y="579" font-size="29" font-weight="700" fill="#116b61">Verify is a view, not a second truth</text><text x="58" y="626" font-size="26" font-weight="400" fill="#17313b">Preserve dates, revisions and scope.</text><text x="58" y="667" font-size="26" font-weight="400" fill="#17313b">Detect stale inputs; do not invent a fresh run.</text><text x="36" y="741" font-size="25" font-weight="400" fill="#52656c">Keep handwritten Verify; generation runs no acceptance.</text>
</g></svg>
