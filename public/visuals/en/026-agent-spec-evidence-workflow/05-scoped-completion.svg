<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" role="img" aria-labelledby="title desc" lang="en">
<title id="title">No automatic upgrade to done</title><desc id="desc">Local, integration and model checks are separate dimensions. Missing required gates prevent closure of that scope; closure is not release.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#116b61"/></marker></defs>
<g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif">
<rect width="720" height="840" rx="24" fill="#f7f5ef"/>
<path d="M36 36 H82" stroke="#116b61" stroke-width="6"/>
<text x="100" y="46" font-size="24" font-weight="600" fill="#52656c">ENGINEERING EVIDENCE</text><text x="684" y="48" font-size="28" font-weight="600" fill="#116b61" text-anchor="end">05</text>
<text x="36" y="106" font-size="40" font-weight="700" fill="#17313b">No automatic upgrade to done</text>
<text x="36" y="151" font-size="25" font-weight="400" fill="#52656c">Teaching example · declare the acceptance scope first</text><rect x="36" y="176" width="648" height="90" rx="18" fill="#e6f1ec" stroke="#e6f1ec"/><text x="58" y="212" font-size="27" font-weight="600" fill="#17313b">Local contract</text><text x="661" y="212" font-size="24" font-weight="700" fill="#116b61" text-anchor="end">PASSED</text><text x="58" y="250" font-size="24" font-weight="400" fill="#52656c">Deterministic / mock checks</text><rect x="36" y="282" width="648" height="90" rx="18" fill="#fae8dc" stroke="#fae8dc"/><text x="58" y="318" font-size="27" font-weight="600" fill="#17313b">Live integration</text><text x="661" y="318" font-size="24" font-weight="700" fill="#a6452c" text-anchor="end">BLOCKED</text><text x="58" y="356" font-size="24" font-weight="400" fill="#52656c">Isolated environment missing</text><rect x="36" y="388" width="648" height="90" rx="18" fill="#fffefa" stroke="#d8ded9"/><text x="58" y="424" font-size="27" font-weight="600" fill="#17313b">Model quality</text><text x="661" y="424" font-size="24" font-weight="700" fill="#52656c" text-anchor="end">NOT RUN</text><text x="58" y="462" font-size="24" font-weight="400" fill="#52656c">No matching evaluation</text><text x="36" y="536" font-size="27" font-weight="600" fill="#17313b">Judge the declared scope; do not borrow a PASS</text><rect x="36" y="560" width="648" height="91" rx="18" fill="#e6f1ec" stroke="#e6f1ec"/><text x="58" y="598" font-size="25" font-weight="500" fill="#116b61">Required gates met → close the declared scope</text><text x="58" y="634" font-size="25" font-weight="500" fill="#116b61">Sync accepted specs → archive / useful handoff</text><rect x="36" y="668" width="648" height="84" rx="18" fill="#fae8dc" stroke="#fae8dc"/><text x="58" y="705" font-size="25" font-weight="500" fill="#a6452c">Required gate missing → keep the gap visible</text><text x="58" y="739" font-size="25" font-weight="500" fill="#a6452c">Repair / wait for prerequisites → record new runs</text><text x="36" y="803" font-size="27" font-weight="600" fill="#17313b">Release has its own process and authority.</text>
</g></svg>
