<svg xmlns="http://www.w3.org/2000/svg" width="720" height="782" viewBox="0 0 720 782" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Start with the smallest fit</title><desc id="desc">Choose by existing evidence capability, handoff needs and protected effects; do not impose the full workflow on every edit.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#116b61"/></marker></defs>
<g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif">
<rect width="720" height="782" rx="24" fill="#f7f5ef"/>
<path d="M36 36 H82" stroke="#116b61" stroke-width="6"/>
<text x="100" y="46" font-size="24" font-weight="600" fill="#52656c">ENGINEERING EVIDENCE</text><text x="684" y="48" font-size="28" font-weight="600" fill="#116b61" text-anchor="end">06</text>
<text x="36" y="106" font-size="40" font-weight="700" fill="#17313b">Start with the smallest fit</text>
<rect x="36" y="150" width="648" height="164" rx="18" fill="#fffefa" stroke="#d8ded9"/><text x="58" y="193" font-size="27" font-weight="700" fill="#17313b">01</text><text x="120" y="193" font-size="27" font-weight="700" fill="#17313b">Small, one-off change</text><text x="58" y="243" font-size="27" font-weight="600" fill="#17313b">PR context + linked CI run</text><text x="58" y="287" font-size="25" font-weight="400" fill="#52656c">Stop here when the record is sufficient.</text><rect x="36" y="333" width="648" height="164" rx="18" fill="#e6f1ec" stroke="#e6f1ec"/><text x="58" y="376" font-size="27" font-weight="700" fill="#116b61">02</text><text x="120" y="376" font-size="27" font-weight="700" fill="#17313b">Multi-session or multi-agent work</text><text x="58" y="426" font-size="27" font-weight="600" fill="#116b61">Claim → run → revision → conclusion</text><text x="58" y="470" font-size="25" font-weight="400" fill="#52656c">Add an index, not duplicate logs.</text><rect x="36" y="516" width="648" height="164" rx="18" fill="#fae8dc" stroke="#fae8dc"/><text x="58" y="559" font-size="27" font-weight="700" fill="#a6452c">03</text><text x="120" y="559" font-size="27" font-weight="700" fill="#17313b">Permissions, funds, external effects</text><text x="58" y="609" font-size="27" font-weight="600" fill="#a6452c">Trusted runs + protected acceptance</text><text x="58" y="653" font-size="25" font-weight="400" fill="#52656c">A ledger cannot authenticate itself.</text><text x="36" y="742" font-size="27" font-weight="600" fill="#17313b">Add useful evidence, not more forms.</text>
</g></svg>
