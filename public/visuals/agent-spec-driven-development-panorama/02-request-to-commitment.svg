<svg xmlns="http://www.w3.org/2000/svg" width="720" height="819" viewBox="0 0 720 819" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">先找缺口，再确定承诺</title><desc id="desc">用已有能力、实际缺口、权限与验收限定文件接入需求。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#116B61"/></marker></defs><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="720" height="819" rx="24" fill="#F7F5EF"/><path d="M36 36L82 36" fill="none" stroke="#116B61" stroke-width="5"/><text x="100" y="45" font-size="22" font-weight="600" fill="#52656C" text-anchor="start">SPEC / DEVELOPMENT</text><text x="682" y="47" font-size="28" font-weight="700" fill="#116B61" text-anchor="end">02</text><text x="36" y="106" font-size="38" font-weight="700" fill="#17313B" text-anchor="start">先找缺口，再确定承诺</text><rect x="36" y="150" width="648" height="99" rx="18" fill="#17313B"/><text x="58" y="190" font-size="25" font-weight="600" fill="#B7D8D1" text-anchor="start">用户要得到什么</text><text x="58" y="230" font-size="31" font-weight="600" fill="#FFFEFA" text-anchor="start">读到业务工具返回的基金文件</text><rect x="36" y="272" width="309" height="128" rx="18" fill="#E6F1EC"/><rect x="365" y="272" width="319" height="128" rx="18" fill="#E6EDF5"/><text x="58" y="313" font-size="29" font-weight="700" fill="#116B61" text-anchor="start">已经具备</text><text x="387" y="313" font-size="29" font-weight="700" fill="#315D88" text-anchor="start">真正缺少</text><text x="58" y="353" font-size="25" font-weight="400" fill="#17313B" text-anchor="start">研究资产与材料工作区</text><text x="387" y="353" font-size="25" font-weight="400" fill="#17313B" text-anchor="start">可信工具结果 → 材料</text><path d="M36 510L684 510" fill="none" stroke="#D5DED8" stroke-width="1"/><text x="36" y="457" font-size="28" font-weight="700" fill="#116B61" text-anchor="start">范围</text><text x="36" y="495" font-size="29" font-weight="400" fill="#17313B" text-anchor="start">文本 PDF / DOCX / XLSX / HTML</text><path d="M36 610L684 610" fill="none" stroke="#D5DED8" stroke-width="1"/><text x="36" y="557" font-size="28" font-weight="700" fill="#116B61" text-anchor="start">权限</text><text x="36" y="595" font-size="29" font-weight="400" fill="#17313B" text-anchor="start">宿主准入，不开放任意下载</text><path d="M36 710L684 710" fill="none" stroke="#D5DED8" stroke-width="1"/><text x="36" y="657" font-size="28" font-weight="700" fill="#116B61" text-anchor="start">验收</text><text x="36" y="695" font-size="29" font-weight="400" fill="#17313B" text-anchor="start">本地夹具走通真实接线</text><text x="36" y="779" font-size="29" font-weight="600" fill="#17313B" text-anchor="start">要补的是连接，不是再造文档平台</text></g></svg>
