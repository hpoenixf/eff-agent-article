<svg xmlns="http://www.w3.org/2000/svg" width="720" height="852" viewBox="0 0 720 852" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">提议的变化，不是现行事实</title><desc id="desc">已接受的规范与待验收增量分开；同步以声明范围验收为前提。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#116B61"/></marker></defs><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="720" height="852" rx="24" fill="#F7F5EF"/><path d="M36 36L82 36" fill="none" stroke="#116B61" stroke-width="5"/><text x="100" y="45" font-size="22" font-weight="600" fill="#52656C" text-anchor="start">SPEC / DEVELOPMENT</text><text x="682" y="47" font-size="28" font-weight="700" fill="#116B61" text-anchor="end">03</text><text x="36" y="106" font-size="38" font-weight="700" fill="#17313B" text-anchor="start">提议的变化，不是现行事实</text><rect x="36" y="152" width="648" height="100" rx="18" fill="#17313B"/><text x="58" y="193" font-size="27" font-weight="600" fill="#B7D8D1" text-anchor="start">现行规范</text><text x="58" y="233" font-size="31" font-weight="600" fill="#FFFEFA" text-anchor="start">当前已经接受的行为契约</text><path d="M360 256L360 289" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="298" width="648" height="236" rx="18" fill="#FFFEFA" stroke="#D5DED8" stroke-width="2"/><text x="58" y="340" font-size="29" font-weight="700" fill="#116B61" text-anchor="start">本次规范增量</text><text x="58" y="390" font-size="27" font-weight="600" fill="#17313B" text-anchor="start">ADDED</text><text x="58" y="426" font-size="27" font-weight="400" fill="#52656C" text-anchor="start">新增</text><text x="374" y="390" font-size="27" font-weight="600" fill="#17313B" text-anchor="start">MODIFIED</text><text x="374" y="426" font-size="27" font-weight="400" fill="#52656C" text-anchor="start">修改</text><text x="58" y="469" font-size="27" font-weight="600" fill="#17313B" text-anchor="start">REMOVED</text><text x="58" y="505" font-size="27" font-weight="400" fill="#52656C" text-anchor="start">删除</text><text x="374" y="469" font-size="27" font-weight="600" fill="#17313B" text-anchor="start">RENAMED</text><text x="374" y="505" font-size="27" font-weight="400" fill="#52656C" text-anchor="start">改名</text><path d="M360 538L360 570" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="579" width="648" height="50" rx="12" fill="#E6F1EC"/><text x="360.0" y="613" font-size="29" font-weight="600" fill="#116B61" text-anchor="middle">声明范围验收满足后，才同步规则</text><rect x="36" y="651" width="648" height="116" rx="18" fill="#E6F1EC"/><text x="58" y="694" font-size="31" font-weight="700" fill="#116B61" text-anchor="start">更新现行规范，再归档变更</text><text x="58" y="738" font-size="28" font-weight="400" fill="#17313B" text-anchor="start">不等于部署版本已经通过实测</text><text x="36" y="814" font-size="27" font-weight="500" fill="#A6452C" text-anchor="start">未满足验收：保留变更，处理对应缺口</text></g></svg>
