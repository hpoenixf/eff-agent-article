<svg xmlns="http://www.w3.org/2000/svg" width="720" height="857" viewBox="0 0 720 857" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">验收结束后，分别交接三件事</title><desc id="desc">必要验收满足才能关闭并同步规范；未满足保留缺口，发布另有权限与读回。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#116B61"/></marker></defs><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="720" height="857" rx="24" fill="#F7F5EF"/><path d="M36 36L82 36" fill="none" stroke="#116B61" stroke-width="5"/><text x="100" y="45" font-size="22" font-weight="600" fill="#52656C" text-anchor="start">SPEC / DEVELOPMENT</text><text x="682" y="47" font-size="28" font-weight="700" fill="#116B61" text-anchor="end">08</text><text x="36" y="106" font-size="38" font-weight="700" fill="#17313B" text-anchor="start">验收结束后，分别交接三件事</text><text x="36" y="155" font-size="28" font-weight="600" fill="#52656C" text-anchor="start">准备完成 ≠ 正式关闭</text><rect x="36" y="181" width="648" height="92" rx="18" fill="#17313B"/><text x="360" y="236" font-size="31" font-weight="600" fill="#FFFEFA" text-anchor="middle">声明范围的必要验收是否满足？</text><path d="M360 276V298H190V345" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><path d="M360 298H530V345" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><text x="78" y="326" font-size="27" font-weight="700" fill="#116B61" text-anchor="start">是</text><text x="560" y="326" font-size="27" font-weight="700" fill="#A6452C" text-anchor="start">否</text><rect x="36" y="354" width="308" height="139" rx="18" fill="#E6F1EC"/><rect x="376" y="354" width="308" height="139" rx="18" fill="#FAE8DC"/><text x="58" y="398" font-size="28" font-weight="700" fill="#116B61" text-anchor="start">关闭当前范围</text><text x="398" y="398" font-size="28" font-weight="700" fill="#A6452C" text-anchor="start">保留具体缺口</text><text x="58" y="445" font-size="26" font-weight="400" fill="#17313B" text-anchor="start">保留实际回执</text><text x="398" y="445" font-size="26" font-weight="400" fill="#17313B" text-anchor="start">定向修复 / 等待条件</text><path d="M190 496L190 534" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><path d="M683 423H699V227H686" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 7"/><rect x="36" y="543" width="648" height="157" rx="18" fill="#FFFEFA" stroke="#D5DED8" stroke-width="2"/><text x="58" y="587" font-size="30" font-weight="700" fill="#17313B" text-anchor="start">同步已接受规范 → 归档变更</text><text x="58" y="632" font-size="28" font-weight="400" fill="#52656C" text-anchor="start">History 只留下值得复用的判断</text><text x="58" y="675" font-size="26" font-weight="400" fill="#52656C" text-anchor="start">没有独有收获，不再制造一份历史。</text><path d="M36 735L684 735" fill="none" stroke="#D5DED8" stroke-width="2" stroke-dasharray="7 7"/><text x="36" y="777" font-size="28" font-weight="700" fill="#116B61" text-anchor="start">发布由原发布流程负责</text><text x="36" y="819" font-size="27" font-weight="400" fill="#17313B" text-anchor="start">授权、部署与实际读回，不由归档代替</text></g></svg>
