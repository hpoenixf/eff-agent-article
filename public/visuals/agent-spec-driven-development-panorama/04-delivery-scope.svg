<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">完整设计，不等于本期全做</title><desc id="desc">当前期走通完整文件读取结果，增强功能留在当前承诺之外。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#116B61"/></marker></defs><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="720" height="840" rx="24" fill="#F7F5EF"/><path d="M36 36L82 36" fill="none" stroke="#116B61" stroke-width="5"/><text x="100" y="45" font-size="22" font-weight="600" fill="#52656C" text-anchor="start">SPEC / DEVELOPMENT</text><text x="682" y="47" font-size="28" font-weight="700" fill="#116B61" text-anchor="end">04</text><text x="36" y="106" font-size="38" font-weight="700" fill="#17313B" text-anchor="start">完整设计，不等于本期全做</text><rect x="36" y="152" width="648" height="308" rx="18" fill="#E6F1EC"/><text x="58" y="194" font-size="27" font-weight="700" fill="#116B61" text-anchor="start">当前期：走通完整结果</text><text x="58" y="240" font-size="30" font-weight="600" fill="#17313B" text-anchor="start">获准文件 → 当前任务真正读得到</text><rect x="58" y="270" width="132" height="50" rx="12" fill="#FFFEFA"/><text x="124.0" y="304" font-size="27" font-weight="600" fill="#116B61" text-anchor="middle">准入</text><path d="M193 295L209 295" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><rect x="212" y="270" width="132" height="50" rx="12" fill="#FFFEFA"/><text x="278.0" y="304" font-size="27" font-weight="600" fill="#116B61" text-anchor="middle">解析</text><path d="M347 295L363 295" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><rect x="366" y="270" width="132" height="50" rx="12" fill="#FFFEFA"/><text x="432.0" y="304" font-size="27" font-weight="600" fill="#116B61" text-anchor="middle">注册</text><path d="M501 295L517 295" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><rect x="520" y="270" width="132" height="50" rx="12" fill="#FFFEFA"/><text x="586.0" y="304" font-size="27" font-weight="600" fill="#116B61" text-anchor="middle">读取</text><text x="58" y="371" font-size="29" font-weight="400" fill="#17313B" text-anchor="start">权限、来源定位、部分覆盖</text><text x="58" y="414" font-size="29" font-weight="400" fill="#17313B" text-anchor="start">随当前交付一起保留</text><rect x="36" y="494" width="648" height="196" rx="18" fill="#FFFEFA" stroke="#D5DED8" stroke-width="2" stroke-dasharray="8 7"/><text x="58" y="538" font-size="27" font-weight="700" fill="#52656C" text-anchor="start">本期之外：可以讨论，不先实现</text><text x="58" y="588" font-size="29" font-weight="400" fill="#52656C" text-anchor="start">OCR / 更丰富的内容理解</text><text x="58" y="635" font-size="29" font-weight="400" fill="#52656C" text-anchor="start">自动入库 / 跨任务缓存</text><rect x="36" y="728" width="648" height="77" rx="18" fill="#17313B"/><text x="58" y="776" font-size="29" font-weight="600" fill="#FFFEFA" text-anchor="start">后置增强，不后置必要保护</text></g></svg>
