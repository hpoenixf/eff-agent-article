<svg xmlns="http://www.w3.org/2000/svg" width="720" height="835" viewBox="0 0 720 835" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">按依赖组织工作，按结果交接</title><desc id="desc">按共享合同组织三个工作单元；图不主张历史上实际采用并发调度。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#116B61"/></marker></defs><g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="720" height="835" rx="24" fill="#F7F5EF"/><path d="M36 36L82 36" fill="none" stroke="#116B61" stroke-width="5"/><text x="100" y="45" font-size="22" font-weight="600" fill="#52656C" text-anchor="start">SPEC / DEVELOPMENT</text><text x="682" y="47" font-size="28" font-weight="700" fill="#116B61" text-anchor="end">05</text><text x="36" y="106" font-size="38" font-weight="700" fill="#17313B" text-anchor="start">按依赖组织工作，按结果交接</text><text x="36" y="153" font-size="26" font-weight="400" fill="#52656C" text-anchor="start">开发依赖示意 · 不是运行时数据流</text><rect x="36" y="177" width="648" height="87" rx="18" fill="#17313B"/><text x="58" y="230" font-size="30" font-weight="600" fill="#FFFEFA" text-anchor="start">先约定共享接线与输出合同</text><path d="M360 267V291H190V322" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><path d="M360 291H530V322" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="330" width="308" height="175" rx="18" fill="#FFFEFA" stroke="#D5DED8" stroke-width="2"/><text x="56" y="371" font-size="28" font-weight="700" fill="#116B61" text-anchor="start">1</text><text x="96" y="371" font-size="26" font-weight="700" fill="#17313B" text-anchor="start">可信获取</text><text x="56" y="424" font-size="25" font-weight="400" fill="#52656C" text-anchor="start">描述准入 / 获取适配</text><text x="56" y="463" font-size="25" font-weight="400" fill="#52656C" text-anchor="start">失败只影响对应附件</text><rect x="376" y="330" width="308" height="175" rx="18" fill="#FFFEFA" stroke="#D5DED8" stroke-width="2"/><text x="396" y="371" font-size="28" font-weight="700" fill="#116B61" text-anchor="start">2</text><text x="436" y="371" font-size="26" font-weight="700" fill="#17313B" text-anchor="start">有界解析</text><text x="396" y="424" font-size="25" font-weight="400" fill="#52656C" text-anchor="start">格式 / 原生定位</text><text x="396" y="463" font-size="25" font-weight="400" fill="#52656C" text-anchor="start">明确的部分覆盖</text><path d="M190 507V535H360V559" fill="none" stroke="#116B61" stroke-width="3" marker-end="url(#arrow)"/><path d="M530 507V535H360" fill="none" stroke="#116B61" stroke-width="3"/><rect x="36" y="567" width="648" height="128" rx="18" fill="#E6F1EC"/><text x="58" y="611" font-size="29" font-weight="700" fill="#116B61" text-anchor="start">3  工作区接入与生命周期</text><text x="58" y="657" font-size="29" font-weight="400" fill="#17313B" text-anchor="start">验证真实入口到实际读取的路径</text><text x="36" y="751" font-size="27" font-weight="400" fill="#17313B" text-anchor="start">接口未稳定时先串行。</text><text x="36" y="793" font-size="27" font-weight="400" fill="#17313B" text-anchor="start">总有人负责把结果接回完整路径。</text></g></svg>
