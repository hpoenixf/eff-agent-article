<svg xmlns="http://www.w3.org/2000/svg" width="560" height="607" viewBox="0 0 560 607" role="img" aria-labelledby="title"><title id="title">Save an artifact, then answer</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#59718e" stroke-width="1.5"/></marker></defs><rect width="560" height="607" rx="22" fill="#f7f9fc"/>
<text x="30" y="37" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#087f82">TASK RELAY / 03</text>
<text x="30" y="78" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#172b46">Save an artifact, then answer</text>
<rect x="30" y="130" width="500" height="110" rx="15" fill="#eaf0ff" stroke="#a8bdec" stroke-width="1.5"/>
<text x="50" y="164" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#345dc2">Main</text>
<text x="50" y="200" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#172b46">Compose the intended output</text>
<path d="M280 242 V261" fill="none" stroke="#59718e" stroke-width="2.6" marker-end="url(#arr)"/>
<rect x="30" y="264" width="500" height="110" rx="15" fill="#e2f5f1" stroke="#64b5ac" stroke-width="1.5"/>
<text x="50" y="298" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#087f82">Report tool</text>
<text x="50" y="334" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#172b46">Save an artifact that can be reread</text>
<path d="M280 376 V395" fill="none" stroke="#59718e" stroke-width="2.6" marker-end="url(#arr)"/>
<rect x="30" y="398" width="500" height="110" rx="15" fill="#eaf0ff" stroke="#a8bdec" stroke-width="1.5"/>
<text x="50" y="432" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#345dc2">Answer to the user</text>
<text x="50" y="468" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#172b46">State conclusions and remaining gaps</text>
<text x="30" y="583" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#536780">No read / missing sources can also lead to an answer</text>
