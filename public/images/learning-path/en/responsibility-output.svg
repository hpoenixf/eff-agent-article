<text x="30" y="78" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#172b46">Explain, delegate, and save safely</text>
<text x="30" y="126" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#172b46">How to explain changes?</text>
