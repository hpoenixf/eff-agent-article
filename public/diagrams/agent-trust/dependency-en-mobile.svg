<svg xmlns="http://www.w3.org/2000/svg" width="360" height="844" viewBox="0 0 360 844" role="img" aria-labelledby="title desc">
<title id="title">A premise changed. What must be checked?</title><desc id="desc">A holdings-source update requires rechecking the overlap calculation and claim. An independent fee comparison can be reused only while its revision and scope remain valid. Unconfirmed does not mean disproved.</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#11766F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#99551D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#526779" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<rect x="1" y="1" width="358" height="842" rx="22" fill="#FAF9F6" stroke="#CFD9DD" stroke-width="1.3"/>
<rect x="20" y="18" width="26" height="23" rx="6" fill="#173348"/>
<text x="33" y="34" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">02</text>
<text x="57" y="34" font-size="12" font-weight="600" fill="#526779" text-anchor="start">DEPENDENCIES &amp; CHANGE</text>
<text x="20" y="73" font-size="24" font-weight="700" fill="#173348" text-anchor="start">A premise changed.</text>
<text x="20" y="103" font-size="24" font-weight="700" fill="#173348" text-anchor="start">What must be checked?</text>
<text x="20" y="132" font-size="16" font-weight="400" fill="#526779" text-anchor="start">Trace the affected dependencies.</text>
<rect x="18" y="157" width="324" height="245" rx="14" fill="#FFF1DF"/>
<circle cx="38" cy="183" r="4" fill="#99551D"/>
<text x="51" y="190" font-size="20" font-weight="650" fill="#99551D" text-anchor="start">Holdings source updated</text>
<text x="38" y="219" font-size="16.5" font-weight="400" fill="#526779" text-anchor="start">The old basis needs rechecking.</text>
<path d="M 180 229 L 180 248" fill="none" stroke="#99551D" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<rect x="38" y="257" width="284" height="48" rx="9" fill="#FFFFFF"/>
<text x="180" y="287" font-size="20" font-weight="650" fill="#173348" text-anchor="middle">Recalculate overlap</text>
<path d="M 180 310 L 180 329" fill="none" stroke="#99551D" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<text x="180" y="357" font-size="20" font-weight="650" fill="#99551D" text-anchor="middle">Review the overlap claim</text>
<text x="180" y="386" font-size="16" font-weight="400" fill="#526779" text-anchor="middle">Unconfirmed ≠ disproved</text>
<rect x="18" y="422" width="324" height="216" rx="14" fill="#E9F4EF"/>
<circle cx="38" cy="448" r="4" fill="#11766F"/>
<text x="51" y="455" font-size="20" font-weight="650" fill="#11766F" text-anchor="start">Fee source unchanged</text>
<text x="38" y="485" font-size="16" font-weight="400" fill="#526779" text-anchor="start">Check revision and current scope.</text>
<path d="M 180 497 L 180 516" fill="none" stroke="#11766F" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="38" y="525" width="284" height="48" rx="9" fill="#FFFFFF"/>
<text x="180" y="556" font-size="18" font-weight="650" fill="#11766F" text-anchor="middle">Fee comparison can be reused</text>
<text x="180" y="611" font-size="16" font-weight="400" fill="#526779" text-anchor="middle">Only where it is independent.</text>
<rect x="18" y="662" width="324" height="79" rx="13" fill="#173348"/>
<text x="180" y="694" font-size="20" font-weight="650" fill="#FFFFFF" text-anchor="middle">Update affected conclusions.</text>
<text x="180" y="723" font-size="20" font-weight="650" fill="#FFFFFF" text-anchor="middle">Keep independent valid parts.</text>
<text x="20" y="777" font-size="14.8" font-weight="400" fill="#526779" text-anchor="start">Illustration assumes complete links</text>
<text x="20" y="799" font-size="14.8" font-weight="400" fill="#526779" text-anchor="start">and readable source revisions;</text>
<text x="20" y="821" font-size="14.8" font-weight="400" fill="#526779" text-anchor="start">current scope still needs checking.</text>
</g>
</svg>
