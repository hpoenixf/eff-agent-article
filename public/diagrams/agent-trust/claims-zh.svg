<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
<title id="title">同一份报告，三种不同的承诺</title><desc id="desc">同一项基金比较任务包含并列的研究判断、行动权限和执行事实；三者各有依据，不构成可信度晋级阶梯。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#11766F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#99551D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#526779" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<rect x="1" y="1" width="998" height="638" rx="22" fill="#FAF9F6" stroke="#CFD9DD" stroke-width="1.3"/>
<rect x="40" y="25" width="34" height="30" rx="6" fill="#173348"/>
<text x="57" y="47" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">01</text>
<text x="88" y="47" font-size="18" font-weight="600" fill="#526779" text-anchor="start">信任的对象</text>
<text x="40" y="95" font-size="36" font-weight="700" fill="#173348" text-anchor="start">同一份报告，三种不同的承诺</text>
<text x="40" y="140" font-size="24" font-weight="400" fill="#526779" text-anchor="start">同一任务：比较两只基金，并保存一份报告。</text>
<rect x="40" y="183" width="296" height="313" rx="16" fill="#FFFFFF" stroke="#CFD9DD" stroke-width="1.25"/>
<rect x="40" y="183" width="296" height="5" rx="2" fill="#11766F"/>
<circle cx="85" cy="231" r="22" fill="#E9F4EF"/>
<path d="M 77 220 H 90 L 95 225 V 242 H 77 Z" fill="none" stroke="#11766F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 82 228 L 90 228" fill="none" stroke="#11766F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 82 234 L 90 234" fill="none" stroke="#11766F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="282" font-size="27" font-weight="650" fill="#11766F" text-anchor="start">研究判断</text>
<text x="64" y="324" font-size="26" font-weight="650" fill="#173348" text-anchor="start">结论是否有依据</text>
<circle cx="68" cy="377" r="3" fill="#11766F"/>
<text x="82" y="385" font-size="24" font-weight="400" fill="#526779" text-anchor="start">原始材料</text>
<circle cx="68" cy="413" r="3" fill="#11766F"/>
<text x="82" y="421" font-size="24" font-weight="400" fill="#526779" text-anchor="start">数据日期</text>
<circle cx="68" cy="449" r="3" fill="#11766F"/>
<text x="82" y="457" font-size="24" font-weight="400" fill="#526779" text-anchor="start">比较口径</text>
<rect x="352" y="183" width="296" height="313" rx="16" fill="#FFFFFF" stroke="#CFD9DD" stroke-width="1.25"/>
<rect x="352" y="183" width="296" height="5" rx="2" fill="#99551D"/>
<circle cx="397" cy="231" r="22" fill="#FFF1DF"/>
<circle cx="392" cy="228" r="6" fill="none" stroke="#99551D" stroke-width="1.8"/>
<path d="M 397 232 L 407 242 M 403 238 L 407 234" fill="none" stroke="#99551D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="376" y="282" font-size="27" font-weight="650" fill="#99551D" text-anchor="start">行动权限</text>
<text x="376" y="324" font-size="26" font-weight="650" fill="#173348" text-anchor="start">这次操作是否获准</text>
<circle cx="380" cy="377" r="3" fill="#99551D"/>
<text x="394" y="385" font-size="24" font-weight="400" fill="#526779" text-anchor="start">用户与目标资源</text>
<circle cx="380" cy="413" r="3" fill="#99551D"/>
<text x="394" y="421" font-size="24" font-weight="400" fill="#526779" text-anchor="start">具体动作</text>
<circle cx="380" cy="449" r="3" fill="#99551D"/>
<text x="394" y="457" font-size="24" font-weight="400" fill="#526779" text-anchor="start">授权有效期</text>
<rect x="664" y="183" width="296" height="313" rx="16" fill="#FFFFFF" stroke="#CFD9DD" stroke-width="1.25"/>
<rect x="664" y="183" width="296" height="5" rx="2" fill="#43639A"/>
<circle cx="709" cy="231" r="22" fill="#EBF0F9"/>
<path d="M 699 220 H 719 V 242 H 699 Z M 704 231 L 708 235 L 715 227" fill="none" stroke="#43639A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="688" y="282" font-size="27" font-weight="650" fill="#43639A" text-anchor="start">执行事实</text>
<text x="688" y="324" font-size="26" font-weight="650" fill="#173348" text-anchor="start">这个版本是否已交付</text>
<circle cx="692" cy="377" r="3" fill="#43639A"/>
<text x="706" y="385" font-size="24" font-weight="400" fill="#526779" text-anchor="start">保存回执</text>
<circle cx="692" cy="413" r="3" fill="#43639A"/>
<text x="706" y="421" font-size="24" font-weight="400" fill="#526779" text-anchor="start">版本身份</text>
<circle cx="692" cy="449" r="3" fill="#43639A"/>
<text x="706" y="457" font-size="24" font-weight="400" fill="#526779" text-anchor="start">重新读取产物</text>
<rect x="40" y="527" width="920" height="81" rx="14" fill="#173348"/>
<text x="500" y="563" font-size="30" font-weight="650" fill="#FFFFFF" text-anchor="middle">有依据 ≠ 有权限 ≠ 已完成</text>
<text x="500" y="593" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle">它们需要各自匹配的依据，不能互相代替。</text>
</g>
</svg>
