<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="712" viewBox="0 0 1000 712" role="img" aria-labelledby="title desc">
<title id="title">一个前提变了，哪些结论要重查？</title><desc id="desc">持仓来源更新会使依赖它的重叠计算与判断需要复核；费用来源未变时，先核版本与适用范围，才可复用独立的费用比较。待确认不等于结论相反。</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#11766F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#99551D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#526779" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<rect x="1" y="1" width="998" height="710" rx="22" fill="#FAF9F6" stroke="#CFD9DD" stroke-width="1.3"/>
<rect x="40" y="25" width="34" height="30" rx="6" fill="#173348"/>
<text x="57" y="47" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">02</text>
<text x="88" y="47" font-size="18" font-weight="600" fill="#526779" text-anchor="start">变化沿依赖传播</text>
<text x="40" y="95" font-size="35" font-weight="700" fill="#173348" text-anchor="start">一个前提变了，哪些结论要重查？</text>
<text x="40" y="140" font-size="24" font-weight="400" fill="#526779" text-anchor="start">沿依赖定位变化，复用仍然有效的独立结论。</text>
<rect x="40" y="180" width="444" height="330" rx="16" fill="#FFF1DF"/>
<rect x="516" y="180" width="444" height="330" rx="16" fill="#E9F4EF"/>
<circle cx="67" cy="212" r="5" fill="#99551D"/>
<text x="84" y="221" font-size="28" font-weight="650" fill="#99551D" text-anchor="start">持仓来源更新</text>
<text x="64" y="259" font-size="24" font-weight="400" fill="#526779" text-anchor="start">原判断的依据需要重新检查</text>
<path d="M 262 276 L 262 300" fill="none" stroke="#99551D" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<rect x="64" y="311" width="396" height="64" rx="10" fill="#FFFFFF"/>
<text x="262" y="352" font-size="27" font-weight="650" fill="#173348" text-anchor="middle">重新计算重叠比例</text>
<path d="M 262 385 L 262 411" fill="none" stroke="#99551D" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<text x="262" y="453" font-size="28" font-weight="650" fill="#99551D" text-anchor="middle">复核重叠判断</text>
<text x="262" y="488" font-size="23" font-weight="400" fill="#526779" text-anchor="middle">待确认，不等于结论相反</text>
<circle cx="543" cy="212" r="5" fill="#11766F"/>
<text x="560" y="221" font-size="28" font-weight="650" fill="#11766F" text-anchor="start">费用来源未变</text>
<text x="540" y="259" font-size="24" font-weight="400" fill="#526779" text-anchor="start">原来源没有受到持仓更新影响</text>
<path d="M 738 276 L 738 300" fill="none" stroke="#11766F" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="540" y="311" width="396" height="64" rx="10" fill="#FFFFFF"/>
<text x="738" y="352" font-size="27" font-weight="650" fill="#173348" text-anchor="middle">核对原版本与适用范围</text>
<path d="M 738 385 L 738 411" fill="none" stroke="#11766F" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="738" y="453" font-size="28" font-weight="650" fill="#11766F" text-anchor="middle">费用比较仍可复用</text>
<text x="738" y="488" font-size="23" font-weight="400" fill="#526779" text-anchor="middle">保留与持仓变化无关的部分</text>
<path d="M 262 518 L 262 545" fill="none" stroke="#99551D" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<path d="M 738 518 L 738 545" fill="none" stroke="#11766F" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="40" y="557" width="920" height="76" rx="13" fill="#173348"/>
<text x="500" y="604" font-size="29" font-weight="650" fill="#FFFFFF" text-anchor="middle">刷新受影响结论 · 保留独立有效部分</text>
<text x="40" y="676" font-size="22" font-weight="400" fill="#526779" text-anchor="start">示意：依赖完整、原版本可回读；仍须检查当前适用范围。</text>
</g>
</svg>
