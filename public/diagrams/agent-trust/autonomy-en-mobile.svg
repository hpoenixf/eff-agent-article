<svg xmlns="http://www.w3.org/2000/svg" width="360" height="850" viewBox="0 0 360 850" role="img" aria-labelledby="title desc">
<title id="title">Expand exploration, keep commitments bounded</title><desc id="desc">Within the current grant, data boundaries and budget, an agent can read sources, form hypotheses, seek evidence and revise. User-facing claims, actions and completion statements need evidence and limits, current authorization and actual effects respectively. Evidence gaps may remain local while permitted work continues.</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#11766F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#99551D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#526779" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<rect x="1" y="1" width="358" height="848" rx="22" fill="#FAF9F6" stroke="#CFD9DD" stroke-width="1.3"/>
<rect x="20" y="18" width="26" height="23" rx="6" fill="#173348"/>
<text x="33" y="34" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">03</text>
<text x="57" y="34" font-size="12" font-weight="600" fill="#526779" text-anchor="start">AUTONOMY &amp; COMMITMENTS</text>
<text x="20" y="73" font-size="24" font-weight="700" fill="#173348" text-anchor="start">Wider exploration,</text>
<text x="20" y="103" font-size="24" font-weight="700" fill="#173348" text-anchor="start">bounded commitments</text>
<text x="20" y="132" font-size="16" font-weight="400" fill="#526779" text-anchor="start">Explore within the given grant.</text>
<rect x="18" y="154" width="324" height="245" rx="14" fill="#E9F4EF"/>
<text x="38" y="184" font-size="20" font-weight="650" fill="#11766F" text-anchor="start">Explore within the grant</text>
<text x="38" y="211" font-size="16" font-weight="400" fill="#526779" text-anchor="start">Respect budget and data boundaries.</text>
<rect x="38" y="231" width="116" height="60" rx="9" fill="#FFFFFF"/>
<rect x="199" y="231" width="123" height="60" rx="9" fill="#FFFFFF"/>
<rect x="168" y="322" width="154" height="49" rx="9" fill="#FFFFFF"/>
<text x="96" y="255" font-size="18.5" font-weight="650" fill="#173348" text-anchor="middle">Read</text>
<text x="96" y="279" font-size="18.5" font-weight="650" fill="#173348" text-anchor="middle">sources</text>
<text x="260.5" y="255" font-size="18.5" font-weight="650" fill="#173348" text-anchor="middle">Form a</text>
<text x="260.5" y="279" font-size="18.5" font-weight="650" fill="#173348" text-anchor="middle">hypothesis</text>
<text x="245" y="342" font-size="18" font-weight="650" fill="#173348" text-anchor="middle">Seek evidence</text>
<text x="245" y="364" font-size="18" font-weight="650" fill="#173348" text-anchor="middle">and revise</text>
<path d="M 160 261 L 192 261" fill="none" stroke="#11766F" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 260.5 297 L 260.5 315" fill="none" stroke="#11766F" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 161 347 L 96 347 L 96 298" fill="none" stroke="#11766F" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="38" y="386" font-size="16" font-weight="400" fill="#11766F" text-anchor="start">Candidate claims stay revisable.</text>
<path d="M 180 404 L 180 418" fill="none" stroke="#526779" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="18" y="426" width="324" height="171" rx="14" fill="#FFFFFF" stroke="#CFD9DD" stroke-width="1.25"/>
<text x="36" y="455" font-size="19" font-weight="650" fill="#173348" text-anchor="start">Before committing to the user</text>
<text x="36" y="489" font-size="18" font-weight="650" fill="#173348" text-anchor="start">Claim</text>
<text x="121" y="489" font-size="18" font-weight="400" fill="#526779" text-anchor="start">Evidence + limits</text>
<path d="M 36 500 L 324 500" fill="none" stroke="#CFD9DD" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="36" y="523" font-size="18" font-weight="650" fill="#173348" text-anchor="start">Action</text>
<text x="121" y="523" font-size="18" font-weight="400" fill="#526779" text-anchor="start">Current grant</text>
<path d="M 36 534 L 324 534" fill="none" stroke="#CFD9DD" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="36" y="557" font-size="18" font-weight="650" fill="#173348" text-anchor="start">Done</text>
<text x="121" y="557" font-size="18" font-weight="400" fill="#526779" text-anchor="start">Actual effect</text>
<rect x="18" y="615" width="324" height="89" rx="12" fill="#E9F4EF"/>
<text x="36" y="643" font-size="19" font-weight="650" fill="#11766F" text-anchor="start">Enough evidence</text>
<text x="36" y="667" font-size="16" font-weight="400" fill="#173348" text-anchor="start">Deliver a specific, scoped claim;</text>
<text x="36" y="690" font-size="16" font-weight="400" fill="#173348" text-anchor="start">other required checks still apply.</text>
<rect x="18" y="720" width="324" height="88" rx="12" fill="#FFF1DF"/>
<text x="36" y="748" font-size="19" font-weight="650" fill="#99551D" text-anchor="start">Evidence gaps remain</text>
<text x="36" y="772" font-size="16" font-weight="400" fill="#173348" text-anchor="start">Keep local uncertainty.</text>
<text x="36" y="795" font-size="16" font-weight="400" fill="#173348" text-anchor="start">Continue permitted work.</text>
<text x="20" y="835" font-size="14.5" font-weight="400" fill="#526779" text-anchor="start">Judgment lenses, not required services.</text>
</g>
</svg>
