<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="782" viewBox="0 0 1000 782" role="img" aria-labelledby="title desc">
<title id="title">Expand exploration, keep commitments bounded</title><desc id="desc">Within the current grant, data boundaries and budget, an agent can read sources, form hypotheses, seek evidence and revise. User-facing claims, actions and completion statements need evidence and limits, current authorization and actual effects respectively. Evidence gaps may remain local while permitted work continues.</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#11766F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#99551D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#526779" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<rect x="1" y="1" width="998" height="780" rx="22" fill="#FAF9F6" stroke="#CFD9DD" stroke-width="1.3"/>
<rect x="40" y="25" width="34" height="30" rx="6" fill="#173348"/>
<text x="57" y="47" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">03</text>
<text x="88" y="47" font-size="18" font-weight="600" fill="#526779" text-anchor="start">AUTONOMY &amp; COMMITMENTS</text>
<text x="40" y="95" font-size="33" font-weight="700" fill="#173348" text-anchor="start">Expand exploration, keep commitments bounded</text>
<text x="40" y="140" font-size="24" font-weight="400" fill="#526779" text-anchor="start">Give exploration room. Keep the grounds for each commitment clear.</text>
<rect x="40" y="181" width="414" height="345" rx="16" fill="#E9F4EF"/>
<text x="64" y="220" font-size="26" font-weight="650" fill="#11766F" text-anchor="start">Explore within the grant</text>
<text x="64" y="259" font-size="22" font-weight="400" fill="#526779" text-anchor="start">Bounded data access and budget.</text>
<rect x="64" y="287" width="167" height="78" rx="10" fill="#FFFFFF"/>
<rect x="264" y="287" width="166" height="78" rx="10" fill="#FFFFFF"/>
<rect x="205" y="407" width="225" height="65" rx="10" fill="#FFFFFF"/>
<text x="147.5" y="319" font-size="25" font-weight="650" fill="#173348" text-anchor="middle">Read</text>
<text x="147.5" y="350" font-size="25" font-weight="650" fill="#173348" text-anchor="middle">sources</text>
<text x="347" y="319" font-size="24" font-weight="650" fill="#173348" text-anchor="middle">Form a</text>
<text x="347" y="350" font-size="24" font-weight="650" fill="#173348" text-anchor="middle">hypothesis</text>
<text x="317.5" y="433" font-size="23" font-weight="650" fill="#173348" text-anchor="middle">Seek evidence</text>
<text x="317.5" y="462" font-size="23" font-weight="650" fill="#173348" text-anchor="middle">and revise</text>
<path d="M 237 326 L 257 326" fill="none" stroke="#11766F" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 347 372 L 347 399" fill="none" stroke="#11766F" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M 198 439 L 147.5 439 L 147.5 373" fill="none" stroke="#11766F" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="64" y="508" font-size="22" font-weight="400" fill="#11766F" text-anchor="start">Candidate claims stay revisable.</text>
<path d="M 462 351 L 511 351" fill="none" stroke="#526779" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<rect x="520" y="181" width="440" height="345" rx="16" fill="#FFFFFF" stroke="#CFD9DD" stroke-width="1.25"/>
<text x="544" y="220" font-size="25" font-weight="650" fill="#173348" text-anchor="start">Before committing to the user</text>
<rect x="544" y="254" width="392" height="67" rx="9" fill="#FAF9F6"/>
<text x="562" y="297" font-size="25" font-weight="650" fill="#173348" text-anchor="start">Claim</text>
<text x="679" y="297" font-size="24" font-weight="400" fill="#526779" text-anchor="start">Evidence + limits</text>
<rect x="544" y="340" width="392" height="67" rx="9" fill="#FAF9F6"/>
<text x="562" y="383" font-size="25" font-weight="650" fill="#173348" text-anchor="start">Action</text>
<text x="679" y="383" font-size="24" font-weight="400" fill="#526779" text-anchor="start">Current grant</text>
<rect x="544" y="426" width="392" height="67" rx="9" fill="#FAF9F6"/>
<text x="562" y="469" font-size="25" font-weight="650" fill="#173348" text-anchor="start">Done</text>
<text x="679" y="469" font-size="24" font-weight="400" fill="#526779" text-anchor="start">Actual effect</text>
<rect x="40" y="554" width="446" height="128" rx="14" fill="#E9F4EF"/>
<rect x="514" y="554" width="446" height="128" rx="14" fill="#FFF1DF"/>
<text x="64" y="590" font-size="26" font-weight="650" fill="#11766F" text-anchor="start">Enough evidence</text>
<text x="64" y="628" font-size="22.5" font-weight="400" fill="#173348" text-anchor="start">Deliver a specific, scoped claim.</text>
<text x="64" y="662" font-size="22.5" font-weight="400" fill="#173348" text-anchor="start">Other required checks still apply.</text>
<text x="538" y="590" font-size="25" font-weight="650" fill="#99551D" text-anchor="start">Evidence gaps remain</text>
<text x="538" y="628" font-size="23" font-weight="400" fill="#173348" text-anchor="start">Keep local uncertainty.</text>
<text x="538" y="662" font-size="23" font-weight="400" fill="#173348" text-anchor="start">Continue permitted work.</text>
<text x="40" y="723" font-size="22" font-weight="400" fill="#526779" text-anchor="start">Actions still need authorization; completion needs observed effects.</text>
<text x="40" y="757" font-size="21" font-weight="400" fill="#526779" text-anchor="start">These are judgment lenses, not three required services.</text>
</g>
</svg>
