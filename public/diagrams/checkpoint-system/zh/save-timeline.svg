<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460" role="img" aria-labelledby="title desc">
<title id="title">一次 Run，多次保存，只保最新快照</title>
<desc id="desc">四次成功保存的简化示意，不是固定步骤清单. 初始化: 尚无旧检查点; 读取完成: 原动作回执已确认; 初稿提交: 发布回执已确认; 压缩状态提交: 保存成功后再采纳. 当前快照槽位：revision 4</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#6c8589" stroke-width="1.6"/></marker></defs>
<rect width="840" height="460" rx="22" fill="#f7f5ef"/>
<rect width="840" height="7" rx="4" fill="#164e63"/>
<g font-family="Noto Sans CJK SC, Noto Sans, sans-serif">
<text x="26" y="46" font-size="27" font-weight="700" fill="#183b4a">一次 Run，多次保存，只保最新快照</text>
<text x="26" y="77" font-size="16" font-weight="400" fill="#5a7279">四次成功保存的简化示意，不是固定步骤清单</text>
<rect x="26" y="101" width="182" height="122" rx="13" fill="#fff" stroke="#d6dfdc"/>
<text x="41" y="130" font-size="14" font-weight="700" fill="#237165">revision 1</text>
<text x="41" y="162" font-size="19" font-weight="700" fill="#183b4a">初始化</text>
<text x="41" y="192" font-size="16" font-weight="400" fill="#45616d">尚无旧检查点</text>
<path d="M211 162 h13" fill="none" stroke="#6c8589" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="228" y="101" width="182" height="122" rx="13" fill="#fff" stroke="#d6dfdc"/>
<text x="243" y="130" font-size="14" font-weight="700" fill="#237165">revision 2</text>
<text x="243" y="162" font-size="19" font-weight="700" fill="#183b4a">读取完成</text>
<text x="243" y="192" font-size="16" font-weight="400" fill="#45616d">原动作回执已确认</text>
<path d="M413 162 h13" fill="none" stroke="#6c8589" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="430" y="101" width="182" height="122" rx="13" fill="#fff" stroke="#d6dfdc"/>
<text x="445" y="130" font-size="14" font-weight="700" fill="#237165">revision 3</text>
<text x="445" y="162" font-size="19" font-weight="700" fill="#183b4a">初稿提交</text>
<text x="445" y="192" font-size="16" font-weight="400" fill="#45616d">发布回执已确认</text>
<path d="M615 162 h13" fill="none" stroke="#6c8589" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="632" y="101" width="182" height="122" rx="13" fill="#edf6f1" stroke="#398276"/>
<text x="647" y="130" font-size="14" font-weight="700" fill="#237165">revision 4</text>
<text x="647" y="162" font-size="19" font-weight="700" fill="#183b4a">压缩状态提交</text>
<text x="647" y="192" font-size="16" font-weight="400" fill="#45616d">保存成功后再采纳</text>
<rect x="26" y="244" width="788" height="76" rx="13" fill="#e2eee9" stroke="#bed5cc"/>
<text x="42" y="273" font-size="21" font-weight="700" fill="#205b55">当前快照槽位：revision 4</text>
<text x="42" y="301" font-size="16" font-weight="400" fill="#205b55">新快照替换当前值；不自动保留可任意回放的全部历史</text>
<rect x="26" y="334" width="788" height="65" rx="13" fill="#e8eef5" stroke="#cedae4"/>
<text x="42" y="360" font-size="18" font-weight="700" fill="#37576c">原动作回执 · 已发布正文</text>
<text x="42" y="385" font-size="16" font-weight="400" fill="#37576c">各自独立保留，不被旧快照覆盖</text>
<text x="26" y="426" font-size="13" font-weight="400" fill="#61767c">实际运行可能有更多保存点；失败尝试不等于成功保存。</text>
<text x="26" y="446" font-size="13" font-weight="400" fill="#61767c">是否可以继续，仍由原执行与控制协议判断。</text>
</g></svg>
