<svg xmlns="http://www.w3.org/2000/svg" width="375" height="712" viewBox="0 0 375 712" role="img" aria-labelledby="title desc">
<title id="title">One task. Four ways to continue.</title>
<desc id="desc">Read A / B → draft → approve → publish (teaching example). Graph runtime → graph state; Workflow runtime → handover state; Service history → deterministic replay; Our Runtime → latest state + receipts. Continuing progress does not undo external effects.</desc>
<rect width="375" height="712" rx="22" fill="#f7f5ef"/>
<rect width="375" height="7" rx="4" fill="#164e63"/>
<g font-family="Noto Sans CJK SC, Noto Sans, sans-serif">
<text x="22" y="43" font-size="23" font-weight="700" fill="#183b4a">Four ways to continue</text>
<text x="22" y="69" font-size="13" font-weight="400" fill="#61767c">Read → draft → approve → publish</text>
<text x="22" y="88" font-size="13" font-weight="400" fill="#61767c">Teaching models, not a ranking</text>
<rect x="20" y="104" width="335" height="120" rx="14" fill="#edf6f1" stroke="#c0d9cc"/>
<circle cx="38" cy="128" r="4" fill="#237165"/>
<text x="50" y="135" font-size="17" font-weight="700" fill="#183b4a">LangGraph</text>
<text x="35" y="159" font-size="13" font-weight="700" fill="#237165">Graph runtime → graph state</text>
<text x="35" y="181" font-size="13" font-weight="400" fill="#45616d">Graph boundary: super-step</text>
<text x="35" y="199" font-size="13" font-weight="400" fill="#45616d">Separate completed-task writes</text>
<text x="35" y="217" font-size="13" font-weight="400" fill="#45616d">Resume a boundary or fork history</text>
<rect x="20" y="236" width="335" height="120" rx="14" fill="#eef3f9" stroke="#c7d8e5"/>
<circle cx="38" cy="260" r="4" fill="#406982"/>
<text x="50" y="267" font-size="17" font-weight="700" fill="#183b4a">Microsoft Agent Framework</text>
<text x="35" y="291" font-size="13" font-weight="700" fill="#406982">Workflow runtime → handover state</text>
<text x="35" y="313" font-size="13" font-weight="400" fill="#45616d">Executors, messages, responses</text>
<text x="35" y="331" font-size="13" font-weight="400" fill="#45616d">Restore matching topology and IDs</text>
<text x="35" y="349" font-size="13" font-weight="400" fill="#45616d">Continue queued work</text>
<rect x="20" y="368" width="335" height="120" rx="14" fill="#f7efe4" stroke="#e5d6bf"/>
<circle cx="38" cy="392" r="4" fill="#896436"/>
<text x="50" y="399" font-size="17" font-weight="700" fill="#183b4a">Temporal</text>
<text x="35" y="423" font-size="13" font-weight="700" fill="#896436">Service history → deterministic replay</text>
<text x="35" y="445" font-size="13" font-weight="400" fill="#45616d">Replay code to rebuild state</text>
<text x="35" y="463" font-size="13" font-weight="400" fill="#45616d">Reuse recorded Activity results</text>
<text x="35" y="481" font-size="13" font-weight="400" fill="#45616d">Handle unfinished Activities separately</text>
<rect x="20" y="500" width="335" height="120" rx="14" fill="#e7f0ed" stroke="#b8d1c5"/>
<circle cx="38" cy="524" r="4" fill="#225e55"/>
<text x="50" y="531" font-size="17" font-weight="700" fill="#183b4a">ETF Agent · this implementation</text>
<text x="35" y="555" font-size="13" font-weight="700" fill="#225e55">Our Runtime → latest state + receipts</text>
<text x="35" y="577" font-size="13" font-weight="400" fill="#45616d">Latest snapshot per scope + Run</text>
<text x="35" y="595" font-size="13" font-weight="400" fill="#45616d">Interruption settles; continue: new Run</text>
<text x="35" y="613" font-size="13" font-weight="400" fill="#45616d">Accepted wakes: scoped continuation</text>
<text x="22" y="656" font-size="13" font-weight="700" fill="#385b67">Progress recovery does not undo effects.</text>
<text x="22" y="675" font-size="13" font-weight="400" fill="#385b67">Confirm publication and unknown outcomes</text>
<text x="22" y="694" font-size="13" font-weight="400" fill="#385b67">in their original records.</text>
</g></svg>
