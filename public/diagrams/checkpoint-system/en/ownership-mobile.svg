<svg xmlns="http://www.w3.org/2000/svg" width="375" height="650" viewBox="0 0 375 650" role="img" aria-labelledby="title desc">
<title id="title">Four roles, four distinct questions</title>
<desc id="desc">A local refusal does not create authority to terminate the entire task. Runtime: Continue, finalize or stop?, Organize lawful next work. Effect owners: Did the original effect commit?, Interpret its own receipt. Checkpoint: Is this snapshot saved and usable?, Check format, identity, revision. Recovery + Control: Which accepted wake may resume?, Check the original safe point</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#708393" stroke-width="1.6"/></marker></defs>
<rect width="375" height="650" rx="22" fill="#f7f5ef"/>
<rect x="0" y="0" width="375" height="8" rx="4" fill="#164e63"/>
<g font-family="Noto Sans CJK SC, Noto Sans, sans-serif" fill="#183b4a">
<text x="22" y="44" font-size="26" font-weight="700" fill="#183b4a">Ownership</text>
<text x="22" y="73" font-size="17" font-weight="500" fill="#576d75">Clear roles, original facts</text>
<rect x="20" y="92" width="335" height="103" rx="14" fill="#ffffff" stroke="#d8dfde"/>
<rect x="20" y="92" width="5" height="103" rx="2" fill="#164e63"/>
<text x="36" y="119" font-size="15" font-weight="700" fill="#164e63">01</text>
<text x="71" y="120" font-size="21" font-weight="700" fill="#183b4a">Runtime</text>
<text x="36" y="147" font-size="15" font-weight="400" fill="#45616d">Continue, finalize or stop?</text>
<text x="36" y="170" font-size="15" font-weight="400" fill="#45616d">Organize lawful next work</text>
<rect x="20" y="207" width="335" height="103" rx="14" fill="#ffffff" stroke="#d8dfde"/>
<rect x="20" y="207" width="5" height="103" rx="2" fill="#147d71"/>
<text x="36" y="234" font-size="15" font-weight="700" fill="#147d71">02</text>
<text x="71" y="235" font-size="21" font-weight="700" fill="#183b4a">Effect owners</text>
<text x="36" y="262" font-size="15" font-weight="400" fill="#45616d">Did the original effect commit?</text>
<text x="36" y="285" font-size="15" font-weight="400" fill="#45616d">Interpret its own receipt</text>
<rect x="20" y="322" width="335" height="103" rx="14" fill="#ffffff" stroke="#d8dfde"/>
<rect x="20" y="322" width="5" height="103" rx="2" fill="#926438"/>
<text x="36" y="349" font-size="15" font-weight="700" fill="#926438">03</text>
<text x="71" y="350" font-size="21" font-weight="700" fill="#183b4a">Checkpoint</text>
<text x="36" y="377" font-size="15" font-weight="400" fill="#45616d">Is this snapshot saved and usable?</text>
<text x="36" y="400" font-size="15" font-weight="400" fill="#45616d">Check format, identity, revision</text>
<rect x="20" y="437" width="335" height="103" rx="14" fill="#ffffff" stroke="#d8dfde"/>
<rect x="20" y="437" width="5" height="103" rx="2" fill="#5b5c8a"/>
<text x="36" y="464" font-size="15" font-weight="700" fill="#5b5c8a">04</text>
<text x="71" y="465" font-size="21" font-weight="700" fill="#183b4a">Recovery + Control</text>
<text x="36" y="492" font-size="15" font-weight="400" fill="#45616d">Which accepted wake may resume?</text>
<text x="36" y="515" font-size="15" font-weight="400" fill="#45616d">Check the original safe point</text>
<rect x="20" y="554" width="335" height="44" rx="10" fill="#e4eeeb"/>
<text x="32" y="574" font-size="14" font-weight="500" fill="#205b55">Original identity, grant, lease, fence</text>
<text x="32" y="594" font-size="14" font-weight="500" fill="#205b55">Snapshots grant no new authority</text>
<text x="22" y="616" font-size="13" font-weight="400" fill="#64767b">Responsibilities, not new services</text>
<text x="22" y="635" font-size="13" font-weight="400" fill="#64767b">or a second state database.</text>
</g></svg>
