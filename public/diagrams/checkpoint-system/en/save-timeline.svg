<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460" role="img" aria-labelledby="title desc">
<title id="title">One Run. Repeated saves. One latest snapshot.</title>
<desc id="desc">Four illustrative successful saves, not a mandatory checklist. Initialize: No checkpoint yet; Read completes: Original receipt confirmed; Draft commits: Publication receipt confirmed; Save compaction: Adopt only after saving. Current slot: revision 4</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#6c8589" stroke-width="1.6"/></marker></defs>
<rect width="840" height="460" rx="22" fill="#f7f5ef"/>
<rect width="840" height="7" rx="4" fill="#164e63"/>
<g font-family="Noto Sans CJK SC, Noto Sans, sans-serif">
<text x="26" y="46" font-size="26" font-weight="700" fill="#183b4a">One Run. Repeated saves. One latest snapshot.</text>
<text x="26" y="77" font-size="16" font-weight="400" fill="#5a7279">Four illustrative successful saves, not a mandatory checklist</text>
<rect x="26" y="101" width="182" height="122" rx="13" fill="#fff" stroke="#d6dfdc"/>
<text x="41" y="130" font-size="14" font-weight="700" fill="#237165">revision 1</text>
<text x="41" y="162" font-size="17" font-weight="700" fill="#183b4a">Initialize</text>
<text x="41" y="192" font-size="12" font-weight="400" fill="#45616d">No checkpoint yet</text>
<path d="M211 162 h13" fill="none" stroke="#6c8589" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="228" y="101" width="182" height="122" rx="13" fill="#fff" stroke="#d6dfdc"/>
<text x="243" y="130" font-size="14" font-weight="700" fill="#237165">revision 2</text>
<text x="243" y="162" font-size="17" font-weight="700" fill="#183b4a">Read completes</text>
<text x="243" y="192" font-size="12" font-weight="400" fill="#45616d">Original receipt confirmed</text>
<path d="M413 162 h13" fill="none" stroke="#6c8589" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="430" y="101" width="182" height="122" rx="13" fill="#fff" stroke="#d6dfdc"/>
<text x="445" y="130" font-size="14" font-weight="700" fill="#237165">revision 3</text>
<text x="445" y="162" font-size="17" font-weight="700" fill="#183b4a">Draft commits</text>
<text x="445" y="192" font-size="12" font-weight="400" fill="#45616d">Publication receipt confirmed</text>
<path d="M615 162 h13" fill="none" stroke="#6c8589" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="632" y="101" width="182" height="122" rx="13" fill="#edf6f1" stroke="#398276"/>
<text x="647" y="130" font-size="14" font-weight="700" fill="#237165">revision 4</text>
<text x="647" y="162" font-size="17" font-weight="700" fill="#183b4a">Save compaction</text>
<text x="647" y="192" font-size="12" font-weight="400" fill="#45616d">Adopt only after saving</text>
<rect x="26" y="244" width="788" height="76" rx="13" fill="#e2eee9" stroke="#bed5cc"/>
<text x="42" y="273" font-size="21" font-weight="700" fill="#205b55">Current slot: revision 4</text>
<text x="42" y="301" font-size="15" font-weight="400" fill="#205b55">New state replaces the current value; old snapshots are not a replayable history.</text>
<rect x="26" y="334" width="788" height="65" rx="13" fill="#e8eef5" stroke="#cedae4"/>
<text x="42" y="360" font-size="18" font-weight="700" fill="#37576c">Original action receipts + published content</text>
<text x="42" y="385" font-size="16" font-weight="400" fill="#37576c">Kept separately; not overwritten by an old snapshot.</text>
<text x="26" y="426" font-size="13" font-weight="400" fill="#61767c">Real Runs may save more often; a failed response does not prove a new saved revision.</text>
<text x="26" y="446" font-size="13" font-weight="400" fill="#61767c">Execution and Control still decide whether continuation is valid.</text>
</g></svg>
