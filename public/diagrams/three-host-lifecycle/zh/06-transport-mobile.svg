<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1330" viewBox="0 0 520 1330" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">端口还在，不代表原 Product 还在</title><desc id="desc">本机故障注入：旧监听者退出后，替代端口可能收到请求</desc>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans","PingFang SC","Microsoft YaHei",Arial,sans-serif}</style>
<rect x="0" y="0" width="520" height="1330" rx="20" fill="#F4F6F5" stroke="#F4F6F5" stroke-width="1.5"/>
<text x="30" y="39" font-size="17" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="1">06 / IDENTITY</text>
<text x="30" y="80" font-size="25" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">端口还在，不代表原 Product 还在</text>
<text x="30" y="111" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">本机故障注入：旧监听者退出后，替代端口可能收到请求</text>
<rect x="18" y="143" width="484" height="554" rx="18" fill="#FCEAEC" stroke="#E5B9C0" stroke-width="1.5"/><text x="36" y="188" font-size="21" font-weight="700" fill="#B94A57" text-anchor="start" letter-spacing="0">旧路径 · 存在身份空隙</text><rect x="36" y="218" width="448" height="95" rx="15" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><circle cx="56" cy="266" r="7" fill="#B94A57"/><text x="76" y="271" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">Web 请求含合成 Cookie</text><path d="M260 314 V332" fill="none" stroke="#B94A57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="333" width="448" height="95" rx="15" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><circle cx="56" cy="381" r="7" fill="#B94A57"/><text x="76" y="386" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">Product 子进程退出</text><path d="M260 429 V447" fill="none" stroke="#B94A57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="448" width="448" height="95" rx="15" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><circle cx="56" cy="496" r="7" fill="#B94A57"/><text x="76" y="501" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">替代监听者占用原端口</text><path d="M260 544 V562" fill="none" stroke="#B94A57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="563" width="448" height="95" rx="15" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><circle cx="56" cy="611" r="7" fill="#B94A57"/><text x="76" y="616" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">请求误送到替代监听者</text><rect x="18" y="731" width="484" height="554" rx="18" fill="#E3F3EC" stroke="#B3D8CB" stroke-width="1.5"/><text x="36" y="776" font-size="21" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="0">新路径 · 启动器持有对外端口</text><rect x="36" y="806" width="448" height="95" rx="15" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><circle cx="56" cy="854" r="7" fill="#177D75"/><text x="76" y="859" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">Web 请求进入固定端口</text><path d="M260 902 V920" fill="none" stroke="#177D75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="921" width="448" height="95" rx="15" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><circle cx="56" cy="969" r="7" fill="#177D75"/><text x="76" y="974" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">原启动器持续持有监听</text><path d="M260 1017 V1035" fill="none" stroke="#177D75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="1036" width="448" height="95" rx="15" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><circle cx="56" cy="1084" r="7" fill="#177D75"/><text x="76" y="1089" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">转发至受管私有 socket</text><path d="M260 1132 V1150" fill="none" stroke="#177D75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="1151" width="448" height="95" rx="15" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><circle cx="56" cy="1199" r="7" fill="#177D75"/><text x="76" y="1204" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">Product 不在 → 明确 503</text><text x="260" y="1303" font-size="16" font-weight="400" fill="#BB7036" text-anchor="middle" letter-spacing="0">验证对象：受控本机合成监听者，不是生产数据泄露</text>
</svg>