ight="600" fill="#183247" text-anchor="middle" letter-spacing="0">已入队等待</text><rect x="488" y="369" width="245" height="99" rx="15" fill="#E3F3EC" stroke="#D6DFDE" stroke-width="1.5"/><text x="610.5" y="424" font-size="19" font-weight="600" fill="#177D75" text-anchor="middle" letter-spacing="0">先取得容量</text><rect x="756" y="369" width="245" height="99" rx="15" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><text x="878.5" y="424" font-size="19" font-weight="600" fill="#183247" text-anchor="middle" letter-spacing="0">完成并释放</text><rect x="24" y="491" width="180" height="99" rx="15" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><text x="40" y="543" font-size="19" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">新后台 Task</text><rect x="220" y="491" width="245" height="99" rx="15" fill="#FFF1E2" stroke="#D6DFDE" stroke-width="1.5"/><text x="342.5" y="546" font-size="19" font-weight="600" fill="#BB7036" text-anchor="middle" letter-spacing="0">等待启动</text><rect x="488" y="491" width="245" height="99" rx="15" fill="#FFF1E2" stroke="#D6DFDE" stroke-width="1.5"/><text x="610.5" y="546" font-size="19" font-weight="600" fill="#BB7036" text-anchor="middle" letter-spacing="0">不创建新 Run</text><rect x="756" y="491" width="245" height="99" rx="15" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><text x="878.5" y="546" font-size="19" font-weight="600" fill="#183247" text-anchor="middle" letter-spacing="0">取得启动资格</text><rect x="23" y="620" width="978" height="45" rx="14" fill="#E3F3EC" stroke="#A9D3C7" stroke-width="1.5"/><text x="40" y="649" font-size="18" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="0">原位交接：Provider 启动许可 → 同一 Run 首个 Entry</text><text x="36" y="604" font-size="17" font-weight="400" fill="#B94A57" text-anchor="start" letter-spacing="0">不要：释放许可 → 再次申请（中间有竞态空隙）</text>
