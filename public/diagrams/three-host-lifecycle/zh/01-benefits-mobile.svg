<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1270" viewBox="0 0 520 1270" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">拆分前后：用户得到什么？</title><desc id="desc">不同进程可以分别停，业务承诺仍有原始依据</desc>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans","PingFang SC","Microsoft YaHei",Arial,sans-serif}</style>
<rect x="0" y="0" width="520" height="1270" rx="20" fill="#F4F6F5" stroke="#F4F6F5" stroke-width="1.5"/>
<text x="30" y="39" font-size="17" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="1">01 / BENEFITS</text>
<text x="30" y="80" font-size="25" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">拆分前后：用户得到什么？</text>
<text x="30" y="111" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">不同进程可以分别停，业务承诺仍有原始依据</text>
<rect x="17" y="143" width="486" height="515" rx="18" fill="#EDF0F5" stroke="#B9C8E0" stroke-width="1.5"/><rect x="17" y="668" width="486" height="515" rx="18" fill="#E6F3EF" stroke="#A8D9C9" stroke-width="1.5"/><text x="39" y="184" font-size="23" font-weight="700" fill="#4569A6" text-anchor="start" letter-spacing="0">拆分前：共享 API 生命周期</text><text x="39" y="709" font-size="23" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="0">拆分后：独立宿主与持久事实</text><rect x="32" y="204" width="456" height="97" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="33" y="205" width="7" height="95" rx="3.5" fill="#4569A6"/><text x="57" y="237" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">管理接口维护</text><text x="57" y="266" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">后台执行也受同一进程退出影响</text><rect x="32" y="312" width="456" height="97" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="33" y="313" width="7" height="95" rx="3.5" fill="#4569A6"/><text x="57" y="345" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">后台执行故障</text><text x="57" y="374" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">普通研究与管理共担宿主风险</text><rect x="32" y="420" width="456" height="97" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="33" y="421" width="7" height="95" rx="3.5" fill="#4569A6"/><text x="57" y="453" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">前台请求等待</text><text x="57" y="482" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">后台可能在模型入队前先创建 Run</text><rect x="32" y="528" width="456" height="97" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="33" y="529" width="7" height="95" rx="3.5" fill="#4569A6"/><text x="57" y="561" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">重启与恢复</text><text x="57" y="590" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">同一进程的退出并不能证明远端停止</text><rect x="32" y="729" width="456" height="97" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="33" y="730" width="7" height="95" rx="3.5" fill="#177D75"/><text x="57" y="762" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">产品维护</text><text x="57" y="791" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">原 Worker 可继续已确认任务</text><rect x="32" y="837" width="456" height="97" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="33" y="838" width="7" height="95" rx="3.5" fill="#177D75"/><text x="57" y="870" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">后台故障</text><text x="57" y="899" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Core 普通研究和旧成果仍可读</text><rect x="32" y="945" width="456" height="97" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="33" y="946" width="7" height="95" rx="3.5" fill="#177D75"/><text x="57" y="978" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">前台优先</text><text x="57" y="1007" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">已排队前台先于新后台启动</text><rect x="32" y="1053" width="456" height="97" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="33" y="1054" width="7" height="95" rx="3.5" fill="#177D75"/><text x="57" y="1086" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">安全接管</text><text x="57" y="1115" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">原 Task／Provider 回执决定是否接续</text><text x="23" y="1220" font-size="17" font-weight="600" fill="#BB7036" text-anchor="start" letter-spacing="0">注意：数据库、Provider 和账户仍是共享依赖</text>
</svg>