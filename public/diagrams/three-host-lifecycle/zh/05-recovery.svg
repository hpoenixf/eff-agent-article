<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="720" viewBox="0 0 1024 720" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">Worker 崩溃后，哪些工作能接管？</title><desc id="desc">Task lease 过期是资格变化，不是物理工作停止证明</desc>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans","PingFang SC","Microsoft YaHei",Arial,sans-serif}</style>
<rect x="0" y="0" width="1024" height="720" rx="20" fill="#F4F6F5" stroke="#F4F6F5" stroke-width="1.5"/>
<text x="30" y="39" font-size="17" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="1">05 / RECOVERY</text>
<text x="30" y="80" font-size="30" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Worker 崩溃后，哪些工作能接管？</text>
<text x="30" y="111" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Task lease 过期是资格变化，不是物理工作停止证明</text>
<rect x="100" y="149" width="824" height="75" rx="16" fill="#EAF1FC" stroke="#C3D2E9" stroke-width="1.5"/><text x="512" y="197" font-size="19" font-weight="700" fill="#183247" text-anchor="middle" letter-spacing="0">原 Worker 停止 / 失联 · 读取原 Claim / Provider 回执</text><path d="M512 224 V260 H174 V292 M512 260 V292 M512 260 H850 V292" fill="none" stroke="#4569A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="29" y="298" width="304" height="250" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="30" y="299" width="7" height="248" rx="3.5" fill="#177D75"/><text x="54" y="331" font-size="21" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">A · 未绑定 Entry</text><text x="54" y="360" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">原 Run 可能尚未创建</text><text x="54" y="385" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">合格同机槽 + 新 Task fence</text><text x="54" y="410" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">才可接管明确的启动占位</text><rect x="44" y="570" width="274" height="50" rx="12" fill="#E3F3EC" stroke="#D6DFDE" stroke-width="1.5"/><text x="181" y="601" font-size="20" font-weight="700" fill="#177D75" text-anchor="middle" letter-spacing="0">可有界接续</text><rect x="367" y="298" width="304" height="250" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="368" y="299" width="7" height="248" rx="3.5" fill="#BB7036"/><text x="392" y="331" font-size="21" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">B · 已绑定 Entry</text><text x="392" y="360" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">保留旧 Entry 与 lease</text><text x="392" y="385" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">新槽不替换请求身份</text><text x="392" y="410" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">先核对原派发与回执</text><rect x="382" y="570" width="274" height="50" rx="12" fill="#FFF1E2" stroke="#D6DFDE" stroke-width="1.5"/><text x="519" y="601" font-size="20" font-weight="700" fill="#BB7036" text-anchor="middle" letter-spacing="0">不能盲目换绑</text><rect x="705" y="298" width="304" height="250" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="706" y="299" width="7" height="248" rx="3.5" fill="#B94A57"/><text x="730" y="331" font-size="21" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">C · 已物理派发</text><text x="730" y="360" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">响应可能仍在远端执行</text><text x="730" y="385" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">dispatched / unknown 保留</text><text x="730" y="410" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">不得重复派发模型调用</text><rect x="720" y="570" width="274" height="50" rx="12" fill="#FCEAEC" stroke="#D6DFDE" stroke-width="1.5"/><text x="857" y="601" font-size="20" font-weight="700" fill="#B94A57" text-anchor="middle" letter-spacing="0">维持未知隔离</text><text x="512" y="677" font-size="17" font-weight="400" fill="#BB7036" text-anchor="middle" letter-spacing="0">同机锁证明有范围：不能推断跨主机、跨挂载或全部外部效果</text>
</svg>