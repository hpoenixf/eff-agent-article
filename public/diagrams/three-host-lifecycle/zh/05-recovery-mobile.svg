<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1090" viewBox="0 0 520 1090" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">Worker 崩溃后，哪些工作能接管？</title><desc id="desc">Task lease 过期是资格变化，不是物理工作停止证明</desc>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans","PingFang SC","Microsoft YaHei",Arial,sans-serif}</style>
<rect x="0" y="0" width="520" height="1090" rx="20" fill="#F4F6F5" stroke="#F4F6F5" stroke-width="1.5"/>
<text x="30" y="39" font-size="17" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="1">05 / RECOVERY</text>
<text x="30" y="80" font-size="25" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Worker 崩溃后，哪些工作能接管？</text>
<text x="30" y="111" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Task lease 过期是资格变化，不是物理工作停止证明</text>
<rect x="22" y="146" width="476" height="89" rx="15" fill="#EAF1FC" stroke="#C3D2E9" stroke-width="1.5"/><text x="260" y="182" font-size="22" font-weight="700" fill="#183247" text-anchor="middle" letter-spacing="0">原 Worker 停止或失联</text><text x="260" y="208" font-size="18" font-weight="400" fill="#516677" text-anchor="middle" letter-spacing="0">先读取原 Claim / Provider 回执</text><path d="M260 236 V267" fill="none" stroke="#4569A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="23" y="271" width="474" height="207" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="24" y="272" width="7" height="205" rx="3.5" fill="#177D75"/><text x="48" y="304" font-size="23" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">A · 未绑定 Entry</text><text x="48" y="333" font-size="19" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">原 Run 可能尚未创建</text><text x="48" y="358" font-size="19" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">合格同机槽 + 新 Task fence</text><text x="48" y="383" font-size="19" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">才可接管明确的启动占位</text><rect x="43" y="421" width="432" height="40" rx="11" fill="#E3F3EC" stroke="#D6DFDE" stroke-width="1.5"/><text x="260" y="448" font-size="19" font-weight="700" fill="#177D75" text-anchor="middle" letter-spacing="0">可有界接续</text><path d="M260 498 V514" fill="none" stroke="#4569A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="23" y="518" width="474" height="207" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="24" y="519" width="7" height="205" rx="3.5" fill="#BB7036"/><text x="48" y="551" font-size="23" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">B · 已绑定 Entry</text><text x="48" y="580" font-size="19" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">保留旧 Entry 与 lease</text><text x="48" y="605" font-size="19" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">新槽不替换请求身份</text><text x="48" y="630" font-size="19" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">先核对原派发与回执</text><rect x="43" y="668" width="432" height="40" rx="11" fill="#FFF1E2" stroke="#D6DFDE" stroke-width="1.5"/><text x="260" y="695" font-size="19" font-weight="700" fill="#BB7036" text-anchor="middle" letter-spacing="0">不能盲目换绑</text><path d="M260 745 V761" fill="none" stroke="#4569A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="23" y="765" width="474" height="207" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="24" y="766" width="7" height="205" rx="3.5" fill="#B94A57"/><text x="48" y="798" font-size="23" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">C · 已物理派发</text><text x="48" y="827" font-size="19" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">响应可能仍在远端执行</text><text x="48" y="852" font-size="19" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">dispatched / unknown 保留</text><text x="48" y="877" font-size="19" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">不得重复派发模型调用</text><rect x="43" y="915" width="432" height="40" rx="11" fill="#FCEAEC" stroke="#D6DFDE" stroke-width="1.5"/><text x="260" y="942" font-size="19" font-weight="700" fill="#B94A57" text-anchor="middle" letter-spacing="0">维持未知隔离</text><text x="260" y="1051" font-size="16" font-weight="400" fill="#BB7036" text-anchor="middle" letter-spacing="0">同机锁证明有范围：不能推断跨主机、跨挂载或全部外部效果</text>
</svg>