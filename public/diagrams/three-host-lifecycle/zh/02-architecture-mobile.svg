<rect x="0" y="0" width="520" height="1090" rx="20" fill="#F4F6F5" stroke="#F4F6F5" stroke-width="1.5"/>
<text x="30" y="39" font-size="17" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="1">02 / TOPOLOGY</text>
<text x="30" y="80" font-size="25" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">三个宿主，一套业务事实</text>
<text x="30" y="111" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">分开运行生命周期，不新建第二套 Task／Run／Publication</text>
<rect x="24" y="151" width="472" height="99" rx="17" fill="#EAF1FC" stroke="#BFCDEA" stroke-width="1.5"/><text x="260" y="188" font-size="22" font-weight="700" fill="#183247" text-anchor="middle" letter-spacing="0">Web · 同源访问</text><text x="260" y="217" font-size="16" font-weight="400" fill="#516677" text-anchor="middle" letter-spacing="0">普通会话与定时管理按明确路径分流</text><path d="M260 250 V286" fill="none" stroke="#4569A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="289" width="456" height="137" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="33" y="290" width="7" height="135" rx="3.5" fill="#4569A6"/><text x="57" y="322" font-size="23" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Core API</text><text x="57" y="351" font-size="19" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">普通会话 / 前台研究</text><text x="57" y="376" font-size="19" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">已提交正文读取</text><path d="M260 426 V444" fill="none" stroke="#177D75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="447" width="456" height="137" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="33" y="448" width="7" height="135" rx="3.5" fill="#177D75"/><text x="57" y="480" font-size="23" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Product API</text><text x="57" y="509" font-size="19" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">订阅确认 / 暂停 / 取消</text><text x="57" y="534" font-size="19" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Task History</text><path d="M260 584 V602" fill="none" stroke="#BB7036" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="605" width="456" height="137" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="33" y="606" width="7" height="135" rx="3.5" fill="#BB7036"/><text x="57" y="638" font-size="23" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Background Worker</text><text x="57" y="667" font-size="19" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">到期研究 / 控制唤醒</text><text x="57" y="692" font-size="19" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">恢复与通知</text><path d="M260 743 V769" fill="none" stroke="#177D75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="25" y="769" width="470" height="127" rx="17" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><text x="260" y="809" font-size="22" font-weight="700" fill="#183247" text-anchor="middle" letter-spacing="0">原有权威继续共享</text><text x="260" y="846" font-size="19" font-weight="400" fill="#4569A6" text-anchor="middle" letter-spacing="0">Task · Run · Control · Publication</text><path d="M260 897 V917" fill="none" stroke="#177D75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="38" y="922" width="444" height="96" rx="14" fill="#E3F3EC" stroke="#AED5C8" stroke-width="1.5"/><text x="260" y="960" font-size="20" font-weight="700" fill="#183247" text-anchor="middle" letter-spacing="0">原持久资源</text><text x="260" y="987" font-size="18" font-weight="400" fill="#183247" text-anchor="middle" letter-spacing="0">PostgreSQL / Provider Admission</text><text x="260" y="1051" font-size="17" font-weight="400" fill="#BB7036" text-anchor="middle" letter-spacing="0">宿主角色决定装配，不授权模型或数据</text>
