<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1020" viewBox="0 0 520 1020" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">单槽位竞争：谁先拿到模型容量？</title><desc id="desc">已开始工作保留资格；新后台必须让位于已排队的前台</desc>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans","PingFang SC","Microsoft YaHei",Arial,sans-serif}</style>
<rect x="0" y="0" width="520" height="1020" rx="20" fill="#F4F6F5" stroke="#F4F6F5" stroke-width="1.5"/>
<text x="30" y="39" font-size="17" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="1">04 / ADMISSION</text>
<text x="30" y="80" font-size="25" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">单槽位竞争：谁先拿到模型容量？</text>
<text x="30" y="111" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">已开始工作保留资格；新后台必须让位于已排队的前台</text>
<rect x="21" y="148" width="478" height="235" rx="18" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="37" y="164" width="446" height="52" rx="12" fill="#EAF1FC" stroke="#C9D7EC" stroke-width="1.5"/><text x="260" y="197" font-size="20" font-weight="700" fill="#183247" text-anchor="middle" letter-spacing="0">时刻 A · 唯一槽占用</text><circle cx="46" cy="244" r="5" fill="#4569A6"/><text x="62" y="251" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">旧后台 Task：正在执行</text><circle cx="46" cy="286" r="5" fill="#177D75"/><text x="62" y="293" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">前台请求：已入队等待</text><circle cx="46" cy="328" r="5" fill="#BB7036"/><text x="62" y="335" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">新后台 Task：等待启动</text><rect x="21" y="402" width="478" height="235" rx="18" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="37" y="418" width="446" height="52" rx="12" fill="#EAF1FC" stroke="#C9D7EC" stroke-width="1.5"/><text x="260" y="451" font-size="20" font-weight="700" fill="#183247" text-anchor="middle" letter-spacing="0">时刻 B · 容量释放</text><circle cx="46" cy="498" r="5" fill="#4569A6"/><text x="62" y="505" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">旧后台 Task：完成原请求</text><circle cx="46" cy="540" r="5" fill="#177D75"/><text x="62" y="547" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">前台请求：先取得容量</text><circle cx="46" cy="582" r="5" fill="#BB7036"/><text x="62" y="589" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">新后台 Task：不创建新 Run</text><rect x="21" y="656" width="478" height="235" rx="18" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="37" y="672" width="446" height="52" rx="12" fill="#EAF1FC" stroke="#C9D7EC" stroke-width="1.5"/><text x="260" y="705" font-size="20" font-weight="700" fill="#183247" text-anchor="middle" letter-spacing="0">时刻 C · 前台完成</text><circle cx="46" cy="752" r="5" fill="#4569A6"/><text x="62" y="759" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">旧后台 Task：已完成</text><circle cx="46" cy="794" r="5" fill="#177D75"/><text x="62" y="801" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">前台请求：完成并释放</text><circle cx="46" cy="836" r="5" fill="#BB7036"/><text x="62" y="843" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">新后台 Task：取得启动资格</text><rect x="22" y="912" width="476" height="60" rx="13" fill="#E3F3EC" stroke="#A9D3C7" stroke-width="1.5"/><text x="35" y="937" font-size="15" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="0">原位交接：Provider 启动许可 → 同一 Run 首个 Entry</text><text x="35" y="957" font-size="14" font-weight="400" fill="#B94A57" text-anchor="start" letter-spacing="0">不要：释放许可 → 再次申请（中间有竞态空隙）</text>
</svg>