<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1020" viewBox="0 0 520 1020" role="img" aria-labelledby="title desc" lang="en">
<title id="title">One provider slot: who executes next?</title><desc id="desc">Keep existing work; defer new background starts behind queued foreground</desc>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans","PingFang SC","Microsoft YaHei",Arial,sans-serif}</style>
<rect x="0" y="0" width="520" height="1020" rx="20" fill="#F4F6F5" stroke="#F4F6F5" stroke-width="1.5"/>
<text x="30" y="39" font-size="17" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="1">04 / ADMISSION</text>
<text x="30" y="80" font-size="25" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Who gets the next model slot?</text>
<text x="30" y="111" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">New Tasks yield to queued foreground</text>
<rect x="21" y="148" width="478" height="235" rx="18" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="37" y="164" width="446" height="52" rx="12" fill="#EAF1FC" stroke="#C9D7EC" stroke-width="1.5"/><text x="260" y="197" font-size="20" font-weight="700" fill="#183247" text-anchor="middle" letter-spacing="0">T0 · slot occupied</text><circle cx="46" cy="244" r="5" fill="#4569A6"/><text x="62" y="251" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">Existing Task：Running</text><circle cx="46" cy="286" r="5" fill="#177D75"/><text x="62" y="293" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">Foreground：Queued</text><circle cx="46" cy="328" r="5" fill="#BB7036"/><text x="62" y="335" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">New Task：Waits to start</text><rect x="21" y="402" width="478" height="235" rx="18" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="37" y="418" width="446" height="52" rx="12" fill="#EAF1FC" stroke="#C9D7EC" stroke-width="1.5"/><text x="260" y="451" font-size="20" font-weight="700" fill="#183247" text-anchor="middle" letter-spacing="0">T1 · slot released</text><circle cx="46" cy="498" r="5" fill="#4569A6"/><text x="62" y="505" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">Existing Task：Completes request</text><circle cx="46" cy="540" r="5" fill="#177D75"/><text x="62" y="547" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">Foreground：Gets slot first</text><circle cx="46" cy="582" r="5" fill="#BB7036"/><text x="62" y="589" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">New Task：No new Run</text><rect x="21" y="656" width="478" height="235" rx="18" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="37" y="672" width="446" height="52" rx="12" fill="#EAF1FC" stroke="#C9D7EC" stroke-width="1.5"/><text x="260" y="705" font-size="20" font-weight="700" fill="#183247" text-anchor="middle" letter-spacing="0">T2 · foreground done</text><circle cx="46" cy="752" r="5" fill="#4569A6"/><text x="62" y="759" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">Existing Task：Completed</text><circle cx="46" cy="794" r="5" fill="#177D75"/><text x="62" y="801" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">Foreground：Completes</text><circle cx="46" cy="836" r="5" fill="#BB7036"/><text x="62" y="843" font-size="18" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">New Task：May start</text><rect x="22" y="912" width="476" height="60" rx="13" fill="#E3F3EC" stroke="#A9D3C7" stroke-width="1.5"/><text x="35" y="937" font-size="15" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="0">Keep one Provider lease through the first Entry</text><text x="35" y="957" font-size="14" font-weight="400" fill="#B94A57" text-anchor="start" letter-spacing="0">Do not release then reacquire the slot</text>
</svg>