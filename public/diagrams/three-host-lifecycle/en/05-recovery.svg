<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="720" viewBox="0 0 1024 720" role="img" aria-labelledby="title desc" lang="en">
<title id="title">After a Worker crash: what can resume?</title><desc id="desc">An expired Task lease does not prove the original work stopped</desc>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans","PingFang SC","Microsoft YaHei",Arial,sans-serif}</style>
<rect x="0" y="0" width="1024" height="720" rx="20" fill="#F4F6F5" stroke="#F4F6F5" stroke-width="1.5"/>
<text x="30" y="39" font-size="17" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="1">05 / RECOVERY</text>
<text x="30" y="80" font-size="30" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">After a Worker crash: what can resume?</text>
<text x="30" y="111" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">An expired Task lease does not prove the original work stopped</text>
<rect x="100" y="149" width="824" height="75" rx="16" fill="#EAF1FC" stroke="#C3D2E9" stroke-width="1.5"/><text x="512" y="197" font-size="19" font-weight="700" fill="#183247" text-anchor="middle" letter-spacing="0">Original Worker crashed or lost connection · inspect receipts</text><path d="M512 224 V260 H174 V292 M512 260 V292 M512 260 H850 V292" fill="none" stroke="#4569A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="29" y="298" width="304" height="250" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="30" y="299" width="7" height="248" rx="3.5" fill="#177D75"/><text x="54" y="331" font-size="21" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">A · Entry unbound</text><text x="54" y="360" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Run may not yet exist</text><text x="54" y="385" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Proven same-host slot + new fence</text><text x="54" y="410" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Permit narrow startup-slot handoff</text><rect x="44" y="570" width="274" height="50" rx="12" fill="#E3F3EC" stroke="#D6DFDE" stroke-width="1.5"/><text x="181" y="601" font-size="20" font-weight="700" fill="#177D75" text-anchor="middle" letter-spacing="0">Bounded continuation</text><rect x="367" y="298" width="304" height="250" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="368" y="299" width="7" height="248" rx="3.5" fill="#BB7036"/><text x="392" y="331" font-size="21" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">B · Entry bound</text><text x="392" y="360" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Keep original Entry and lease</text><text x="392" y="385" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">New slot cannot replace identity</text><text x="392" y="410" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Reconcile original dispatch receipts</text><rect x="382" y="570" width="274" height="50" rx="12" fill="#FFF1E2" stroke="#D6DFDE" stroke-width="1.5"/><text x="519" y="601" font-size="20" font-weight="700" fill="#BB7036" text-anchor="middle" letter-spacing="0">No blind rebind</text><rect x="705" y="298" width="304" height="250" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="706" y="299" width="7" height="248" rx="3.5" fill="#B94A57"/><text x="730" y="331" font-size="21" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">C · Dispatched</text><text x="730" y="360" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Remote call may remain active</text><text x="730" y="385" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Retain dispatched / unknown</text><text x="730" y="410" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Never repeat the model call</text><rect x="720" y="570" width="274" height="50" rx="12" fill="#FCEAEC" stroke="#D6DFDE" stroke-width="1.5"/><text x="857" y="601" font-size="20" font-weight="700" fill="#B94A57" text-anchor="middle" letter-spacing="0">Retain unknown</text><text x="512" y="677" font-size="17" font-weight="400" fill="#BB7036" text-anchor="middle" letter-spacing="0">Same-host lock proof does not establish cross-host or all-effects recovery</text>
</svg>