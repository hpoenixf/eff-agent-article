<text x="30" y="39" font-size="17" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="1">01 / BENEFITS</text>
<text x="30" y="80" font-size="25" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Before vs after: what changes for users?</text>
<text x="30" y="111" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Independent host lifetimes; original durable facts remain authoritative</text>
<rect x="17" y="143" width="486" height="515" rx="18" fill="#EDF0F5" stroke="#B9C8E0" stroke-width="1.5"/><rect x="17" y="668" width="486" height="515" rx="18" fill="#E6F3EF" stroke="#A8D9C9" stroke-width="1.5"/><text x="39" y="184" font-size="23" font-weight="700" fill="#4569A6" text-anchor="start" letter-spacing="0">BEFORE · one API process</text><text x="39" y="709" font-size="23" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="0">AFTER · independent process hosts</text><rect x="32" y="204" width="456" height="97" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="33" y="205" width="7" height="95" rx="3.5" fill="#4569A6"/><text x="57" y="237" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Product maintenance</text><text x="57" y="266" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Background execution shares process exit</text><rect x="32" y="312" width="456" height="97" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="33" y="313" width="7" height="95" rx="3.5" fill="#4569A6"/><text x="57" y="345" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Worker incident</text><text x="57" y="374" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Interactive research shares host risk</text><rect x="32" y="420" width="456" height="97" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="33" y="421" width="7" height="95" rx="3.5" fill="#4569A6"/><text x="57" y="453" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Foreground waiting</text><text x="57" y="482" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">New background Run may start too early</text><rect x="32" y="528" width="456" height="97" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="33" y="529" width="7" height="95" rx="3.5" fill="#4569A6"/><text x="57" y="561" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Restart and recovery</text><text x="57" y="590" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Lost lease cannot prove remote stop</text><rect x="32" y="729" width="456" height="97" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="33" y="730" width="7" height="95" rx="3.5" fill="#177D75"/><text x="57" y="762" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Product maintenance</text><text x="57" y="791" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Existing Worker keeps accepted task</text><rect x="32" y="837" width="456" height="97" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="33" y="838" width="7" height="95" rx="3.5" fill="#177D75"/><text x="57" y="870" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Worker incident</text><text x="57" y="899" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Core and stored results stay readable</text><rect x="32" y="945" width="456" height="97" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="33" y="946" width="7" height="95" rx="3.5" fill="#177D75"/><text x="57" y="978" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Foreground priority</text><text x="57" y="1007" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Queued user request precedes new Task</text><rect x="32" y="1053" width="456" height="97" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="33" y="1054" width="7" height="95" rx="3.5" fill="#177D75"/><text x="57" y="1086" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Safe takeover</text><text x="57" y="1115" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Task and Provider receipts decide</text><text x="23" y="1220" font-size="17" font-weight="600" fill="#BB7036" text-anchor="start" letter-spacing="0">Database, provider capacity, and identity stores remain shared</text>
</svg>