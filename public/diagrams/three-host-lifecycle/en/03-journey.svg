<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="860" viewBox="0 0 1024 860" role="img" aria-labelledby="title desc" lang="en">
<title id="title">One scheduled study, across three hosts</title><desc id="desc">Admission, execution, publication, and readback are separate facts</desc>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans","PingFang SC","Microsoft YaHei",Arial,sans-serif}</style>
<rect x="0" y="0" width="1024" height="860" rx="20" fill="#F4F6F5" stroke="#F4F6F5" stroke-width="1.5"/>
<text x="30" y="39" font-size="17" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="1">03 / LIFECYCLE</text>
<text x="30" y="80" font-size="30" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">One scheduled study, across three hosts</text>
<text x="30" y="111" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Admission, execution, publication, and readback are separate facts</text>
<rect x="28" y="144" width="968" height="99" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="28" y="144" width="189" height="99" rx="14" fill="#E3F3EC"/><text x="47" y="197" font-size="21" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="0">01 Product</text><text x="250" y="181" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">User confirms a scheduled study</text><text x="250" y="209" font-size="16" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Validate account / Scope / revision</text><text x="250" y="232" font-size="16" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Persist an authorized Schedule</text><path d="M512 244 V253" fill="none" stroke="#177D75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="253" width="968" height="99" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="28" y="253" width="189" height="99" rx="14" fill="#FFF1E2"/><text x="47" y="306" font-size="21" font-weight="700" fill="#BB7036" text-anchor="start" letter-spacing="0">02 Product down</text><text x="250" y="290" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Management API can exit</text><text x="250" y="318" font-size="16" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">No user Stop or cancellation implied</text><text x="250" y="341" font-size="16" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Original confirmed schedule persists</text><path d="M512 353 V362" fill="none" stroke="#177D75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="362" width="968" height="99" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="28" y="362" width="189" height="99" rx="14" fill="#EAF1FC"/><text x="47" y="415" font-size="21" font-weight="700" fill="#4569A6" text-anchor="start" letter-spacing="0">03 Worker</text><text x="250" y="399" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Due event is claimed independently</text><text x="250" y="427" font-size="16" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Read qualified occurrence / Task</text><text x="250" y="450" font-size="16" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Recheck Task and Provider admission</text><path d="M512 462 V471" fill="none" stroke="#177D75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="471" width="968" height="99" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="28" y="471" width="189" height="99" rx="14" fill="#E3F3EC"/><text x="47" y="524" font-size="21" font-weight="700" fill="#4569A6" text-anchor="start" letter-spacing="0">04 Runtime</text><text x="250" y="508" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Only qualified requests are dispatched</text><text x="250" y="536" font-size="16" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Original Run, budget, tools, Gateway</text><text x="250" y="559" font-size="16" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Retain effects and unknown receipts</text><path d="M512 571 V580" fill="none" stroke="#177D75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="580" width="968" height="99" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="28" y="580" width="189" height="99" rx="14" fill="#FFF1E2"/><text x="47" y="633" font-size="21" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="0">05 Publication</text><text x="250" y="617" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Commit answer and settle notice</text><text x="250" y="645" font-size="16" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Store original result revision</text><text x="250" y="668" font-size="16" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Retry notice, never rerun research</text><path d="M512 680 V689" fill="none" stroke="#177D75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="689" width="968" height="99" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="28" y="689" width="189" height="99" rx="14" fill="#EAF1FC"/><text x="47" y="742" font-size="21" font-weight="700" fill="#BB7036" text-anchor="start" letter-spacing="0">06 Product returns</text><text x="250" y="726" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Read answer in Task History</text><text x="250" y="754" font-size="16" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Authenticate same user / Scope</text><text x="250" y="777" font-size="16" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">No old Worker memory required</text><text x="36" y="835" font-size="18" font-weight="700" fill="#BB7036" text-anchor="start" letter-spacing="0">API shutdown ≠ user cancellation; schedule pause ≠ cancel a running Task</text>
</svg>