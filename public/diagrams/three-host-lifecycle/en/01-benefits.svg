<text x="30" y="80" font-size="30" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Before vs after: what changes for users?</text>
<text x="30" y="111" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Independent host lifetimes; original durable facts remain authoritative</text>
<rect x="25" y="149" width="474" height="568" rx="18" fill="#EDF0F5" stroke="#B9C8E0" stroke-width="1.5"/><rect x="525" y="149" width="474" height="568" rx="18" fill="#E6F3EF" stroke="#A8D9C9" stroke-width="1.5"/><text x="50" y="191" font-size="23" font-weight="700" fill="#4569A6" text-anchor="start" letter-spacing="0">BEFORE · one API process</text><text x="549" y="191" font-size="23" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="0">AFTER · independent process hosts</text><rect x="45" y="219" width="438" height="106" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="46" y="220" width="7" height="104" rx="3.5" fill="#4569A6"/><text x="70" y="252" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Product maintenance</text><text x="70" y="281" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Background execution shares process exit</text><rect x="45" y="339" width="438" height="106" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="46" y="340" width="7" height="104" rx="3.5" fill="#4569A6"/><text x="70" y="372" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Worker incident</text><text x="70" y="401" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Interactive research shares host risk</text><rect x="45" y="459" width="438" height="106" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="46" y="460" width="7" height="104" rx="3.5" fill="#4569A6"/><text x="70" y="492" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Foreground waiting</text><text x="70" y="521" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">New background Run may start too early</text><rect x="45" y="579" width="438" height="106" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="46" y="580" width="7" height="104" rx="3.5" fill="#4569A6"/><text x="70" y="612" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Restart and recovery</text><text x="70" y="641" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Lost lease cannot prove remote stop</text><rect x="544" y="219" width="438" height="106" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="545" y="220" width="7" height="104" rx="3.5" fill="#177D75"/><text x="569" y="252" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Product maintenance</text><text x="569" y="281" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Existing Worker keeps accepted task</text><rect x="544" y="339" width="438" height="106" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="545" y="340" width="7" height="104" rx="3.5" fill="#177D75"/><text x="569" y="372" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Worker incident</text><text x="569" y="401" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Core and stored results stay readable</text><rect x="544" y="459" width="438" height="106" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="545" y="460" width="7" height="104" rx="3.5" fill="#177D75"/><text x="569" y="492" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Foreground priority</text><text x="569" y="521" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Queued user request precedes new Task</text><rect x="544" y="579" width="438" height="106" rx="16" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="545" y="580" width="7" height="104" rx="3.5" fill="#177D75"/><text x="569" y="612" font-size="20" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Safe takeover</text><text x="569" y="641" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Task and Provider receipts decide</text><text x="40" y="762" font-size="19" font-weight="600" fill="#BB7036" text-anchor="start" letter-spacing="0">Database, provider capacity, and identity stores remain shared</text>
