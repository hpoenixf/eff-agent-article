<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="690" viewBox="0 0 1024 690" role="img" aria-labelledby="title desc" lang="en">
<title id="title">One provider slot: who executes next?</title><desc id="desc">Keep existing work; defer new background starts behind queued foreground</desc>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans","PingFang SC","Microsoft YaHei",Arial,sans-serif}</style>
<rect x="0" y="0" width="1024" height="690" rx="20" fill="#F4F6F5" stroke="#F4F6F5" stroke-width="1.5"/>
<text x="30" y="39" font-size="17" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="1">04 / ADMISSION</text>
<text x="30" y="80" font-size="30" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">One provider slot: who executes next?</text>
<text x="30" y="111" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Keep existing work; defer new background starts behind queued foreground</text>
<rect x="220" y="157" width="245" height="55" rx="13" fill="#EAF1FC" stroke="#C9D7EC" stroke-width="1.5"/><text x="342.5" y="191" font-size="18" font-weight="700" fill="#183247" text-anchor="middle" letter-spacing="0">T0 · slot occupied</text><rect x="488" y="157" width="245" height="55" rx="13" fill="#EAF1FC" stroke="#C9D7EC" stroke-width="1.5"/><text x="610.5" y="191" font-size="18" font-weight="700" fill="#183247" text-anchor="middle" letter-spacing="0">T1 · slot released</text><rect x="756" y="157" width="245" height="55" rx="13" fill="#EAF1FC" stroke="#C9D7EC" stroke-width="1.5"/><text x="878.5" y="191" font-size="18" font-weight="700" fill="#183247" text-anchor="middle" letter-spacing="0">T2 · foreground done</text><rect x="24" y="247" width="180" height="99" rx="15" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><text x="40" y="299" font-size="19" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Existing Task</text><rect x="220" y="247" width="245" height="99" rx="15" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><text x="342.5" y="302" font-size="19" font-weight="600" fill="#183247" text-anchor="middle" letter-spacing="0">Running</text><rect x="488" y="247" width="245" height="99" rx="15" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><text x="610.5" y="302" font-size="19" font-weight="600" fill="#183247" text-anchor="middle" letter-spacing="0">Completes request</text><rect x="756" y="247" width="245" height="99" rx="15" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><text x="878.5" y="302" font-size="19" font-weight="600" fill="#183247" text-anchor="middle" letter-spacing="0">Completed</text><rect x="24" y="369" width="180" height="99" rx="15" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><text x="40" y="421" font-size="19" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Foreground</text><rect x="220" y="369" width="245" height="99" rx="15" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><text x="342.5" y="424" font-size="19" font-weight="600" fill="#183247" text-anchor="middle" letter-spacing="0">Queued</text><rect x="488" y="369" width="245" height="99" rx="15" fill="#E3F3EC" stroke="#D6DFDE" stroke-width="1.5"/><text x="610.5" y="424" font-size="19" font-weight="600" fill="#177D75" text-anchor="middle" letter-spacing="0">Gets slot first</text><rect x="756" y="369" width="245" height="99" rx="15" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><text x="878.5" y="424" font-size="19" font-weight="600" fill="#183247" text-anchor="middle" letter-spacing="0">Completes</text><rect x="24" y="491" width="180" height="99" rx="15" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><text x="40" y="543" font-size="19" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">New Task</text><rect x="220" y="491" width="245" height="99" rx="15" fill="#FFF1E2" stroke="#D6DFDE" stroke-width="1.5"/><text x="342.5" y="546" font-size="19" font-weight="600" fill="#BB7036" text-anchor="middle" letter-spacing="0">Waits to start</text><rect x="488" y="491" width="245" height="99" rx="15" fill="#FFF1E2" stroke="#D6DFDE" stroke-width="1.5"/><text x="610.5" y="546" font-size="19" font-weight="600" fill="#BB7036" text-anchor="middle" letter-spacing="0">No new Run</text><rect x="756" y="491" width="245" height="99" rx="15" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><text x="878.5" y="546" font-size="19" font-weight="600" fill="#183247" text-anchor="middle" letter-spacing="0">May start</text><rect x="23" y="620" width="978" height="45" rx="14" fill="#E3F3EC" stroke="#A9D3C7" stroke-width="1.5"/><text x="40" y="649" font-size="18" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="0">In-place handoff: Provider startup slot → same Run's first Entry</text><text x="36" y="604" font-size="17" font-weight="400" fill="#B94A57" text-anchor="start" letter-spacing="0">Avoid: release slot → reacquire slot (another waiter can intervene)</text>
</svg>