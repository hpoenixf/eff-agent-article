<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="760" viewBox="0 0 1024 760" role="img" aria-labelledby="title desc" lang="en">
<title id="title">An open port is not Product identity</title><desc id="desc">Local fault injection: a different listener reused the old Product port</desc>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans","PingFang SC","Microsoft YaHei",Arial,sans-serif}</style>
<rect x="0" y="0" width="1024" height="760" rx="20" fill="#F4F6F5" stroke="#F4F6F5" stroke-width="1.5"/>
<text x="30" y="39" font-size="17" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="1">06 / IDENTITY</text>
<text x="30" y="80" font-size="30" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">An open port is not Product identity</text>
<text x="30" y="111" font-size="17" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Local fault injection: a different listener reused the old Product port</text>
<rect x="24" y="148" width="476" height="525" rx="19" fill="#FCEAEC" stroke="#E5B9C0" stroke-width="1.5"/><text x="47" y="186" font-size="22" font-weight="700" fill="#B94A57" text-anchor="start" letter-spacing="0">BEFORE · unstable listener identity</text><rect x="46" y="216" width="430" height="80" rx="14" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><circle cx="67" cy="255" r="7" fill="#B94A57"/><text x="86" y="261" font-size="19" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">Web request with synthetic cookie</text><path d="M262 297 V319" fill="none" stroke="#B94A57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="46" y="321" width="430" height="80" rx="14" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><circle cx="67" cy="360" r="7" fill="#B94A57"/><text x="86" y="366" font-size="19" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">Original Product child exits</text><path d="M262 402 V424" fill="none" stroke="#B94A57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="46" y="426" width="430" height="80" rx="14" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><circle cx="67" cy="465" r="7" fill="#B94A57"/><text x="86" y="471" font-size="19" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">Replacement binds old TCP port</text><path d="M262 507 V529" fill="none" stroke="#B94A57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="46" y="531" width="430" height="80" rx="14" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><circle cx="67" cy="570" r="7" fill="#B94A57"/><text x="86" y="576" font-size="19" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">Request reaches replacement</text><rect x="531" y="148" width="476" height="525" rx="19" fill="#E3F3EC" stroke="#B3D8CB" stroke-width="1.5"/><text x="554" y="186" font-size="22" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="0">AFTER · launcher owns public port</text><rect x="553" y="216" width="430" height="80" rx="14" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><circle cx="574" cy="255" r="7" fill="#177D75"/><text x="593" y="261" font-size="19" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">Web reaches stable public port</text><path d="M769 297 V319" fill="none" stroke="#177D75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="553" y="321" width="430" height="80" rx="14" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><circle cx="574" cy="360" r="7" fill="#177D75"/><text x="593" y="366" font-size="19" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">Original launcher retains listener</text><path d="M769 402 V424" fill="none" stroke="#177D75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="553" y="426" width="430" height="80" rx="14" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><circle cx="574" cy="465" r="7" fill="#177D75"/><text x="593" y="471" font-size="19" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">Forward to private child socket</text><path d="M769 507 V529" fill="none" stroke="#177D75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="553" y="531" width="430" height="80" rx="14" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><circle cx="574" cy="570" r="7" fill="#177D75"/><text x="593" y="576" font-size="19" font-weight="600" fill="#183247" text-anchor="start" letter-spacing="0">Product absent → explicit 503</text><text x="512" y="723" font-size="18" font-weight="400" fill="#BB7036" text-anchor="middle" letter-spacing="0">Scope: controlled local fixtures, not a real-user credential incident</text>
</svg>