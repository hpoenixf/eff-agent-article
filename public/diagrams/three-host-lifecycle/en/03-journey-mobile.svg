<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1360" viewBox="0 0 520 1360" role="img" aria-labelledby="title desc" lang="en">
<title id="title">One scheduled study, across three hosts</title><desc id="desc">Admission, execution, publication, and readback are separate facts</desc>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans","PingFang SC","Microsoft YaHei",Arial,sans-serif}</style>
<rect x="0" y="0" width="520" height="1360" rx="20" fill="#F4F6F5" stroke="#F4F6F5" stroke-width="1.5"/>
<text x="30" y="39" font-size="17" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="1">03 / LIFECYCLE</text>
<text x="30" y="80" font-size="25" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">One scheduled study, across three hosts</text>
<text x="30" y="111" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Admission, execution, publication, and readback are separate facts</text>
<rect x="24" y="144" width="472" height="182" rx="18" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="38" y="159" width="166" height="39" rx="12" fill="#E3F3EC" stroke="#D6DFDE" stroke-width="1.5"/><text x="51" y="185" font-size="19" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="0">01 Product</text><text x="40" y="235" font-size="21" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">User confirms a scheduled study</text><text x="40" y="267" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Validate account / Scope / revision</text><text x="40" y="292" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Persist an authorized Schedule</text><path d="M260 327 V339" fill="none" stroke="#177D75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="339" width="472" height="182" rx="18" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="38" y="354" width="166" height="39" rx="12" fill="#FFF1E2" stroke="#D6DFDE" stroke-width="1.5"/><text x="51" y="380" font-size="19" font-weight="700" fill="#BB7036" text-anchor="start" letter-spacing="0">02 Product down</text><text x="40" y="430" font-size="21" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Management API can exit</text><text x="40" y="462" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">No user Stop or cancellation implied</text><text x="40" y="487" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Original confirmed schedule persists</text><path d="M260 522 V534" fill="none" stroke="#177D75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="534" width="472" height="182" rx="18" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="38" y="549" width="166" height="39" rx="12" fill="#EAF1FC" stroke="#D6DFDE" stroke-width="1.5"/><text x="51" y="575" font-size="19" font-weight="700" fill="#4569A6" text-anchor="start" letter-spacing="0">03 Worker</text><text x="40" y="625" font-size="21" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Due event is claimed independently</text><text x="40" y="657" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Read qualified occurrence / Task</text><text x="40" y="682" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Recheck Task and Provider admission</text><path d="M260 717 V729" fill="none" stroke="#177D75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="729" width="472" height="182" rx="18" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="38" y="744" width="166" height="39" rx="12" fill="#E3F3EC" stroke="#D6DFDE" stroke-width="1.5"/><text x="51" y="770" font-size="19" font-weight="700" fill="#4569A6" text-anchor="start" letter-spacing="0">04 Runtime</text><text x="40" y="820" font-size="21" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Only qualified requests are dispatched</text><text x="40" y="852" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Original Run, budget, tools, Gateway</text><text x="40" y="877" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Retain effects and unknown receipts</text><path d="M260 912 V924" fill="none" stroke="#177D75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="924" width="472" height="182" rx="18" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="38" y="939" width="166" height="39" rx="12" fill="#FFF1E2" stroke="#D6DFDE" stroke-width="1.5"/><text x="51" y="965" font-size="19" font-weight="700" fill="#177D75" text-anchor="start" letter-spacing="0">05 Publication</text><text x="40" y="1015" font-size="21" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Commit answer and settle notice</text><text x="40" y="1047" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Store original result revision</text><text x="40" y="1072" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Retry notice, never rerun research</text><path d="M260 1107 V1119" fill="none" stroke="#177D75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="1119" width="472" height="182" rx="18" fill="#FFFFFF" stroke="#D6DFDE" stroke-width="1.5"/><rect x="38" y="1134" width="166" height="39" rx="12" fill="#EAF1FC" stroke="#D6DFDE" stroke-width="1.5"/><text x="51" y="1160" font-size="19" font-weight="700" fill="#BB7036" text-anchor="start" letter-spacing="0">06 Product returns</text><text x="40" y="1210" font-size="21" font-weight="700" fill="#183247" text-anchor="start" letter-spacing="0">Read answer in Task History</text><text x="40" y="1242" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">Authenticate same user / Scope</text><text x="40" y="1267" font-size="18" font-weight="400" fill="#516677" text-anchor="start" letter-spacing="0">No old Worker memory required</text><text x="30" y="1321" font-size="16" font-weight="700" fill="#BB7036" text-anchor="start" letter-spacing="0">API shutdown ≠ user cancellation; schedule pause ≠ cancel a running Task</text>
</svg>