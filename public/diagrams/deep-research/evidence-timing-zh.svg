<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc"><title id="title">动态证据：先发布了什么？</title><desc id="desc">D1 两模式先发布占位内容，v2 在实际读取前登记。D2 Standard 已有 v1 结论后修订，Deep 在 v2 后才首次实质回答。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526779" stroke-width="1.8"/></marker></defs><g font-family="Noto Sans CJK SC,Noto Sans SC,Arial,sans-serif"><rect x="1" y="1" width="958" height="698" rx="20" fill="#FAF9F6" stroke="#CFD9DD"/><text x="22" y="32" font-size="13" font-weight="600" fill="#526779">03  /  DEEP RESEARCH</text><text x="22" y="72" font-size="30" font-weight="700" fill="#173348">动态证据：先发布了什么？</text><text x="22" y="108" font-size="16" font-weight="400" fill="#526779">首次正式发布触发 v2 登记</text><rect x="20" y="145" width="920" height="137" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="36" y="175" font-size="19" font-weight="650" fill="#11766F">D1 · 两种模式</text><text x="36" y="218" font-size="18" font-weight="600" fill="#173348">01  占位发布</text><text x="36" y="244" font-size="16" font-weight="400" fill="#526779">不是旧版实质结论</text><path d="M292 212 L320 212" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><text x="336" y="218" font-size="18" font-weight="600" fill="#173348">02  登记 v2</text><text x="336" y="244" font-size="16" font-weight="400" fill="#526779">发生在实际读取之前</text><path d="M592 212 L620 212" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><text x="636" y="218" font-size="18" font-weight="600" fill="#173348">03  读取后作答</text><text x="636" y="244" font-size="16" font-weight="400" fill="#526779">未证明旧结论修订</text><rect x="20" y="296" width="920" height="137" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="36" y="326" font-size="19" font-weight="650" fill="#11766F">D2 · Standard</text><text x="36" y="369" font-size="18" font-weight="600" fill="#173348">01  v1 实质结论</text><text x="36" y="395" font-size="16" font-weight="400" fill="#526779">确实先作出旧版判断</text><path d="M292 363 L320 363" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><text x="336" y="369" font-size="18" font-weight="600" fill="#173348">02  登记并读取 v2</text><text x="336" y="395" font-size="16" font-weight="400" fill="#526779">新证据进入研究</text><path d="M592 363 L620 363" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><text x="636" y="369" font-size="18" font-weight="600" fill="#173348">03  修订已有结论</text><text x="636" y="395" font-size="16" font-weight="400" fill="#526779">观察到真实改判路径</text><rect x="20" y="447" width="920" height="137" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="36" y="477" font-size="19" font-weight="650" fill="#99551D">D2 · Deep</text><text x="36" y="520" font-size="18" font-weight="600" fill="#173348">01  占位发布</text><text x="36" y="546" font-size="16" font-weight="400" fill="#526779">仅提示接下来读取</text><path d="M292 514 L320 514" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><text x="336" y="520" font-size="18" font-weight="600" fill="#173348">02  登记并读取 v2</text><text x="336" y="546" font-size="16" font-weight="400" fill="#526779">先取得更新版证据</text><path d="M592 514 L620 514" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><text x="636" y="520" font-size="18" font-weight="600" fill="#173348">03  首次实质回答</text><text x="636" y="546" font-size="16" font-weight="400" fill="#526779">不是旧结论的修订</text><text x="22" y="626" font-size="16" font-weight="400" fill="#526779">发布节奏 → 新证据可用时点：这里测的是完整反馈工作流。</text><text x="22" y="652" font-size="16" font-weight="400" fill="#526779">不能把它解释为固定证据时点下，Deep Prompt 自身的质量收益。</text></g></svg>