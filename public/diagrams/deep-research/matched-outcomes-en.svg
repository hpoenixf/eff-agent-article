ont-weight="400" fill="#526779">Times: Standard / Deep. — = not reached. D2 uses strict criteria.</text><text x="22" y="626" font-size="16" font-weight="400" fill="#526779">An earlier terminal event is not an earlier complete answer or proof of higher quality.</text></g></svg>