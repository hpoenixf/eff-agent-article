<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">升档增加容量，不清空账本</title><desc id="desc">Teaching allocation, not an observed run. Root request cap 57 to 85; used 20 and reserved 6 carry forward. Free 31 to 59 are upper bounds.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526779" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans CJK SC,Noto Sans SC,Arial,sans-serif"><rect x="1" y="1" width="958" height="498" rx="20" fill="#FAF9F6" stroke="#CFD9DD"/><text x="20" y="36" font-size="18" font-weight="700" fill="#11766F">教学分配 · 非真实运行记录</text><text x="20" y="76" font-size="30" font-weight="700" fill="#173348">升档增加容量，不清空账本</text><text x="20" y="110" font-size="18" font-weight="400" fill="#526779">单位：根请求预算槽位</text><text x="20" y="169" font-size="22" font-weight="700" fill="#173348">Standard · 57</text><rect x="240.0" y="143" width="160.0" height="47" rx="0" fill="#11766F" stroke="#CFD9DD"/><rect x="400.0" y="143" width="48.0" height="47" rx="0" fill="#99551D" stroke="#CFD9DD"/><rect x="448.0" y="143" width="248.0" height="47" rx="0" fill="#C7DDD5" stroke="#CFD9DD"/><text x="240" y="222" font-size="20" font-weight="400" fill="#173348">已用 20  /  子任务预留 6  /  未预留 31</text><text x="20" y="304" font-size="22" font-weight="700" fill="#173348">Deep · 85</text><rect x="240.0" y="278" width="160.0" height="47" rx="0" fill="#11766F" stroke="#CFD9DD"/><rect x="400.0" y="278" width="48.0" height="47" rx="0" fill="#99551D" stroke="#CFD9DD"/><rect x="448.0" y="278" width="472.0" height="47" rx="0" fill="#C7DDD5" stroke="#CFD9DD"/><text x="240" y="357" font-size="20" font-weight="400" fill="#173348">已用 20  /  子任务预留 6  /  未预留 59</text><path d="M320 231 V263" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><text x="354" y="251" font-size="19" font-weight="700" fill="#11766F">已用与预留原样结转</text><text x="20" y="411" font-size="23" font-weight="700" fill="#11766F">新增容量 +28，而不是一笔全新的 85。</text><text x="20" y="447" font-size="18" font-weight="400" fill="#526779">仅在获准且宿主应用 Deep 后；31 / 59 是其他约束前的上界。</text><text x="20" y="472" font-size="18" font-weight="400" fill="#526779">未知结算与外部限额仍可能进一步减少可用量。</text></g></svg>