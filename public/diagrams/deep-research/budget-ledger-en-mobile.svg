<svg xmlns="http://www.w3.org/2000/svg" width="390" height="620" viewBox="0 0 390 620" role="img" aria-labelledby="title desc"><title id="title">More capacity, same ledger</title><desc id="desc">Teaching allocation, not an observed run. Root request cap 57 to 85; used 20 and reserved 6 carry forward. Free 31 to 59 are upper bounds.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526779" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans CJK SC,Noto Sans SC,Arial,sans-serif"><rect x="1" y="1" width="388" height="618" rx="20" fill="#FAF9F6" stroke="#CFD9DD"/><text x="20" y="36" font-size="18" font-weight="700" fill="#11766F">Teaching allocation, not an observed run</text><text x="20" y="76" font-size="23" font-weight="700" fill="#173348">More capacity, same ledger</text><text x="20" y="110" font-size="18" font-weight="400" fill="#526779">Unit: root request-budget slots</text><text x="20" y="169" font-size="22" font-weight="700" fill="#173348">Standard · 57</text><rect x="20.0" y="188" width="82.3529411764706" height="47" rx="0" fill="#11766F" stroke="#CFD9DD"/><rect x="102.3529411764706" y="188" width="24.705882352941178" height="47" rx="0" fill="#99551D" stroke="#CFD9DD"/><rect x="127.05882352941177" y="188" width="127.6470588235294" height="47" rx="0" fill="#C7DDD5" stroke="#CFD9DD"/><text x="20" y="266" font-size="18" font-weight="400" fill="#173348">Used 20 / Reserved 6 / Unreserved 31</text><text x="20" y="330" font-size="22" font-weight="700" fill="#173348">Deep · 85</text><rect x="20.0" y="349" width="82.3529411764706" height="47" rx="0" fill="#11766F" stroke="#CFD9DD"/><rect x="102.3529411764706" y="349" width="24.705882352941178" height="47" rx="0" fill="#99551D" stroke="#CFD9DD"/><rect x="127.05882352941177" y="349" width="242.94117647058823" height="47" rx="0" fill="#C7DDD5" stroke="#CFD9DD"/><text x="20" y="427" font-size="18" font-weight="400" fill="#173348">Used 20 / Reserved 6 / Unreserved 59</text><path d="M58 278 V299" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><text x="80" y="296" font-size="18" font-weight="700" fill="#11766F">Usage + reserves carry forward</text><rect x="20" y="451" width="350" height="53" rx="10" fill="#E9F4EF" stroke="#CFD9DD"/><text x="34" y="485" font-size="21" font-weight="700" fill="#11766F">+28 capacity, not a fresh 85</text><text x="20" y="540" font-size="18" font-weight="400" fill="#526779">Only after approved, Host-applied Deep.</text><text x="20" y="565" font-size="18" font-weight="400" fill="#526779">31 / 59 are upper bounds before limits;</text><text x="20" y="590" font-size="18" font-weight="400" fill="#526779">unknown settlements can reduce them.</text></g></svg>