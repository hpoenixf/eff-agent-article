<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc"><title id="title">授权不等于已经生效</title><desc id="desc">模式意图经 Resource Owner 批准后，仍须 Host 应用；下一轮才采用 Deep 指导，已用额度不重置。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526779" stroke-width="1.8"/></marker></defs><g font-family="Noto Sans CJK SC,Noto Sans SC,Arial,sans-serif"><rect x="1" y="1" width="958" height="488" rx="20" fill="#FAF9F6" stroke="#CFD9DD"/><text x="22" y="32" font-size="13" font-weight="600" fill="#526779">01  /  DEEP RESEARCH</text><text x="22" y="73" font-size="30" font-weight="700" fill="#173348">授权不等于已经生效</text><text x="22" y="105" font-size="16" font-weight="400" fill="#526779">同一 Run：资源 Owner 可拒绝；仅获批且 Host 应用后，下一轮才改变指导。</text><rect x="22" y="152" width="213" height="145" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="38" y="182" font-size="16" font-weight="700" fill="#11766F">01</text><text x="38" y="215" font-size="20" font-weight="650" fill="#173348">模式意图</text><text x="38" y="246" font-size="16" font-weight="400" fill="#526779">用户 / Skill / Entry / Main</text><text x="38" y="272" font-size="16" font-weight="400" fill="#526779">提出升级，不生成新额度</text><path d="M237 223 L254 223" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><rect x="257" y="152" width="213" height="145" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="273" y="182" font-size="16" font-weight="700" fill="#11766F">02</text><text x="273" y="215" font-size="20" font-weight="650" fill="#173348">资源批准者</text><text x="273" y="246" font-size="16" font-weight="400" fill="#526779">核查原额度、消耗与预留</text><text x="273" y="272" font-size="16" font-weight="400" fill="#526779">阶段、期限与外部限制</text><path d="M472 223 L489 223" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><rect x="492" y="152" width="213" height="145" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="508" y="182" font-size="16" font-weight="700" fill="#99551D">03</text><text x="508" y="215" font-size="20" font-weight="650" fill="#173348">Host 实际应用</text><text x="508" y="246" font-size="16" font-weight="400" fill="#526779">recorded-pending ≠ deep</text><text x="508" y="272" font-size="16" font-weight="400" fill="#526779">新额度与时钟已实际生效</text><path d="M707 223 L724 223" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><rect x="727" y="152" width="213" height="145" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="743" y="182" font-size="16" font-weight="700" fill="#11766F">04</text><text x="743" y="215" font-size="20" font-weight="650" fill="#173348">下一轮请求</text><text x="743" y="246" font-size="16" font-weight="400" fill="#526779">读取当前 Host 状态</text><text x="743" y="272" font-size="16" font-weight="400" fill="#526779">重建 Deep 交付指导</text><rect x="20" y="330" width="920" height="130" rx="12" fill="#E9F4EF" stroke="#CFD9DD"/><text x="36" y="362" font-size="20" font-weight="650" fill="#11766F">升级容量，不清零历史</text><text x="36" y="394" font-size="16" font-weight="400" fill="#173348">总轮次示例：36 → 54；已用次数、Child 预留与未知结算继续计入。</text><text x="36" y="420" font-size="16" font-weight="400" fill="#173348">批准记录不覆盖旧请求，也不自动提升 reasoning effort。</text></g></svg>