<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc"><title id="title">Parallel evidence, aligned meaning</title><desc id="desc">Teaching composition: independent source slices retain source IDs and unknowns; dependencies remain sequential.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526779" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans CJK SC,Noto Sans SC,Arial,sans-serif"><rect x="1" y="1" width="958" height="548" rx="20" fill="#FAF9F6" stroke="#CFD9DD"/><text x="20" y="36" font-size="18" font-weight="700" fill="#11766F">Teaching composition</text><text x="20" y="72" font-size="30" font-weight="700" fill="#173348">Parallel evidence, aligned meaning</text><rect x="20" y="109" width="200" height="161" rx="10" fill="#E9F4EF" stroke="#CFD9DD"/><text x="38" y="145" font-size="22" font-weight="700" fill="#11766F">Supervisor</text><text x="38" y="177" font-size="22" font-weight="700" fill="#11766F">Assign slices</text><text x="38" y="209" font-size="22" font-weight="700" fill="#11766F">independently</text><path d="M220 188 H251 V150 H278" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><rect x="284" y="108" width="333" height="95" rx="10" fill="#FFFFFF" stroke="#CFD9DD"/><text x="300" y="137" font-size="19" font-weight="700" fill="#173348">A · Original report / time basis</text><text x="300" y="170" font-size="18" font-weight="400" fill="#526779">Read sources; retain original pointers</text><path d="M617 153 H646 V218 H674" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><path d="M220 188 H251 V277 H278" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><rect x="284" y="235" width="333" height="95" rx="10" fill="#FFFFFF" stroke="#CFD9DD"/><text x="300" y="264" font-size="19" font-weight="700" fill="#173348">B · New filing / counterevidence</text><text x="300" y="297" font-size="18" font-weight="400" fill="#526779">Read sources; retain original pointers</text><path d="M617 280 H646 V218 H674" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><path d="M450 235 V204" fill="none" stroke="#526779" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arr)"/><text x="466" y="224" font-size="18" font-weight="400" fill="#99551D">Updates alter basis</text><rect x="680" y="150" width="260" height="144" rx="10" fill="#EDF1F5" stroke="#CFD9DD"/><text x="696" y="181" font-size="18" font-weight="400" fill="#173348">Each slice returns</text><text x="696" y="209" font-size="18" font-weight="400" fill="#173348">Findings + IDs + unknowns</text><text x="696" y="237" font-size="18" font-weight="400" fill="#173348">Align version and basis;</text><text x="696" y="265" font-size="18" font-weight="400" fill="#173348">synthesize beyond summaries</text><rect x="20" y="366" width="920" height="146" rx="10" fill="#E9F4EF" stroke="#CFD9DD"/><text x="38" y="400" font-size="18" font-weight="400" fill="#173348">Parallelize independent slices; keep tightly dependent reasoning sequential.</text><text x="38" y="435" font-size="18" font-weight="400" fill="#173348">More branches add coordination and token cost.</text><text x="38" y="470" font-size="18" font-weight="400" fill="#173348">A teaching composition inspired by public multi-agent practice, not a universal workflow.</text></g></svg>