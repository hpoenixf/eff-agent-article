<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc"><title id="title">Questions behind public patterns</title><desc id="desc">Public documented patterns, not proprietary internals or a performance ranking.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526779" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans CJK SC,Noto Sans SC,Arial,sans-serif"><rect x="1" y="1" width="958" height="508" rx="20" fill="#FAF9F6" stroke="#CFD9DD"/><text x="22" y="39" font-size="18" font-weight="700" fill="#11766F">Public patterns, not a ranking</text><text x="22" y="77" font-size="30" font-weight="700" fill="#173348">What needs to be controlled?</text><text x="22" y="112" font-size="18" font-weight="400" fill="#526779">Organize engineering choices by questions, not brand scores.</text><text x="27" y="172" font-size="20" font-weight="700" fill="#11766F">01</text><text x="77" y="172" font-size="23" font-weight="700" fill="#173348">OpenAI</text><path d="M255 164 H304" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><text x="329" y="172" font-size="20" font-weight="400" fill="#173348">Handle asynchronous tasks; locate citation spans.</text><path d="M22 196 H938" fill="none" stroke="#CFD9DD" stroke-width="2"/><text x="27" y="242" font-size="20" font-weight="700" fill="#11766F">02</text><text x="77" y="242" font-size="23" font-weight="700" fill="#173348">Anthropic</text><path d="M255 234 H304" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><text x="329" y="242" font-size="20" font-weight="400" fill="#173348">Research independent slices in parallel, then synthesize.</text><path d="M22 266 H938" fill="none" stroke="#CFD9DD" stroke-width="2"/><text x="27" y="312" font-size="20" font-weight="700" fill="#11766F">03</text><text x="77" y="312" font-size="23" font-weight="700" fill="#173348">Google</text><path d="M255 304 H304" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><text x="329" y="312" font-size="20" font-weight="400" fill="#173348">Review the plan; choose research depth.</text><path d="M22 336 H938" fill="none" stroke="#CFD9DD" stroke-width="2"/><text x="27" y="382" font-size="20" font-weight="700" fill="#11766F">04</text><text x="77" y="382" font-size="23" font-weight="700" fill="#173348">LangChain</text><path d="M255 374 H304" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><text x="329" y="382" font-size="20" font-weight="400" fill="#173348">Make supervisor / research loops explicit and bounded.</text><path d="M22 406 H938" fill="none" stroke="#CFD9DD" stroke-width="2"/><text x="22" y="478" font-size="18" font-weight="400" fill="#526779">Public documented patterns, not a reconstruction of proprietary internals.</text></g></svg>