<svg xmlns="http://www.w3.org/2000/svg" width="390" height="640" viewBox="0 0 390 640" role="img" aria-labelledby="title desc"><title id="title">从公开模式提炼工程问题</title><desc id="desc">Public documented patterns, not proprietary internals or a performance ranking.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526779" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans CJK SC,Noto Sans SC,Arial,sans-serif"><rect x="1" y="1" width="388" height="638" rx="20" fill="#FAF9F6" stroke="#CFD9DD"/><text x="22" y="39" font-size="18" font-weight="700" fill="#11766F">公开模式，不是性能排名</text><text x="22" y="77" font-size="23" font-weight="700" fill="#173348">先问需要控制什么</text><text x="23" y="137" font-size="18" font-weight="700" fill="#11766F">01</text><text x="65" y="137" font-size="21" font-weight="700" fill="#173348">OpenAI</text><text x="65" y="165" font-size="18" font-weight="400" fill="#173348">异步任务如何接回？</text><text x="65" y="190" font-size="18" font-weight="400" fill="#173348">引文如何定位？</text><path d="M22 212 H368" fill="none" stroke="#CFD9DD" stroke-width="2"/><text x="23" y="244" font-size="18" font-weight="700" fill="#11766F">02</text><text x="65" y="244" font-size="21" font-weight="700" fill="#173348">Anthropic</text><text x="65" y="272" font-size="18" font-weight="400" fill="#173348">哪些研究切片可独立并行？</text><text x="65" y="297" font-size="18" font-weight="400" fill="#173348">如何汇总？</text><path d="M22 319 H368" fill="none" stroke="#CFD9DD" stroke-width="2"/><text x="23" y="351" font-size="18" font-weight="700" fill="#11766F">03</text><text x="65" y="351" font-size="21" font-weight="700" fill="#173348">Google</text><text x="65" y="379" font-size="18" font-weight="400" fill="#173348">计划能否先审阅？</text><text x="65" y="404" font-size="18" font-weight="400" fill="#173348">研究深度能否选择？</text><path d="M22 426 H368" fill="none" stroke="#CFD9DD" stroke-width="2"/><text x="23" y="458" font-size="18" font-weight="700" fill="#11766F">04</text><text x="65" y="458" font-size="21" font-weight="700" fill="#173348">LangChain</text><text x="65" y="486" font-size="18" font-weight="400" fill="#173348">主管与研究循环</text><text x="65" y="511" font-size="18" font-weight="400" fill="#173348">是否有明确边界？</text><path d="M22 533 H368" fill="none" stroke="#CFD9DD" stroke-width="2"/><text x="22" y="588" font-size="18" font-weight="400" fill="#526779">依据公开文档中的模式；</text><text x="22" y="613" font-size="18" font-weight="400" fill="#526779">不重建专有系统内部实现。</text></g></svg>