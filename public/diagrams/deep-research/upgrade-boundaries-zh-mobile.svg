<svg xmlns="http://www.w3.org/2000/svg" width="360" height="766" viewBox="0 0 360 766" role="img" aria-labelledby="title desc"><title id="title">授权不等于已经生效</title><desc id="desc">只有通过资源 Owner 检查并由 Host 应用的升级，才会改变下一轮指导。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526779" stroke-width="1.8"/></marker></defs><g font-family="Noto Sans CJK SC,Noto Sans SC,Arial,sans-serif"><rect x="1" y="1" width="358" height="764" rx="20" fill="#FAF9F6" stroke="#CFD9DD"/><text x="22" y="32" font-size="13" font-weight="600" fill="#526779">01  /  DEEP RESEARCH</text><text x="20" y="64" font-size="23" font-weight="700" fill="#173348">授权不等于已经生效</text><text x="20" y="92" font-size="16" font-weight="400" fill="#526779">同一 Run；箭头均需满足条件</text><rect x="20" y="112" width="320" height="100" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="34" y="139" font-size="19" font-weight="650" fill="#173348">01 模式意图</text><text x="34" y="166" font-size="16" font-weight="400" fill="#526779">用户 / Skill / Entry / Main</text><text x="34" y="190" font-size="16" font-weight="400" fill="#526779">提出升级，不生成新额度</text><path d="M40 215 L40 230" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><text x="55" y="229" font-size="16" font-weight="600" fill="#11766F">提交审批</text><rect x="20" y="234" width="320" height="100" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="34" y="261" font-size="19" font-weight="650" fill="#173348">02 资源批准者</text><text x="34" y="288" font-size="16" font-weight="400" fill="#526779">核查消耗、预留、阶段与期限</text><text x="34" y="312" font-size="16" font-weight="400" fill="#526779">授权或外部限制不满足则拒绝</text><path d="M40 337 L40 352" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><text x="55" y="351" font-size="16" font-weight="600" fill="#11766F">获批且实际应用成功</text><rect x="20" y="356" width="320" height="100" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="34" y="383" font-size="19" font-weight="650" fill="#173348">03 Host 实际应用</text><text x="34" y="410" font-size="16" font-weight="400" fill="#526779">recorded-pending ≠ deep</text><text x="34" y="434" font-size="16" font-weight="400" fill="#526779">新额度与时钟已实际生效</text><path d="M40 459 L40 474" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><text x="55" y="473" font-size="16" font-weight="600" fill="#11766F">下一轮读取</text><rect x="20" y="478" width="320" height="100" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="34" y="505" font-size="19" font-weight="650" fill="#173348">04 下一轮请求</text><text x="34" y="532" font-size="16" font-weight="400" fill="#526779">读取 Host 当前生效状态</text><text x="34" y="556" font-size="16" font-weight="400" fill="#526779">重建 Deep 交付指导</text><rect x="20" y="610" width="320" height="137" rx="12" fill="#E9F4EF" stroke="#CFD9DD"/><text x="34" y="637" font-size="19" font-weight="650" fill="#11766F">升级容量，不清零历史</text><text x="34" y="665" font-size="16" font-weight="400" fill="#173348">总轮次示例：36 → 54</text><text x="34" y="691" font-size="16" font-weight="400" fill="#173348">已用次数、Child 预留继续计入。</text><text x="34" y="717" font-size="16" font-weight="400" fill="#173348">批准记录不覆盖已发出的请求。</text></g></svg>