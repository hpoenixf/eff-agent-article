<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc"><title id="title">从公开模式提炼工程问题</title><desc id="desc">Public documented patterns, not proprietary internals or a performance ranking.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526779" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans CJK SC,Noto Sans SC,Arial,sans-serif"><rect x="1" y="1" width="958" height="508" rx="20" fill="#FAF9F6" stroke="#CFD9DD"/><text x="22" y="39" font-size="18" font-weight="700" fill="#11766F">公开模式，不是性能排名</text><text x="22" y="77" font-size="30" font-weight="700" fill="#173348">先问需要控制什么</text><text x="22" y="112" font-size="18" font-weight="400" fill="#526779">用问题组织选型，而非给品牌打分。</text><text x="27" y="172" font-size="20" font-weight="700" fill="#11766F">01</text><text x="77" y="172" font-size="23" font-weight="700" fill="#173348">OpenAI</text><path d="M255 164 H304" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><text x="329" y="172" font-size="20" font-weight="400" fill="#173348">异步任务如何接回？ 引文如何定位？</text><path d="M22 196 H938" fill="none" stroke="#CFD9DD" stroke-width="2"/><text x="27" y="242" font-size="20" font-weight="700" fill="#11766F">02</text><text x="77" y="242" font-size="23" font-weight="700" fill="#173348">Anthropic</text><path d="M255 234 H304" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><text x="329" y="242" font-size="20" font-weight="400" fill="#173348">哪些研究切片可独立并行？ 如何汇总？</text><path d="M22 266 H938" fill="none" stroke="#CFD9DD" stroke-width="2"/><text x="27" y="312" font-size="20" font-weight="700" fill="#11766F">03</text><text x="77" y="312" font-size="23" font-weight="700" fill="#173348">Google</text><path d="M255 304 H304" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><text x="329" y="312" font-size="20" font-weight="400" fill="#173348">计划能否先审阅？ 研究深度能否选择？</text><path d="M22 336 H938" fill="none" stroke="#CFD9DD" stroke-width="2"/><text x="27" y="382" font-size="20" font-weight="700" fill="#11766F">04</text><text x="77" y="382" font-size="23" font-weight="700" fill="#173348">LangChain</text><path d="M255 374 H304" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><text x="329" y="382" font-size="20" font-weight="400" fill="#173348">主管与研究循环 是否有明确边界？</text><path d="M22 406 H938" fill="none" stroke="#CFD9DD" stroke-width="2"/><text x="22" y="478" font-size="18" font-weight="400" fill="#526779">公开文档中的模式，不是对专有系统内部实现的重建。</text></g></svg>