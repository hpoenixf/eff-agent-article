<svg xmlns="http://www.w3.org/2000/svg" width="390" height="640" viewBox="0 0 390 640" role="img" aria-labelledby="title desc"><title id="title">Questions behind public patterns</title><desc id="desc">Public documented patterns, not proprietary internals or a performance ranking.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526779" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans CJK SC,Noto Sans SC,Arial,sans-serif"><rect x="1" y="1" width="388" height="638" rx="20" fill="#FAF9F6" stroke="#CFD9DD"/><text x="22" y="39" font-size="18" font-weight="700" fill="#11766F">Public patterns, not a ranking</text><text x="22" y="77" font-size="23" font-weight="700" fill="#173348">What needs to be controlled?</text><text x="23" y="137" font-size="18" font-weight="700" fill="#11766F">01</text><text x="65" y="137" font-size="21" font-weight="700" fill="#173348">OpenAI</text><text x="65" y="165" font-size="18" font-weight="400" fill="#173348">Handle asynchronous tasks;</text><text x="65" y="190" font-size="18" font-weight="400" fill="#173348">locate citation spans.</text><path d="M22 212 H368" fill="none" stroke="#CFD9DD" stroke-width="2"/><text x="23" y="244" font-size="18" font-weight="700" fill="#11766F">02</text><text x="65" y="244" font-size="21" font-weight="700" fill="#173348">Anthropic</text><text x="65" y="272" font-size="18" font-weight="400" fill="#173348">Research independent slices</text><text x="65" y="297" font-size="18" font-weight="400" fill="#173348">in parallel, then synthesize.</text><path d="M22 319 H368" fill="none" stroke="#CFD9DD" stroke-width="2"/><text x="23" y="351" font-size="18" font-weight="700" fill="#11766F">03</text><text x="65" y="351" font-size="21" font-weight="700" fill="#173348">Google</text><text x="65" y="379" font-size="18" font-weight="400" fill="#173348">Review the plan;</text><text x="65" y="404" font-size="18" font-weight="400" fill="#173348">choose research depth.</text><path d="M22 426 H368" fill="none" stroke="#CFD9DD" stroke-width="2"/><text x="23" y="458" font-size="18" font-weight="700" fill="#11766F">04</text><text x="65" y="458" font-size="21" font-weight="700" fill="#173348">LangChain</text><text x="65" y="486" font-size="18" font-weight="400" fill="#173348">Make supervisor / research</text><text x="65" y="511" font-size="18" font-weight="400" fill="#173348">loops explicit and bounded.</text><path d="M22 533 H368" fill="none" stroke="#CFD9DD" stroke-width="2"/><text x="22" y="588" font-size="18" font-weight="400" fill="#526779">Based on public documentation;</text><text x="22" y="613" font-size="18" font-weight="400" fill="#526779">not proprietary internals.</text></g></svg>