<svg xmlns="http://www.w3.org/2000/svg" width="360" height="766" viewBox="0 0 360 766" role="img" aria-labelledby="title desc"><title id="title">Approval is not application</title><desc id="desc">Only an approved and Host-applied upgrade changes the next request. Existing usage remains.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526779" stroke-width="1.8"/></marker></defs><g font-family="Noto Sans CJK SC,Noto Sans SC,Arial,sans-serif"><rect x="1" y="1" width="358" height="764" rx="20" fill="#FAF9F6" stroke="#CFD9DD"/><text x="22" y="32" font-size="13" font-weight="600" fill="#526779">01  /  DEEP RESEARCH</text><text x="20" y="64" font-size="23" font-weight="700" fill="#173348">Approval is not application</text><text x="20" y="92" font-size="16" font-weight="400" fill="#526779">Same Run; transitions are conditional</text><rect x="20" y="112" width="320" height="100" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="34" y="139" font-size="19" font-weight="650" fill="#173348">01 Mode intent</text><text x="34" y="166" font-size="16" font-weight="400" fill="#526779">User / Skill / Entry / Main</text><text x="34" y="190" font-size="16" font-weight="400" fill="#526779">Requests capacity, not a new grant</text><path d="M40 215 L40 230" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><text x="55" y="229" font-size="16" font-weight="600" fill="#11766F">Submit for review</text><rect x="20" y="234" width="320" height="100" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="34" y="261" font-size="19" font-weight="650" fill="#173348">02 Resource Owner</text><text x="34" y="288" font-size="16" font-weight="400" fill="#526779">Checks usage, reserves, time, phase</text><text x="34" y="312" font-size="16" font-weight="400" fill="#526779">May reject: authority or outer limits</text><path d="M40 337 L40 352" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><text x="55" y="351" font-size="16" font-weight="600" fill="#11766F">If approved and applied</text><rect x="20" y="356" width="320" height="100" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="34" y="383" font-size="19" font-weight="650" fill="#173348">03 Host applies grant</text><text x="34" y="410" font-size="16" font-weight="400" fill="#526779">recorded-pending ≠ deep</text><text x="34" y="434" font-size="16" font-weight="400" fill="#526779">Budget and clock actually updated</text><path d="M40 459 L40 474" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><text x="55" y="473" font-size="16" font-weight="600" fill="#11766F">On the next turn</text><rect x="20" y="478" width="320" height="100" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="34" y="505" font-size="19" font-weight="650" fill="#173348">04 Next model turn</text><text x="34" y="532" font-size="16" font-weight="400" fill="#526779">Reads the applied Host state</text><text x="34" y="556" font-size="16" font-weight="400" fill="#526779">Rebuilds Deep delivery guidance</text><rect x="20" y="610" width="320" height="137" rx="12" fill="#E9F4EF" stroke="#CFD9DD"/><text x="34" y="637" font-size="19" font-weight="650" fill="#11766F">More capacity, same history</text><text x="34" y="665" font-size="16" font-weight="400" fill="#173348">Example turn cap: 36 → 54</text><text x="34" y="691" font-size="16" font-weight="400" fill="#173348">Usage and Child reserves remain.</text><text x="34" y="717" font-size="16" font-weight="400" fill="#173348">No rewrite of earlier requests.</text></g></svg>