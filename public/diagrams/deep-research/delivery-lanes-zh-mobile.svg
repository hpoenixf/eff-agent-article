<svg xmlns="http://www.w3.org/2000/svg" width="390" height="650" viewBox="0 0 390 650" role="img" aria-labelledby="title desc"><title id="title">研究循环与发布通道分离</title><desc id="desc">Host-applied Deep selects Deep guidance, otherwise ordinary guidance. One research loop emits progress or supported answers and continues; only original stop conditions terminate. Main owns adequacy, Host resources and permissions, Publication answer versions.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526779" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans CJK SC,Noto Sans SC,Arial,sans-serif"><rect x="1" y="1" width="388" height="648" rx="20" fill="#FAF9F6" stroke="#CFD9DD"/><text x="20" y="35" font-size="18" font-weight="700" fill="#11766F">状态选指引 · 发布不等于终止</text><text x="20" y="73" font-size="22" font-weight="700" fill="#173348">研究循环与发布通道分离</text><rect x="20" y="95" width="350" height="83" rx="10" fill="#EDF1F5" stroke="#CFD9DD"/><text x="34" y="123" font-size="18" font-weight="400" fill="#173348">宿主已应用 Deep → Deep 指引</text><text x="34" y="152" font-size="18" font-weight="400" fill="#173348">否则 → 普通指引</text><path d="M195 178 V199" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="204" width="350" height="61" rx="10" fill="#E9F4EF" stroke="#CFD9DD"/><text x="34" y="230" font-size="19" font-weight="700" fill="#11766F">同一个研究循环</text><text x="34" y="254" font-size="19" font-weight="700" fill="#11766F">读取 / 计算 / 子任务</text><path d="M70 265 V291 H35 V318" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><path d="M310 265 V291 H355 V408" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="323" width="350" height="64" rx="10" fill="#FFFFFF" stroke="#CFD9DD"/><text x="34" y="348" font-size="18" font-weight="700" fill="#173348">进度通道 · 可返回研究</text><text x="34" y="375" font-size="18" font-weight="400" fill="#526779">send_research_update</text><rect x="20" y="413" width="350" height="64" rx="10" fill="#FFFFFF" stroke="#CFD9DD"/><text x="34" y="438" font-size="18" font-weight="700" fill="#173348">有据结果 · 可返回研究</text><text x="34" y="465" font-size="18" font-weight="400" fill="#526779">send_answer_part / replaces</text><path d="M20 355 H9 V235 H20" fill="none" stroke="#526779" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arr)"/><path d="M370 445 H381 V235 H370" fill="none" stroke="#526779" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arr)"/><text x="20" y="514" font-size="18" font-weight="700" fill="#99551D">循环终止：仅按原有停止条件</text><path d="M195 265 V280 H280 V287" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><text x="110" y="305" font-size="18" font-weight="400" fill="#99551D">原停止条件 → 停止</text><text x="20" y="555" font-size="18" font-weight="400" fill="#526779">Main：判断语义是否充分</text><text x="20" y="582" font-size="18" font-weight="400" fill="#526779">Host：控制资源与权限</text><text x="20" y="609" font-size="18" font-weight="400" fill="#526779">Publication：管理答案版本</text></g></svg>