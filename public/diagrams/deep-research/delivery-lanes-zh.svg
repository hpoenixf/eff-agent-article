<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc"><title id="title">研究循环与发布通道分离</title><desc id="desc">Host-applied Deep selects Deep guidance, otherwise ordinary guidance. One research loop emits progress or supported answers and continues; only original stop conditions terminate. Main owns adequacy, Host resources and permissions, Publication answer versions.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526779" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans CJK SC,Noto Sans SC,Arial,sans-serif"><rect x="1" y="1" width="958" height="548" rx="20" fill="#FAF9F6" stroke="#CFD9DD"/><text x="20" y="35" font-size="18" font-weight="700" fill="#11766F">状态选指引 · 发布不等于终止</text><text x="20" y="73" font-size="30" font-weight="700" fill="#173348">研究循环与发布通道分离</text><rect x="20" y="112" width="300" height="89" rx="10" fill="#EDF1F5" stroke="#CFD9DD"/><text x="35" y="145" font-size="18" font-weight="400" fill="#173348">宿主已应用 Deep → Deep 指引</text><text x="35" y="174" font-size="18" font-weight="400" fill="#173348">否则 → 普通指引</text><path d="M320 156 H363" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><rect x="370" y="111" width="280" height="90" rx="10" fill="#E9F4EF" stroke="#CFD9DD"/><text x="388" y="146" font-size="20" font-weight="700" fill="#11766F">同一个研究循环</text><text x="388" y="176" font-size="20" font-weight="700" fill="#11766F">读取 / 计算 / 子任务</text><path d="M650 156 H689" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><rect x="697" y="112" width="243" height="89" rx="10" fill="#FFFFFF" stroke="#CFD9DD"/><text x="713" y="145" font-size="19" font-weight="700" fill="#99551D">仅原有停止条件</text><text x="713" y="175" font-size="19" font-weight="700" fill="#99551D">满足后终止</text><path d="M460 201 V244 H242 V274" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><path d="M558 201 V244 H720 V274" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="281" width="440" height="99" rx="10" fill="#FFFFFF" stroke="#CFD9DD"/><text x="38" y="312" font-size="22" font-weight="700" fill="#173348">进度通道</text><text x="38" y="347" font-size="20" font-weight="400" fill="#526779">send_research_update</text><rect x="500" y="281" width="440" height="99" rx="10" fill="#FFFFFF" stroke="#CFD9DD"/><text x="519" y="312" font-size="22" font-weight="700" fill="#173348">有据结果通道</text><text x="519" y="347" font-size="20" font-weight="400" fill="#526779">send_answer_part / replaces</text><path d="M20 329 H9 V226 H392 V201" fill="none" stroke="#526779" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arr)"/><path d="M940 329 H951 V226 H629 V201" fill="none" stroke="#526779" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arr)"/><text x="20" y="414" font-size="18" font-weight="400" fill="#526779">虚线：两条发布通道都可返回研究；发布本身不是停止条件。</text><rect x="20" y="446" width="920" height="76" rx="10" fill="#EDF1F5" stroke="#CFD9DD"/><text x="36" y="476" font-size="18" font-weight="700" fill="#173348">Main：语义是否充分</text><text x="350" y="476" font-size="18" font-weight="700" fill="#173348">Host：资源与权限</text><text x="36" y="506" font-size="18" font-weight="700" fill="#173348">Publication：管理答案版本</text></g></svg>