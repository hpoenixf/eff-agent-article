<svg xmlns="http://www.w3.org/2000/svg" width="390" height="650" viewBox="0 0 390 650" role="img" aria-labelledby="title desc"><title id="title">Parallel evidence, aligned meaning</title><desc id="desc">Teaching composition: independent source slices retain source IDs and unknowns; dependencies remain sequential.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526779" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans CJK SC,Noto Sans SC,Arial,sans-serif"><rect x="1" y="1" width="388" height="648" rx="20" fill="#FAF9F6" stroke="#CFD9DD"/><text x="20" y="36" font-size="18" font-weight="700" fill="#11766F">Teaching composition</text><text x="20" y="72" font-size="22" font-weight="700" fill="#173348">Parallel slices, shared basis</text><rect x="20" y="95" width="350" height="53" rx="10" fill="#E9F4EF" stroke="#CFD9DD"/><text x="35" y="128" font-size="18" font-weight="700" fill="#11766F">Supervisor: two independent slices</text><path d="M96 148 V171" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><path d="M291 148 V171" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="175" width="165" height="129" rx="10" fill="#FFFFFF" stroke="#CFD9DD"/><text x="32" y="203" font-size="21" font-weight="700" fill="#11766F">A</text><text x="32" y="234" font-size="18" font-weight="400" fill="#173348">Original report</text><text x="32" y="259" font-size="18" font-weight="400" fill="#173348">Time basis</text><text x="32" y="286" font-size="18" font-weight="400" fill="#526779">Read sources</text><rect x="205" y="175" width="165" height="129" rx="10" fill="#FFFFFF" stroke="#CFD9DD"/><text x="217" y="203" font-size="21" font-weight="700" fill="#11766F">B</text><text x="217" y="234" font-size="18" font-weight="400" fill="#173348">New disclosure</text><text x="217" y="259" font-size="18" font-weight="400" fill="#173348">Counterevidence</text><text x="217" y="286" font-size="18" font-weight="400" fill="#526779">Read sources</text><path d="M205 211 H185" fill="none" stroke="#526779" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arr)"/><text x="21" y="336" font-size="18" font-weight="400" fill="#99551D">Dashed: updates can change meaning</text><path d="M96 304 H10 V355 H195 V369" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><path d="M291 304 H380 V355 H195" fill="none" stroke="#526779" stroke-width="2"/><rect x="20" y="374" width="350" height="85" rx="10" fill="#EDF1F5" stroke="#CFD9DD"/><text x="35" y="403" font-size="18" font-weight="400" fill="#173348">Each: findings + source IDs + unknowns</text><text x="35" y="428" font-size="18" font-weight="400" fill="#173348">Original pointers, not just summaries</text><path d="M195 459 V481" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arr)"/><rect x="20" y="486" width="350" height="53" rx="10" fill="#E9F4EF" stroke="#CFD9DD"/><text x="33" y="507" font-size="18" font-weight="700" fill="#11766F">Supervisor: align version / basis</text><text x="33" y="530" font-size="18" font-weight="700" fill="#11766F">then synthesize</text><text x="20" y="575" font-size="18" font-weight="400" fill="#526779">Tight dependencies stay sequential.</text><text x="20" y="601" font-size="18" font-weight="400" fill="#526779">More branches: coordination + token cost.</text><text x="20" y="627" font-size="18" font-weight="400" fill="#526779">Not a universal project workflow.</text></g></svg>