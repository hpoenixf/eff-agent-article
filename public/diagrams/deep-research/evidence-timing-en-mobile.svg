<svg xmlns="http://www.w3.org/2000/svg" width="360" height="766" viewBox="0 0 360 766" role="img" aria-labelledby="title desc"><title id="title">Dynamic evidence: what came first?</title><desc id="desc">D1 does not prove revision of an old conclusion. D2 Standard revises v1; Deep first answers substantively after v2.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526779" stroke-width="1.8"/></marker></defs><g font-family="Noto Sans CJK SC,Noto Sans SC,Arial,sans-serif"><rect x="1" y="1" width="358" height="764" rx="20" fill="#FAF9F6" stroke="#CFD9DD"/><text x="22" y="32" font-size="13" font-weight="600" fill="#526779">03  /  DEEP RESEARCH</text><text x="20" y="62" font-size="21" font-weight="700" fill="#173348">What came before v2?</text><text x="20" y="90" font-size="16" font-weight="400" fill="#526779">First publication triggers v2 registration</text><rect x="20" y="110" width="320" height="168" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="34" y="134" font-size="18" font-weight="650" fill="#11766F">D1 · Both modes</text><text x="34" y="159" font-size="16" font-weight="600" fill="#526779">01</text><text x="66" y="159" font-size="17" font-weight="600" fill="#173348">Placeholder</text><text x="66" y="179" font-size="16" font-weight="400" fill="#526779">No substantive v1 claim</text><text x="34" y="204" font-size="16" font-weight="600" fill="#526779">02</text><text x="66" y="204" font-size="17" font-weight="600" fill="#173348">Register v2</text><text x="66" y="224" font-size="16" font-weight="400" fill="#526779">Before the actual read</text><text x="34" y="249" font-size="16" font-weight="600" fill="#526779">03</text><text x="66" y="249" font-size="17" font-weight="600" fill="#173348">Read, then answer</text><text x="66" y="269" font-size="16" font-weight="400" fill="#526779">No proven v1 revision</text><rect x="20" y="288" width="320" height="168" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="34" y="312" font-size="18" font-weight="650" fill="#11766F">D2 · Standard</text><text x="34" y="337" font-size="16" font-weight="600" fill="#526779">01</text><text x="66" y="337" font-size="17" font-weight="600" fill="#173348">Real v1 conclusion</text><text x="66" y="357" font-size="16" font-weight="400" fill="#526779">A substantive old claim</text><text x="34" y="382" font-size="16" font-weight="600" fill="#526779">02</text><text x="66" y="382" font-size="17" font-weight="600" fill="#173348">Register and read v2</text><text x="66" y="402" font-size="16" font-weight="400" fill="#526779">New evidence enters</text><text x="34" y="427" font-size="16" font-weight="600" fill="#526779">03</text><text x="66" y="427" font-size="17" font-weight="600" fill="#173348">Revise prior answer</text><text x="66" y="447" font-size="16" font-weight="400" fill="#526779">A real revision path</text><rect x="20" y="466" width="320" height="168" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="34" y="490" font-size="18" font-weight="650" fill="#99551D">D2 · Deep</text><text x="34" y="515" font-size="16" font-weight="600" fill="#526779">01</text><text x="66" y="515" font-size="17" font-weight="600" fill="#173348">Placeholder</text><text x="66" y="535" font-size="16" font-weight="400" fill="#526779">Only a reading notice</text><text x="34" y="560" font-size="16" font-weight="600" fill="#526779">02</text><text x="66" y="560" font-size="17" font-weight="600" fill="#173348">Register and read v2</text><text x="66" y="580" font-size="16" font-weight="400" fill="#526779">Updated evidence first</text><text x="34" y="605" font-size="16" font-weight="600" fill="#526779">03</text><text x="66" y="605" font-size="17" font-weight="600" fill="#173348">First real answer</text><text x="66" y="625" font-size="16" font-weight="400" fill="#526779">Not a v1 revision</text><text x="20" y="665" font-size="16" font-weight="400" fill="#526779">Publication timing changes when</text><text x="20" y="689" font-size="16" font-weight="400" fill="#526779">new evidence becomes available.</text><text x="20" y="713" font-size="16" font-weight="400" fill="#526779">This is a workflow test, not an</text><text x="20" y="737" font-size="16" font-weight="400" fill="#526779">isolated test of Deep wording.</text></g></svg>