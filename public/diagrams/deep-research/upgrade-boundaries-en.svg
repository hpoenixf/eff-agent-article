<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc"><title id="title">Approval is not application</title><desc id="desc">Mode intent requires Resource Owner approval and Host application. Only the next request adopts Deep guidance; prior usage remains.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526779" stroke-width="1.8"/></marker></defs><g font-family="Noto Sans CJK SC,Noto Sans SC,Arial,sans-serif"><rect x="1" y="1" width="958" height="488" rx="20" fill="#FAF9F6" stroke="#CFD9DD"/><text x="22" y="32" font-size="13" font-weight="600" fill="#526779">01  /  DEEP RESEARCH</text><text x="22" y="73" font-size="30" font-weight="700" fill="#173348">Approval is not application</text><text x="22" y="105" font-size="16" font-weight="400" fill="#526779">One Run: the Owner may reject. Only an approved, Host-applied grant changes the next turn.</text><rect x="22" y="152" width="213" height="145" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="38" y="182" font-size="16" font-weight="700" fill="#11766F">01</text><text x="38" y="215" font-size="20" font-weight="650" fill="#173348">Mode intent</text><text x="38" y="246" font-size="16" font-weight="400" fill="#526779">User / Skill / Entry / Main</text><text x="38" y="272" font-size="16" font-weight="400" fill="#526779">Requests more capacity</text><path d="M237 223 L254 223" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><rect x="257" y="152" width="213" height="145" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="273" y="182" font-size="16" font-weight="700" fill="#11766F">02</text><text x="273" y="215" font-size="20" font-weight="650" fill="#173348">Resource Owner</text><text x="273" y="246" font-size="16" font-weight="400" fill="#526779">Checks usage and reserves</text><text x="273" y="272" font-size="16" font-weight="400" fill="#526779">Phase, time, external limits</text><path d="M472 223 L489 223" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><rect x="492" y="152" width="213" height="145" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="508" y="182" font-size="16" font-weight="700" fill="#99551D">03</text><text x="508" y="215" font-size="20" font-weight="650" fill="#173348">Host applies grant</text><text x="508" y="246" font-size="16" font-weight="400" fill="#526779">recorded-pending ≠ deep</text><text x="508" y="272" font-size="16" font-weight="400" fill="#526779">Budget and clock updated</text><path d="M707 223 L724 223" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><rect x="727" y="152" width="213" height="145" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="743" y="182" font-size="16" font-weight="700" fill="#11766F">04</text><text x="743" y="215" font-size="20" font-weight="650" fill="#173348">Next model turn</text><text x="743" y="246" font-size="16" font-weight="400" fill="#526779">Reads current Host state</text><text x="743" y="272" font-size="16" font-weight="400" fill="#526779">Builds Deep guidance</text><rect x="20" y="330" width="920" height="130" rx="12" fill="#E9F4EF" stroke="#CFD9DD"/><text x="36" y="362" font-size="20" font-weight="650" fill="#11766F">More capacity, same history</text><text x="36" y="394" font-size="16" font-weight="400" fill="#173348">Example turn cap: 36 → 54. Usage, Child reserves, and unknown settlements remain.</text><text x="36" y="420" font-size="16" font-weight="400" fill="#173348">No rewrite of earlier requests; no automatic increase in reasoning effort.</text></g></svg>