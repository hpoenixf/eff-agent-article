<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc"><title id="title">Dynamic evidence: what came first?</title><desc id="desc">D1 both modes published placeholders; v2 was registered before the actual read. D2 Standard revised a real v1 conclusion; Deep first answered substantively after v2.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526779" stroke-width="1.8"/></marker></defs><g font-family="Noto Sans CJK SC,Noto Sans SC,Arial,sans-serif"><rect x="1" y="1" width="958" height="698" rx="20" fill="#FAF9F6" stroke="#CFD9DD"/><text x="22" y="32" font-size="13" font-weight="600" fill="#526779">03  /  DEEP RESEARCH</text><text x="22" y="72" font-size="30" font-weight="700" fill="#173348">Dynamic evidence: what came first?</text><text x="22" y="108" font-size="16" font-weight="400" fill="#526779">First publication triggers v2 registration</text><rect x="20" y="145" width="920" height="137" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="36" y="175" font-size="19" font-weight="650" fill="#11766F">D1 · Both modes</text><text x="36" y="218" font-size="18" font-weight="600" fill="#173348">01  Placeholder</text><text x="36" y="244" font-size="16" font-weight="400" fill="#526779">No substantive v1 claim</text><path d="M292 212 L320 212" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><text x="336" y="218" font-size="18" font-weight="600" fill="#173348">02  Register v2</text><text x="336" y="244" font-size="16" font-weight="400" fill="#526779">Before the actual read</text><path d="M592 212 L620 212" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><text x="636" y="218" font-size="18" font-weight="600" fill="#173348">03  Read, then answer</text><text x="636" y="244" font-size="16" font-weight="400" fill="#526779">No proven v1 revision</text><rect x="20" y="296" width="920" height="137" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="36" y="326" font-size="19" font-weight="650" fill="#11766F">D2 · Standard</text><text x="36" y="369" font-size="18" font-weight="600" fill="#173348">01  Real v1 conclusion</text><text x="36" y="395" font-size="16" font-weight="400" fill="#526779">A substantive old claim</text><path d="M292 363 L320 363" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><text x="336" y="369" font-size="18" font-weight="600" fill="#173348">02  Register and read v2</text><text x="336" y="395" font-size="16" font-weight="400" fill="#526779">New evidence enters</text><path d="M592 363 L620 363" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><text x="636" y="369" font-size="18" font-weight="600" fill="#173348">03  Revise prior answer</text><text x="636" y="395" font-size="16" font-weight="400" fill="#526779">A real revision path</text><rect x="20" y="447" width="920" height="137" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="36" y="477" font-size="19" font-weight="650" fill="#99551D">D2 · Deep</text><text x="36" y="520" font-size="18" font-weight="600" fill="#173348">01  Placeholder</text><text x="36" y="546" font-size="16" font-weight="400" fill="#526779">Only a reading notice</text><path d="M292 514 L320 514" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><text x="336" y="520" font-size="18" font-weight="600" fill="#173348">02  Register and read v2</text><text x="336" y="546" font-size="16" font-weight="400" fill="#526779">Updated evidence first</text><path d="M592 514 L620 514" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arr)"/><text x="636" y="520" font-size="18" font-weight="600" fill="#173348">03  First real answer</text><text x="636" y="546" font-size="16" font-weight="400" fill="#526779">Not a v1 revision</text><text x="22" y="626" font-size="16" font-weight="400" fill="#526779">Publication timing changes when new evidence becomes available.</text><text x="22" y="652" font-size="16" font-weight="400" fill="#526779">This tests a feedback workflow, not the isolated quality effect of Deep wording.</text></g></svg>