<svg xmlns="http://www.w3.org/2000/svg" width="360" height="766" viewBox="0 0 360 766" role="img" aria-labelledby="title desc"><title id="title">动态证据：先发布了什么？</title><desc id="desc">D1 未证明先有旧结论再修订；D2 Standard 先有旧结论，Deep 在 v2 后首次实质回答。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526779" stroke-width="1.8"/></marker></defs><g font-family="Noto Sans CJK SC,Noto Sans SC,Arial,sans-serif"><rect x="1" y="1" width="358" height="764" rx="20" fill="#FAF9F6" stroke="#CFD9DD"/><text x="22" y="32" font-size="13" font-weight="600" fill="#526779">03  /  DEEP RESEARCH</text><text x="20" y="62" font-size="21" font-weight="700" fill="#173348">动态证据：先发布了什么？</text><text x="20" y="90" font-size="16" font-weight="400" fill="#526779">首次正式发布触发 v2 登记</text><rect x="20" y="110" width="320" height="168" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="34" y="134" font-size="18" font-weight="650" fill="#11766F">D1 · 两种模式</text><text x="34" y="159" font-size="16" font-weight="600" fill="#526779">01</text><text x="66" y="159" font-size="17" font-weight="600" fill="#173348">占位发布</text><text x="66" y="179" font-size="16" font-weight="400" fill="#526779">不是旧版实质结论</text><text x="34" y="204" font-size="16" font-weight="600" fill="#526779">02</text><text x="66" y="204" font-size="17" font-weight="600" fill="#173348">登记 v2</text><text x="66" y="224" font-size="16" font-weight="400" fill="#526779">发生在实际读取之前</text><text x="34" y="249" font-size="16" font-weight="600" fill="#526779">03</text><text x="66" y="249" font-size="17" font-weight="600" fill="#173348">读取后作答</text><text x="66" y="269" font-size="16" font-weight="400" fill="#526779">未证明旧结论修订</text><rect x="20" y="288" width="320" height="168" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="34" y="312" font-size="18" font-weight="650" fill="#11766F">D2 · Standard</text><text x="34" y="337" font-size="16" font-weight="600" fill="#526779">01</text><text x="66" y="337" font-size="17" font-weight="600" fill="#173348">v1 实质结论</text><text x="66" y="357" font-size="16" font-weight="400" fill="#526779">确实先作出旧版判断</text><text x="34" y="382" font-size="16" font-weight="600" fill="#526779">02</text><text x="66" y="382" font-size="17" font-weight="600" fill="#173348">登记并读取 v2</text><text x="66" y="402" font-size="16" font-weight="400" fill="#526779">新证据进入研究</text><text x="34" y="427" font-size="16" font-weight="600" fill="#526779">03</text><text x="66" y="427" font-size="17" font-weight="600" fill="#173348">修订已有结论</text><text x="66" y="447" font-size="16" font-weight="400" fill="#526779">观察到真实改判路径</text><rect x="20" y="466" width="320" height="168" rx="12" fill="#FFFFFF" stroke="#CFD9DD"/><text x="34" y="490" font-size="18" font-weight="650" fill="#99551D">D2 · Deep</text><text x="34" y="515" font-size="16" font-weight="600" fill="#526779">01</text><text x="66" y="515" font-size="17" font-weight="600" fill="#173348">占位发布</text><text x="66" y="535" font-size="16" font-weight="400" fill="#526779">仅提示接下来读取</text><text x="34" y="560" font-size="16" font-weight="600" fill="#526779">02</text><text x="66" y="560" font-size="17" font-weight="600" fill="#173348">登记并读取 v2</text><text x="66" y="580" font-size="16" font-weight="400" fill="#526779">先取得更新版证据</text><text x="34" y="605" font-size="16" font-weight="600" fill="#526779">03</text><text x="66" y="605" font-size="17" font-weight="600" fill="#173348">首次实质回答</text><text x="66" y="625" font-size="16" font-weight="400" fill="#526779">不是旧结论的修订</text><text x="20" y="665" font-size="16" font-weight="400" fill="#526779">发布节奏会改变新证据的可用时点。</text><text x="20" y="689" font-size="16" font-weight="400" fill="#526779">这里测的是完整反馈工作流，</text><text x="20" y="713" font-size="16" font-weight="400" fill="#526779">不是固定证据时点下的 Prompt 净效应。</text></g></svg>