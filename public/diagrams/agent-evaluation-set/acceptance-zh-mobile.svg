<text x="40" y="142.0" font-size="18" fill="#087E73" font-weight="700" text-anchor="start">同一任务，分开取得证据</text>
<text x="40" y="162.0" font-size="15" fill="#50656D" font-weight="400" text-anchor="start">具体验证按本次承诺选用</text>
