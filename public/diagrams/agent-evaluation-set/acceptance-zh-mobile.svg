<text x="24" y="65.0" font-size="22" fill="#183742" font-weight="700" text-anchor="start">验收结论怎样获得依据</text>
<text x="24" y="93.0" font-size="15" fill="#50656D" font-weight="400" text-anchor="start">RQ-08 教学示意 · 多版本文档中的修订范围</text>
