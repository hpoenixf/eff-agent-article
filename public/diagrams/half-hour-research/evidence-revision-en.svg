<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
<title id="title">Test changed reasoning, not just a number</title><desc id="desc">Proposed teaching test; values from a synthetic paired case</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#21796a"/></marker></defs>
<g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<rect width="980" height="430" rx="20" fill="#f3f7f5"/>
<text x="28" y="43" font-size="30" font-weight="700" fill="#15353d">Test changed reasoning, not just a number</text>
<text x="28" y="74" font-size="18" font-weight="400" fill="#49636b">Proposed teaching test; values from a synthetic paired case</text>
<rect x="28" y="116" width="280" height="166" rx="13" fill="#fff" stroke="#d5e2dd"/>
<rect x="28" y="129" width="4" height="140" rx="2" fill="#21796a"/>
<text x="44" y="145" font-size="23" font-weight="700" fill="#21796a">Original finding</text>
<text x="44" y="170" font-size="16" font-weight="400" fill="#15353d">Gap: −0.5 percentage points</text>
<text x="44" y="195" font-size="16" font-weight="400" fill="#15353d">Save a substantive finding first</text>
<text x="44" y="220" font-size="16" font-weight="400" fill="#15353d">Then release revised material</text>
<rect x="350" y="116" width="280" height="166" rx="13" fill="#fff" stroke="#d5e2dd"/>
<rect x="350" y="129" width="4" height="140" rx="2" fill="#21796a"/>
<text x="366" y="145" font-size="23" font-weight="700" fill="#21796a">Release the correction</text>
<text x="366" y="170" font-size="16" font-weight="400" fill="#15353d">Gap: −0.9 percentage points</text>
<text x="366" y="195" font-size="16" font-weight="400" fill="#15353d">Verify the new input actually arrived</text>
<text x="366" y="220" font-size="16" font-weight="400" fill="#15353d">Retain original source versions</text>
<rect x="672" y="116" width="280" height="166" rx="13" fill="#fff" stroke="#d5e2dd"/>
<rect x="672" y="129" width="4" height="140" rx="2" fill="#356e9b"/>
<text x="688" y="145" font-size="23" font-weight="700" fill="#356e9b">Review each version</text>
<text x="688" y="170" font-size="16" font-weight="400" fill="#15353d">Review numbers and explanations</text>
<text x="688" y="195" font-size="16" font-weight="400" fill="#15353d">Fee contribution remains unknown</text>
<text x="688" y="220" font-size="16" font-weight="400" fill="#15353d">Do not infer its explanatory power</text>
<polyline points="308,193 350,193" fill="none" stroke="#21796a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="630,193 672,193" fill="none" stroke="#21796a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="28" y="339" font-size="18" font-weight="400" fill="#49636b">Check arrival of revised evidence, updated values, and supported reasoning separately.</text>
<text x="28" y="362" font-size="18" font-weight="400" fill="#49636b">Review compares answer versions; it adds no production keyword gate or mandatory review.</text>
</g>
</svg>
