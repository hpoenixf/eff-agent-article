<svg xmlns="http://www.w3.org/2000/svg" width="980" height="405" viewBox="0 0 980 405" role="img" aria-labelledby="title desc">
<title id="title">A correction supersedes one request</title><desc id="desc">Save the message; adopt it next; preserve effects</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#21796a"/></marker></defs>
<g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<rect width="980" height="405" rx="20" fill="#f3f7f5"/>
<text x="28" y="43" font-size="30" font-weight="700" fill="#15353d">A correction supersedes one request</text>
<text x="28" y="74" font-size="18" font-weight="400" fill="#49636b">Save the message; adopt it next; preserve effects</text>
<rect x="28" y="115" width="280" height="150" rx="13" fill="#fff" stroke="#d5e2dd"/>
<rect x="28" y="128" width="4" height="124" rx="2" fill="#21796a"/>
<text x="44" y="144" font-size="23" font-weight="700" fill="#21796a">Receive correction</text>
<text x="44" y="169" font-size="18" font-weight="400" fill="#15353d">Save exact text and target Run</text>
<text x="44" y="194" font-size="18" font-weight="400" fill="#15353d">Keep order and revision</text>
<rect x="350" y="115" width="280" height="150" rx="13" fill="#fff" stroke="#d5e2dd"/>
<rect x="350" y="128" width="4" height="124" rx="2" fill="#356e9b"/>
<text x="366" y="144" font-size="23" font-weight="700" fill="#356e9b">Handle the old request</text>
<text x="366" y="169" font-size="18" font-weight="400" fill="#15353d">Stop old undispatched work</text>
<text x="366" y="194" font-size="18" font-weight="400" fill="#15353d">Keep outcomes and unknowns</text>
<rect x="672" y="115" width="280" height="150" rx="13" fill="#fff" stroke="#d5e2dd"/>
<rect x="672" y="128" width="4" height="124" rx="2" fill="#21796a"/>
<text x="688" y="144" font-size="23" font-weight="700" fill="#21796a">Adopt in the successor</text>
<text x="688" y="169" font-size="18" font-weight="400" fill="#15353d">Full text reaches admitted input</text>
<text x="688" y="194" font-size="18" font-weight="400" fill="#15353d">Continue; review the report</text>
<polyline points="308,186 350,186" fill="none" stroke="#21796a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="630,186 672,186" fill="none" stroke="#21796a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="28" y="322" font-size="18" font-weight="400" fill="#49636b">A user stop and a superseded request are different control facts.</text>
<text x="28" y="345" font-size="18" font-weight="400" fill="#49636b">Original grants, usage, and deadlines remain. Adoption alone does not establish correct reasoning.</text>
</g>
</svg>
