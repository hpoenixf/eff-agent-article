<svg xmlns="http://www.w3.org/2000/svg" width="980" height="510" viewBox="0 0 980 510" role="img" aria-labelledby="title desc">
<title id="title">下一次请求，三种事实一起看</title><desc id="desc">同一资源记录的不同视图，不另建三套预算</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#21796a"/></marker></defs>
<g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<rect width="980" height="510" rx="20" fill="#f3f7f5"/>
<text x="28" y="43" font-size="30" font-weight="700" fill="#15353d">下一次请求，三种事实一起看</text>
<text x="28" y="74" font-size="18" font-weight="400" fill="#49636b">同一资源记录的不同视图，不另建三套预算</text>
<rect x="28" y="108" width="280" height="125" rx="13" fill="#fff" stroke="#d5e2dd"/>
<rect x="28" y="121" width="4" height="99" rx="2" fill="#21796a"/>
<text x="44" y="137" font-size="23" font-weight="700" fill="#21796a">真实请求消耗</text>
<text x="44" y="162" font-size="17" font-weight="400" fill="#15353d">已发出请求仍计入消耗</text>
<text x="44" y="187" font-size="17" font-weight="400" fill="#15353d">未知调用不因发布而退款</text>
<rect x="350" y="108" width="280" height="125" rx="13" fill="#fff" stroke="#d5e2dd"/>
<rect x="350" y="121" width="4" height="99" rx="2" fill="#21796a"/>
<text x="366" y="137" font-size="23" font-weight="700" fill="#21796a">当前阶段机会</text>
<text x="366" y="162" font-size="17" font-weight="400" fill="#15353d">探索与收尾分别表达</text>
<text x="366" y="187" font-size="17" font-weight="400" fill="#15353d">发布结算仅作用于原请求</text>
<rect x="672" y="108" width="280" height="125" rx="13" fill="#fff" stroke="#d5e2dd"/>
<rect x="672" y="121" width="4" height="99" rx="2" fill="#21796a"/>
<text x="688" y="137" font-size="23" font-weight="700" fill="#21796a">时间与输入容量</text>
<text x="688" y="162" font-size="17" font-weight="400" fill="#15353d">期限和输入硬容量仍生效</text>
<text x="688" y="187" font-size="17" font-weight="400" fill="#15353d">内层有次数不代表外层允许</text>
<polyline points="168,233 168,263 490,263 490,286" fill="none" stroke="#21796a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="490,233 490,263 490,263 490,286" fill="none" stroke="#21796a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="812,233 812,263 490,263 490,286" fill="none" stroke="#21796a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="275" y="289" width="430" height="77" rx="13" fill="#fff" stroke="#d5e2dd"/>
<rect x="275" y="302" width="4" height="51" rx="2" fill="#356e9b"/>
<text x="291" y="318" font-size="23" font-weight="700" fill="#356e9b">原资源模块在实际请求边界核对</text>
<text x="291" y="343" font-size="17" font-weight="400" fill="#15353d">消费同一有效记录，不在提醒里重新授予额度</text>
<polyline points="395,366 395,395 232,395 232,412" fill="none" stroke="#21796a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="585,366 585,395 748,395 748,412" fill="none" stroke="#21796a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="28" y="415" width="408" height="65" rx="13" fill="#fff" stroke="#d5e2dd"/>
<rect x="28" y="428" width="4" height="39" rx="2" fill="#21796a"/>
<text x="44" y="444" font-size="23" font-weight="700" fill="#21796a">获准：按当前阶段执行</text>
<rect x="544" y="415" width="408" height="65" rx="13" fill="#fff" stroke="#d5e2dd"/>
<rect x="544" y="428" width="4" height="39" rx="2" fill="#9a651a"/>
<text x="560" y="444" font-size="23" font-weight="700" fill="#9a651a">无法新调用：提供已提交成果</text>
</g>
</svg>
