<svg xmlns="http://www.w3.org/2000/svg" width="390" height="600" viewBox="0 0 390 600" role="img" aria-labelledby="title desc">
<title id="title">Hand off a correction</title><desc id="desc">Request interruption is not a Run stop</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#21796a"/></marker></defs>
<g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<rect width="390" height="600" rx="20" fill="#f3f7f5"/>
<text x="24" y="36" font-size="23" font-weight="700" fill="#15353d">Hand off a correction</text>
<text x="24" y="62" font-size="15" font-weight="400" fill="#49636b">Request interruption is not a Run stop</text>
<rect x="30" y="90" width="330" height="112" rx="13" fill="#fff" stroke="#d5e2dd"/>
<rect x="30" y="103" width="4" height="86" rx="2" fill="#21796a"/>
<text x="46" y="119" font-size="20" font-weight="700" fill="#21796a">Receive correction</text>
<text x="46" y="144" font-size="16" font-weight="400" fill="#15353d">Save exact text and target Run</text>
<text x="46" y="169" font-size="16" font-weight="400" fill="#15353d">Reception alone is not adoption</text>
<polyline points="195,202 195,231" fill="none" stroke="#21796a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="30" y="235" width="330" height="112" rx="13" fill="#fff" stroke="#d5e2dd"/>
<rect x="30" y="248" width="4" height="86" rx="2" fill="#356e9b"/>
<text x="46" y="264" font-size="20" font-weight="700" fill="#356e9b">Handle the old request</text>
<text x="46" y="289" font-size="16" font-weight="400" fill="#15353d">Stop obsolete undispatched work</text>
<text x="46" y="314" font-size="16" font-weight="400" fill="#15353d">Keep settled and unknown effects</text>
<polyline points="195,347 195,376" fill="none" stroke="#21796a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="30" y="380" width="330" height="112" rx="13" fill="#fff" stroke="#d5e2dd"/>
<rect x="30" y="393" width="4" height="86" rx="2" fill="#21796a"/>
<text x="46" y="409" font-size="20" font-weight="700" fill="#21796a">Adopt in the successor</text>
<text x="46" y="434" font-size="16" font-weight="400" fill="#15353d">Full text reaches admitted input</text>
<text x="46" y="459" font-size="16" font-weight="400" fill="#15353d">Continue, then review the report</text>
<text x="24" y="550" font-size="16" font-weight="400" fill="#49636b">Explicit stop and deadlines keep their owners.</text>
<text x="24" y="573" font-size="16" font-weight="400" fill="#49636b">Readmission does not reset or replay usage.</text>
</g>
</svg>
