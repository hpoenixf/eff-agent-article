<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" role="img" aria-labelledby="title desc">
<title id="title">长研究需要几种边界同时工作</title><desc id="desc">执行空间与收尾机会一起安排; 单次操作: 模型请求有等待边界, 工具有自己的执行期限, 连接心跳不等于研究进展; 整项研究: 请求额度、实际执行时间, 墙钟时间、用户期限, 升档保留已用与未知量; 收尾预留: 为综合、发布留下机会, 探索结束后有限收尾, 已有合法正文继续保留</desc>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="360" height="640" rx="18" fill="#f4f7f5"/>
<text x="20" y="34" font-size="21" font-weight="700" fill="#142f39">长研究需要几种边界同时工作</text>
<text x="20" y="66" font-size="14" font-weight="400" fill="#42626a">执行空间与收尾机会一起安排</text>
<rect x="16" y="88" width="328" height="140" rx="12" fill="#fff" stroke="#d9e4df"/>
<rect x="16" y="88" width="5" height="140" rx="2" fill="#22796c"/>
<text x="32" y="115" font-size="20" font-weight="700" fill="#22796c">单次操作</text>
<text x="32" y="138" font-size="15" font-weight="400" fill="#42626a">各自的请求与工具期限</text>
<text x="32" y="164" font-size="17" font-weight="400" fill="#243d45">模型请求有等待边界</text><text x="32" y="188" font-size="17" font-weight="400" fill="#243d45">工具有自己的执行期限</text><text x="32" y="212" font-size="17" font-weight="400" fill="#243d45">连接心跳不等于研究进展</text>
<rect x="16" y="239" width="328" height="140" rx="12" fill="#fff" stroke="#d9e4df"/>
<rect x="16" y="239" width="5" height="140" rx="2" fill="#315f9c"/>
<text x="32" y="266" font-size="20" font-weight="700" fill="#315f9c">整项研究</text>
<text x="32" y="289" font-size="15" font-weight="400" fill="#42626a">不同资源分别计量</text>
<text x="32" y="315" font-size="17" font-weight="400" fill="#243d45">请求额度、实际执行时间</text><text x="32" y="339" font-size="17" font-weight="400" fill="#243d45">墙钟时间、用户期限</text><text x="32" y="363" font-size="17" font-weight="400" fill="#243d45">升档保留已用与未知量</text>
<rect x="16" y="390" width="328" height="140" rx="12" fill="#fff" stroke="#d9e4df"/>
<rect x="16" y="390" width="5" height="140" rx="2" fill="#94621c"/>
<text x="32" y="417" font-size="20" font-weight="700" fill="#94621c">收尾预留</text>
<text x="32" y="440" font-size="15" font-weight="400" fill="#42626a">包含在原预算之内</text>
<text x="32" y="466" font-size="17" font-weight="400" fill="#243d45">为综合、发布留下机会</text><text x="32" y="490" font-size="17" font-weight="400" fill="#243d45">探索结束后有限收尾</text><text x="32" y="514" font-size="17" font-weight="400" fill="#243d45">已有合法正文继续保留</text>
<text x="20" y="555" font-size="14" font-weight="400" fill="#31584e">全部适用的限制共同生效</text><text x="20" y="578" font-size="14" font-weight="400" fill="#31584e">提高一项额度，不取消其他边界</text>
</g></svg>
