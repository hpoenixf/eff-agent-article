<svg xmlns="http://www.w3.org/2000/svg" width="390" height="615" viewBox="0 0 390 615" role="img" aria-labelledby="title desc">
<title id="title">怎样验证模型真的改判？</title><desc id="desc">数值来自合成案例，流程用于检验改判</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#21796a"/></marker></defs>
<g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<rect width="390" height="615" rx="20" fill="#f3f7f5"/>
<text x="24" y="36" font-size="23" font-weight="700" fill="#15353d">怎样验证模型真的改判？</text>
<text x="24" y="62" font-size="15" font-weight="400" fill="#49636b">数值来自合成案例，流程用于检验改判</text>
<rect x="30" y="90" width="330" height="112" rx="13" fill="#fff" stroke="#d5e2dd"/>
<rect x="30" y="103" width="4" height="86" rx="2" fill="#21796a"/>
<text x="46" y="119" font-size="20" font-weight="700" fill="#21796a">旧版资料与结论</text>
<text x="46" y="144" font-size="16" font-weight="400" fill="#15353d">差额 −0.5 个百分点</text>
<text x="46" y="169" font-size="16" font-weight="400" fill="#15353d">先保存实质结论，不以读取提示代替</text>
<polyline points="195,202 195,230" fill="none" stroke="#21796a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="30" y="234" width="330" height="112" rx="13" fill="#fff" stroke="#d5e2dd"/>
<rect x="30" y="247" width="4" height="86" rx="2" fill="#21796a"/>
<text x="46" y="263" font-size="20" font-weight="700" fill="#21796a">更正材料到来</text>
<text x="46" y="288" font-size="16" font-weight="400" fill="#15353d">新差额 −0.9 个百分点</text>
<text x="46" y="313" font-size="16" font-weight="400" fill="#15353d">确认新版材料进入实际模型输入</text>
<polyline points="195,346 195,374" fill="none" stroke="#21796a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="30" y="378" width="330" height="112" rx="13" fill="#fff" stroke="#d5e2dd"/>
<rect x="30" y="391" width="4" height="86" rx="2" fill="#356e9b"/>
<text x="46" y="407" font-size="20" font-weight="700" fill="#356e9b">逐版检查判断</text>
<text x="46" y="432" font-size="16" font-weight="400" fill="#15353d">核对数字、依赖解释与未知项</text>
<text x="46" y="457" font-size="16" font-weight="400" fill="#15353d">材料仍未给出费用贡献</text>
<text x="24" y="557" font-size="16" font-weight="400" fill="#49636b">改对差额，不自动使费用归因正确</text>
<text x="24" y="580" font-size="16" font-weight="400" fill="#49636b">这是评测判断，不是新的正文发布门</text>
</g>
</svg>
