<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" role="img" aria-labelledby="title desc">
<title id="title">Several limits govern long research</title><desc id="desc">Budget execution and an opportunity to finish; Each operation: A model request has a deadline, Tools have execution limits, Heartbeats do not prove progress; The whole Run: Requests and active execution, Wall time and user deadlines, Keep spent and unknown usage; Finalization: Leave room to synthesize, Finish within existing capacity, Preserve authorized text</desc>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="360" height="640" rx="18" fill="#f4f7f5"/>
<text x="20" y="34" font-size="21" font-weight="700" fill="#142f39">Several limits govern</text><text x="20" y="60" font-size="21" font-weight="700" fill="#142f39">long research</text>
<text x="20" y="86" font-size="14" font-weight="400" fill="#42626a">Execution and finishing share a budget</text>
<rect x="16" y="108" width="328" height="140" rx="12" fill="#fff" stroke="#d9e4df"/>
<rect x="16" y="108" width="5" height="140" rx="2" fill="#22796c"/>
<text x="32" y="135" font-size="20" font-weight="700" fill="#22796c">Each operation</text>
<text x="32" y="158" font-size="15" font-weight="400" fill="#42626a">Request and tool boundaries</text>
<text x="32" y="184" font-size="15" font-weight="400" fill="#243d45">A model request has a deadline</text><text x="32" y="208" font-size="15" font-weight="400" fill="#243d45">Tools have execution limits</text><text x="32" y="232" font-size="15" font-weight="400" fill="#243d45">Heartbeats do not prove progress</text>
<rect x="16" y="259" width="328" height="140" rx="12" fill="#fff" stroke="#d9e4df"/>
<rect x="16" y="259" width="5" height="140" rx="2" fill="#315f9c"/>
<text x="32" y="286" font-size="20" font-weight="700" fill="#315f9c">The whole Run</text>
<text x="32" y="309" font-size="15" font-weight="400" fill="#42626a">Track resources separately</text>
<text x="32" y="335" font-size="15" font-weight="400" fill="#243d45">Requests and active execution</text><text x="32" y="359" font-size="15" font-weight="400" fill="#243d45">Wall time and user deadlines</text><text x="32" y="383" font-size="15" font-weight="400" fill="#243d45">Keep spent and unknown usage</text>
<rect x="16" y="410" width="328" height="140" rx="12" fill="#fff" stroke="#d9e4df"/>
<rect x="16" y="410" width="5" height="140" rx="2" fill="#94621c"/>
<text x="32" y="437" font-size="20" font-weight="700" fill="#94621c">Finalization</text>
<text x="32" y="460" font-size="15" font-weight="400" fill="#42626a">Part of the original budget</text>
<text x="32" y="486" font-size="15" font-weight="400" fill="#243d45">Leave room to synthesize</text><text x="32" y="510" font-size="15" font-weight="400" fill="#243d45">Finish within existing capacity</text><text x="32" y="534" font-size="15" font-weight="400" fill="#243d45">Preserve authorized text</text>
<text x="20" y="575" font-size="14" font-weight="400" fill="#31584e">All applicable limits remain binding</text><text x="20" y="598" font-size="14" font-weight="400" fill="#31584e">An upgrade preserves the other boundaries</text>
</g></svg>
