<svg xmlns="http://www.w3.org/2000/svg" width="390" height="590" viewBox="0 0 390 590" role="img" aria-labelledby="title desc">
<title id="title">Keep capture optional</title><desc id="desc">Visible capture loss; preserved committed text</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#21796a"/></marker></defs>
<g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<rect width="390" height="590" rx="20" fill="#f3f7f5"/>
<text x="24" y="36" font-size="23" font-weight="700" fill="#15353d">Keep capture optional</text>
<text x="24" y="62" font-size="15" font-weight="400" fill="#49636b">Visible capture loss; preserved committed text</text>
<rect x="30" y="86" width="330" height="74" rx="13" fill="#fff" stroke="#d5e2dd"/>
<rect x="30" y="99" width="4" height="48" rx="2" fill="#21796a"/>
<text x="46" y="115" font-size="20" font-weight="700" fill="#21796a">Model produces text</text>
<text x="46" y="140" font-size="16" font-weight="400" fill="#15353d">Submit the original candidate</text>
<polyline points="195,160 195,178" fill="none" stroke="#21796a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="30" y="182" width="330" height="74" rx="13" fill="#fff" stroke="#d5e2dd"/>
<rect x="30" y="195" width="4" height="48" rx="2" fill="#21796a"/>
<text x="46" y="211" font-size="20" font-weight="700" fill="#21796a">Publication commits</text>
<text x="46" y="236" font-size="16" font-weight="400" fill="#15353d">Save text, revision, and receipt</text>
<polyline points="195,256 195,274" fill="none" stroke="#21796a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="30" y="278" width="330" height="74" rx="13" fill="#fff" stroke="#d5e2dd"/>
<rect x="30" y="291" width="4" height="48" rx="2" fill="#21796a"/>
<text x="46" y="307" font-size="20" font-weight="700" fill="#21796a">Page and history read</text>
<text x="46" y="332" font-size="16" font-weight="400" fill="#15353d">Retrieve the committed version</text>
<rect x="30" y="400" width="330" height="113" rx="13" fill="#fff" stroke="#d5e2dd"/>
<rect x="30" y="413" width="4" height="87" rx="2" fill="#9a651a"/>
<text x="46" y="429" font-size="20" font-weight="700" fill="#9a651a">Capture: local rollback</text>
<text x="46" y="454" font-size="16" font-weight="400" fill="#15353d">Release locks; record capture failure</text>
<text x="46" y="479" font-size="16" font-weight="400" fill="#15353d">Capture success is not a commit prerequisite</text>
<text x="24" y="546" font-size="16" font-weight="400" fill="#49636b">Required answer-storage failure still matters.</text>
</g>
</svg>
