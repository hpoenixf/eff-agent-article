<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
<title id="title">Offline: turn files into searchable material</title>
<desc id="desc">Retain source and version throughout. Acquire files: Document records → Parse content: Structured text → Create passages: Text + location → Build indexes: Searchable corpus</desc>
<rect width="1000" height="330" rx="20" fill="#f3f6fa"/>
<g font-family="Noto Sans CJK SC, Noto Sans, sans-serif" fill="#19334d">
<text x="24" y="43" font-size="28" font-weight="700">Offline: turn files into searchable material</text>
<text x="24" y="75" font-size="18" font-weight="400" fill="#536b80">Retain source and version throughout</text>
<rect x="24.0" y="102" width="224.5" height="177" rx="12" fill="#fff" stroke="#cad6e2"/>
<text x="40.0" y="130" font-size="18" font-weight="700" fill="#28688c">1</text>
<text x="40.0" y="161" font-size="20" font-weight="700">Acquire files</text>
<text x="40.0" y="192" font-size="18" font-weight="400" fill="#41586e">Approved originals</text>
<text x="40.0" y="219" font-size="18" font-weight="400" fill="#41586e">Source and version</text>
<text x="40.0" y="255" font-size="18" font-weight="600" fill="#1b6e68">Document records</text>
<path d="M251.5 189 h12 m-4 -4 l4 4 l-4 4" fill="none" stroke="#6a8197" stroke-width="2"/>
<rect x="266.5" y="102" width="224.5" height="177" rx="12" fill="#fff" stroke="#cad6e2"/>
<text x="282.5" y="130" font-size="18" font-weight="700" fill="#28688c">2</text>
<text x="282.5" y="161" font-size="20" font-weight="700">Parse content</text>
<text x="282.5" y="192" font-size="18" font-weight="400" fill="#41586e">Headings and pages</text>
<text x="282.5" y="219" font-size="18" font-weight="400" fill="#41586e">Tables and coverage</text>
<text x="282.5" y="255" font-size="18" font-weight="600" fill="#1b6e68">Structured text</text>
<path d="M494.0 189 h12 m-4 -4 l4 4 l-4 4" fill="none" stroke="#6a8197" stroke-width="2"/>
<rect x="509.0" y="102" width="224.5" height="177" rx="12" fill="#fff" stroke="#cad6e2"/>
<text x="525.0" y="130" font-size="18" font-weight="700" fill="#28688c">3</text>
<text x="525.0" y="161" font-size="20" font-weight="700">Create passages</text>
<text x="525.0" y="192" font-size="18" font-weight="400" fill="#41586e">Page / section units</text>
<text x="525.0" y="219" font-size="18" font-weight="400" fill="#41586e">Bounded splitting</text>
<text x="525.0" y="255" font-size="18" font-weight="600" fill="#1b6e68">Text + location</text>
<path d="M736.5 189 h12 m-4 -4 l4 4 l-4 4" fill="none" stroke="#6a8197" stroke-width="2"/>
<rect x="751.5" y="102" width="224.5" height="177" rx="12" fill="#fff" stroke="#cad6e2"/>
<text x="767.5" y="130" font-size="18" font-weight="700" fill="#28688c">4</text>
<text x="767.5" y="161" font-size="20" font-weight="700">Build indexes</text>
<text x="767.5" y="192" font-size="18" font-weight="400" fill="#41586e">Lexical / vector*</text>
<text x="767.5" y="219" font-size="18" font-weight="400" fill="#41586e">Scope metadata</text>
<text x="767.5" y="255" font-size="18" font-weight="600" fill="#1b6e68">Searchable corpus</text>
<text x="24" y="309" font-size="17" font-weight="400" fill="#536b80">Bottom line = step output. * Vector retrieval is optional; reranking is optional.</text>
</g></svg>
