<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc">
<title id="title">Workshop: the same six layers</title><desc id="desc">v0.20 local project · the bounded subset used here</desc>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",Arial,sans-serif}</style>
<rect width="1280" height="840" fill="#F6F8FC"/>
<rect width="1280" height="102" fill="#0F203D"/>
<text x="32" y="46" font-size="30" font-weight="760" fill="#FFFFFF" >Workshop: the same six layers</text>
<text x="32" y="79" font-size="18" font-weight="500" fill="#BDCEE4" >v0.20 local project · the bounded subset used here</text>
<rect x="24" y="114" width="1232" height="36" rx="8" fill="#E7EDF7"/>
<text x="40" y="139" font-size="18" font-weight="650" fill="#245A97" >Stage 4: the same layer names and order; the actions below are examples within them.</text>
<text x="42" y="178" font-size="17" font-weight="700" fill="#172C46" >Architecture layer</text>
<text x="338" y="178" font-size="17" font-weight="700" fill="#172C46" >Workshop example</text>
<text x="790" y="178" font-size="17" font-weight="700" fill="#172C46" >What to check</text>
<g data-layer-id="L1" data-layer-name="Task Intake" data-layer-top="192">
<rect x="24" y="192" width="1232" height="84" rx="9" fill="#FFFFFF"/>
<rect x="32" y="198" width="274" height="72" rx="7" fill="#E8EFFA"/>
<text x="46" y="223" font-size="21" font-weight="760" fill="#2563A9" >L1</text>
<text x="46" y="252" font-size="20" font-weight="730" fill="#172C46" >Task Intake</text>
<text x="338" y="224" font-size="23" font-weight="730" fill="#17334B" >Request work</text>
<text x="338" y="254" font-size="19" font-weight="550" fill="#5C6F84" >Question file → submit</text>
<text x="790" y="238" font-size="19" font-weight="500" fill="#465673" >Submission saves; work executes.</text>
</g>
<g data-layer-id="L2" data-layer-name="Identity &amp; Context" data-layer-top="284">
<rect x="24" y="284" width="1232" height="84" rx="9" fill="#EFF3F9"/>
<rect x="32" y="290" width="274" height="72" rx="7" fill="#E8EFFA"/>
<text x="46" y="315" font-size="21" font-weight="760" fill="#2563A9" >L2</text>
<text x="46" y="344" font-size="20" font-weight="730" fill="#172C46" >Identity &amp; Context</text>
<text x="338" y="316" font-size="23" font-weight="730" fill="#17334B" >Bind the scope</text>
<text x="338" y="346" font-size="19" font-weight="550" fill="#5C6F84" >Project · Run · manifest</text>
<text x="790" y="316" font-size="19" font-weight="500" fill="#465673" >Recovery retains sources,</text>
<text x="790" y="341" font-size="19" font-weight="500" fill="#465673" >permissions and budgets.</text>
</g>
<g data-layer-id="L3" data-layer-name="Agent &amp; Runtime" data-layer-top="376">
<rect x="24" y="376" width="1232" height="84" rx="9" fill="#FFFFFF"/>
<rect x="32" y="382" width="274" height="72" rx="7" fill="#E8EFFA"/>
<text x="46" y="407" font-size="21" font-weight="760" fill="#2563A9" >L3</text>
<text x="46" y="436" font-size="20" font-weight="730" fill="#172C46" >Agent &amp; Runtime</text>
<text x="338" y="408" font-size="23" font-weight="730" fill="#17334B" >Choose the next step</text>
<text x="338" y="438" font-size="19" font-weight="550" fill="#5C6F84" >Main · tool loop · Child</text>
<text x="790" y="408" font-size="19" font-weight="500" fill="#465673" >Model choices remain</text>
<text x="790" y="433" font-size="19" font-weight="500" fill="#465673" >within the original grant.</text>
</g>
<g data-layer-id="L4" data-layer-name="Tools &amp; Domains" data-layer-top="468">
<rect x="24" y="468" width="1232" height="84" rx="9" fill="#EFF3F9"/>
<rect x="32" y="474" width="274" height="72" rx="7" fill="#E8EFFA"/>
<text x="46" y="499" font-size="21" font-weight="760" fill="#2563A9" >L4</text>
<text x="46" y="528" font-size="20" font-weight="730" fill="#172C46" >Tools &amp; Domains</text>
<text x="338" y="500" font-size="23" font-weight="730" fill="#17334B" >Acquire evidence</text>
<text x="338" y="530" font-size="19" font-weight="550" fill="#5C6F84" >Text · Memory · bounded checks</text>
<text x="790" y="500" font-size="19" font-weight="500" fill="#465673" >Preferences and Child opinions</text>
<text x="790" y="525" font-size="19" font-weight="500" fill="#465673" >cannot replace the source.</text>
</g>
<g data-layer-id="L5" data-layer-name="Result &amp; Delivery" data-layer-top="560">
<rect x="24" y="560" width="1232" height="84" rx="9" fill="#FFFFFF"/>
<rect x="32" y="566" width="274" height="72" rx="7" fill="#E8EFFA"/>
<text x="46" y="591" font-size="21" font-weight="760" fill="#2563A9" >L5</text>
<text x="46" y="620" font-size="20" font-weight="730" fill="#172C46" >Result &amp; Delivery</text>
<text x="338" y="592" font-size="23" font-weight="730" fill="#17334B" >Keep the deliverable</text>
<text x="338" y="622" font-size="19" font-weight="550" fill="#5C6F84" >Report · Publication receipt</text>
<text x="790" y="606" font-size="19" font-weight="500" fill="#465673" >An answer is not a saved report.</text>
</g>
<g data-layer-id="L6" data-layer-name="User Interface" data-layer-top="652">
<rect x="24" y="652" width="1232" height="84" rx="9" fill="#EFF3F9"/>
<rect x="32" y="658" width="274" height="72" rx="7" fill="#E8EFFA"/>
<text x="46" y="683" font-size="21" font-weight="760" fill="#2563A9" >L6</text>
<text x="46" y="712" font-size="20" font-weight="730" fill="#172C46" >User Interface</text>
<text x="338" y="684" font-size="23" font-weight="730" fill="#17334B" >Open it again</text>
<text x="338" y="714" font-size="19" font-weight="550" fill="#5C6F84" >CLI · local read-only Reader</text>
<text x="790" y="684" font-size="19" font-weight="500" fill="#465673" >Read persisted results</text>
<text x="790" y="709" font-size="19" font-weight="500" fill="#465673" >after the execution process exits.</text>
</g>
<rect x="24" y="760" width="1232" height="64" rx="8" fill="#FFFFFF" stroke="#DCE5ED"/>
<text x="42" y="786" font-size="19" font-weight="650" fill="#246F5D" >Keep the report, original task and traceable sources.</text>
<text x="42" y="811" font-size="17" font-weight="500" fill="#465673" >The layers describe responsibilities, not six services or a complete production or finance platform.</text>
</svg>
