<svg xmlns="http://www.w3.org/2000/svg" width="390" height="956" viewBox="0 0 390 956" role="img" aria-labelledby="title desc">
<title id="title">练手篇：同一套六层架构</title><desc id="desc">v0.20 本地项目 · 本练习实际使用的有界子集</desc>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",Arial,sans-serif}</style>
<rect width="390" height="956" fill="#F6F8FC"/>
<rect width="390" height="100" fill="#0F203D"/>
<text x="18" y="35" font-size="22" font-weight="760" fill="#FFFFFF" >练手篇：同一套六层架构</text>
<text x="18" y="64" font-size="15" font-weight="500" fill="#BDCEE4" >v0.20 本地项目</text>
<text x="18" y="86" font-size="14" font-weight="500" fill="#BDCEE4" >本练习实际使用的有界子集</text>
<text x="18" y="126" font-size="16" font-weight="650" fill="#245A97" >统一架构层 → 本次练习示例</text>
<g data-layer-id="L1" data-layer-name="任务输入与触发" data-layer-top="144">
<rect x="12" y="144" width="366" height="118" rx="8" fill="#FFFFFF" stroke="#DCE5ED"/>
<text x="24" y="168" font-size="17" font-weight="760" fill="#2563A9" >L1</text>
<text x="62" y="168" font-size="17" font-weight="730" fill="#172C46" >任务输入与触发</text>
<text x="24" y="192" font-size="16" font-weight="700" fill="#17334B" >提出任务</text>
<text x="24" y="214" font-size="15.5" font-weight="600" fill="#17334B" >问题文件 → submit</text>
<text x="24" y="235" font-size="14" font-weight="450" fill="#5C6F84" >提交只保存；work 才执行。</text>
</g>
<g data-layer-id="L2" data-layer-name="身份、会话与上下文" data-layer-top="268">
<rect x="12" y="268" width="366" height="118" rx="8" fill="#EFF3F9" stroke="#DCE5ED"/>
<text x="24" y="292" font-size="17" font-weight="760" fill="#2563A9" >L2</text>
<text x="62" y="292" font-size="17" font-weight="730" fill="#172C46" >身份、会话与上下文</text>
<text x="24" y="316" font-size="16" font-weight="700" fill="#17334B" >锁定范围</text>
<text x="24" y="338" font-size="15.5" font-weight="600" fill="#17334B" >项目 · Run · manifest</text>
<text x="24" y="359" font-size="14" font-weight="450" fill="#5C6F84" >资料、权限和预算不随恢复重置。</text>
</g>
<g data-layer-id="L3" data-layer-name="Agent 决策与运行" data-layer-top="392">
<rect x="12" y="392" width="366" height="118" rx="8" fill="#FFFFFF" stroke="#DCE5ED"/>
<text x="24" y="416" font-size="17" font-weight="760" fill="#2563A9" >L3</text>
<text x="62" y="416" font-size="17" font-weight="730" fill="#172C46" >Agent 决策与运行</text>
<text x="24" y="440" font-size="16" font-weight="700" fill="#17334B" >决定下一步</text>
<text x="24" y="462" font-size="15.5" font-weight="600" fill="#17334B" >Main · 工具循环 · Child</text>
<text x="24" y="483" font-size="14" font-weight="450" fill="#5C6F84" >模型选择动作，执行仍受原约束。</text>
</g>
<g data-layer-id="L4" data-layer-name="工具与领域能力" data-layer-top="516">
<rect x="12" y="516" width="366" height="118" rx="8" fill="#EFF3F9" stroke="#DCE5ED"/>
<text x="24" y="540" font-size="17" font-weight="760" fill="#2563A9" >L4</text>
<text x="62" y="540" font-size="17" font-weight="730" fill="#172C46" >工具与领域能力</text>
<text x="24" y="564" font-size="16" font-weight="700" fill="#17334B" >取得依据</text>
<text x="24" y="586" font-size="15.5" font-weight="600" fill="#17334B" >选定文本 · Memory · 受限核对</text>
<text x="24" y="607" font-size="14" font-weight="450" fill="#5C6F84" >偏好与 Child 判断不能冒充原文。</text>
</g>
<g data-layer-id="L5" data-layer-name="结果发布与交付" data-layer-top="640">
<rect x="12" y="640" width="366" height="118" rx="8" fill="#FFFFFF" stroke="#DCE5ED"/>
<text x="24" y="664" font-size="17" font-weight="760" fill="#2563A9" >L5</text>
<text x="62" y="664" font-size="17" font-weight="730" fill="#172C46" >结果发布与交付</text>
<text x="24" y="688" font-size="16" font-weight="700" fill="#17334B" >留下成果</text>
<text x="24" y="710" font-size="15.5" font-weight="600" fill="#17334B" >报告文件 · Publication 回执</text>
<text x="24" y="731" font-size="14" font-weight="450" fill="#5C6F84" >说“完成”不等于报告已经保存。</text>
</g>
<g data-layer-id="L6" data-layer-name="用户界面" data-layer-top="764">
<rect x="12" y="764" width="366" height="118" rx="8" fill="#EFF3F9" stroke="#DCE5ED"/>
<text x="24" y="788" font-size="17" font-weight="760" fill="#2563A9" >L6</text>
<text x="62" y="788" font-size="17" font-weight="730" fill="#172C46" >用户界面</text>
<text x="24" y="812" font-size="16" font-weight="700" fill="#17334B" >重新打开</text>
<text x="24" y="834" font-size="15.5" font-weight="600" fill="#17334B" >CLI 回读 · 本地只读 Reader</text>
<text x="24" y="855" font-size="14" font-weight="450" fill="#5C6F84" >关闭执行进程后，仍可读持久结果。</text>
</g>
<text x="18" y="917" font-size="13.5" font-weight="500" fill="#465673" >六层是职责地图，不是六个服务。</text>
<text x="18" y="939" font-size="13.5" font-weight="500" fill="#465673" >本地练习不等于完整生产或金融平台。</text>
</svg>
