<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc"><title id="title">六层，落到一件能检查的事</title><desc id="desc">v0.20 本地研究项目 · 本文实际使用的有界子集</desc>
<rect width="1040" height="640" rx="20" fill="#f4f7f3"/>
<style>text{font-family:"Noto Sans CJK SC","DejaVu Sans",sans-serif;fill:#173f36}.muted{fill:#526b64}</style>
<text x="36" y="49" font-size="30" font-weight="700" class="">六层，落到一件能检查的事</text>
<text x="36" y="79" font-size="17" font-weight="400" class="muted">v0.20 本地研究项目 · 本文实际使用的有界子集</text>
<text x="36" y="119" font-size="20" font-weight="600" class="">带入一份资料，带走报告、原任务与可回查来源。</text>
<rect x="36" y="152" width="474" height="130" rx="12" fill="#ffffff" stroke="#cbdad2"/>
<rect x="48" y="164" width="38" height="26" rx="6" fill="#dcece2"/>
<text x="56" y="183" font-size="15" font-weight="700" class="">L1</text>
<text x="98" y="184" font-size="21" font-weight="700" class="">提出任务</text>
<text x="52" y="224" font-size="19" font-weight="600" class="">问题文件 → submit</text>
<text x="52" y="257" font-size="17" font-weight="400" class="muted">提交只保存；work 才执行。</text>
<rect x="530" y="152" width="474" height="130" rx="12" fill="#ffffff" stroke="#cbdad2"/>
<rect x="542" y="164" width="38" height="26" rx="6" fill="#dcece2"/>
<text x="550" y="183" font-size="15" font-weight="700" class="">L2</text>
<text x="592" y="184" font-size="21" font-weight="700" class="">锁定范围</text>
<text x="546" y="224" font-size="19" font-weight="600" class="">项目 · Run · manifest</text>
<text x="546" y="257" font-size="17" font-weight="400" class="muted">资料、权限和预算不随恢复重置。</text>
<rect x="36" y="300" width="474" height="130" rx="12" fill="#ffffff" stroke="#cbdad2"/>
<rect x="48" y="312" width="38" height="26" rx="6" fill="#dcece2"/>
<text x="56" y="331" font-size="15" font-weight="700" class="">L3</text>
<text x="98" y="332" font-size="21" font-weight="700" class="">决定下一步</text>
<text x="52" y="372" font-size="19" font-weight="600" class="">Main · 工具循环 · Child</text>
<text x="52" y="405" font-size="17" font-weight="400" class="muted">模型选择动作，执行仍受原约束。</text>
<rect x="530" y="300" width="474" height="130" rx="12" fill="#ffffff" stroke="#cbdad2"/>
<rect x="542" y="312" width="38" height="26" rx="6" fill="#dcece2"/>
<text x="550" y="331" font-size="15" font-weight="700" class="">L4</text>
<text x="592" y="332" font-size="21" font-weight="700" class="">取得依据</text>
<text x="546" y="372" font-size="19" font-weight="600" class="">选定文本 · Memory · 受限核对</text>
<text x="546" y="405" font-size="17" font-weight="400" class="muted">偏好与 Child 判断不能冒充原文。</text>
<rect x="36" y="448" width="474" height="130" rx="12" fill="#ffffff" stroke="#cbdad2"/>
<rect x="48" y="460" width="38" height="26" rx="6" fill="#dcece2"/>
<text x="56" y="479" font-size="15" font-weight="700" class="">L5</text>
<text x="98" y="480" font-size="21" font-weight="700" class="">留下成果</text>
<text x="52" y="520" font-size="19" font-weight="600" class="">报告文件 · Publication 回执</text>
<text x="52" y="553" font-size="17" font-weight="400" class="muted">说“完成”不等于报告已经保存。</text>
<rect x="530" y="448" width="474" height="130" rx="12" fill="#ffffff" stroke="#cbdad2"/>
<rect x="542" y="460" width="38" height="26" rx="6" fill="#dcece2"/>
<text x="550" y="479" font-size="15" font-weight="700" class="">L6</text>
<text x="592" y="480" font-size="21" font-weight="700" class="">重新打开</text>
<text x="546" y="520" font-size="19" font-weight="600" class="">CLI 回读 · 本地只读 Reader</text>
<text x="546" y="553" font-size="17" font-weight="400" class="muted">关闭执行进程后，仍可读持久结果。</text>
<text x="36" y="620" font-size="15" font-weight="400" class="muted">六层是职责地图，不是六个服务；不是完整生产或金融平台。</text>
</svg>