<svg xmlns="http://www.w3.org/2000/svg" width="390" height="956" viewBox="0 0 390 956" role="img" aria-labelledby="title desc">
<title id="title">Workshop: the same six layers</title><desc id="desc">v0.20 local project · the bounded subset used here</desc>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",Arial,sans-serif}</style>
<rect width="390" height="956" fill="#F6F8FC"/>
<rect width="390" height="100" fill="#0F203D"/>
<text x="18" y="35" font-size="22" font-weight="760" fill="#FFFFFF" >Workshop: the same six layers</text>
<text x="18" y="64" font-size="15" font-weight="500" fill="#BDCEE4" >v0.20 local project</text>
<text x="18" y="86" font-size="14" font-weight="500" fill="#BDCEE4" >Only the bounded subset used here</text>
<text x="18" y="126" font-size="16" font-weight="650" fill="#245A97" >Architecture layer → workshop example</text>
<g data-layer-id="L1" data-layer-name="Task Intake" data-layer-top="144">
<rect x="12" y="144" width="366" height="118" rx="8" fill="#FFFFFF" stroke="#DCE5ED"/>
<text x="24" y="168" font-size="17" font-weight="760" fill="#2563A9" >L1</text>
<text x="62" y="168" font-size="17" font-weight="730" fill="#172C46" >Task Intake</text>
<text x="24" y="192" font-size="16" font-weight="700" fill="#17334B" >Request work</text>
<text x="24" y="214" font-size="15" font-weight="600" fill="#17334B" >Question file → submit</text>
<text x="24" y="235" font-size="14" font-weight="450" fill="#5C6F84" >Submission saves; work executes.</text>
</g>
<g data-layer-id="L2" data-layer-name="Identity &amp; Context" data-layer-top="268">
<rect x="12" y="268" width="366" height="118" rx="8" fill="#EFF3F9" stroke="#DCE5ED"/>
<text x="24" y="292" font-size="17" font-weight="760" fill="#2563A9" >L2</text>
<text x="62" y="292" font-size="17" font-weight="730" fill="#172C46" >Identity &amp; Context</text>
<text x="24" y="316" font-size="16" font-weight="700" fill="#17334B" >Bind the scope</text>
<text x="24" y="338" font-size="15" font-weight="600" fill="#17334B" >Project · Run · manifest</text>
<text x="24" y="359" font-size="14" font-weight="450" fill="#5C6F84" >Recovery retains sources,</text>
<text x="24" y="376" font-size="14" font-weight="450" fill="#5C6F84" >permissions and budgets.</text>
</g>
<g data-layer-id="L3" data-layer-name="Agent &amp; Runtime" data-layer-top="392">
<rect x="12" y="392" width="366" height="118" rx="8" fill="#FFFFFF" stroke="#DCE5ED"/>
<text x="24" y="416" font-size="17" font-weight="760" fill="#2563A9" >L3</text>
<text x="62" y="416" font-size="17" font-weight="730" fill="#172C46" >Agent &amp; Runtime</text>
<text x="24" y="440" font-size="16" font-weight="700" fill="#17334B" >Choose the next step</text>
<text x="24" y="462" font-size="15" font-weight="600" fill="#17334B" >Main · tool loop · Child</text>
<text x="24" y="483" font-size="14" font-weight="450" fill="#5C6F84" >Model choices remain</text>
<text x="24" y="500" font-size="14" font-weight="450" fill="#5C6F84" >within the original grant.</text>
</g>
<g data-layer-id="L4" data-layer-name="Tools &amp; Domains" data-layer-top="516">
<rect x="12" y="516" width="366" height="118" rx="8" fill="#EFF3F9" stroke="#DCE5ED"/>
<text x="24" y="540" font-size="17" font-weight="760" fill="#2563A9" >L4</text>
<text x="62" y="540" font-size="17" font-weight="730" fill="#172C46" >Tools &amp; Domains</text>
<text x="24" y="564" font-size="16" font-weight="700" fill="#17334B" >Acquire evidence</text>
<text x="24" y="586" font-size="15" font-weight="600" fill="#17334B" >Text · Memory · bounded checks</text>
<text x="24" y="607" font-size="14" font-weight="450" fill="#5C6F84" >Preferences and Child opinions</text>
<text x="24" y="624" font-size="14" font-weight="450" fill="#5C6F84" >cannot replace the source.</text>
</g>
<g data-layer-id="L5" data-layer-name="Result &amp; Delivery" data-layer-top="640">
<rect x="12" y="640" width="366" height="118" rx="8" fill="#FFFFFF" stroke="#DCE5ED"/>
<text x="24" y="664" font-size="17" font-weight="760" fill="#2563A9" >L5</text>
<text x="62" y="664" font-size="17" font-weight="730" fill="#172C46" >Result &amp; Delivery</text>
<text x="24" y="688" font-size="16" font-weight="700" fill="#17334B" >Keep the deliverable</text>
<text x="24" y="710" font-size="15" font-weight="600" fill="#17334B" >Report · Publication receipt</text>
<text x="24" y="731" font-size="14" font-weight="450" fill="#5C6F84" >An answer is not a saved report.</text>
</g>
<g data-layer-id="L6" data-layer-name="User Interface" data-layer-top="764">
<rect x="12" y="764" width="366" height="118" rx="8" fill="#EFF3F9" stroke="#DCE5ED"/>
<text x="24" y="788" font-size="17" font-weight="760" fill="#2563A9" >L6</text>
<text x="62" y="788" font-size="17" font-weight="730" fill="#172C46" >User Interface</text>
<text x="24" y="812" font-size="16" font-weight="700" fill="#17334B" >Open it again</text>
<text x="24" y="834" font-size="15" font-weight="600" fill="#17334B" >CLI · local read-only Reader</text>
<text x="24" y="855" font-size="14" font-weight="450" fill="#5C6F84" >Read persisted results</text>
<text x="24" y="872" font-size="14" font-weight="450" fill="#5C6F84" >after the execution process exits.</text>
</g>
<text x="18" y="917" font-size="13.5" font-weight="500" fill="#465673" >Responsibility layers, not six services.</text>
<text x="18" y="939" font-size="13.5" font-weight="500" fill="#465673" >Not a complete production or finance platform.</text>
</svg>
