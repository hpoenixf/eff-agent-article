<svg xmlns="http://www.w3.org/2000/svg" width="390" height="824" viewBox="0 0 390 824" role="img" aria-labelledby="title desc"><title id="title">Six layers. One inspectable task.</title><desc id="desc">v0.20 local research project · the subset used here</desc>
<rect width="390" height="824" rx="20" fill="#f4f7f3"/>
<style>text{font-family:"Noto Sans CJK SC","DejaVu Sans",sans-serif;fill:#173f36}.muted{fill:#526b64}</style>
<text x="18" y="40" font-size="20" font-weight="700" class="">Six layers. One inspectable task.</text>
<text x="18" y="67" font-size="14" font-weight="400" class="muted">v0.20 local research project</text>
<text x="18" y="86" font-size="14" font-weight="400" class="muted">The bounded subset used in this workshop</text>
<text x="18" y="113" font-size="15" font-weight="600" class="">Bring a document. Keep a checkable result.</text>
<rect x="18" y="136" width="354" height="94" rx="12" fill="#ffffff" stroke="#cbdad2"/>
<rect x="30" y="148" width="38" height="26" rx="6" fill="#dcece2"/>
<text x="38" y="167" font-size="15" font-weight="700" class="">L1</text>
<text x="80" y="168" font-size="18" font-weight="700" class="">Request work</text>
<text x="34" y="195" font-size="16" font-weight="600" class="">Question file → submit</text>
<text x="34" y="217" font-size="15" font-weight="400" class="muted">Submission saves; work executes.</text>
<rect x="18" y="240" width="354" height="94" rx="12" fill="#ffffff" stroke="#cbdad2"/>
<rect x="30" y="252" width="38" height="26" rx="6" fill="#dcece2"/>
<text x="38" y="271" font-size="15" font-weight="700" class="">L2</text>
<text x="80" y="272" font-size="18" font-weight="700" class="">Bind the scope</text>
<text x="34" y="299" font-size="16" font-weight="600" class="">Project · Run · manifest</text>
<text x="34" y="321" font-size="15" font-weight="400" class="muted">Recovery retains sources and budgets.</text>
<rect x="18" y="344" width="354" height="94" rx="12" fill="#ffffff" stroke="#cbdad2"/>
<rect x="30" y="356" width="38" height="26" rx="6" fill="#dcece2"/>
<text x="38" y="375" font-size="15" font-weight="700" class="">L3</text>
<text x="80" y="376" font-size="18" font-weight="700" class="">Choose the next step</text>
<text x="34" y="403" font-size="16" font-weight="600" class="">Main · tool loop · Child</text>
<text x="34" y="425" font-size="15" font-weight="400" class="muted">Model choices remain within the grant.</text>
<rect x="18" y="448" width="354" height="94" rx="12" fill="#ffffff" stroke="#cbdad2"/>
<rect x="30" y="460" width="38" height="26" rx="6" fill="#dcece2"/>
<text x="38" y="479" font-size="15" font-weight="700" class="">L4</text>
<text x="80" y="480" font-size="18" font-weight="700" class="">Acquire evidence</text>
<text x="34" y="507" font-size="16" font-weight="600" class="">Text · Memory · bounded checks</text>
<text x="34" y="529" font-size="15" font-weight="400" class="muted">Preferences are not source evidence.</text>
<rect x="18" y="552" width="354" height="94" rx="12" fill="#ffffff" stroke="#cbdad2"/>
<rect x="30" y="564" width="38" height="26" rx="6" fill="#dcece2"/>
<text x="38" y="583" font-size="15" font-weight="700" class="">L5</text>
<text x="80" y="584" font-size="18" font-weight="700" class="">Keep the deliverable</text>
<text x="34" y="611" font-size="16" font-weight="600" class="">Report · Publication receipt</text>
<text x="34" y="633" font-size="15" font-weight="400" class="muted">An answer is not a saved report.</text>
<rect x="18" y="656" width="354" height="94" rx="12" fill="#ffffff" stroke="#cbdad2"/>
<rect x="30" y="668" width="38" height="26" rx="6" fill="#dcece2"/>
<text x="38" y="687" font-size="15" font-weight="700" class="">L6</text>
<text x="80" y="688" font-size="18" font-weight="700" class="">Open it again</text>
<text x="34" y="715" font-size="16" font-weight="600" class="">CLI · local read-only Reader</text>
<text x="34" y="737" font-size="15" font-weight="400" class="muted">Read persisted results after execution.</text>
<text x="18" y="797" font-size="13" font-weight="400" class="muted">A map, not six services or a full platform.</text>
</svg>