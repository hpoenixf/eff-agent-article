<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="662" viewBox="0 0 1080 662" role="img" aria-labelledby="horizon-title horizon-desc" lang="zh">
<title id="horizon-title">从一次请求，到长期个人助手</title>
<desc id="horizon-desc">四层递进的认知总结：一次请求处理已知输入并交付当前结果；持续任务的责任和证据跨越进程；人机协作让未知先询问，等待、恢复与权限仍绑定原任务；长期个人助手的目标跨多次运行，条件变化时重新判断偏好、授权和是否打扰。延续目标与责任，不等于让模型一直运行。</desc>
<rect width="1080" height="662" rx="22" fill="#F7F6F1"/>
<g font-family="Inter, Arial, Noto Sans CJK SC, sans-serif">
<text x="44" y="39" fill="#246D62" font-size="15" font-weight="650" letter-spacing="1.2">回看 · 工程视野如何展开</text><text x="44" y="88.0" fill="#233D3B" font-size="35" font-weight="650" >从一次请求，到长期个人助手</text><text x="44" y="124" fill="#526861" font-size="21" font-weight="400" >每一步都在扩大需要负责的范围，而不只是增加功能。</text><path d="M69 200 V528" fill="none" stroke="#B6C8BD" stroke-width="2"/><rect x="115" y="153" width="921" height="94" rx="15" fill="#FEFEFA" stroke="#D7E0D8"/><circle cx="69" cy="200" r="17" fill="#F7F6F1" stroke="#246D62" stroke-width="1.6"/><text x="69" y="207" fill="#246D62" font-size="20" font-weight="650" text-anchor="middle">1</text><path d="M64 252 L69 257 L74 252" fill="none" stroke="#8FA99A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="143" y="207" fill="#233D3B" font-size="27" font-weight="650" >一次请求</text><path d="M405 174 V226" stroke="#CBD9CE" stroke-width="1"/><text x="431" y="178" fill="#526861" font-size="17" font-weight="500" >起点：输入与交付范围已知</text><text x="431" y="214" fill="#233D3B" font-size="23" font-weight="500" >处理眼前输入，交付当前结果。</text><rect x="115" y="257" width="921" height="94" rx="15" fill="#F0F5EF" stroke="#D7E0D8"/><circle cx="69" cy="304" r="20" fill="#F7F6F1" stroke="#246D62" stroke-width="1.6"/><text x="69" y="311" fill="#246D62" font-size="20" font-weight="650" text-anchor="middle">2</text><path d="M64 356 L69 361 L74 356" fill="none" stroke="#8FA99A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="143" y="311" fill="#233D3B" font-size="27" font-weight="650" >持续任务</text><path d="M405 278 V330" stroke="#CBD9CE" stroke-width="1"/><text x="431" y="282" fill="#526861" font-size="17" font-weight="500" >但执行可能中断</text><text x="431" y="310" fill="#233D3B" font-size="23" font-weight="500" >进程结束不等于任务结束。</text>
<text x="431" y="338" fill="#233D3B" font-size="23" font-weight="500" >责任与证据要跨进程延续。</text><rect x="115" y="361" width="921" height="94" rx="15" fill="#E3EEE6" stroke="#D7E0D8"/><circle cx="69" cy="408" r="23" fill="#F7F6F1" stroke="#246D62" stroke-width="1.6"/><text x="69" y="415" fill="#246D62" font-size="20" font-weight="650" text-anchor="middle">3</text><path d="M64 460 L69 465 L74 460" fill="none" stroke="#8FA99A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="143" y="415" fill="#233D3B" font-size="27" font-weight="650" >人机协作</text><path d="M405 382 V434" stroke="#CBD9CE" stroke-width="1"/><text x="431" y="386" fill="#526861" font-size="17" font-weight="500" >但有些未知需要用户澄清</text><text x="431" y="414" fill="#233D3B" font-size="23" font-weight="500" >需要时先询问。</text>
<text x="431" y="442" fill="#233D3B" font-size="23" font-weight="500" >等待、恢复与权限仍绑定原任务。</text><rect x="115" y="465" width="921" height="94" rx="15" fill="#214F48" stroke="#214F48"/><circle cx="69" cy="512" r="26" fill="#F7F6F1" stroke="#B88A4E" stroke-width="2"/><text x="69" y="519" fill="#936833" font-size="20" font-weight="650" text-anchor="middle">4</text><text x="143" y="519" fill="#FBFCF6" font-size="27" font-weight="650" >长期个人助手</text><path d="M405 486 V538" stroke="#54736A" stroke-width="1"/><text x="431" y="490" fill="#DBE9DF" font-size="17" font-weight="500" >但目标会跨越多次运行</text><text x="431" y="518" fill="#FBFCF6" font-size="23" font-weight="500" >条件变化时，重看偏好与授权；</text>
<text x="431" y="546" fill="#FBFCF6" font-size="23" font-weight="500" >重新判断下一步，以及是否值得打扰。</text><path d="M44 596 H1036" stroke="#D7E0D8"/><circle cx="58" cy="627" r="5" fill="#B88A4E"/><text x="77" y="635.0" fill="#233D3B" font-size="25" font-weight="600" >延续的是目标与责任，不是让模型一直运行。</text></g>
</svg>
