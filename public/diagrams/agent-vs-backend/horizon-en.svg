<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="662" viewBox="0 0 1080 662" role="img" aria-labelledby="horizon-title horizon-desc" lang="en">
<title id="horizon-title">From one request to a long-term personal assistant</title>
<desc id="horizon-desc">Four widening perspectives: one request handles known input and delivers a result; a continuing task carries responsibility and evidence across processes; human collaboration asks about unknowns while waiting, resuming and permission remain tied to the original task; a long-term personal assistant revisits preferences, permission, the next step and whether to interrupt as conditions change across many runs. Continuity does not require the model to keep running.</desc>
<rect width="1080" height="662" rx="22" fill="#F7F6F1"/>
<g font-family="Inter, Arial, Noto Sans CJK SC, sans-serif">
<text x="44" y="39" fill="#246D62" font-size="15" font-weight="650" letter-spacing="1.2">LOOKING BACK · A WIDER ENGINEERING HORIZON</text><text x="44" y="88.0" fill="#233D3B" font-size="33" font-weight="650" >From one request to a long-term personal assistant</text><text x="44" y="124" fill="#526861" font-size="21" font-weight="400" >Each step expands what we must take responsibility for, not just the feature set.</text><path d="M69 200 V528" fill="none" stroke="#B6C8BD" stroke-width="2"/><rect x="115" y="153" width="921" height="94" rx="15" fill="#FEFEFA" stroke="#D7E0D8"/><circle cx="69" cy="200" r="17" fill="#F7F6F1" stroke="#246D62" stroke-width="1.6"/><text x="69" y="207" fill="#246D62" font-size="20" font-weight="650" text-anchor="middle">1</text><path d="M64 252 L69 257 L74 252" fill="none" stroke="#8FA99A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="143" y="207" fill="#233D3B" font-size="25" font-weight="650" >One request</text><path d="M405 174 V226" stroke="#CBD9CE" stroke-width="1"/><text x="431" y="178" fill="#526861" font-size="17" font-weight="500" >Known input, a result to deliver</text><text x="431" y="206" fill="#233D3B" font-size="22.2" font-weight="500" >Process the input in front of you.</text>
<text x="431" y="234" fill="#233D3B" font-size="22.2" font-weight="500" >Deliver the current result.</text><rect x="115" y="257" width="921" height="94" rx="15" fill="#F0F5EF" stroke="#D7E0D8"/><circle cx="69" cy="304" r="20" fill="#F7F6F1" stroke="#246D62" stroke-width="1.6"/><text x="69" y="311" fill="#246D62" font-size="20" font-weight="650" text-anchor="middle">2</text><path d="M64 356 L69 361 L74 356" fill="none" stroke="#8FA99A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="143" y="311" fill="#233D3B" font-size="25" font-weight="650" >A continuing task</text><path d="M405 278 V330" stroke="#CBD9CE" stroke-width="1"/><text x="431" y="282" fill="#526861" font-size="17" font-weight="500" >But execution can stop</text><text x="431" y="310" fill="#233D3B" font-size="22.2" font-weight="500" >Responsibility and evidence must survive</text>
<text x="431" y="338" fill="#233D3B" font-size="22.2" font-weight="500" >across processes, even when execution stops.</text><rect x="115" y="361" width="921" height="94" rx="15" fill="#E3EEE6" stroke="#D7E0D8"/><circle cx="69" cy="408" r="23" fill="#F7F6F1" stroke="#246D62" stroke-width="1.6"/><text x="69" y="415" fill="#246D62" font-size="20" font-weight="650" text-anchor="middle">3</text><path d="M64 460 L69 465 L74 460" fill="none" stroke="#8FA99A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="143" y="415" fill="#233D3B" font-size="25" font-weight="650" >Human collaboration</text><path d="M405 382 V434" stroke="#CBD9CE" stroke-width="1"/><text x="431" y="386" fill="#526861" font-size="17" font-weight="500" >But some answers need user input</text><text x="431" y="414" fill="#233D3B" font-size="22.2" font-weight="500" >Ask when needed. Waiting, resuming and</text>
<text x="431" y="442" fill="#233D3B" font-size="22.2" font-weight="500" >permission still belong to the original task.</text><rect x="115" y="465" width="921" height="94" rx="15" fill="#214F48" stroke="#214F48"/><circle cx="69" cy="512" r="26" fill="#F7F6F1" stroke="#B88A4E" stroke-width="2"/><text x="69" y="519" fill="#936833" font-size="20" font-weight="650" text-anchor="middle">4</text><text x="143" y="501" fill="#FBFCF6" font-size="25" font-weight="650" >A long-term</text>
<text x="143" y="530" fill="#FBFCF6" font-size="25" font-weight="650" >personal assistant</text><path d="M405 486 V538" stroke="#54736A" stroke-width="1"/><text x="431" y="490" fill="#DBE9DF" font-size="17" font-weight="500" >But the goal spans many runs</text><text x="431" y="518" fill="#FBFCF6" font-size="21.3" font-weight="500" >As conditions change, revisit preferences and permission.</text>
<text x="431" y="546" fill="#FBFCF6" font-size="21.3" font-weight="500" >Reassess the next step and whether to interrupt.</text><path d="M44 596 H1036" stroke="#D7E0D8"/><circle cx="58" cy="627" r="5" fill="#B88A4E"/><text x="77" y="635.0" fill="#233D3B" font-size="23" font-weight="600" >Carry goals and responsibility forward. The model need not keep running.</text></g>
</svg>
