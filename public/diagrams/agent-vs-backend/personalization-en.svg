<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" role="img" aria-labelledby="title desc">
<title id="title">Preferences and permission</title><desc id="desc">Memory informs later inputs; grants constrain actions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#11766F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<rect x="1" y="1" width="898" height="668" rx="22" fill="#FAF9F6" stroke="#C6D3DA" stroke-width="1.3"/>
<rect x="36" y="22" width="31" height="28" rx="7" fill="#173348"/>
<text x="51.5" y="42" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">04</text>
<text x="79" y="42" font-size="15" fill="#526779" font-weight="600" text-anchor="start">PERSONALIZATION &amp; UPDATES</text>
<text x="36" y="87" font-size="32" fill="#173348" font-weight="700" text-anchor="start">Preferences and permission</text>
<text x="36" y="129" font-size="19" fill="#526779" font-weight="400" text-anchor="start">Memory informs later inputs; grants constrain actions.</text>
<rect x="36" y="166" width="232" height="154" rx="13" fill="#E8F4F0" stroke="#C6D3DA" stroke-width="1.3"/>
<text x="54" y="198" font-size="23" fill="#173348" font-weight="650" text-anchor="start">Preferences &amp;</text>
<text x="54" y="225" font-size="23" fill="#173348" font-weight="650" text-anchor="start">observations</text>
<text x="54" y="259" font-size="20" fill="#526779" font-weight="400" text-anchor="start">Keep provenance</text>
<text x="54" y="287" font-size="20" fill="#526779" font-weight="400" text-anchor="start">and confirmation</text>
<path d="M 269 242 L 326 242" fill="none" stroke="#11766F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="334" y="166" width="232" height="154" rx="13" fill="#E8F4F0" stroke="#C6D3DA" stroke-width="1.3"/>
<text x="352" y="198" font-size="23" fill="#173348" font-weight="650" text-anchor="start">Versioned</text>
<text x="352" y="225" font-size="23" fill="#173348" font-weight="650" text-anchor="start">memory</text>
<text x="352" y="259" font-size="20" fill="#526779" font-weight="400" text-anchor="start">Scope + current</text>
<text x="352" y="287" font-size="20" fill="#526779" font-weight="400" text-anchor="start">validity</text>
<path d="M 567 242 L 624 242" fill="none" stroke="#11766F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="632" y="166" width="232" height="154" rx="13" fill="#E8F4F0" stroke="#C6D3DA" stroke-width="1.3"/>
<text x="650" y="198" font-size="23" fill="#173348" font-weight="650" text-anchor="start">Working context</text>
<text x="650" y="232" font-size="20" fill="#526779" font-weight="400" text-anchor="start">Select relevant facts</text>
<text x="650" y="260" font-size="20" fill="#526779" font-weight="400" text-anchor="start">for this task</text>
<text x="450" y="356" font-size="20" fill="#11766F" font-weight="600" text-anchor="middle">Memory informs advice; it does not become a new grant.</text>
<rect x="36" y="385" width="828" height="101" rx="16" fill="#EDF0FB" stroke="#4655A1" stroke-width="1.3"/>
<text x="60" y="419" font-size="23" fill="#4655A1" font-weight="700" text-anchor="start">A separate permission path</text>
<text x="60" y="458" font-size="22" fill="#173348" font-weight="550" text-anchor="start">Explicit grant → execution check → action</text>
<rect x="36" y="517" width="828" height="102" rx="14" fill="#FFF1E5" stroke="#A65A2B" stroke-width="1.3"/>
<text x="56" y="548" font-size="22" fill="#A65A2B" font-weight="650" text-anchor="start">After correction / deletion</text>
<text x="56" y="579" font-size="19" fill="#526779" font-weight="400" text-anchor="start">Exclude old facts from later inputs; invalidate notes that record dependencies on old</text>
<text x="56" y="604" font-size="19" fill="#526779" font-weight="400" text-anchor="start">versions.</text>
<text x="450" y="642" font-size="18" fill="#526779" font-weight="400" text-anchor="middle">Already sent content and historical reports cannot be recalled by this change.</text>
</g>
</svg>
