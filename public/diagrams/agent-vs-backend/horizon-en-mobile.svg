<svg xmlns="http://www.w3.org/2000/svg" width="390" height="811" viewBox="0 0 390 811" role="img" aria-labelledby="horizon-title horizon-desc" lang="en">
<title id="horizon-title">From one request to a long-term personal assistant</title>
<desc id="horizon-desc">Four widening perspectives: one request handles known input and delivers a result; a continuing task carries responsibility and evidence across processes; human collaboration asks about unknowns while waiting, resuming and permission remain tied to the original task; a long-term personal assistant revisits preferences, permission, the next step and whether to interrupt as conditions change across many runs. Continuity does not require the model to keep running.</desc>
<rect width="390" height="811" rx="22" fill="#F7F6F1"/>
<g font-family="Inter, Arial, Noto Sans CJK SC, sans-serif">
<text x="22" y="29" fill="#246D62" font-size="13" font-weight="650" letter-spacing="0.8">A WIDER ENGINEERING HORIZON</text><text x="22" y="65" fill="#233D3B" font-size="25" font-weight="650" >From one request to a</text>
<text x="22" y="99" fill="#233D3B" font-size="25" font-weight="650" >long-term personal assistant</text><text x="22" y="125" fill="#526861" font-size="16.2" font-weight="400" >A wider view starts where the last one stops.</text><rect x="20" y="145" width="350" height="126" rx="15" fill="#FEFEFA" stroke="#D7E0D8"/><circle cx="45" cy="172" r="11.0" fill="none" stroke="#246D62" stroke-width="1.5"/><text x="45" y="177" fill="#246D62" font-size="15" font-weight="650" text-anchor="middle">1</text><text x="73" y="180" fill="#233D3B" font-size="20.6" font-weight="650" >One request</text><text x="37" y="207" fill="#526861" font-size="16.4" font-weight="500" >Known input, a result to deliver</text><text x="37" y="234" fill="#233D3B" font-size="17" font-weight="500" >Process the input in front of you.</text>
<text x="37" y="258" fill="#233D3B" font-size="17" font-weight="500" >Deliver the current result.</text><rect x="20" y="281" width="350" height="126" rx="15" fill="#F0F5EF" stroke="#D7E0D8"/><circle cx="45" cy="308" r="12.8" fill="none" stroke="#246D62" stroke-width="1.5"/><text x="45" y="313" fill="#246D62" font-size="15" font-weight="650" text-anchor="middle">2</text><text x="73" y="316" fill="#233D3B" font-size="20.6" font-weight="650" >A continuing task</text><text x="37" y="343" fill="#526861" font-size="16.4" font-weight="500" >But execution can stop</text><text x="37" y="370" fill="#233D3B" font-size="17" font-weight="500" >Responsibility and evidence</text>
<text x="37" y="394" fill="#233D3B" font-size="17" font-weight="500" >must survive across processes.</text><rect x="20" y="417" width="350" height="126" rx="15" fill="#E3EEE6" stroke="#D7E0D8"/><circle cx="45" cy="444" r="14.6" fill="none" stroke="#246D62" stroke-width="1.5"/><text x="45" y="449" fill="#246D62" font-size="15" font-weight="650" text-anchor="middle">3</text><text x="73" y="452" fill="#233D3B" font-size="20.6" font-weight="650" >Human collaboration</text><text x="37" y="479" fill="#526861" font-size="16.4" font-weight="500" >But some answers need user input</text><text x="37" y="506" fill="#233D3B" font-size="17" font-weight="500" >Ask when needed. Waiting, resuming</text>
<text x="37" y="530" fill="#233D3B" font-size="17" font-weight="500" >and permission stay with the task.</text><rect x="20" y="553" width="350" height="148" rx="15" fill="#214F48" stroke="#214F48"/><circle cx="45" cy="580" r="16.4" fill="none" stroke="#B88A4E" stroke-width="1.5"/><text x="45" y="585" fill="#E6C894" font-size="15" font-weight="650" text-anchor="middle">4</text><text x="73" y="588" fill="#FBFCF6" font-size="20.6" font-weight="650" >A long-term assistant</text><text x="37" y="615" fill="#DBE9DF" font-size="16.4" font-weight="500" >But the goal spans many runs</text><text x="37" y="642" fill="#FBFCF6" font-size="17" font-weight="500" >As things change, revisit preferences</text>
<text x="37" y="666" fill="#FBFCF6" font-size="17" font-weight="500" >and permission. Reassess the next</text>
<text x="37" y="690" fill="#FBFCF6" font-size="17" font-weight="500" >step and whether to interrupt.</text><path d="M22 725 H368" stroke="#D7E0D8"/><text x="22" y="756" fill="#233D3B" font-size="17.4" font-weight="600" >Carry goals and responsibility forward.</text>
<text x="22" y="784" fill="#233D3B" font-size="17.4" font-weight="600" >The model need not keep running.</text></g>
</svg>
