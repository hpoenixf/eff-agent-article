<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 788" width="400" height="788" role="img" aria-labelledby="title desc">
<title id="title">超时之后，结果可能不同</title><desc id="desc">恢复策略取决于动作真正走到了哪里。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#11766F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<rect x="1" y="1" width="398" height="786" rx="22" fill="#FAF9F6" stroke="#C6D3DA" stroke-width="1.3"/>
<rect x="24" y="22" width="31" height="28" rx="7" fill="#173348"/>
<text x="39.5" y="42" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">02</text>
<text x="67" y="42" font-size="15" fill="#526779" font-weight="600" text-anchor="start">派发与结算</text>
<text x="24" y="77" font-size="25" fill="#173348" font-weight="700" text-anchor="start">超时之后，结果可能不同</text>
<text x="24" y="111" font-size="16" fill="#526779" font-weight="400" text-anchor="start">恢复策略取决于动作真正走到了哪里。</text>
<rect x="24" y="148" width="352" height="151" rx="14" fill="#EEF2F4" stroke="#C6D3DA" stroke-width="1.3"/>
<text x="42" y="180" font-size="19" fill="#526779" font-weight="550" text-anchor="start">确定未派发</text>
<text x="42" y="217" font-size="22" fill="#173348" font-weight="700" text-anchor="start">按策略重试</text>
<text x="42" y="249" font-size="18" fill="#526779" font-weight="400" text-anchor="start">仍检查原授权与预算。</text>
<rect x="24" y="319" width="352" height="151" rx="14" fill="#E8F4F0" stroke="#11766F" stroke-width="1.3"/>
<text x="42" y="351" font-size="19" fill="#526779" font-weight="550" text-anchor="start">已派发，有完整回执</text>
<text x="42" y="388" font-size="22" fill="#173348" font-weight="700" text-anchor="start">结算原结果</text>
<text x="42" y="420" font-size="18" fill="#526779" font-weight="400" text-anchor="start">按成功或失败的真实回执处理。</text>
<rect x="24" y="490" width="352" height="151" rx="14" fill="#FFF1E5" stroke="#A65A2B" stroke-width="1.3"/>
<text x="42" y="522" font-size="19" fill="#526779" font-weight="550" text-anchor="start">已派发，回执丢失</text>
<text x="42" y="559" font-size="22" fill="#173348" font-weight="700" text-anchor="start">保留 unknown</text>
<text x="42" y="591" font-size="18" fill="#526779" font-weight="400" text-anchor="start">查询原操作或人工核对；</text>
<text x="42" y="615" font-size="18" fill="#526779" font-weight="400" text-anchor="start">确认后再决定下一步。</text>
<rect x="24" y="680" width="352" height="97" rx="12" fill="#FFFFFF" stroke="#A65A2B" stroke-width="1.3"/>
<text x="40" y="710" font-size="18" fill="#A65A2B" font-weight="550" text-anchor="start">unknown：不自动重发；本地超时不能</text>
<text x="40" y="735" font-size="18" fill="#A65A2B" font-weight="550" text-anchor="start">证明远端容量已释放。</text>
</g>
</svg>
