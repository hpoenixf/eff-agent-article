<svg xmlns="http://www.w3.org/2000/svg" width="390" height="793" viewBox="0 0 390 793" role="img" aria-labelledby="horizon-title horizon-desc" lang="zh">
<title id="horizon-title">从一次请求，到长期个人助手</title>
<desc id="horizon-desc">四层递进的认知总结：一次请求处理已知输入并交付当前结果；持续任务的责任和证据跨越进程；人机协作让未知先询问，等待、恢复与权限仍绑定原任务；长期个人助手的目标跨多次运行，条件变化时重新判断偏好、授权和是否打扰。延续目标与责任，不等于让模型一直运行。</desc>
<rect width="390" height="793" rx="22" fill="#F7F6F1"/>
<g font-family="Inter, Arial, Noto Sans CJK SC, sans-serif">
<text x="22" y="29" fill="#246D62" font-size="13" font-weight="650" letter-spacing="0.8">回看 · 视野如何展开</text><text x="22" y="65" fill="#233D3B" font-size="28" font-weight="650" >从一次请求</text>
<text x="22" y="99" fill="#233D3B" font-size="28" font-weight="650" >到长期个人助手</text><text x="22" y="125" fill="#526861" font-size="17" font-weight="400" >前一步的边界，成为下一步的问题。</text><rect x="20" y="143" width="350" height="126" rx="15" fill="#FEFEFA" stroke="#D7E0D8"/><circle cx="45" cy="170" r="11.0" fill="none" stroke="#246D62" stroke-width="1.5"/><text x="45" y="175" fill="#246D62" font-size="15" font-weight="650" text-anchor="middle">1</text><text x="73" y="178" fill="#233D3B" font-size="22" font-weight="650" >一次请求</text><text x="37" y="205" fill="#526861" font-size="17" font-weight="500" >起点：输入与交付范围已知</text><text x="37" y="232" fill="#233D3B" font-size="17.8" font-weight="500" >处理眼前输入，</text>
<text x="37" y="256" fill="#233D3B" font-size="17.8" font-weight="500" >交付当前结果。</text><rect x="20" y="279" width="350" height="126" rx="15" fill="#F0F5EF" stroke="#D7E0D8"/><circle cx="45" cy="306" r="12.8" fill="none" stroke="#246D62" stroke-width="1.5"/><text x="45" y="311" fill="#246D62" font-size="15" font-weight="650" text-anchor="middle">2</text><text x="73" y="314" fill="#233D3B" font-size="22" font-weight="650" >持续任务</text><text x="37" y="341" fill="#526861" font-size="17" font-weight="500" >但执行可能中断</text><text x="37" y="368" fill="#233D3B" font-size="17.8" font-weight="500" >进程结束不等于任务结束。</text>
<text x="37" y="392" fill="#233D3B" font-size="17.8" font-weight="500" >责任与证据要跨进程延续。</text><rect x="20" y="415" width="350" height="126" rx="15" fill="#E3EEE6" stroke="#D7E0D8"/><circle cx="45" cy="442" r="14.6" fill="none" stroke="#246D62" stroke-width="1.5"/><text x="45" y="447" fill="#246D62" font-size="15" font-weight="650" text-anchor="middle">3</text><text x="73" y="450" fill="#233D3B" font-size="22" font-weight="650" >人机协作</text><text x="37" y="477" fill="#526861" font-size="17" font-weight="500" >但有些未知需要用户澄清</text><text x="37" y="504" fill="#233D3B" font-size="17.8" font-weight="500" >需要时先询问。等待、恢复</text>
<text x="37" y="528" fill="#233D3B" font-size="17.8" font-weight="500" >与权限，仍绑定原任务。</text><rect x="20" y="551" width="350" height="132" rx="15" fill="#214F48" stroke="#214F48"/><circle cx="45" cy="578" r="16.4" fill="none" stroke="#B88A4E" stroke-width="1.5"/><text x="45" y="583" fill="#E6C894" font-size="15" font-weight="650" text-anchor="middle">4</text><text x="73" y="586" fill="#FBFCF6" font-size="22" font-weight="650" >长期个人助手</text><text x="37" y="613" fill="#DBE9DF" font-size="17" font-weight="500" >但目标会跨越多次运行</text><text x="37" y="640" fill="#FBFCF6" font-size="17.8" font-weight="500" >条件变化时，重看偏好与授权，</text>
<text x="37" y="664" fill="#FBFCF6" font-size="17.8" font-weight="500" >再判断下一步与是否值得打扰。</text><path d="M22 707 H368" stroke="#D7E0D8"/><text x="22" y="738" fill="#233D3B" font-size="21" font-weight="600" >延续的是目标与责任，</text>
<text x="22" y="766" fill="#233D3B" font-size="21" font-weight="600" >不是让模型一直运行。</text></g>
</svg>
