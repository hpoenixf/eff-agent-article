<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 824" width="400" height="824" role="img" aria-labelledby="title desc">
<title id="title">懂你的偏好，也守住边界</title><desc id="desc">记忆进入后续输入，动作仍由明确授权约束。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#11766F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<rect x="1" y="1" width="398" height="822" rx="22" fill="#FAF9F6" stroke="#C6D3DA" stroke-width="1.3"/>
<rect x="24" y="22" width="31" height="28" rx="7" fill="#173348"/>
<text x="39.5" y="42" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">04</text>
<text x="67" y="42" font-size="15" fill="#526779" font-weight="600" text-anchor="start">个性化与事实更新</text>
<text x="24" y="77" font-size="25" fill="#173348" font-weight="700" text-anchor="start">懂你的偏好，也守住边界</text>
<text x="24" y="111" font-size="16" fill="#526779" font-weight="400" text-anchor="start">记忆进入后续输入，动作仍由明确授权约束。</text>
<rect x="24" y="153" width="352" height="96" rx="13" fill="#E8F4F0" stroke="#C6D3DA" stroke-width="1.3"/>
<text x="42" y="185" font-size="21" fill="#173348" font-weight="650" text-anchor="start">用户偏好 / 有来源观察</text>
<text x="42" y="219" font-size="18" fill="#526779" font-weight="400" text-anchor="start">保留出处，不把推测当成用户确认</text>
<path d="M 200 250 L 200 266" fill="none" stroke="#11766F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="24" y="271" width="352" height="96" rx="13" fill="#E8F4F0" stroke="#C6D3DA" stroke-width="1.3"/>
<text x="42" y="303" font-size="21" fill="#173348" font-weight="650" text-anchor="start">有作用域与版本的记忆</text>
<text x="42" y="337" font-size="18" fill="#526779" font-weight="400" text-anchor="start">按当前任务选择相关且有效的事实</text>
<path d="M 200 368 L 200 384" fill="none" stroke="#11766F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="24" y="389" width="352" height="96" rx="13" fill="#E8F4F0" stroke="#C6D3DA" stroke-width="1.3"/>
<text x="42" y="421" font-size="21" fill="#173348" font-weight="650" text-anchor="start">当前工作上下文</text>
<text x="42" y="455" font-size="18" fill="#526779" font-weight="400" text-anchor="start">影响建议与表达，不自行授予权限</text>
<rect x="24" y="512" width="352" height="84" rx="13" fill="#EDF0FB" stroke="#4655A1" stroke-width="1.3"/>
<text x="42" y="544" font-size="21" fill="#4655A1" font-weight="650" text-anchor="start">独立的授权通道</text>
<text x="42" y="575" font-size="18" fill="#173348" font-weight="550" text-anchor="start">明确授权 → 执行门 → 动作</text>
<rect x="24" y="618" width="352" height="128" rx="13" fill="#FFF1E5" stroke="#A65A2B" stroke-width="1.3"/>
<text x="42" y="651" font-size="21" fill="#A65A2B" font-weight="650" text-anchor="start">更正 / 删除之后</text>
<text x="42" y="681" font-size="18" fill="#526779" font-weight="400" text-anchor="start">后续输入排除旧事实；已记录依赖旧</text>
<text x="42" y="706" font-size="18" fill="#526779" font-weight="400" text-anchor="start">版本的摘要一并失效。</text>
<text x="24" y="773" font-size="17" fill="#526779" font-weight="400" text-anchor="start">已发出的内容与历史报告不能因此撤回。</text>
</g>
</svg>
