<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-labelledby="title desc">
<title id="title">谁来决定下一步？</title><desc id="desc">策略来自模型，执行边界由代码守住。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#11766F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<rect x="1" y="1" width="898" height="658" rx="22" fill="#FAF9F6" stroke="#C6D3DA" stroke-width="1.3"/>
<rect x="36" y="22" width="31" height="28" rx="7" fill="#173348"/>
<text x="51.5" y="42" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">01</text>
<text x="79" y="42" font-size="15" fill="#526779" font-weight="600" text-anchor="start">决策与执行</text>
<text x="36" y="87" font-size="32" fill="#173348" font-weight="700" text-anchor="start">谁来决定下一步？</text>
<text x="36" y="129" font-size="19" fill="#526779" font-weight="400" text-anchor="start">策略来自模型，执行边界由代码守住。</text>
<rect x="36" y="156" width="828" height="106" rx="16" fill="#FFFFFF" stroke="#C6D3DA" stroke-width="1.3"/>
<text x="58" y="191" font-size="23" fill="#173348" font-weight="650" text-anchor="start">规则驱动路径</text>
<text x="58" y="223.0" font-size="19" fill="#526779" font-weight="400" text-anchor="start">程序约定分支、异步与恢复。</text>
<rect x="430" y="184" width="184" height="48" rx="9" fill="#EEF2F4"/>
<text x="522" y="215" font-size="19" fill="#173348" font-weight="550" text-anchor="middle">业务规则</text>
<rect x="654" y="184" width="184" height="48" rx="9" fill="#EEF2F4"/>
<text x="746" y="215" font-size="19" fill="#173348" font-weight="550" text-anchor="middle">确定执行路径</text>
<path d="M 615 208 L 648 208" fill="none" stroke="#526779" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="36" y="307" font-size="20" fill="#11766F" font-weight="650" text-anchor="start">观察驱动的 Agent 回路</text>
<rect x="36" y="329" width="232" height="104" rx="13" fill="#E8F4F0" stroke="#C6D3DA" stroke-width="1.3"/>
<text x="54" y="361" font-size="23" fill="#173348" font-weight="650" text-anchor="start">模型提出下一步</text>
<text x="54" y="395" font-size="20" fill="#526779" font-weight="400" text-anchor="start">任务 + 当前观察</text>
<rect x="334" y="329" width="232" height="104" rx="13" fill="#EDF0FB" stroke="#C6D3DA" stroke-width="1.3"/>
<text x="352" y="361" font-size="23" fill="#173348" font-weight="650" text-anchor="start">宿主检查动作</text>
<text x="352" y="395" font-size="20" fill="#526779" font-weight="400" text-anchor="start">权限与预算</text>
<rect x="632" y="329" width="232" height="104" rx="13" fill="#E8F4F0" stroke="#C6D3DA" stroke-width="1.3"/>
<text x="650" y="361" font-size="23" fill="#173348" font-weight="650" text-anchor="start">工具执行</text>
<text x="650" y="395" font-size="20" fill="#526779" font-weight="400" text-anchor="start">保存结果与原始回执</text>
<path d="M 269 381 L 327 381" fill="none" stroke="#11766F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 567 381 L 625 381" fill="none" stroke="#11766F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 748 434 L 748 485 L 152 485 L 152 441" fill="none" stroke="#11766F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="80" y="469" width="220" height="31" rx="3" fill="#FAF9F6"/>
<text x="190" y="491" font-size="18" fill="#11766F" font-weight="600" text-anchor="middle">真实结果 → 新观察</text>
<path d="M 450 434 L 450 518" fill="none" stroke="#A65A2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="334" y="521" width="232" height="50" rx="11" fill="#FFF1E5" stroke="#A65A2B" stroke-width="1.3"/>
<text x="450" y="553" font-size="19" fill="#A65A2B" font-weight="600" text-anchor="middle">未通过 → 拒绝 / 停止</text>
<rect x="36" y="594" width="828" height="42" rx="10" fill="#FFFFFF" stroke="#C6D3DA" stroke-width="1.3"/>
<text x="450" y="622" font-size="20" fill="#173348" font-weight="550" text-anchor="middle">形成最终候选时：交付校验 → 用户取得成果</text>
</g>
</svg>
