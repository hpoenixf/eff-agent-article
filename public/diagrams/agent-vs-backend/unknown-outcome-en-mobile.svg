<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 788" width="400" height="788" role="img" aria-labelledby="title desc">
<title id="title">Timeout is an observation</title><desc id="desc">Recovery depends on what actually happened.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#11766F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Noto Sans SC, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<rect x="1" y="1" width="398" height="786" rx="22" fill="#FAF9F6" stroke="#C6D3DA" stroke-width="1.3"/>
<rect x="24" y="22" width="31" height="28" rx="7" fill="#173348"/>
<text x="39.5" y="42" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">02</text>
<text x="67" y="42" font-size="15" fill="#526779" font-weight="600" text-anchor="start">DISPATCH &amp; SETTLEMENT</text>
<text x="24" y="77" font-size="25" fill="#173348" font-weight="700" text-anchor="start">Timeout is an observation</text>
<text x="24" y="111" font-size="16" fill="#526779" font-weight="400" text-anchor="start">Recovery depends on what actually happened.</text>
<rect x="24" y="148" width="352" height="151" rx="14" fill="#EEF2F4" stroke="#C6D3DA" stroke-width="1.3"/>
<text x="42" y="180" font-size="19" fill="#526779" font-weight="550" text-anchor="start">Confirmed: not dispatched</text>
<text x="42" y="217" font-size="22" fill="#173348" font-weight="700" text-anchor="start">Retry under policy</text>
<text x="42" y="249" font-size="18" fill="#526779" font-weight="400" text-anchor="start">Recheck the original grant and budget.</text>
<rect x="24" y="319" width="352" height="151" rx="14" fill="#E8F4F0" stroke="#11766F" stroke-width="1.3"/>
<text x="42" y="351" font-size="19" fill="#526779" font-weight="550" text-anchor="start">Dispatched, complete receipt</text>
<text x="42" y="388" font-size="22" fill="#173348" font-weight="700" text-anchor="start">Settle the original result</text>
<text x="42" y="420" font-size="18" fill="#526779" font-weight="400" text-anchor="start">Use the actual success or failure</text>
<text x="42" y="444" font-size="18" fill="#526779" font-weight="400" text-anchor="start">receipt.</text>
<rect x="24" y="490" width="352" height="151" rx="14" fill="#FFF1E5" stroke="#A65A2B" stroke-width="1.3"/>
<text x="42" y="522" font-size="19" fill="#526779" font-weight="550" text-anchor="start">Dispatched, receipt missing</text>
<text x="42" y="559" font-size="22" fill="#173348" font-weight="700" text-anchor="start">Keep the outcome unknown</text>
<text x="42" y="591" font-size="18" fill="#526779" font-weight="400" text-anchor="start">Query / verify the original operation.</text>
<text x="42" y="615" font-size="18" fill="#526779" font-weight="400" text-anchor="start">Decide after confirmation.</text>
<rect x="24" y="680" width="352" height="97" rx="12" fill="#FFFFFF" stroke="#A65A2B" stroke-width="1.3"/>
<text x="40" y="710" font-size="18" fill="#A65A2B" font-weight="550" text-anchor="start">Unknown: no automatic resend.</text>
<text x="40" y="735" font-size="18" fill="#A65A2B" font-weight="550" text-anchor="start">A local timeout does not prove</text>
<text x="40" y="760" font-size="18" fill="#A65A2B" font-weight="550" text-anchor="start">remote capacity was released.</text>
</g>
</svg>
