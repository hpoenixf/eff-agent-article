<svg xmlns="http://www.w3.org/2000/svg" width="640" height="940" viewBox="0 0 640 940" role="img" aria-label="Prompt 与 Skill"><title>Prompt 与 Skill</title><desc>区别来自 Host，而非 Markdown</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1932"/><stop offset="1" stop-color="#10423e"/></linearGradient></defs><rect width="640" height="940" fill="url(#bg)"/><text x="37" y="64" fill="#86e3c7" font-size="18" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">ENGINEERING / SKILL</text><text x="37" y="116" fill="#ffffff" font-size="36" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">Prompt 与 Skill</text><text x="37" y="157" fill="#b8dbe1" font-size="25" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">区别来自 Host，而非 Markdown</text><rect x="37" y="210" width="566" height="225" rx="24" fill="#29354c" stroke="#3c7181" stroke-width="1.5"/><text x="62" y="262" fill="#ffd4a2" font-size="31" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">一次性 Prompt</text><text x="62" y="315" fill="#f2f9fb" font-size="25" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">直接进入模型上下文</text><text x="62" y="352" fill="#bfd4e0" font-size="24" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">能指导已有工具调用</text><rect x="37" y="464" width="566" height="312" rx="24" fill="#174850" stroke="#3c7181" stroke-width="1.5"/><text x="62" y="516" fill="#91f6d8" font-size="31" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">Host 管理的 Skill</text><text x="62" y="563" fill="#f2f9fb" font-size="25" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">01  短目录 → 按需读取</text><text x="62" y="611" fill="#f2f9fb" font-size="25" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">02  可选脚本、参考资料</text><text x="62" y="659" fill="#f2f9fb" font-size="25" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">03  原授权 + 实际回执</text><text x="62" y="724" fill="#b7dcd8" font-size="23" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">不是自动运行，也不会越权</text><rect x="37" y="805" width="566" height="81" rx="24" fill="#21495a" stroke="#3c7181" stroke-width="1.5"/><text x="60" y="857" fill="#a7f6d8" font-size="24" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">核心：Skill 还是文字，Host 才提供能力</text></svg>