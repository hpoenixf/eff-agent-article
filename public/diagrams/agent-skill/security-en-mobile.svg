<svg xmlns="http://www.w3.org/2000/svg" width="640" height="940" viewBox="0 0 640 940" role="img" aria-label="Script permissions"><title>Script permissions</title><desc>Path validation is not a sandbox</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1932"/><stop offset="1" stop-color="#10423e"/></linearGradient></defs><rect width="640" height="940" fill="url(#bg)"/><text x="37" y="64" fill="#86e3c7" font-size="18" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">ENGINEERING / SKILL</text><text x="37" y="116" fill="#ffffff" font-size="36" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">Script permissions</text><text x="37" y="157" fill="#b8dbe1" font-size="25" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">Path validation is not a sandbox</text><rect x="37" y="202" width="566" height="289" rx="24" fill="#3c3344" stroke="#3c7181" stroke-width="1.5"/><text x="63" y="255" fill="#ffdcbe" font-size="29" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">Reviewed package runner</text><text x="63" y="304" fill="#f2f9fb" font-size="24" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">Check grants, package identity</text><text x="63" y="350" fill="#f2f9fb" font-size="24" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">Restrict to in-package .py</text><text x="63" y="396" fill="#f2f9fb" font-size="24" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">Timeout, cancel, output limits</text><text x="63" y="454" fill="#ffbda0" font-size="27" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">NOT an OS sandbox</text><rect x="37" y="521" width="566" height="282" rx="24" fill="#174850" stroke="#3c7181" stroke-width="1.5"/><text x="63" y="575" fill="#abf4dc" font-size="28" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">Docker Analysis Sandbox</text><text x="63" y="628" fill="#f2f9fb" font-size="24" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">A separate execution route</text><text x="63" y="677" fill="#f2f9fb" font-size="24" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">Its own isolation and limits</text><text x="63" y="735" fill="#d1f9e9" font-size="24" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">Not protection for every Skill</text><text x="43" y="874" fill="#a1f2da" font-size="23" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">Review grants, code, process privileges</text></svg>