<svg xmlns="http://www.w3.org/2000/svg" width="640" height="940" viewBox="0 0 640 940" role="img" aria-label="脚本权限边界"><title>脚本权限边界</title><desc>路径验证，不等于沙箱</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1932"/><stop offset="1" stop-color="#10423e"/></linearGradient></defs><rect width="640" height="940" fill="url(#bg)"/><text x="37" y="64" fill="#86e3c7" font-size="18" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">ENGINEERING / SKILL</text><text x="37" y="116" fill="#ffffff" font-size="36" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">脚本权限边界</text><text x="37" y="157" fill="#b8dbe1" font-size="25" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">路径验证，不等于沙箱</text><rect x="37" y="202" width="566" height="289" rx="24" fill="#3c3344" stroke="#3c7181" stroke-width="1.5"/><text x="63" y="255" fill="#ffdcbe" font-size="29" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">可信包脚本执行器</text><text x="63" y="304" fill="#f2f9fb" font-size="24" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">核验原 Run 权限、包身份</text><text x="63" y="350" fill="#f2f9fb" font-size="24" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">只选受审包内 .py 路径</text><text x="63" y="396" fill="#f2f9fb" font-size="24" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">超时、取消与输出大小</text><text x="63" y="454" fill="#ffbda0" font-size="27" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">不提供独立 OS 沙箱</text><rect x="37" y="521" width="566" height="282" rx="24" fill="#174850" stroke="#3c7181" stroke-width="1.5"/><text x="63" y="575" fill="#abf4dc" font-size="28" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">Docker Analysis Sandbox</text><text x="63" y="628" fill="#f2f9fb" font-size="24" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">另一个独立的执行路径</text><text x="63" y="677" fill="#f2f9fb" font-size="24" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">有自己的隔离与资源约束</text><text x="63" y="735" fill="#d1f9e9" font-size="24" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">不能替所有 Skill 脚本背书</text><text x="43" y="874" fill="#a1f2da" font-size="23" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">安全审查：谁批准？运行什么？进程能访问什么？</text></svg>