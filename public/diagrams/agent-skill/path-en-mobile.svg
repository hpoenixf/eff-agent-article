<svg xmlns="http://www.w3.org/2000/svg" width="640" height="940" viewBox="0 0 640 940" role="img" aria-label="How a Skill is used"><title>How a Skill is used</title><desc>Discovery, reading, grants, execution</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1932"/><stop offset="1" stop-color="#10423e"/></linearGradient></defs><rect width="640" height="940" fill="url(#bg)"/><text x="37" y="64" fill="#86e3c7" font-size="18" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">ENGINEERING / SKILL</text><text x="37" y="116" fill="#ffffff" font-size="36" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">How a Skill is used</text><text x="37" y="157" fill="#b8dbe1" font-size="25" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">Discovery, reading, grants, execution</text><rect x="37" y="185" width="566" height="128" rx="24" fill="#20364e" stroke="#3c7181" stroke-width="1.5"/><text x="62" y="235" fill="#f2f9fb" font-size="27" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">01  User request</text><text x="62" y="277" fill="#c6dfe5" font-size="24" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">Explicit or natural language</text><path d="M320 315v35" fill="none" stroke="#65cfb6" stroke-width="4"/><path d="M311 335l9 13 9-13" fill="none" stroke="#65cfb6" stroke-width="3"/><rect x="37" y="354" width="566" height="128" rx="24" fill="#17474c" stroke="#3c7181" stroke-width="1.5"/><text x="62" y="404" fill="#f2f9fb" font-size="27" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">02  Short Skill catalog</text><text x="62" y="446" fill="#c6dfe5" font-size="24" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">Name, ID, description, version</text><path d="M320 484v35" fill="none" stroke="#65cfb6" stroke-width="4"/><path d="M311 504l9 13 9-13" fill="none" stroke="#65cfb6" stroke-width="3"/><rect x="37" y="523" width="566" height="128" rx="24" fill="#20364e" stroke="#3c7181" stroke-width="1.5"/><text x="62" y="573" fill="#f2f9fb" font-size="27" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">03  Read instructions</text><text x="62" y="615" fill="#c6dfe5" font-size="24" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">Read success is not execution</text><path d="M320 653v35" fill="none" stroke="#65cfb6" stroke-width="4"/><path d="M311 673l9 13 9-13" fill="none" stroke="#65cfb6" stroke-width="3"/><rect x="37" y="692" width="566" height="128" rx="24" fill="#17474c" stroke="#3c7181" stroke-width="1.5"/><text x="62" y="742" fill="#9af4d2" font-size="27" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">04  Host grants &amp; tool call</text><text x="62" y="784" fill="#c6dfe5" font-size="24" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">Receipt or explicit gap</text><text x="43" y="902" fill="#9ff2d6" font-size="24" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">Catalog ≠ read ≠ grant ≠ run</text></svg>