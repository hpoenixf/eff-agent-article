<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="从提问到执行：Skill 不是自动运行"><title>从提问到执行：Skill 不是自动运行</title><desc>每一步各自成立，目录出现不等于已读取，读取不等于获得执行权限。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1830"/><stop offset="1" stop-color="#0f3940"/></linearGradient><linearGradient id="accent"><stop stop-color="#5ee0c2"/><stop offset="1" stop-color="#7da4ff"/></linearGradient><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#79dec6"/></marker></defs><rect width="1200" height="650" fill="url(#bg)"/><circle cx="1080" cy="40" r="180" fill="#53d0aa" opacity=".09" filter="url(#glow)"/><circle cx="35" cy="590" r="240" fill="#7da4ff" opacity=".08" filter="url(#glow)"/><text x="55" y="58" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#8bddc7">ENGINEERING / SKILL</text><text x="55" y="111" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff">从提问到执行：Skill 不是自动运行</text><text x="55" y="150" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#bfd4dd">每一步各自成立，目录出现不等于已读取，读取不等于获得执行权限。</text><rect x="60" y="220" width="250" height="130" rx="20" fill="#19334e" stroke="#386079" stroke-width="1.4"/><text x="84" y="271" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">用户提问</text><text x="84" y="311" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#bacee2">显式指定 / 自然语言</text><path d="M320 285L375 285" stroke="#79dec6" stroke-width="4" fill="none" marker-end="url(#arr)"/><rect x="388" y="220" width="250" height="130" rx="20" fill="#1b3952" stroke="#386079" stroke-width="1.4"/><text x="413" y="271" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">Skill 目录</text><text x="413" y="311" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#bacee2">ID / 描述 / 版本</text><path d="M648 285L703 285" stroke="#79dec6" stroke-width="4" fill="none" marker-end="url(#arr)"/><rect x="716" y="220" width="404" height="130" rx="20" fill="#164b52" stroke="#386079" stroke-width="1.4"/><text x="738" y="271" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">按需读取指引</text><text x="738" y="311" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#bacee2">仍不代表执行</text><path d="M929 365L929 415" stroke="#79dec6" stroke-width="4" fill="none" marker-end="url(#arr)"/><rect x="645" y="422" width="475" height="117" rx="20" fill="#163f3f" stroke="#386079" stroke-width="1.4"/><text x="671" y="467" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#a4f2d8">Host 核验权限与工具调用</text><text x="671" y="506" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#d6e7ea">可用 → 执行并检查回执 ｜ 不可用 → 保留缺口</text><rect x="65" y="422" width="500" height="117" rx="20" fill="#172d46" stroke="#386079" stroke-width="1.4"/><text x="91" y="467" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">模型决定如何研究、如何综合</text><text x="91" y="506" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#bfd4db">Skill 不接管 Run 或交付生命周期</text><path d="M633 484L575 484" stroke="#79dec6" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="70" y="595" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#b4d3db">示意图：这里只画职责与关键门，不代表每次请求必须调用 Skill。</text></svg>