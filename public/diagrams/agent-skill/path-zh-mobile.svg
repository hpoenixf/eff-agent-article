<svg xmlns="http://www.w3.org/2000/svg" width="640" height="940" viewBox="0 0 640 940" role="img" aria-label="Skill 怎样被用起来？"><title>Skill 怎样被用起来？</title><desc>发现、加载、权限、执行必须区分</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1932"/><stop offset="1" stop-color="#10423e"/></linearGradient></defs><rect width="640" height="940" fill="url(#bg)"/><text x="37" y="64" fill="#86e3c7" font-size="18" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">ENGINEERING / SKILL</text><text x="37" y="116" fill="#ffffff" font-size="36" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">Skill 怎样被用起来？</text><text x="37" y="157" fill="#b8dbe1" font-size="25" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">发现、加载、权限、执行必须区分</text><rect x="37" y="185" width="566" height="128" rx="24" fill="#20364e" stroke="#3c7181" stroke-width="1.5"/><text x="62" y="235" fill="#f2f9fb" font-size="27" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">01  用户提出问题</text><text x="62" y="277" fill="#c6dfe5" font-size="24" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">显式指定或自然语言</text><path d="M320 315v35" fill="none" stroke="#65cfb6" stroke-width="4"/><path d="M311 335l9 13 9-13" fill="none" stroke="#65cfb6" stroke-width="3"/><rect x="37" y="354" width="566" height="128" rx="24" fill="#17474c" stroke="#3c7181" stroke-width="1.5"/><text x="62" y="404" fill="#f2f9fb" font-size="27" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">02  Host 提供短目录</text><text x="62" y="446" fill="#c6dfe5" font-size="24" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">名称、ID、描述、版本</text><path d="M320 484v35" fill="none" stroke="#65cfb6" stroke-width="4"/><path d="M311 504l9 13 9-13" fill="none" stroke="#65cfb6" stroke-width="3"/><rect x="37" y="523" width="566" height="128" rx="24" fill="#20364e" stroke="#3c7181" stroke-width="1.5"/><text x="62" y="573" fill="#f2f9fb" font-size="27" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">03  读取 Skill 指引</text><text x="62" y="615" fill="#c6dfe5" font-size="24" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">读取成功不代表已经执行</text><path d="M320 653v35" fill="none" stroke="#65cfb6" stroke-width="4"/><path d="M311 673l9 13 9-13" fill="none" stroke="#65cfb6" stroke-width="3"/><rect x="37" y="692" width="566" height="128" rx="24" fill="#17474c" stroke="#3c7181" stroke-width="1.5"/><text x="62" y="742" fill="#9af4d2" font-size="27" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">04  Host 核验工具权限</text><text x="62" y="784" fill="#c6dfe5" font-size="24" font-weight="400" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">能执行则返回回执；否则说明缺口</text><text x="43" y="902" fill="#9ff2d6" font-size="24" font-weight="700" font-family="Noto Sans CJK SC,Noto Sans,Arial,sans-serif">目录 ≠ 读取 ≠ 授权 ≠ 执行</text></svg>