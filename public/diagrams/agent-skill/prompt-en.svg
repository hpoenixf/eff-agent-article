<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="Prompt vs Skill: What actually changes?"><title>Prompt vs Skill: What actually changes?</title><desc>Instructions remain text; discovery and execution depend on the Host.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1830"/><stop offset="1" stop-color="#0f3940"/></linearGradient><linearGradient id="accent"><stop stop-color="#5ee0c2"/><stop offset="1" stop-color="#7da4ff"/></linearGradient><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#79dec6"/></marker></defs><rect width="1200" height="650" fill="url(#bg)"/><circle cx="1080" cy="40" r="180" fill="#53d0aa" opacity=".09" filter="url(#glow)"/><circle cx="35" cy="590" r="240" fill="#7da4ff" opacity=".08" filter="url(#glow)"/><text x="55" y="58" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#8bddc7">ENGINEERING / SKILL</text><text x="55" y="111" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff">Prompt vs Skill: What actually changes?</text><text x="55" y="150" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#bfd4dd">Instructions remain text; discovery and execution depend on the Host.</text><rect x="55" y="188" width="470" height="352" rx="20" fill="#162741" stroke="#386079" stroke-width="1.4"/><rect x="675" y="188" width="470" height="352" rx="20" fill="#162f43" stroke="#386079" stroke-width="1.4"/><text x="82" y="233" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffd18d">One-off Prompt</text><text x="82" y="286" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#edf7fa">Put all guidance in model context</text><rect x="84" y="320" width="410" height="96" rx="12" fill="#26344c" stroke="#386079" stroke-width="1.4"/><text x="105" y="355" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#edf7fa">Text → model → tools (if available)</text><text x="82" y="468" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#aec2d3">Can guide behavior; no skill lifecycle</text><path d="M550 363H648" stroke="#78dec3" stroke-width="5" stroke-dasharray="10 10" marker-end="url(#arr)"/><text x="705" y="233" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#7deacb">Host-managed Skill</text><rect x="705" y="262" width="413" height="66" rx="12" fill="#174c55" stroke="#386079" stroke-width="1.4"/><text x="726" y="305" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#edf7fa">Discover → read SKILL.md on demand</text><path d="M920 333L920 361" stroke="#79dec6" stroke-width="4" fill="none" marker-end="url(#arr)"/><rect x="705" y="371" width="413" height="66" rx="12" fill="#21374d" stroke="#386079" stroke-width="1.4"/><text x="726" y="412" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#edf7fa">Optional script → controlled tool → result</text><text x="705" y="480" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#b8d3df">Identity, scope, execution trace</text><rect x="220" y="559" width="760" height="58" rx="15" fill="#123f4a" stroke="#368c82" stroke-width="1.4"/><text x="253" y="597" font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#9ff4d4">Key difference: Host capabilities, not Markdown syntax</text></svg>