<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1104" viewBox="0 0 360 1104" role="img" aria-labelledby="title desc">
<title id="title">How a local problem stops the whole task</title>
<desc id="desc">Teaching diagram: a problem with optional research notes can block independent authorized work when a local check takes global veto authority. With scoped handling, the termination owner uses the facts to select continuation, bounded finalization, or settlement. Existing budgets, authorization, cancellation, hard deadlines, and unknown effects still constrain actions.</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#11766F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#99551D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#526779" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<rect x="1" y="1" width="358" height="1102" rx="22" fill="#FAF9F6" stroke="#CFD9DD" stroke-width="1.25"/>
<rect x="20" y="19" width="28" height="24" rx="6" fill="#173348"/>
<text x="34" y="36" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">01</text>
<text x="59" y="36" font-size="15" font-weight="600" fill="#526779" text-anchor="start">How failures spread</text>
<text x="20" y="80" font-size="24" font-weight="700" fill="#173348" text-anchor="start">How a local problem</text>
<text x="20" y="112" font-size="24" font-weight="700" fill="#173348" text-anchor="start">stops the whole task</text>
<text x="20" y="143" font-size="17" font-weight="400" fill="#526779" text-anchor="start">Teaching example: the same problem,</text>
<text x="20" y="167" font-size="17" font-weight="400" fill="#526779" text-anchor="start">different decision authority.</text>
<rect x="18" y="188" width="324" height="339" rx="15" fill="#FFF1DF"/>
<circle cx="36" cy="217" r="4" fill="#99551D"/>
<text x="49" y="224" font-size="20" font-weight="650" fill="#99551D" text-anchor="start">A local problem expands</text>
<rect x="34" y="244" width="292" height="64" rx="10" fill="#FFFFFF"/>
<text x="180" y="270" font-size="18" font-weight="600" fill="#173348" text-anchor="middle">Optional research notes</text>
<text x="180" y="295" font-size="18" font-weight="600" fill="#173348" text-anchor="middle">have a problem</text>
<path d="M 180 317 L 180 337" fill="none" stroke="#99551D" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<rect x="34" y="348" width="292" height="54" rx="10" fill="#FFFFFF"/>
<text x="180" y="382" font-size="17" font-weight="650" fill="#173348" text-anchor="middle">Local check rejects the whole task</text>
<path d="M 180 411 L 180 431" fill="none" stroke="#99551D" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<text x="180" y="465" font-size="17.5" font-weight="600" fill="#99551D" text-anchor="middle">Independent authorized work</text>
<text x="180" y="493" font-size="17.5" font-weight="600" fill="#99551D" text-anchor="middle">is cut off as well</text>
<rect x="18" y="547" width="324" height="358" rx="15" fill="#E9F4EF"/>
<circle cx="36" cy="576" r="4" fill="#11766F"/>
<text x="49" y="583" font-size="20" font-weight="650" fill="#11766F" text-anchor="start">Handle the actual scope</text>
<rect x="34" y="603" width="292" height="64" rx="10" fill="#FFFFFF"/>
<text x="180" y="629" font-size="18" font-weight="600" fill="#173348" text-anchor="middle">Optional research notes</text>
<text x="180" y="654" font-size="18" font-weight="600" fill="#173348" text-anchor="middle">have a problem</text>
<path d="M 180 676 L 180 696" fill="none" stroke="#11766F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="34" y="707" width="292" height="64" rx="10" fill="#FFFFFF"/>
<text x="180" y="733" font-size="17.5" font-weight="650" fill="#173348" text-anchor="middle">Local handling reports facts</text>
<text x="180" y="758" font-size="17.5" font-weight="650" fill="#173348" text-anchor="middle">Termination owner decides</text>
<path d="M 180 780 L 180 800" fill="none" stroke="#11766F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="180" y="838" font-size="17" font-weight="600" fill="#11766F" text-anchor="middle">If allowed: continue or finalize</text>
<text x="180" y="867" font-size="17" font-weight="600" fill="#11766F" text-anchor="middle">Otherwise: end and settle</text>
<rect x="18" y="926" width="324" height="156" rx="14" fill="#173348"/>
<text x="36" y="959" font-size="18" font-weight="650" fill="#FFFFFF" text-anchor="start">Existing budgets and</text>
<text x="36" y="984" font-size="18" font-weight="650" fill="#FFFFFF" text-anchor="start">authorization still apply</text>
<text x="36" y="1016" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start">Cancellation and hard deadlines hold.</text>
<text x="36" y="1040" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start">Unknown effects must not be</text>
<text x="36" y="1064" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start">blindly retried.</text>
</g>
</svg>
