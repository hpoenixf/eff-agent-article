<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="770" viewBox="0 0 1000 770" role="img" aria-labelledby="title desc">
<title id="title">How a local problem stops the whole task</title>
<desc id="desc">Teaching diagram: a problem with optional research notes can block independent authorized work when a local check takes global veto authority. With scoped handling, the termination owner uses the facts to select continuation, bounded finalization, or settlement. Existing budgets, authorization, cancellation, hard deadlines, and unknown effects still constrain actions.</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#11766F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#99551D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#526779" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<rect x="1" y="1" width="998" height="768" rx="22" fill="#FAF9F6" stroke="#CFD9DD" stroke-width="1.25"/>
<rect x="40" y="26" width="34" height="30" rx="6" fill="#173348"/>
<text x="57" y="48" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">01</text>
<text x="88" y="48" font-size="19" font-weight="600" fill="#526779" text-anchor="start">How failures spread</text>
<text x="40" y="102" font-size="33" font-weight="700" fill="#173348" text-anchor="start">How a local problem stops the whole task</text>
<text x="40" y="145" font-size="23" font-weight="400" fill="#526779" text-anchor="start">Teaching example: the same local problem, different decision authority.</text>
<rect x="40" y="183" width="444" height="416" rx="16" fill="#FFF1DF"/>
<circle cx="66" cy="216" r="5" fill="#99551D"/>
<text x="82" y="224" font-size="25" font-weight="650" fill="#99551D" text-anchor="start">A local problem expands</text>
<rect x="60" y="245" width="404" height="78" rx="11" fill="#FFFFFF"/>
<text x="262" y="275" font-size="25" font-weight="600" fill="#173348" text-anchor="middle">Optional research notes</text>
<text x="262" y="307" font-size="25" font-weight="600" fill="#173348" text-anchor="middle">have a problem</text>
<text x="262" y="354" font-size="22" font-weight="400" fill="#99551D" text-anchor="middle">A local check gains a global veto</text>
<path d="M 262 364 L 262 382" fill="none" stroke="#99551D" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<rect x="60" y="393" width="404" height="75" rx="11" fill="#FFFFFF"/>
<text x="262" y="439" font-size="25" font-weight="650" fill="#173348" text-anchor="middle">Reject the whole task</text>
<path d="M 262 477 L 262 498" fill="none" stroke="#99551D" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<text x="262" y="535" font-size="23" font-weight="600" fill="#99551D" text-anchor="middle">Independent authorized work</text>
<text x="262" y="569" font-size="23" font-weight="600" fill="#99551D" text-anchor="middle">is cut off as well</text>
<rect x="516" y="183" width="444" height="416" rx="16" fill="#E9F4EF"/>
<circle cx="542" cy="216" r="5" fill="#11766F"/>
<text x="558" y="224" font-size="25" font-weight="650" fill="#11766F" text-anchor="start">Handle the actual scope</text>
<rect x="536" y="245" width="404" height="78" rx="11" fill="#FFFFFF"/>
<text x="738" y="275" font-size="25" font-weight="600" fill="#173348" text-anchor="middle">Optional research notes</text>
<text x="738" y="307" font-size="25" font-weight="600" fill="#173348" text-anchor="middle">have a problem</text>
<text x="738" y="354" font-size="22" font-weight="400" fill="#11766F" text-anchor="middle">Handle locally; report the facts</text>
<path d="M 738 364 L 738 382" fill="none" stroke="#11766F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="536" y="393" width="404" height="75" rx="11" fill="#FFFFFF"/>
<text x="738" y="422" font-size="25" font-weight="650" fill="#173348" text-anchor="middle">Termination owner</text>
<text x="738" y="454" font-size="25" font-weight="650" fill="#173348" text-anchor="middle">selects the next step</text>
<path d="M 738 477 L 738 498" fill="none" stroke="#11766F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<text x="738" y="535" font-size="23" font-weight="600" fill="#11766F" text-anchor="middle">If allowed: continue or finalize</text>
<text x="738" y="569" font-size="23" font-weight="600" fill="#11766F" text-anchor="middle">Otherwise: end and settle</text>
<rect x="40" y="626" width="920" height="108" rx="15" fill="#173348"/>
<text x="66" y="666" font-size="25" font-weight="650" fill="#FFFFFF" text-anchor="start">Existing budgets and authorization still apply</text>
<text x="66" y="706" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="start">Cancellation and hard deadlines hold; unknown effects must not be blindly retried.</text>
</g>
</svg>
