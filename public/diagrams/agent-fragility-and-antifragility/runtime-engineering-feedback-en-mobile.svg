<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1138" viewBox="0 0 360 1138" role="img" aria-labelledby="title desc">
<title id="title">A failure can leave two different outcomes</title>
<desc id="desc">The run contains impact and recovers, delivers, or stops within existing rules. Developers and teams use counterexamples and history to change responsibility, remove duplicated controls, validate behavior against the Spec, and inform later designs. Withstanding disruption is distinct from gaining a net benefit from it; the latter requires comparing costs and later outcomes.</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#11766F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#99551D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#526779" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<rect x="1" y="1" width="358" height="1136" rx="22" fill="#FAF9F6" stroke="#CFD9DD" stroke-width="1.25"/>
<rect x="20" y="19" width="28" height="24" rx="6" fill="#173348"/>
<text x="34" y="36" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">02</text>
<text x="59" y="36" font-size="15" font-weight="600" fill="#526779" text-anchor="start">Two kinds of feedback</text>
<text x="20" y="80" font-size="23.5" font-weight="700" fill="#173348" text-anchor="start">A failure can leave</text>
<text x="20" y="112" font-size="23.5" font-weight="700" fill="#173348" text-anchor="start">two different outcomes</text>
<text x="20" y="143" font-size="17" font-weight="400" fill="#526779" text-anchor="start">How this task ends, and how</text>
<text x="20" y="167" font-size="17" font-weight="400" fill="#526779" text-anchor="start">the next design changes.</text>
<rect x="18" y="188" width="324" height="246" rx="15" fill="#E9F4EF"/>
<circle cx="36" cy="216" r="4" fill="#11766F"/>
<text x="49" y="223" font-size="21" font-weight="650" fill="#11766F" text-anchor="start">This run</text>
<text x="34" y="251" font-size="17" font-weight="400" fill="#526779" text-anchor="start">Work within existing rules</text>
<rect x="34" y="270" width="80" height="74" rx="10" fill="#FFFFFF"/>
<text x="74" y="297" font-size="17" font-weight="600" fill="#173348" text-anchor="middle">A</text>
<text x="74" y="322" font-size="17" font-weight="600" fill="#173348" text-anchor="middle">problem</text>
<path d="M 120 308 L 132 308" fill="none" stroke="#11766F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="140" y="270" width="80" height="74" rx="10" fill="#FFFFFF"/>
<text x="180" y="297" font-size="17" font-weight="600" fill="#173348" text-anchor="middle">Contain /</text>
<text x="180" y="322" font-size="17" font-weight="600" fill="#173348" text-anchor="middle">recover</text>
<path d="M 226 308 L 238 308" fill="none" stroke="#11766F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="246" y="270" width="80" height="74" rx="10" fill="#FFFFFF"/>
<text x="286" y="287" font-size="17" font-weight="600" fill="#173348" text-anchor="middle">Deliver /</text>
<text x="286" y="309" font-size="17" font-weight="600" fill="#173348" text-anchor="middle">stop</text>
<text x="286" y="331" font-size="17" font-weight="600" fill="#173348" text-anchor="middle">honestly</text>
<text x="34" y="379" font-size="17" font-weight="400" fill="#526779" text-anchor="start">Recovery depends on existing grants,</text>
<text x="34" y="406" font-size="17" font-weight="400" fill="#526779" text-anchor="start">budgets and execution facts.</text>
<path d="M 180 444 L 180 504" fill="none" stroke="#526779" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)" stroke-dasharray="6 7"/>
<rect x="39" y="447" width="282" height="49" rx="3" fill="#FAF9F6"/>
<text x="180" y="468" font-size="17" font-weight="500" fill="#526779" text-anchor="middle">Developers and teams</text>
<text x="180" y="492" font-size="17" font-weight="500" fill="#526779" text-anchor="middle">analyze the evidence</text>
<rect x="18" y="520" width="324" height="424" rx="15" fill="#FFF1DF"/>
<circle cx="36" cy="548" r="4" fill="#99551D"/>
<text x="49" y="555" font-size="20" font-weight="650" fill="#99551D" text-anchor="start">Development feedback</text>
<text x="34" y="583" font-size="17" font-weight="400" fill="#526779" text-anchor="start">Teams change the next design</text>
<rect x="34" y="598" width="292" height="62" rx="10" fill="#FFFFFF"/>
<text x="180" y="623" font-size="17" font-weight="600" fill="#173348" text-anchor="middle">Counterexample and history</text>
<text x="180" y="649" font-size="17" font-weight="600" fill="#173348" text-anchor="middle">Explain the failure conditions</text>
<path d="M 180 665 L 180 670" fill="none" stroke="#99551D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<rect x="34" y="677" width="292" height="62" rx="10" fill="#FFFFFF"/>
<text x="180" y="702" font-size="17" font-weight="600" fill="#173348" text-anchor="middle">Change ownership</text>
<text x="180" y="728" font-size="17" font-weight="600" fill="#173348" text-anchor="middle">Remove duplicated controls</text>
<path d="M 180 744 L 180 749" fill="none" stroke="#99551D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<rect x="34" y="756" width="292" height="62" rx="10" fill="#FFFFFF"/>
<text x="180" y="781" font-size="17" font-weight="600" fill="#173348" text-anchor="middle">Spec + behavior verification</text>
<text x="180" y="807" font-size="17" font-weight="600" fill="#173348" text-anchor="middle">Check allow and deny</text>
<path d="M 180 823 L 180 828" fill="none" stroke="#99551D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<rect x="34" y="835" width="292" height="62" rx="10" fill="#FFFFFF"/>
<text x="180" y="860" font-size="17" font-weight="600" fill="#173348" text-anchor="middle">Later designs</text>
<text x="180" y="886" font-size="17" font-weight="600" fill="#173348" text-anchor="middle">Reuse within scope</text>
<path d="M 327 866 L 334 866 L 334 629 L 327 629" fill="none" stroke="#99551D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)" stroke-dasharray="6 7"/>
<text x="180" y="928" font-size="17" font-weight="500" fill="#99551D" text-anchor="middle">Later observations retest the change</text>
<rect x="18" y="964" width="324" height="150" rx="14" fill="#173348"/>
<text x="180" y="997" font-size="20" font-weight="650" fill="#FFFFFF" text-anchor="middle">Withstanding disruption</text>
<text x="180" y="1026" font-size="20" font-weight="650" fill="#FFFFFF" text-anchor="middle">does not prove a net benefit</text>
<text x="180" y="1061" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="middle">Compare costs and later outcomes.</text>
<text x="180" y="1087" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="middle">No runtime self-modification.</text>
</g>
</svg>
