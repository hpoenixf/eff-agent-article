<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="848" viewBox="0 0 1000 848" role="img" aria-labelledby="title desc">
<title id="title">A failure can leave two different outcomes</title>
<desc id="desc">The run contains impact and recovers, delivers, or stops within existing rules. Developers and teams use counterexamples and history to change responsibility, remove duplicated controls, validate behavior against the Spec, and inform later designs. Withstanding disruption is distinct from gaining a net benefit from it; the latter requires comparing costs and later outcomes.</desc>
<defs>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#11766F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#99551D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#526779" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
<rect x="1" y="1" width="998" height="846" rx="22" fill="#FAF9F6" stroke="#CFD9DD" stroke-width="1.25"/>
<rect x="40" y="26" width="34" height="30" rx="6" fill="#173348"/>
<text x="57" y="48" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">02</text>
<text x="88" y="48" font-size="19" font-weight="600" fill="#526779" text-anchor="start">Run feedback and development feedback</text>
<text x="40" y="102" font-size="33" font-weight="700" fill="#173348" text-anchor="start">A failure can leave two different outcomes</text>
<text x="40" y="145" font-size="22" font-weight="400" fill="#526779" text-anchor="start">Observe how this task ends, and how the next design changes, separately.</text>
<rect x="40" y="183" width="920" height="221" rx="16" fill="#E9F4EF"/>
<circle cx="66" cy="215" r="5" fill="#11766F"/>
<text x="82" y="224" font-size="25" font-weight="650" fill="#11766F" text-anchor="start">This run · Work within existing rules</text>
<rect x="64" y="247" width="248" height="92" rx="11" fill="#FFFFFF"/>
<text x="188" y="284" font-size="23" font-weight="600" fill="#173348" text-anchor="middle">A disturbance</text>
<text x="188" y="317" font-size="23" font-weight="600" fill="#173348" text-anchor="middle">occurs</text>
<path d="M 324 293 L 362 293" fill="none" stroke="#11766F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="376" y="247" width="248" height="92" rx="11" fill="#FFFFFF"/>
<text x="500" y="284" font-size="23" font-weight="600" fill="#173348" text-anchor="middle">Contain impact</text>
<text x="500" y="317" font-size="23" font-weight="600" fill="#173348" text-anchor="middle">Recover if allowed</text>
<path d="M 636 293 L 674 293" fill="none" stroke="#11766F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="688" y="247" width="248" height="92" rx="11" fill="#FFFFFF"/>
<text x="812" y="284" font-size="23" font-weight="600" fill="#173348" text-anchor="middle">Deliver a result</text>
<text x="812" y="317" font-size="23" font-weight="600" fill="#173348" text-anchor="middle">or stop honestly</text>
<text x="64" y="378" font-size="22" font-weight="400" fill="#526779" text-anchor="start">Recovery still depends on existing grants, budgets, and execution facts.</text>
<path d="M 500 412 L 500 475" fill="none" stroke="#526779" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)" stroke-dasharray="6 7"/>
<rect x="222" y="422" width="556" height="33" rx="3" fill="#FAF9F6"/>
<text x="500" y="447" font-size="22" font-weight="500" fill="#526779" text-anchor="middle">Evidence for developers and teams to analyze</text>
<rect x="40" y="489" width="920" height="211" rx="16" fill="#FFF1DF"/>
<circle cx="66" cy="521" r="5" fill="#99551D"/>
<text x="82" y="530" font-size="25" font-weight="650" fill="#99551D" text-anchor="start">Development feedback · Change the next design</text>
<rect x="64" y="553" width="194" height="89" rx="11" fill="#FFFFFF"/>
<text x="161" y="576" font-size="22" font-weight="600" fill="#173348" text-anchor="middle">Counterexample</text>
<text x="161" y="601" font-size="22" font-weight="600" fill="#173348" text-anchor="middle">+ history</text>
<text x="161" y="626" font-size="22" font-weight="600" fill="#173348" text-anchor="middle">Explain conditions</text>
<path d="M 265 598 L 281 598" fill="none" stroke="#99551D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<rect x="290" y="553" width="194" height="89" rx="11" fill="#FFFFFF"/>
<text x="387" y="587" font-size="22" font-weight="600" fill="#173348" text-anchor="middle">Align authority</text>
<text x="387" y="619" font-size="22" font-weight="600" fill="#173348" text-anchor="middle">Cut duplication</text>
<path d="M 491 598 L 507 598" fill="none" stroke="#99551D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<rect x="516" y="553" width="194" height="89" rx="11" fill="#FFFFFF"/>
<text x="613" y="587" font-size="22" font-weight="600" fill="#173348" text-anchor="middle">Spec + checks</text>
<text x="613" y="619" font-size="22" font-weight="600" fill="#173348" text-anchor="middle">Allow and deny</text>
<path d="M 717 598 L 733 598" fill="none" stroke="#99551D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<rect x="742" y="553" width="194" height="89" rx="11" fill="#FFFFFF"/>
<text x="839" y="587" font-size="22" font-weight="600" fill="#173348" text-anchor="middle">Later designs</text>
<text x="839" y="619" font-size="22" font-weight="600" fill="#173348" text-anchor="middle">Reuse in scope</text>
<path d="M 839 650 L 839 674 L 161 674 L 161 650" fill="none" stroke="#99551D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)" stroke-dasharray="6 7"/>
<rect x="272" y="657" width="456" height="33" rx="3" fill="#FFF1DF"/>
<text x="500" y="681" font-size="22" font-weight="500" fill="#99551D" text-anchor="middle">Later observations retest the change</text>
<rect x="40" y="725" width="920" height="91" rx="15" fill="#173348"/>
<text x="500" y="763" font-size="27" font-weight="650" fill="#FFFFFF" text-anchor="middle">Withstanding disruption ≠ gaining a net benefit</text>
<text x="500" y="797" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle">Compare costs and later outcomes. This is not runtime self-modification.</text>
</g>
</svg>
