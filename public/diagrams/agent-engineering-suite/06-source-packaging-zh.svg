<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">一份模块源，四种安装形态</title><desc id="desc">独立使用或整套采用；包装变化，模块内容保持一致。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#54736d"/></marker></defs><rect x="0" y="0" width="1200" height="850" rx="0" fill="#f5f8f7" stroke="none"/><rect x="0" y="0" width="1200" height="125" rx="0" fill="#173b35" stroke="none"/><text x="35" y="43" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="15" font-weight="400" fill="#a5d9c5">AGENT ENGINEERING SUITE   /   06</text><text x="35" y="82" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="29" font-weight="700" fill="#ffffff">一份模块源，四种安装形态</text><text x="35" y="111" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="16" font-weight="400" fill="#d4e7df">独立使用或整套采用；包装变化，模块内容保持一致。</text><rect x="35" y="165" width="1130" height="110" rx="14" fill="#e8f2ed" stroke="#cadbd3"/><text x="55" y="199" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">唯一规范源：9 个 Skills + 对应脚本、模板与许可</text><text x="55" y="230" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">单模块没有强制模块依赖；发布构建生成可安装产物。</text><path d="M600 280L600 318" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="380" y="325" width="440" height="60" rx="12" fill="#173b35" stroke="none"/><text x="405" y="363" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="21" font-weight="700" fill="#ffffff">构建 + 清单 / 字节一致性检查</text><path d="M600 390L170 450" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600 390L455 450" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600 390L740 450" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600 390L1025 450" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="465" width="275" height="165" rx="14" fill="#e8f2ed" stroke="#cadbd3"/><text x="55" y="499" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">单个 Skill</text><text x="55" y="530" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">aes-history</text><text x="55" y="557" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">只装需要的能力</text><rect x="320" y="465" width="275" height="165" rx="14" fill="#e8f2ed" stroke="#cadbd3"/><text x="340" y="499" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">整套 Skills</text><text x="340" y="530" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">9 个可独立调用模块</text><text x="340" y="557" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">按问题选择入口</text><rect x="605" y="465" width="275" height="165" rx="14" fill="#e8f2ed" stroke="#cadbd3"/><text x="625" y="499" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">单模块插件</text><text x="625" y="530" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">history plugin</text><text x="625" y="557" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">带齐模块自身资源</text><rect x="890" y="465" width="275" height="165" rx="14" fill="#e8f2ed" stroke="#cadbd3"/><text x="910" y="499" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">整套插件</text><text x="910" y="530" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">agent-engineering-suite</text><text x="910" y="557" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">统一分发 9 个模块</text><rect x="35" y="660" width="1130" height="75" rx="14" fill="#ffffff" stroke="#cadbd3"/><text x="55" y="694" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">选择一种覆盖方式，避免同一模块叠装</text><rect x="35" y="776" width="1130" height="45" rx="10" fill="#e4ece9" stroke="none"/><text x="53" y="805" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="17" font-weight="400" fill="#213d38">安装不会自动获得账号权限，也不会自动运行工作流或发布代码。</text><text x="35" y="838" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="12" font-weight="400" fill="#607971">PLAYBOOKS + DETERMINISTIC TOOLS · EXPLICIT EVIDENCE HANDOFFS</text></svg>