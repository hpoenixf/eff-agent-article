<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Why a suite: repair the broken handoff</title><desc id="desc">Both paths produce code. Only one leaves a reliable starting point for the next session.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#54736d"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f5f8f7" stroke="none"/><rect x="0" y="0" width="1200" height="125" rx="0" fill="#173b35" stroke="none"/><text x="35" y="43" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="15" font-weight="400" fill="#a5d9c5">AGENT ENGINEERING SUITE   /   02</text><text x="35" y="82" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Why a suite: repair the broken handoff</text><text x="35" y="111" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="16" font-weight="400" fill="#d4e7df">Both paths produce code. Only one leaves a reliable starting point for the next session.</text><text x="35" y="175" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="19" font-weight="700" fill="#9a5c42">COMMON FAILURE</text><rect x="35" y="195" width="260" height="115" rx="14" fill="#fbede5" stroke="#cadbd3"/><text x="55" y="229" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">Vague request</text><text x="55" y="260" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">Context stays in chat</text><path d="M298 252L319 252" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="325" y="195" width="260" height="115" rx="14" fill="#fbede5" stroke="#cadbd3"/><text x="345" y="229" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">Code changed</text><text x="345" y="260" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">Rationale / limits lost</text><path d="M588 252L609 252" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="615" y="195" width="260" height="115" rx="14" fill="#fbede5" stroke="#cadbd3"/><text x="635" y="229" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">Tests pass</text><text x="635" y="260" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">Rationale / limits lost</text><path d="M878 252L899 252" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="905" y="195" width="260" height="115" rx="14" fill="#fbede5" stroke="#cadbd3"/><text x="925" y="229" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">New session guesses</text><text x="925" y="260" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">Rationale / limits lost</text><text x="35" y="370" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="19" font-weight="700" fill="#246551">THE HANDOFF TO REPAIR</text><rect x="35" y="394" width="360" height="165" rx="14" fill="#e8f2ed" stroke="#cadbd3"/><text x="55" y="428" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">DECISION</text><text x="55" y="459" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">Why this option?</text><text x="55" y="486" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">Which tradeoffs remain?</text><path d="M398 477L415 477" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="420" y="394" width="360" height="165" rx="14" fill="#e8f2ed" stroke="#cadbd3"/><text x="440" y="428" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">EVIDENCE</text><text x="440" y="459" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">Which revision, what observed?</text><text x="440" y="486" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">Separate build, check, outcome</text><path d="M783 477L800 477" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="805" y="394" width="360" height="165" rx="14" fill="#e8f2ed" stroke="#cadbd3"/><text x="825" y="428" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">NEXT ACTION</text><text x="825" y="459" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">Who acts, with what dependency?</text><text x="825" y="486" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">What demonstrates completion?</text><rect x="35" y="590" width="1130" height="95" rx="14" fill="#ffffff" stroke="#cadbd3"/><text x="55" y="624" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">A new session reads back before continuing</text><text x="55" y="655" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">Keep unverified claims and counterexamples. New evidence may revise an earlier judgment.</text><rect x="35" y="726" width="1130" height="45" rx="10" fill="#e4ece9" stroke="none"/><text x="53" y="755" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="17" font-weight="400" fill="#213d38">The goal is less context reconstruction—not more paperwork.</text><text x="35" y="788" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="12" font-weight="400" fill="#607971">PLAYBOOKS + DETERMINISTIC TOOLS · EXPLICIT EVIDENCE HANDOFFS</text></svg>