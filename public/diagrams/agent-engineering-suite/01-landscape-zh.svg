<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">九个模块，一套工程协作语言</title><desc id="desc">按问题选用；分组表示责任，不是必须串行的自动流水线。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#54736d"/></marker></defs><rect x="0" y="0" width="1200" height="900" rx="0" fill="#f5f8f7" stroke="none"/><rect x="0" y="0" width="1200" height="125" rx="0" fill="#173b35" stroke="none"/><text x="35" y="43" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="15" font-weight="400" fill="#a5d9c5">AGENT ENGINEERING SUITE   /   01</text><text x="35" y="82" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="29" font-weight="700" fill="#ffffff">九个模块，一套工程协作语言</text><text x="35" y="111" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="16" font-weight="400" fill="#d4e7df">按问题选用；分组表示责任，不是必须串行的自动流水线。</text><rect x="35" y="152" width="360" height="490" rx="14" fill="#ffffff" stroke="#cadbd3"/><text x="53" y="190" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">01  决定与约定</text><rect x="50" y="213" width="330" height="90" rx="14" fill="#edf4f0" stroke="#cadbd3"/><text x="70" y="247" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">grilling</text><text x="70" y="278" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">问清有后果的取舍</text><rect x="50" y="316" width="330" height="90" rx="14" fill="#edf4f0" stroke="#cadbd3"/><text x="70" y="350" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">spec-flow</text><text x="70" y="381" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">范围、验收与证据关联</text><rect x="420" y="152" width="360" height="490" rx="14" fill="#ffffff" stroke="#cadbd3"/><text x="438" y="190" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">02  实现与审视</text><rect x="435" y="213" width="330" height="90" rx="14" fill="#edf4f0" stroke="#cadbd3"/><text x="455" y="247" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">architecture</text><text x="455" y="278" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">深化模块与职责边界</text><rect x="435" y="316" width="330" height="90" rx="14" fill="#edf4f0" stroke="#cadbd3"/><text x="455" y="350" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">code-review</text><text x="455" y="381" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">规范与 Spec 双轴审查</text><rect x="805" y="152" width="360" height="490" rx="14" fill="#ffffff" stroke="#cadbd3"/><text x="823" y="190" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">03  留存与下一步</text><rect x="820" y="213" width="330" height="90" rx="14" fill="#edf4f0" stroke="#cadbd3"/><text x="840" y="247" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">history</text><text x="840" y="278" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">决策理由与演进记录</text><rect x="820" y="316" width="330" height="90" rx="14" fill="#edf4f0" stroke="#cadbd3"/><text x="840" y="350" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">docs-maintenance</text><text x="840" y="381" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">同步事实与安全清理</text><rect x="820" y="419" width="330" height="90" rx="14" fill="#edf4f0" stroke="#cadbd3"/><text x="840" y="453" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">maturity</text><text x="840" y="484" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">依据版本化量尺评估</text><rect x="820" y="522" width="330" height="90" rx="14" fill="#edf4f0" stroke="#cadbd3"/><text x="840" y="556" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">roadmap</text><text x="840" y="587" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">行动、依赖与验收状态</text><rect x="35" y="670" width="1130" height="115" rx="14" fill="#e8f2ed" stroke="#cadbd3"/><text x="55" y="704" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">workflow  /  可选的路由与交接模板</text><text x="55" y="735" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">Agent 选择下一步，复用已安装模块；确定性 CLI 校验结构、计算结果与记录。</text><text x="55" y="762" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">各模块可以独立使用；执行、发布与破坏性操作仍受当前授权约束。</text><rect x="35" y="826" width="1130" height="45" rx="10" fill="#e4ece9" stroke="none"/><text x="53" y="855" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="17" font-weight="400" fill="#213d38">连接的是决定、证据与行动，不是再造一个 Agent Runtime。</text><text x="35" y="888" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="12" font-weight="400" fill="#607971">PLAYBOOKS + DETERMINISTIC TOOLS · EXPLICIT EVIDENCE HANDOFFS</text></svg>