<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc"><title id="title">评分与路线图：反馈，但不混为一谈</title><desc id="desc">评估负责描述现状；路线图负责安排变化。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#54736d"/></marker></defs><rect x="0" y="0" width="1200" height="840" rx="0" fill="#f5f8f7" stroke="none"/><rect x="0" y="0" width="1200" height="125" rx="0" fill="#173b35" stroke="none"/><text x="35" y="43" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="15" font-weight="400" fill="#a5d9c5">AGENT ENGINEERING SUITE   /   05</text><text x="35" y="82" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="29" font-weight="700" fill="#ffffff">评分与路线图：反馈，但不混为一谈</text><text x="35" y="111" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="16" font-weight="400" fill="#d4e7df">评估负责描述现状；路线图负责安排变化。</text><rect x="35" y="175" width="360" height="175" rx="14" fill="#e8f2ed" stroke="#cadbd3"/><text x="55" y="209" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">01  证据快照</text><text x="55" y="240" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">实现、验证、用户结果</text><text x="55" y="267" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">固定版本与可追溯引用</text><rect x="420" y="175" width="360" height="175" rx="14" fill="#e8f2ed" stroke="#cadbd3"/><text x="440" y="209" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">02  量尺评估</text><text x="440" y="240" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">记录强项、缺口与不确定性</text><text x="440" y="267" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">比较时保持量尺版本一致</text><rect x="805" y="175" width="360" height="175" rx="14" fill="#e8f2ed" stroke="#cadbd3"/><text x="825" y="209" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">03  明确判断</text><text x="825" y="240" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">Agent / 人审视价值与风险</text><text x="825" y="267" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">决定值得做的下一步</text><rect x="805" y="450" width="360" height="175" rx="14" fill="#e8f2ed" stroke="#cadbd3"/><text x="825" y="484" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">04  路线图行动</text><text x="825" y="515" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">责任、依赖与验收条件</text><text x="825" y="542" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">行动状态由证据支撑</text><rect x="420" y="450" width="360" height="175" rx="14" fill="#e8f2ed" stroke="#cadbd3"/><text x="440" y="484" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">05  实施与复验</text><text x="440" y="515" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">完成具体变化并验证结果</text><text x="440" y="542" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">形成下一份证据快照</text><path d="M398 262L415 262" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M783 262L800 262" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M985 355L985 440" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M800 535L783 535" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M420 535L215 535" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M215 535L215 355" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="766" width="1130" height="45" rx="10" fill="#e4ece9" stroke="none"/><text x="53" y="795" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="17" font-weight="400" fill="#213d38">分数上升 ≠ Roadmap 完成；完成状态必须满足该行动自己的验收条件。</text><text x="35" y="828" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="12" font-weight="400" fill="#607971">PLAYBOOKS + DETERMINISTIC TOOLS · EXPLICIT EVIDENCE HANDOFFS</text></svg>