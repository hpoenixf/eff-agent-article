<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">为什么需要套件：把断掉的交接接起来</title><desc id="desc">同样写代码，区别在于下一次工作是否还要重新猜。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#54736d"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f5f8f7" stroke="none"/><rect x="0" y="0" width="1200" height="125" rx="0" fill="#173b35" stroke="none"/><text x="35" y="43" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="15" font-weight="400" fill="#a5d9c5">AGENT ENGINEERING SUITE   /   02</text><text x="35" y="82" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="29" font-weight="700" fill="#ffffff">为什么需要套件：把断掉的交接接起来</text><text x="35" y="111" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="16" font-weight="400" fill="#d4e7df">同样写代码，区别在于下一次工作是否还要重新猜。</text><text x="35" y="175" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="19" font-weight="700" fill="#9a5c42">常见断点</text><rect x="35" y="195" width="260" height="115" rx="14" fill="#fbede5" stroke="#cadbd3"/><text x="55" y="229" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">模糊请求</text><text x="55" y="260" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">上下文留在对话里</text><path d="M298 252L319 252" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="325" y="195" width="260" height="115" rx="14" fill="#fbede5" stroke="#cadbd3"/><text x="345" y="229" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">代码改完</text><text x="345" y="260" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">理由 / 边界未交接</text><path d="M588 252L609 252" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="615" y="195" width="260" height="115" rx="14" fill="#fbede5" stroke="#cadbd3"/><text x="635" y="229" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">测试绿了</text><text x="635" y="260" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">理由 / 边界未交接</text><path d="M878 252L899 252" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="905" y="195" width="260" height="115" rx="14" fill="#fbede5" stroke="#cadbd3"/><text x="925" y="229" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">换会话重猜</text><text x="925" y="260" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">理由 / 边界未交接</text><text x="35" y="370" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="19" font-weight="700" fill="#246551">套件要补上的连接</text><rect x="35" y="394" width="360" height="165" rx="14" fill="#e8f2ed" stroke="#cadbd3"/><text x="55" y="428" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">决定</text><text x="55" y="459" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">为何选这个方案</text><text x="55" y="486" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">未解决哪些取舍</text><path d="M398 477L415 477" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="420" y="394" width="360" height="165" rx="14" fill="#e8f2ed" stroke="#cadbd3"/><text x="440" y="428" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">证据</text><text x="440" y="459" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">哪个版本、观察到什么</text><text x="440" y="486" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">实现 / 验证 / 结果分开</text><path d="M783 477L800 477" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="805" y="394" width="360" height="165" rx="14" fill="#e8f2ed" stroke="#cadbd3"/><text x="825" y="428" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">下一步</text><text x="825" y="459" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">谁处理、依赖什么</text><text x="825" y="486" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">怎样证明已经完成</text><rect x="35" y="590" width="1130" height="95" rx="14" fill="#ffffff" stroke="#cadbd3"/><text x="55" y="624" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">新会话先回读，再继续</text><text x="55" y="655" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">保留未验证项与反例；新证据可以推翻旧判断，而不是重复一遍旧测试。</text><rect x="35" y="726" width="1130" height="45" rx="10" fill="#e4ece9" stroke="none"/><text x="53" y="755" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="17" font-weight="400" fill="#213d38">目的：减少反复重建上下文，而不是增加文档数量。</text><text x="35" y="788" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="12" font-weight="400" fill="#607971">PLAYBOOKS + DETERMINISTIC TOOLS · EXPLICIT EVIDENCE HANDOFFS</text></svg>