<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc"><title id="title">Maturity and roadmap: feedback, not conflation</title><desc id="desc">Assessment describes the present. The roadmap organizes change.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#54736d"/></marker></defs><rect x="0" y="0" width="1200" height="840" rx="0" fill="#f5f8f7" stroke="none"/><rect x="0" y="0" width="1200" height="125" rx="0" fill="#173b35" stroke="none"/><text x="35" y="43" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="15" font-weight="400" fill="#a5d9c5">AGENT ENGINEERING SUITE   /   05</text><text x="35" y="82" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="29" font-weight="700" fill="#ffffff">Maturity and roadmap: feedback, not conflation</text><text x="35" y="111" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="16" font-weight="400" fill="#d4e7df">Assessment describes the present. The roadmap organizes change.</text><rect x="35" y="175" width="360" height="175" rx="14" fill="#e8f2ed" stroke="#cadbd3"/><text x="55" y="209" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">01  Evidence snapshot</text><text x="55" y="240" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">Implementation, checks, outcomes</text><text x="55" y="267" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">Fixed revision and traceable refs</text><rect x="420" y="175" width="360" height="175" rx="14" fill="#e8f2ed" stroke="#cadbd3"/><text x="440" y="209" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">02  Rubric assessment</text><text x="440" y="240" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">Strengths, gaps and uncertainty</text><text x="440" y="267" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">Compare compatible rubric versions</text><rect x="805" y="175" width="360" height="175" rx="14" fill="#e8f2ed" stroke="#cadbd3"/><text x="825" y="209" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">03  Explicit judgment</text><text x="825" y="240" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">Agent / human weighs value and risk</text><text x="825" y="267" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">Select a worthwhile next step</text><rect x="805" y="450" width="360" height="175" rx="14" fill="#e8f2ed" stroke="#cadbd3"/><text x="825" y="484" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">04  Roadmap action</text><text x="825" y="515" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">Owner, dependencies, acceptance</text><text x="825" y="542" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">Evidence supports action state</text><rect x="420" y="450" width="360" height="175" rx="14" fill="#e8f2ed" stroke="#cadbd3"/><text x="440" y="484" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#213d38">05  Implement &amp; re-check</text><text x="440" y="515" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">Make a change; verify its outcome</text><text x="440" y="542" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#213d38">Produce the next evidence snapshot</text><path d="M398 262L415 262" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M783 262L800 262" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M985 355L985 440" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M800 535L783 535" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M420 535L215 535" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M215 535L215 355" fill="none" stroke="#54736d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="766" width="1130" height="45" rx="10" fill="#e4ece9" stroke="none"/><text x="53" y="795" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="17" font-weight="400" fill="#213d38">A higher score does not close a roadmap item; its own acceptance criteria must be met.</text><text x="35" y="828" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="12" font-weight="400" fill="#607971">PLAYBOOKS + DETERMINISTIC TOOLS · EXPLICIT EVIDENCE HANDOFFS</text></svg>